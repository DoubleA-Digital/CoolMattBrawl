       before armour and before `pinned` so a counter beats everything except
       being already dead. */
    if (this.counter > 0 && from && from.alive) {
      this.counter = 0;
      this.counterFlash = 24;
      this.invuln = Math.max(this.invuln, 14);
      const ripo = this.ch.riposte || { dmg: 11, base: 5.5, scale: 1.1, angle: 40 };
      const dirX = from.x >= this.x ? 1 : -1;
      const kb = CFG.kbBase + ripo.base + ripo.dmg * CFG.kbDamageScale
               + from.percent * CFG.kbPercentScale * ripo.scale * 1.9;
      const m2 = kb * ((CFG.kbWeightRef + 0.55) / (from.ch.weight + 0.55));
      const rad = ripo.angle * Math.PI / 180;
      from.applyKnockback(Math.cos(rad) * m2 * dirX, -Math.sin(rad) * m2,
                          ripo.dmg, m2, this);
      this.stats.damageDealt += ripo.dmg;
      this.addMeter(ripo.dmg * CFG.meter.onDeal);
      FX.banner("RIPOSTE", this.ch.accent);
      FX.hitPause(12); FX.shake(13);
      FX.flash(this.ch.color, 0.2);
      FX.ring(this.x, this.y, 10, 150, this.ch.accent, 4);
      FX.blade(this.x, this.y - 6, dirX > 0 ? 0 : Math.PI, 30, 96, 2.4,
               this.ch.accent, { w: 16, life: 16, spin: dirX * 0.08 });
      Snd.superHit();
      return;
    }
    /* Supers have armour during their active window, but it is no longer
       unconditional: enough damage breaks through and interrupts the super.
       Unbreakable armour meant a super, once started, could never be
       contested — the opponent's only option was to run. */
    if (CFG.meter.superArmor && this.inSuper && this.attack.t > this.attack.data.startup) {
      this.armorDamage = (this.armorDamage || 0) + dmg;
      if (this.armorDamage < CFG.meter.superArmorHp) {
        this.percent = Math.min(999, this.percent + dmg * 0.5);
        this.hitFlash = 4;
        this.addMeter(dmg * CFG.meter.onTake);
        FX.ring(this.x, this.y, 8, this.ch.hurt * 2, "#ffffff", 2);
        return;
      }
      // armour broken: the super is cancelled and the hit lands in full
      this.attack = null;
      this.pinned = false;
      this.armorDamage = 0;
      FX.banner("ARMOUR BREAK", "#ffffff");
      FX.burst(this.x, this.y, 22, "#ffffff", 8);
      FX.shake(14);
      Snd.shieldBreak();
    }
    if (this.pinned) { this.percent += dmg * 0.4; this.hitFlash = 4; return; }

    // frozen: the hit shatters the ice and lands harder for it
    if (this.frozenT > 0) {
      this.frozenT = 0;
      dmg += 7; vx *= 1.25; vy *= 1.25; mag *= 1.25;
      FX.burst(this.x, this.y, 30, "#d4f1ff", 9);
      FX.ring(this.x, this.y, 8, 120, "#ffffff", 4);
      FX.damageText(this.x, this.y - 44, "SHATTER", "#d4f1ff");
      Snd.shieldBreak();
    }
    // cursed: flies further from everything
    if (this.curseT > 0) { vx *= 1.22; vy *= 1.22; mag *= 1.22; }
    // marked by Deja Vu: remember it, it comes back
    if (this.echoT > 0) this.echoDmg += dmg;
    // any hit knocks a hidden fighter out of hiding
    if (this.stealthT > 0) this.stealthT = 0;

    // Orbit's Keel Anchor: full damage still lands, but the brace halves
    // how far it sends her — survivability, not immunity.
    if (this.anchorGlow > 0) { vx *= 0.55; vy *= 0.55; mag *= 0.55; }

    // Kite's footing: she doesn't fly as far or stay stunned as long.
    if (this.ch.footing) {
      const k = 1 - this.ch.footing * 0.18;
      vx *= k; vy *= k; mag *= k;
    }

    this.percent = Math.min(999, this.percent + dmg);
    this.addMeter(dmg * CFG.meter.onTake);
    this.vx = vx; this.vy = vy;
    this.grounded = false; this.groundSeg = null;
    this.hitstun = Math.min(CFG.hitstunMax, Math.round(mag * CFG.hitstunPerKb) + 4);
    this.setState(ST.HITSTUN);
    this.hitFlash = 8;
    this.airJumps = CFG.airJumps;
    if (from) this.lastHitBy = from;
    if (this.grabbedBy) this.grabbedBy.releaseGrab();
  }

  /* ---------------------------------------------------------- integrate */
  integrate() {
    const ch = this.ch;
    if (this.dropThrough > 0) this.dropThrough--;
    const noGrav = this.state === ST.AIRDODGE || this.state === ST.RESPAWN || this.pinned;

    if (!this.grounded && !noGrav) {
      let g = CFG.gravity * ch.fallMul;
      if (this.fastFalling) g *= CFG.fastFallMul;
      this.vy = Math.min(this.vy + g, CFG.maxFall * (this.fastFalling ? CFG.fastFallMul : 1) * ch.fallMul);
      this.vx *= CFG.airDrag;
    }

    const prevFeet = this.feetY;
    const fallV = this.vy;
    this.x += this.vx;
    this.y += this.vy;

    /* Howling Peak's gusts. A push on position rather than velocity, so it
       can't stack with air drag into a runaway; grounded fighters dig in and
       take half, and Kite's footing shrugs off most of it. */
    const wind = Stage.def.wind ? Stage.windNow().x : 0;
    if (wind && this.state !== ST.RESPAWN && !this.pinned)
      this.x += wind * (this.grounded ? 0.5 : 1) * (1 - (ch.footing || 0) * 0.6);

    /* Ground collision. A fighter already riding a segment gets a wider
       capture band so a drifting platform carries them along instead of
       dropping them through. */
    const wasSeg = this.groundSeg;
    this.grounded = false; this.groundSeg = null;
    let best = null, bestY = Infinity;
    for (const seg of Stage.segs) {
      if (!seg.solid && this.dropThrough > 0) continue;
      const sy = Stage.surfaceY(seg, this.x);
      if (sy === null) continue;
      const half = seg.thick * 0.5;
      const feet = this.feetY;
      const riding = seg === wasSeg;
      const up = riding ? 16 : 2;
      const tol = Math.max(10, Math.abs(this.vy) + 8) + (riding ? 10 : 0);
      const wasAbove = riding || prevFeet <= sy + half + 1;
      if (this.vy >= -0.5 && feet >= sy - up && feet <= sy + half + tol && wasAbove) {
        if (sy < bestY) { bestY = sy; best = seg; }
      }
    }

    /* Spore Hollow's caps: arriving from the air launches you straight back
       up with your jumps refreshed. Dropping through still works. */
    if (best && best.local.bounce && best !== wasSeg && fallV > 1) {
      this.y = bestY - this.h * 0.5;
      this.vy = -best.local.bounce;
      this.airJumps = CFG.airJumps;
      this.fastFalling = false;
      if (best.fx) best.fx.squash = 14;
      Snd.tone(180, 0.16, "sine", 0.14, 520);
      FX.ring(this.x, this.feetY, 6, 50, Stage.pal.soft, 2);
      best = null;
      if (this.state === ST.LANDLAG) this.setState(ST.AIR);
    }

    if (best) {
      this.y = bestY - this.h * 0.5;
      this.vy = 0;
      // Rust Line: the belt carries whoever is standing on it
      if (best.local.belt && best.fx) this.x += best.fx.belt;
      this.grounded = true; this.groundSeg = best;
      this.airJumps = CFG.airJumps;
      this.fastFalling = false;

      if (this.state === ST.HITSTUN && this.hitstun > 0) {
        this.vy = -Math.abs(this.vy) * 0.2; this.vx *= 0.7;
      } else if (this.state === ST.AIR || this.state === ST.AIRDODGE) {
        this.setState(ST.LANDLAG, CFG.landLag);
        Snd.land();
        FX.burst(this.x, this.feetY, 5, "#b9b6d8", 2.4);
      }

      if ([ST.IDLE, ST.LANDLAG, ST.SHIELD, ST.SHIELDBREAK].includes(this.state))
        this.vx *= CFG.groundFriction;
      this.vx = clamp(this.vx, -ch.speed * 2.4, ch.speed * 2.4);
    }

    if (Math.abs(this.vx) < 0.02) this.vx = 0;
  }

  /* --------------------------------------------------------- blast zones */
  checkBlastZones(match) {
    const b = Stage.blast;
    if (this.x < b.left || this.x > b.right || this.y < b.top || this.y > b.bottom) this.ko(match);
  }

  ko(match) {
    this.stocks--;
    this.stats.falls++;
    const killer = this.lastHitBy;
    if (killer && killer !== this && killer.alive) { killer.stats.kos++; killer.addMeter(14); }
    Snd.ko();
    FX.shake(20); FX.hitPause(10); FX.flash(this.ch.color, 0.22);
    const ex = clamp(this.x, 40, CFG.world.w - 40), ey = clamp(this.y, 40, CFG.world.h - 40);
    FX.burst(ex, ey, 34, this.ch.color, 11);
    FX.ring(ex, ey, 16, 280, this.ch.color, 4);
    FX.punch(0.9);
    FX.banner(this.stocks > 0 ? "KO!" : `${this.ch.name} OUT!`, this.tint);
    this.setState(ST.DEAD);
    this.respawnTimer = CFG.respawnFrames;
    this.percent = 0; this.vx = 0; this.vy = 0;
    this.lastHitBy = null; this.pinned = false; this.attack = null;
    this.moveLog = []; this.armorDamage = 0; this.launchFx = 0;
    this.slowT = this.frozenT = this.curseT = this.rootT = 0;
    this.stealthT = this.ambushT = this.echoT = 0; this.echoDmg = 0; this.posHist.length = 0;
    if (this.grabTarget) this.releaseGrab();
    if (this.grabbedBy) this.grabbedBy.releaseGrab();
    match.onKO(this);
  }

  /* ------------------------------------------------------- stock steal ----
     2v2 only. A fighter who is out of stocks can take one from a teammate who
     has two or more and come straight back in, so one bad stock does not bench
     a player for the rest of the match. */
  canStealStock() {
    const m = Match.current;
    if (!m || !m.teams || m.over || this.stocks > 0) return false;
    return m.fighters.some(o => o !== this && o.team === this.team && o.stocks >= 2);
  }
  tryStockSteal(match) {
    if (!this.canStealStock()) { this.stealWait = 0; return; }
    let want;
    if (this.isCPU) want = ++this.stealWait > 150;
    else { this.pad.poll(); want = this.pad.hit("special") || this.pad.hit("super"); }
    if (!want) return;
    const mate = match.fighters.find(o => o !== this && o.team === this.team && o.stocks >= 2);
    mate.stocks--;
    this.stocks = 1; this.stealWait = 0;
    FX.banner("STOCK STEAL", this.tint);
    Snd.uiBig();
    this.respawn();
  }

  respawn() {
    this.x = Stage.pivot.x + (this.slot - 1.5) * 90;
    this.y = Stage.pivot.y - 420;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0; this.percent = 0;
    this.shield = CFG.shieldMax;
    this.airJumps = CFG.airJumps;
    this.setState(ST.RESPAWN, CFG.respawnInvuln);
    this.invuln = CFG.respawnInvuln;
    this.alive = true; this.trail.length = 0;
  }
  updateRespawn(inp) {
    this.vy = 0; this.vx *= 0.9;
    if (inp.ax !== 0) { this.x += inp.ax * 3; this.facing = inp.ax; }
    if (--this.stateTimer <= 0 || inp.hit("down") || inp.hit("light")) {
      this.invuln = 40; this.setState(ST.AIR);
    }
  }

  intangible() {
    if (this.invuln > 0) return true;
    if (this.state === ST.AIRDODGE || this.state === ST.ROLL || this.state === ST.SPOTDODGE) {
      const total = this.state === ST.ROLL ? CFG.rollFrames
                  : this.state === ST.SPOTDODGE ? CFG.spotDodgeFrames : CFG.airDodgeFrames;
      const used = total - this.stateTimer;
      return used >= CFG.dodgeInvuln[0] && used <= CFG.dodgeInvuln[1];
    }
    return false;
  }
  shielding() { return this.state === ST.SHIELD; }
}


/* ===== src/08_combat.js ===== */
/* ==========================================================================
   9. COMBAT — hitbox resolution, super entities, and the CPU
   ========================================================================== */

/* ---------------------------------------------------------------- entities
   Orbs, shockwaves and gravity wells all live here so supers can put things
   into the world that outlive the move that spawned them. */
const Entities = {
  list: [],
  reset() { this.list.length = 0; },

  orb(owner, x, y, vx, vy, move) {
    this.list.push({ kind: "orb", owner, x, y, vx, vy, move, life: 90, r: 16, hitIds: [] });
  },
  /** A shockwave runs along the platform it was born on and dies at that
      platform's edge — it no longer snaps down to the main deck. */
  shockwave(owner, x, y, dir, move, plat) {
    this.list.push({ kind: "wave", owner, x, y, dir, move, plat: plat || null,
                     life: 70, r: 46, hitIds: [] });
  },
  well(owner, x, y, move) {
    this.list.push({ kind: "well", owner, x, y, move, life: 62, r: 38, pull: 180, hitIds: [] });
  },
  /** Kite's updraft: a rising column that carries anyone inside it upward.
      A storm column (her super) lifts only her foes, and lifts them hard. */
  updraft(owner, x, y, life, storm) {
    this.list.push({ kind: "draft", owner, x, y, life, max: life, storm: !!storm,
                     r: storm ? 54 : 62, hitIds: [] });
  },

  update(fighters) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      e.life--;
      let gone = e.life <= 0;

      if (e.kind === "orb") {
        e.x += e.vx; e.y += e.vy; e.vy += 0.04;
        if (e.life % 3 === 0) FX.spark(e.x, e.y, e.owner.ch.color);
        if (e.x < -300 || e.x > CFG.world.w + 300 || e.y > CFG.world.h + 300) gone = true;
        if (!gone) gone = this._touch(e, fighters, true);

      } else if (KINDS[e.kind]) {
        if (KINDS[e.kind].update(e, fighters)) gone = true;

      } else if (e.kind === "draft") {
        e.y -= 1.2;
        if (e.life % 2 === 0)
          FX.spark(e.x + rnd(-e.r, e.r), e.y + rnd(-40, 60), e.owner.ch.accent);
        for (const f of fighters) {
          if (!f.alive || f.state === ST.DEAD) continue;
          if (e.storm && allies(f, e.owner)) continue;
          if (Math.abs(f.x - e.x) > e.r + f.ch.hurt) continue;
          if (Math.abs(f.y - e.y) > 150) continue;
          if (e.storm) {
            // caught in the storm: carried up and held over the column
            if (f.intangible()) continue;
            f.vy = Math.max(f.vy - 1.05, -9);
            f.vx = f.vx * 0.86 + (e.x - f.x) * 0.02;
          } else {
            // her own lift is stronger: this is Kite's recovery tool
            const lift = f === e.owner ? -1.15 : -0.6;
            f.vy = Math.max(f.vy + lift, -13);
          }
          f.grounded = false; f.groundSeg = null;
        }

      } else if (e.kind === "wave") {
        // runs along its own platform and stops dead at that platform's edge
        e.x += e.dir * 13;
        let best = null;
        for (const seg of Stage.segs) {
          if (e.plat ? seg.local !== e.plat : !seg.main) continue;
          const sy = Stage.surfaceY(seg, e.x);
          if (sy !== null) best = sy;
        }
        if (best !== null) e.y = best - 10; else gone = true;
        e.r = 46 * (0.5 + e.life / 70);
        if (e.life % 2 === 0) {
          FX.spark(e.x + rnd(-14, 14), e.y + rnd(-10, 6), e.owner.ch.color);
          FX.spark(e.x, e.y - rnd(0, 30), "#ffffff");
        }
        if (!gone) this._touch(e, fighters, false);

      } else if (e.kind === "well") {
        const t = 1 - e.life / 62;
        e.r = 38 + Math.sin(t * Math.PI) * 54;
        // drag everyone toward the singularity
        for (const f of fighters) {
          if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD) continue;
          const d = dist(e.x, e.y, f.x, f.y);
          if (d < e.pull && d > 1) {
            const k = (1 - d / e.pull) * 0.9;
            f.vx += (e.x - f.x) / d * k;
            f.vy += (e.y - f.y) / d * k;
            if (f.grounded && Math.abs(e.y - f.y) > 30) { f.grounded = false; f.groundSeg = null; }
          }
        }
        for (let k = 0; k < 2; k++) {
          const a = Math.random() * 7, rr = e.pull * (0.4 + Math.random() * 0.6);
          FX.parts.push({ x: e.x + Math.cos(a) * rr, y: e.y + Math.sin(a) * rr,
            vx: -Math.cos(a) * 3.4, vy: -Math.sin(a) * 3.4,
            life: 18, max: 18, size: 2.2, color: e.owner.ch.color, grav: 0, drag: 1 });
        }
        if (e.life === 1) {                       // collapse
          Snd.superHit(); FX.shake(28); FX.hitPause(12);
          FX.flash("#ffffff", 0.4);
          FX.ring(e.x, e.y, 10, 420, "#ffffff", 6);
          FX.ring(e.x, e.y, 10, 300, e.owner.ch.color, 4);
          FX.burst(e.x, e.y, 50, e.owner.ch.color, 14);
          for (const f of fighters) {
            if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
            if (dist(e.x, e.y, f.x, f.y) < 190) Combat.land(e.owner, f, e.move, e.x, e.y);
          }
        }
      }

      if (gone) {
        if (e.kind === "orb") FX.burst(e.x, e.y, 8, e.owner.ch.color, 4);
        if (KINDS[e.kind] && KINDS[e.kind].end) KINDS[e.kind].end(e, fighters);
        const k = this.list.indexOf(e);
        if (k >= 0) this.list.splice(k, 1);
      }
    }
  },

  /** Spawn any of the newer kinds below: fields are kind-specific. */
  add(kind, owner, fields) {
    const e = Object.assign({ kind, owner, x: owner.x, y: owner.y, vx: 0, vy: 0,
                              r: 14, life: 60, hitIds: [] }, fields);
    e.max = e.max || e.life;
    this.list.push(e);
    return e;
  },

  /** Hit every foe of owner within r of (x, y) once. Used by explosions. */
  blast(owner, x, y, r, move, fighters) {
    for (const f of fighters) {
      if (allies(f, owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
      if (dist(x, y, f.x, f.y) < r + f.ch.hurt) Combat.land(owner, f, move, x, y);
    }
  },

  /** Returns true if the entity should be consumed by the hit. */
  _touch(e, fighters, consume) {
    for (const f of fighters) {
      if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD) continue;
      if (f.intangible() || e.hitIds.includes(f.slot)) continue;
      if (dist(e.x, e.y, f.x, f.y) < e.r + f.ch.hurt) {
        e.hitIds.push(f.slot);
        Combat.land(e.owner, f, e.move, e.x, e.y);
        if (consume) return true;
      }
    }
    return false;
  },

  draw(g) {
    for (const e of this.list) {
      const c = e.owner.ch.color;
      g.save();
      g.globalCompositeOperation = "lighter";

      if (e.kind === "orb") {
        g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 24;
        g.beginPath(); g.arc(e.x, e.y, e.r, 0, 7); g.fill();
        g.fillStyle = "#fff"; g.shadowBlur = 8;
        g.beginPath(); g.arc(e.x, e.y, e.r * 0.45, 0, 7); g.fill();

      } else if (KINDS[e.kind]) {
        KINDS[e.kind].draw(g, e, c);

      } else if (e.kind === "draft") {
        const a = clamp(e.life / 110, 0, 1) * (e.storm ? 1.5 : 1);
        const q = g.createLinearGradient(0, e.y + 90, 0, e.y - 120);
        q.addColorStop(0, hexA(e.owner.ch.accent, 0));
        q.addColorStop(0.4, hexA(c, 0.26 * a));
        q.addColorStop(1, hexA(e.owner.ch.accent, 0));
        g.fillStyle = q;
        g.fillRect(e.x - e.r, e.y - 120, e.r * 2, 210);
        g.strokeStyle = hexA(e.owner.ch.accent, 0.4 * a); g.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const ox = -e.r + 10 + i * ((e.r * 2 - 20) / 3);
          const wob = Math.sin(e.life * 0.18 + i) * 7;
          g.beginPath();
          g.moveTo(e.x + ox + wob, e.y + 80);
          g.quadraticCurveTo(e.x + ox - wob, e.y - 10, e.x + ox + wob, e.y - 110);
          g.stroke();
        }

      } else if (e.kind === "wave") {
        const a = clamp(e.life / 70, 0, 1);
        g.globalAlpha = a;
        g.strokeStyle = c; g.lineWidth = 5; g.shadowColor = c; g.shadowBlur = 22;
        g.beginPath();
        g.moveTo(e.x - e.dir * 26, e.y + 12);
        g.quadraticCurveTo(e.x, e.y - 52 * a, e.x + e.dir * 26, e.y + 12);
        g.stroke();
        g.strokeStyle = "#fff"; g.lineWidth = 2;
        g.beginPath();
        g.moveTo(e.x - e.dir * 16, e.y + 10);
        g.quadraticCurveTo(e.x, e.y - 34 * a, e.x + e.dir * 16, e.y + 10);
        g.stroke();

      } else if (e.kind === "well") {
        const t = 1 - e.life / 62;
        const rg = g.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.r * 1.7);
        rg.addColorStop(0, "rgba(0,0,0,1)");
        rg.addColorStop(0.45, hexA(c, 0.5));
        rg.addColorStop(1, "rgba(0,0,0,0)");
        g.globalCompositeOperation = "source-over";
        g.fillStyle = rg;
        g.beginPath(); g.arc(e.x, e.y, e.r * 1.7, 0, 7); g.fill();
        g.globalCompositeOperation = "lighter";
        g.strokeStyle = c; g.lineWidth = 3; g.shadowColor = c; g.shadowBlur = 20;
        for (let i = 0; i < 3; i++) {
          const rr = e.r * (0.6 + i * 0.28);
          g.globalAlpha = 0.7 - i * 0.18;
          g.beginPath();
          g.ellipse(e.x, e.y, rr, rr * 0.42, t * 5 + i, 0, 7);
          g.stroke();
        }
      }
      g.restore();
    }
  },
};

/* ---------------------------------------------------------------- combat */
const Combat = {
  /** Every live fighter that f is allowed to hit. */
  foes(f) {
    return Match.current.fighters.filter(o =>
      !allies(o, f) && o.alive && o.state !== ST.DEAD);
  },
  /** Within a few frames of the stage music's beat? Tempo's hits pay more. */
  onBeat() {
    const p = this.beatPeriod();
    const ph = (Match.current ? Match.current.frames : 0) % p;
    return Math.min(ph, p - ph) <= 4;
  },
  beatPeriod() { return 3600 / ((Stage.def.music && Stage.def.music.bpm) || 120); },
  /** The closest foe, optionally only within range. Teammates never count. */
  nearestFoe(f, range) {
    let best = null, bd = range || Infinity;
    for (const o of this.foes(f)) {
      const d = dist(f.x, f.y, o.x, o.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },

  resolve(fighters) {
    for (const atk of fighters) {
      if (!atk.alive || atk.state === ST.DEAD) continue;
      if (!atk.attack || !atk.hitboxActive()) continue;
      const a = atk.attack;
      const hb = atk.hitboxWorld();

      for (const def of fighters) {
        if (allies(def, atk) || !def.alive || def.state === ST.DEAD) continue;
        if (def.state === ST.GRABBED && def.grabbedBy === atk) continue;
        if (a.hitIds && a.hitIds.includes(def.slot)) continue;
        if (dist(hb.x, hb.y, def.x, def.y) > hb.r + def.ch.hurt) continue;

        if (a.kind === "grab") {
          if (def.intangible() || def.state === ST.HITSTUN) continue;
          atk.lockGrab(def);
          return;
        }
        if (def.intangible()) { FX.spark(def.x, def.y, "#ffffff"); continue; }

        a.hitIds = a.hitIds || [];
        a.hitIds.push(def.slot);
        this.land(atk, def, a.data, hb.x, hb.y, hb.r);
      }
    }
  },

  /** dirOverride sends the hit a fixed way (-1 or 1) instead of away from
      the attacker — Pivot's Tipping Point throws foes off their own side. */
  land(atk, def, move, hx, hy, hbR, dirOverride) {
    const dirX = dirOverride || (def.x >= atk.x ? 1 : -1);
    // delayed super hits (a bomb, a curse, an echo) carry `unblockable`
    const isSuper = move.unblockable || move === (atk.ch.super) ||
                    (atk.attack && atk.attack.kind === "super" && atk.attack.data === move);
    const K = CFG.skill;

    /* ---- skill modifiers, applied before anything reads move.dmg ----
       Spacing: connecting with the outer edge of the hitbox pays a bonus, so
       there is a reason to measure a strike instead of walking into the
       opponent. Staleness: repeating the same move weakens it, so the strong
       button is not simply the best button. Neither applies to throws. */
    let tip = false, staleMul = 1;
    if (hbR) {
      const d = dist(hx, hy, def.x, def.y);
      tip = d > hbR * K.tipZone;
    }
    staleMul = atk.staleMul(move);
    let dmg = move.dmg * staleMul * (tip ? K.tipBonus : 1);
    let kbMul = move.kbMul || 1;

    /* ---- fighter-specific bonuses ---- */
    // Shade: the first hit out of stealth is an ambush
    const ambush = atk.ambushT > 0;
    if (ambush) { atk.ambushT = 0; dmg *= 1.35; kbMul *= 1.2; }
    // Tempo: a hit that lands on the stage music's beat
    const onBeat = atk.ch.rhythm && this.onBeat();
    if (onBeat) { dmg *= 1.2; atk.addMeter(4); }

    // ---------------- shield ----------------
    // Tempo's sound waves shatter a held shield outright
    if (def.shielding() && move.breaksShield) {
      def.breakShield();
      FX.ring(def.x, def.y, 10, 90, atk.ch.color, 3);
      return;
    }
    if (def.shielding() && !isSuper) {
      const facingHit = (def.facing === -dirX) || Math.abs(def.x - atk.x) < 8;
      if (facingHit) {
        def.shield -= dmg * CFG.shieldDamageMul + 4;
        def.vx += dirX * dmg * 0.12;
        Snd.shield();
        FX.ring(def.x, def.y, 10, def.ch.hurt * 2.2, "#7fd9ff", 2);
        FX.hitPause(3); FX.shake(3);
        if (def.shield <= 0) def.breakShield();
        return;
      }
    }

    // ---------------- knockback ----------------
    const base = move.base || 2, scale = move.scale || 0.5;
    const kb = CFG.kbBase + base + dmg * CFG.kbDamageScale
             + def.percent * CFG.kbPercentScale * scale * 1.9;
    const mag = kb * kbMul * ((CFG.kbWeightRef + 0.55) / (def.ch.weight + 0.55));
    const rad = (move.angle != null ? move.angle : 45) * Math.PI / 180;

    def.applyKnockback(Math.cos(rad) * mag * dirX, -Math.sin(rad) * mag, dmg, mag, atk);
    atk.stats.damageDealt += dmg;
    atk.stats.bestHit = Math.max(atk.stats.bestHit, dmg);
    // Vex: her hits heal her own damage
    const steal = move.lifesteal != null ? move.lifesteal : (atk.ch.lifesteal || 0);
    if (steal > 0 && atk.percent > 0) {
      const heal = Math.min(atk.percent, dmg * steal);
      atk.percent -= heal;
      FX.damageText(atk.x, atk.y - 50, "+" + heal.toFixed(1), "#7dff9a");
    }
    if (ambush) { FX.damageText(hx, hy - 62, "AMBUSH!", atk.ch.accent); FX.flash(atk.ch.color, 0.15); }
    if (onBeat) { FX.damageText(hx, hy - 62, "ON BEAT", atk.ch.accent); FX.ring(hx, hy, 8, 90, atk.ch.color, 3); }
    atk.addMeter(dmg * CFG.meter.onDeal);
    atk.recordMove(move);
    if (move.onHit) move.onHit(atk, def);

    /* Hit confirm: a clean connect refunds part of the remaining endlag, so
       landing a commital move leaves you safer than whiffing it. Multi-hit
       moves and supers are excluded — cutting their recovery would truncate
       the move itself. */
    const a2 = atk.attack;
    if (a2 && a2.kind !== "super" && !(move.hits > 1)) {
      const left = a2.total - a2.t;
      if (left > 0) a2.t += Math.round(left * K.hitConfirmCut);
    }


    // ---------------- feel ----------------
    const pause = Math.round(CFG.hitPauseBase + dmg * CFG.hitPausePerDmg);
    FX.hitPause(pause);
    FX.shake(3 + dmg * 0.85);
    FX.burst(hx, hy, Math.round(6 + dmg * 1.1), atk.ch.color, 3 + dmg * 0.35);
    FX.ring(hx, hy, 6, 30 + dmg * 5, "#ffffff", 2);
    FX.hitmark(hx, hy, dmg);
    // the bigger the hit, the more it throws off
    if (dmg >= 6) {
      const away = Math.atan2(-Math.sin(rad), Math.cos(rad) * dirX);
      FX.impactLines(hx, hy, away, Math.round(3 + dmg * 0.45),
                     dmg >= 13 ? "#ffffff" : atk.ch.accent, 30 + dmg * 2.4);
    }
    FX.damageText(hx, hy - 24, dmg, tip ? "#ffffff" : atk.ch.accent);
    Snd.hit(dmg);

    /* SMASH: a hit strong enough that it will probably take the stock gets a
       beat of its own — longer freeze, a white pop, and a smoke trail behind
       whoever is flying. Countered, armoured and planted hits never set it
       off, because they never set the victim flying. */
    if (mag >= CFG.smashKb && def.state === ST.HITSTUN && def.lastHitBy === atk) {
      FX.hitPause(pause + 7);
      FX.flash("#ffffff", 0.22);
      FX.punch(0.6);
      FX.ring(hx, hy, 10, 160, "#ffffff", 4);
      FX.damageText(hx, hy - 62, "SMASH!", "#ffffff");
      Snd.bigHit();
      def.launchFx = 40;
    }
    if (dmg >= 13) { Snd.bigHit(); FX.flash(atk.ch.color, 0.12); FX.punch(0.5); }
    else if (dmg >= 7) FX.punch(0.22);

    /* Tell the player why the number was what it was — a skill mechanic the
       player cannot see is just inconsistency. */
    if (tip) {
      FX.ring(hx, hy, 4, 44, "#ffffff", 3);
      FX.damageText(hx, hy - 44, "TIP", "#ffffff");
      Snd.tone(1500, 0.05, "square", 0.09, 2300);
    }
    if (staleMul < 0.95) FX.damageText(hx, hy - 44, "STALE", "#8f8cb5");
  },
};

/* ------------------------------------------------------------------- CPU */
const CPU = {
  think(f, match) {
    f._ai = f._ai || { t: 0, cur: {}, prev: {} };
    const ai = f._ai;
    ai.prev = Object.assign({}, ai.cur);
    ai.cur = {}; BUTTONS.forEach(b => ai.cur[b] = false);
    ai.t++;

    const inp = {
      ax: 0, ay: 0,
      held: b => !!ai.cur[b],
      hit: b => !!ai.cur[b] && !ai.prev[b],
      released: b => !ai.cur[b] && !!ai.prev[b],
    };
    const press = b => { ai.cur[b] = true; };

    // a stealthed Shade is lost to the CPU unless she is close enough to
    // catch the shimmer -- about what a person watching the screen can manage
    const foes = Combat.foes(f).filter(o => o.stealthT <= 0 || dist(f.x, f.y, o.x, o.y) < 200);
    if (!foes.length) {
      // nobody visible: drift back toward the middle of the stage and wait
      const home = Stage.pivot.x - f.x;
      if (Math.abs(home) > 80) { const dir = home > 0 ? "right" : "left"; press(dir); inp.ax = home > 0 ? 1 : -1; }
      return inp;
    }
    let target = foes[0], bd = Infinity;
    for (const o of foes) { const d = dist(f.x, f.y, o.x, o.y); if (d < bd) { bd = d; target = o; } }

    const centerX = Stage.pivot.x;
    const onStage = f.groundSeg !== null;
    const halfDeck = Math.abs(Stage.def.layout[0].x2);

    // --- recovery first ---
    if (!onStage && (Math.abs(f.x - centerX) > halfDeck || f.y > Stage.pivot.y + 70)) {
      const dir = f.x < centerX ? "right" : "left";
      press(dir); inp.ax = dir === "right" ? 1 : -1;
      if (f.vy > 1 && f.airJumps > 0 && ai.t % 14 < 2) press("up");
      if (f.y > Stage.pivot.y + 20 && ai.t % 10 < 2) press("up");
      // Echo can simply rewind to where she was standing
      const back = f.posHist[0];
      if (f.ch.id === "ECHO" && f.specialCD <= 0 && back && Math.abs(back.x - centerX) < halfDeck &&
          back.y < Stage.pivot.y) press("special");
      return inp;
    }

    const dx = target.x - f.x, dy = target.y - f.y, adx = Math.abs(dx);

    // --- get out of anything about to go off ---
    for (const e of Entities.list) {
      if (allies(e.owner, f)) continue;
      const danger = e.kind === "payload" ? e.w + 30 : e.kind === "ghost" ? 80 : 0;
      if (!danger || dist(e.x, e.y, f.x, f.y) > danger) continue;
      const dir = f.x < e.x ? "left" : "right";
      press(dir); inp.ax = dir === "right" ? 1 : -1;
      if (f.grounded && ai.t % 20 < 2) press("up");
      return inp;
    }
    // Vex keeps her siphon going by holding the button
    if (f.ch.id === "VEX" && f.state === ST.ATTACK && f.attack && f.attack.kind === "special") {
      press("special"); return inp;
    }

    // --- super when it's up and the target is worth it ---
    /* Supers have different ideal ranges: some reach across the stage, some
       only touch whoever is close. A CPU that fires them blind wastes them. */
    const superRange = { ZIP: 900, KITE: 900, HUSK: 460, PIVOT: 260, ORBIT: 300, MIRA: 120,
                         BOLDER: 200, RIME: 220, HEX: 1200, SHADE: 1200, VEX: 150, FUSE: 150,
                         RICO: 600, SPROUT: 1200, ECHO: 400, TEMPO: 190 }[f.ch.id] || 320;
    // Overgrowth only catches foes who are standing on something
    const superOk = f.ch.id === "SPROUT" ? foes.some(o => o.grounded)
                  : f.ch.id === "BOLDER" ? f.grounded : true;
    if (f.meterFull && Math.random() < CFG.cpu.superChance && bd < superRange && superOk) {
      press("super"); return inp;
    }

    if (Math.random() < CFG.cpu.dodgeChance && f.grounded) { press("shield"); return inp; }

    if (adx > 54) { const dir = dx > 0 ? "right" : "left"; press(dir); inp.ax = dx > 0 ? 1 : -1; }
    if (dy < -70 && f.grounded && ai.t % 24 < 2) press("up");
    if (dy < -50 && !f.grounded && f.airJumps > 0 && ai.t % 20 < 2) press("up");
    if (dy > 90 && !f.grounded) { press("down"); inp.ay = 1; }

    const inLight = adx < 58 && Math.abs(dy) < 52;
    const inHeavy = adx < 76 && Math.abs(dy) < 58;
    if (inLight && Math.random() < CFG.cpu.aggression * 0.3) {
      if (target.percent > 70 && Math.random() < 0.5) press("heavy");
      else if (Math.random() < 0.18) press("grab");
      else press("light");
    } else if (inHeavy && Math.random() < 0.16) press("heavy");

    if (f.specialCD <= 0 && Math.random() < 0.012) {
      const facingFoe = Math.sign(dx) === f.facing;
      const nearEdge = Math.abs(target.x - centerX) > halfDeck * 0.6;
      switch (f.ch.id) {
        case "BOLDER": if (adx < 120) press("special"); break;
        case "ZIP":    if (adx < 170) press("special"); break;
        case "ORBIT":  if (adx < 260) press("special"); break;
        // swap when the foe is the one closer to the edge
        case "PIVOT":  if (facingFoe && adx < 260 && Math.abs(dy) < 40 && nearEdge) press("special"); break;
        case "KITE":    if (!f.grounded) press("special"); break;
        case "HUSK":    if (adx < 150) press("special"); break;
        // hold the counter when someone is in swinging range
        case "MIRA":    if (adx < 90) press("special"); break;
        case "RIME":    if (facingFoe && adx < 420 && Math.abs(dy) < 50 && target.slowT <= 0) press("special"); break;
        case "HEX":     if (adx < 420 && target.curseT <= 0) press("special"); break;
        // fade on the approach, so the ambush lands
        case "SHADE":   if (adx > 220 && adx < 600) press("special"); break;
        case "VEX":     if (bd < 280 && f.percent > 20) press("special"); break;
        case "FUSE":    if (facingFoe && adx < 280) press("special"); break;
        case "RICO":    if (facingFoe && adx < 380 && Math.abs(dy) < 50) press("special"); break;
        case "SPROUT":  if (f.grounded && f.percent > 25 && adx > 160) press("special"); break;
        // rewind out of trouble: high damage, or off the stage
        case "ECHO":    if (f.percent > 60 || !onStage && f.y > Stage.pivot.y) press("special"); break;
        case "TEMPO":   if (adx < 150 || (target.shielding() && adx < 170)) press("special"); break;
      }
    }
    if (f.state === ST.GRABBED && ai.t % 3 === 0) press("light");
    return inp;
  },
};


/* ===== src/08a_kinds.js ===== */
/* ==========================================================================
   9a. ENTITY KINDS — the things the newer fighters put into the world

   Each kind is { update(e, fighters) -> gone?, draw(g, e, color), end?(e) }.
   Entities.update/draw dispatch here for any kind listed, so a new fighter's
   projectile is one entry in this table rather than another branch in the
   loop. Everything a kind draws is derived from the fields the netcode ships
   (x, y, r, life, max, dir, landed), so guests render them identically.
   ========================================================================== */

/** Straight-line flight with a lifetime; returns true once it should go. */
function flyOff(e) {
  e.x += e.vx; e.y += e.vy;
  return e.x < -300 || e.x > CFG.world.w + 300 || e.y < -400 || e.y > CFG.world.h + 300;
}

/** A dashed circle — the telegraph every area attack below uses. */
function warnCircle(g, x, y, r, col, a) {
  g.save();
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = a;
  g.strokeStyle = col; g.lineWidth = 3;
  g.setLineDash([10, 9]);
  g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  g.setLineDash([]);
  g.globalAlpha = a * 0.25; g.fillStyle = col;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.restore();
}

const KINDS = {

  /* ---- RIME: Ice Lance. Straight, fast, chills whoever it hits. ---- */
  ice: {
    update(e, fighters) {
      if (e.life % 2 === 0) FX.spark(e.x - e.dir * 10, e.y, "#d4f1ff");
      return flyOff(e) || Entities._touch(e, fighters, true);
    },
    draw(g, e, c) {
      g.save(); g.translate(e.x, e.y); g.scale(e.dir || 1, 1);
      g.shadowColor = c; g.shadowBlur = 18;
      g.fillStyle = hexA("#d4f1ff", 0.9);
      poly(g, [22, 0, 4, -7, -18, -3, -24, 0, -18, 3, 4, 7]); g.fill();
      g.fillStyle = "#ffffff";
      poly(g, [22, 0, 6, -2.5, -10, 0, 6, 2.5]); g.fill();
      g.restore();
    },
  },

  /* ---- HEX: Hex Bolt. Slow, and bends toward the nearest foe. ---- */
  hex: {
    update(e, fighters) {
      const t = Combat.nearestFoe(e.owner, 420);
      if (t) {
        const a = Math.atan2(t.y - e.y, t.x - e.x), sp = Math.hypot(e.vx, e.vy);
        const cur = Math.atan2(e.vy, e.vx);
        let d = a - cur; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
        const turn = cur + clamp(d, -0.05, 0.05);
        e.vx = Math.cos(turn) * sp; e.vy = Math.sin(turn) * sp;
      }
      if (e.life % 3 === 0) FX.spark(e.x, e.y, e.owner.ch.accent);
      return flyOff(e) || Entities._touch(e, fighters, true);
    },
    draw(g, e, c) {
      g.save(); g.translate(e.x, e.y); g.rotate(e.life * 0.12);
      g.shadowColor = c; g.shadowBlur = 20;
      g.strokeStyle = c; g.lineWidth = 3;
      g.beginPath();
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; g.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); }
      g.closePath(); g.stroke();
      g.fillStyle = "#ffffff"; g.beginPath(); g.arc(0, 0, 4, 0, 7); g.fill();
      g.restore();
    },
  },

  /* ---- FUSE: Sticky Charge. Sticks to the first foe it touches (or the
         floor) and goes off when its fuse runs out. ---- */
  bomb: {
    update(e, fighters) {
      if (e.stuck) {
        const s = e.stuck;
        if (!s.alive || s.state === ST.DEAD) { e.stuck = null; e.landed = false; e.vy = 0; }
        else { e.x = s.x + e.ox; e.y = s.y + e.oy; }
      } else if (!e.landed) {
        e.vy += 0.5; e.x += e.vx; e.y += e.vy; e.vx *= 0.99;
        for (const f of fighters) {
          if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
          if (dist(e.x, e.y, f.x, f.y) < e.r + f.ch.hurt) {
            e.stuck = f; e.ox = clamp(e.x - f.x, -14, 14); e.oy = -6; e.landed = true;
            FX.damageText(f.x, f.y - 50, "STUCK!", e.owner.ch.accent);
            Snd.tone(300, 0.08, "square", 0.1, 160);
            break;
          }
        }
        if (!e.stuck && e.vy > 0) {
          const fl = Stage.floorBelow(e.x, e.y - e.vy);
          if (fl !== null && e.y + e.r >= fl) { e.y = fl - e.r; e.landed = true; e.vx = 0; }
        }
        if (e.y > CFG.world.h + 300) { e.dud = true; return true; }
      }
      if (e.life < 40 && e.life % (e.life < 20 ? 4 : 8) === 0) Snd.tone(1200, 0.03, "square", 0.06);
      return false;
    },
    end(e, fighters) {
      if (e.dud) return;
      FX.ring(e.x, e.y, 10, 150, "#ffd27a", 5);
      FX.burst(e.x, e.y, 30, e.owner.ch.color, 9);
      FX.shake(14); Snd.bigHit();
      Entities.blast(e.owner, e.x, e.y, 70, e.move, fighters);
    },
    draw(g, e, c) {
      g.save(); g.globalCompositeOperation = "source-over";
      g.translate(e.x, e.y);
      const hot = e.life < 40 && Math.floor(e.life / (e.life < 20 ? 2 : 4)) % 2 === 0;
      ink(g, () => { g.beginPath(); g.arc(0, 0, e.r, 0, 7); }, hot ? "#ff3b1f" : "#2a2230");
      g.fillStyle = hexA("#ffffff", 0.35); g.beginPath(); g.arc(-3, -3, e.r * 0.35, 0, 7); g.fill();
      g.strokeStyle = c; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, e.r - 3, 0, 7); g.stroke();
      // the fuse
      g.strokeStyle = "#c8a070"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, -e.r); g.quadraticCurveTo(5, -e.r - 6, 2, -e.r - 10); g.stroke();
      g.fillStyle = "#ffe36b"; g.shadowColor = "#ff8a1f"; g.shadowBlur = 12;
      g.beginPath(); g.arc(2, -e.r - 10, 2.6 + Math.random() * 1.4, 0, 7); g.fill();
      g.restore();
    },
  },

  /* ---- FUSE: Payload. A huge countdown bomb, with its blast radius drawn
         on the floor the whole time, so it is a threat you can run from. ---- */
  payload: {
    update(e, fighters) {
      if (!e.landed) {
        e.vy += 0.6; e.y += e.vy;
        const fl = Stage.floorBelow(e.x, e.y - e.vy);
        if (fl !== null && e.y + e.r >= fl) { e.y = fl - e.r; e.vy = 0; e.landed = true; FX.shake(6); Snd.bigHit(); }
        if (e.y > CFG.world.h + 300) { e.dud = true; return true; }
      }
      const sec = Math.ceil(e.life / 40);
      if (e.life % 40 === 0 && sec > 0) {
        FX.damageText(e.x, e.y - 60, String(sec), "#ff3b1f");
        Snd.tone(sec === 1 ? 1300 : 880, 0.1, "square", 0.14);
      }
      return false;
    },
    end(e, fighters) {
      if (e.dud) return;
      FX.flash("#ffffff", 0.5); FX.punch(0.9);
      FX.ring(e.x, e.y, 20, e.w, "#ffffff", 7);
      FX.ring(e.x, e.y, 10, e.w * 0.8, e.owner.ch.color, 5);
      FX.burst(e.x, e.y, 60, e.owner.ch.color, 14);
      FX.shake(34); FX.hitPause(12);
      Snd.superHit();
      Entities.blast(e.owner, e.x, e.y, e.w, e.move, fighters);
    },
    draw(g, e, c) {
      const k = 1 - e.life / e.max;
      warnCircle(g, e.x, e.y, e.w, "#ff3b1f", 0.25 + k * 0.45 + (e.life < 40 ? 0.2 * Math.sin(e.life) : 0));
      g.save(); g.globalCompositeOperation = "source-over";
      g.translate(e.x, e.y);
      const pulse = 1 + (e.life < 40 ? Math.abs(Math.sin(e.life * 0.4)) * 0.08 : 0);
      g.scale(pulse, pulse);
      ink(g, () => { g.beginPath(); g.arc(0, 0, e.r, 0, 7); }, vol(g, -e.r, e.r, "#3a2f40", 0.2, 0.4), 4);
      g.fillStyle = hexA("#ffffff", 0.3); g.beginPath(); g.arc(-9, -10, e.r * 0.3, 0, 7); g.fill();
      // hazard band
      g.save(); g.beginPath(); g.arc(0, 0, e.r, 0, 7); g.clip();
      hatch(g, -e.r, -5, e.r * 2, 10, "#ffc83d", 9, 0.9);
      g.restore();
      g.font = `900 22px ${FONT_DISPLAY}`; g.textAlign = "center";
      outlineText(g, String(Math.max(1, Math.ceil(e.life / 40))), 0, 30 + e.r, "#ff3b1f", 5);
      g.restore();
    },
  },

  /* ---- RICO: Return Disc. Out, slows, turns, and comes home — it hits on
         both legs, and she catches it. ---- */
  disc: {
    update(e, fighters) {
      if (!e.turned) {
        e.vx -= e.dir * 0.62;
        if (Math.sign(e.vx) !== e.dir) { e.turned = true; e.hitIds = []; e.landed = true; }
      } else {
        const o = e.owner, dx = o.x - e.x, dy = o.y - e.y, d = Math.hypot(dx, dy) || 1;
        const sp = Math.min(15, Math.hypot(e.vx, e.vy) + 0.7);
        e.vx = e.vx * 0.8 + dx / d * sp * 0.2; e.vy = e.vy * 0.8 + dy / d * sp * 0.2;
        if (d < 26 || !o.alive || o.state === ST.DEAD) {
          if (d < 26) { FX.ring(o.x, o.y, 4, 30, o.ch.accent, 2); Snd.tone(1500, 0.04, "square", 0.06); }
          return true;
        }
      }
      e.x += e.vx; e.y += e.vy;
      Entities._touch(e, fighters, false);
      return e.y > CFG.world.h + 300;
    },
    draw(g, e, c) {
      g.save(); g.translate(e.x, e.y); g.rotate(e.life * 0.5);
      g.shadowColor = c; g.shadowBlur = 16;
      g.strokeStyle = c; g.lineWidth = 4;
      g.beginPath(); g.ellipse(0, 0, e.r, e.r * 0.55, 0, 0, 7); g.stroke();
      g.strokeStyle = "#ffffff"; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(-e.r * 0.7, 0); g.lineTo(e.r * 0.7, 0); g.stroke();
      g.restore();
    },
  },

  /* ---- RICO: Bank Shot. Bounces inside the stage's box; each disc may hit
         the same foe again after a breather, at most three times. ---- */
  rdisc: {
    update(e, fighters) {
      const P = Stage.pivot;
      if (e.seek) {
        const t = Combat.nearestFoe(e.owner);
        if (t) {
          const sp = Math.hypot(e.vx, e.vy), cur = Math.atan2(e.vy, e.vx);
          let d = Math.atan2(t.y - e.y, t.x - e.x) - cur;
          while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
          const a = cur + clamp(d, -0.035, 0.035);
          e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp;
        }
      }
      e.x += e.vx; e.y += e.vy;
      const L = P.x - 560, R = P.x + 560, T = P.y - 560, B = P.y - 14;
      if (e.x < L || e.x > R) { e.vx = -e.vx; e.x = clamp(e.x, L, R); Snd.tone(900, 0.03, "square", 0.05); }
      if (e.y < T || e.y > B) { e.vy = -e.vy; e.y = clamp(e.y, T, B); Snd.tone(700, 0.03, "square", 0.05); }
      e.hitLog = e.hitLog || {};
      for (const f of fighters) {
        if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
        const h = e.hitLog[f.slot] || (e.hitLog[f.slot] = { n: 0, at: -99 });
        if (h.n >= (e.cap || 3) || (h.at > 0 && e.life > h.at - 20)) continue;
        if (dist(e.x, e.y, f.x, f.y) < e.r + f.ch.hurt) { h.n++; h.at = e.life; Combat.land(e.owner, f, e.move, e.x, e.y); }
      }
      return false;
    },
    draw(g, e, c) { KINDS.disc.draw(g, e, c); },
  },

  /* ---- SPROUT: Bloom. Heals its planter (and teammates) standing in it;
         a foe who walks through takes one sting from the thorns. ---- */
  flower: {
    update(e, fighters) {
      if (!e.landed) {
        const fl = Stage.floorBelow(e.x, e.y);
        if (fl === null) return true;
        e.y = fl; e.landed = true;
      }
      for (const f of fighters) {
        if (!f.alive || f.state === ST.DEAD) continue;
        const d = Math.abs(f.x - e.x), dy = e.y - f.feetY;
        if (d > e.r || dy < -10 || dy > 90) continue;
        if (allies(f, e.owner)) {
          if (e.life % 15 === 0 && f.percent > 0) {
            f.percent = Math.max(0, f.percent - 1);
            FX.damageText(f.x, f.y - 46, "+1", "#7dff9a");
          }
        } else if (!e.hitIds.includes(f.slot) && d < 34 && !f.intangible()) {
          e.hitIds.push(f.slot);
          Combat.land(e.owner, f, e.move, e.x, e.y - 20);
        }
      }
      if (e.life % 6 === 0) FX.spark(e.x + rnd(-e.r, e.r), e.y - rnd(4, 40), "#9dffbd");
      return false;
    },
    draw(g, e, c) {
      const grow = clamp((e.max - e.life) / 30, 0, 1), fade = clamp(e.life / 30, 0, 1);
      // the healing patch on the floor
      g.save(); g.globalAlpha = 0.3 * fade;
      const q = g.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.r);
      q.addColorStop(0, hexA("#7dff9a", 0.6)); q.addColorStop(1, hexA("#7dff9a", 0));
      g.fillStyle = q; g.beginPath(); g.ellipse(e.x, e.y, e.r, 14, 0, 0, 7); g.fill();
      g.restore();
      g.save(); g.globalCompositeOperation = "source-over"; g.globalAlpha = fade;
      g.translate(e.x, e.y);
      const h = 34 * grow, sway = Math.sin(e.life * 0.05) * 3;
      g.strokeStyle = INK; g.lineWidth = 5; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(sway, -h * 0.5, sway, -h); g.stroke();
      g.strokeStyle = "#2f9a52"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(sway, -h * 0.5, sway, -h); g.stroke();
      g.translate(sway, -h);
      for (let i = 0; i < 6; i++) {
        g.save(); g.rotate(i / 6 * Math.PI * 2 + e.life * 0.01);
        ink(g, () => { g.beginPath(); g.ellipse(0, -8 * grow, 4.5 * grow, 8 * grow, 0, 0, 7); }, c, 2);
        g.restore();
      }
      g.fillStyle = "#ffe14d"; g.beginPath(); g.arc(0, 0, 4 * grow, 0, 7); g.fill();
      g.restore();
    },
  },

  /* ---- ECHO: the afterimage Recall leaves behind. It holds for a beat,
         then detonates on anyone who walked into where she was. ---- */
  ghost: {
    update() { return false; },
    end(e, fighters) {
      FX.ring(e.x, e.y, 8, 90, e.owner.ch.color, 4);
      FX.burst(e.x, e.y, 16, e.owner.ch.accent, 6);
      Snd.tone(500, 0.12, "triangle", 0.1, 1200);
      Entities.blast(e.owner, e.x, e.y, 62, e.move, fighters);
    },
    draw(g, e, c) {
      g.save(); g.globalCompositeOperation = "source-over";
      g.globalAlpha = 0.25 + 0.25 * Math.abs(Math.sin(e.life * 0.4));
      g.translate(e.x, e.y); g.scale(e.dir || 1, 1);
      e.owner.ch.draw(g, { time: e.life, runPhase: 0, running: false, air: false, vx: 0, vy: 0,
                           state: ST.IDLE, flash: true, atkPhase: -1 });
      g.restore();
      warnCircle(g, e.x, e.y, 62, c, 0.35);
    },
  },

  /* ---- TEMPO: a sound wave. An expanding ring that hits each foe once as
         it passes them; it shatters shields rather than chipping them. ---- */
  ring: {
    update(e, fighters) {
      e.r = e.maxR * (1 - e.life / e.max) + 10;
      for (const f of fighters) {
        if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
        if (e.hitIds.includes(f.slot)) continue;
        if (Math.abs(dist(e.x, e.y, f.x, f.y) - e.r) < f.ch.hurt + 10) {
          e.hitIds.push(f.slot);
          Combat.land(e.owner, f, e.move, f.x, f.y);
        }
      }
      return false;
    },
    draw(g, e, c) {
      const a = clamp(e.life / e.max, 0, 1);
      g.save(); g.globalAlpha = a;
      g.strokeStyle = c; g.lineWidth = 5; g.shadowColor = c; g.shadowBlur = 20;
      g.beginPath(); g.arc(e.x, e.y, e.r, 0, 7); g.stroke();
      g.strokeStyle = "#ffffff"; g.lineWidth = 1.6;
      g.beginPath(); g.arc(e.x, e.y, e.r - 7, 0, 7); g.stroke();
      // notes riding the ring
      g.fillStyle = "#ffffff";
      for (let i = 0; i < 6; i++) {
        const an = i / 6 * Math.PI * 2 + e.life * 0.03;
        const nx = e.x + Math.cos(an) * e.r, ny = e.y + Math.sin(an) * e.r;
        g.beginPath(); g.ellipse(nx, ny, 3.4, 2.6, -0.4, 0, 7); g.fill();
        g.fillRect(nx + 2.4, ny - 10, 1.4, 10);
      }
      g.restore();
    },
  },

  /* ---- HEX: Doom. A mark over a cursed foe; when it closes, lightning. ---- */
  doom: {
    update(e) {
      const t = e.tgt;
      if (!t || !t.alive || t.state === ST.DEAD) { e.dud = true; return true; }
      e.x = t.x; e.y = t.y;
      return false;
    },
    end(e) {
      if (e.dud) return;
      const t = e.tgt;
      FX.bolt(t.x + rnd(-20, 20), t.y - 420, t.x, t.y, "#ffffff", { segs: 9, jag: 22, life: 14, w: 5 });
      FX.bolt(t.x, t.y - 420, t.x, t.y, e.owner.ch.color, { segs: 7, jag: 30, life: 12, w: 3 });
      FX.flash(e.owner.ch.color, 0.25); FX.shake(16);
      Snd.superHit();
      if (!t.intangible()) Combat.land(e.owner, t, e.move, t.x, t.y);
    },
    draw(g, e, c) {
      const k = e.life / e.max;
      g.save(); g.translate(e.x, e.y - 60);
      g.strokeStyle = c; g.lineWidth = 3; g.shadowColor = c; g.shadowBlur = 16;
      g.beginPath(); g.arc(0, 0, 12 + 30 * k, 0, 7); g.stroke();
      g.rotate(e.life * 0.08);
      g.beginPath();
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; g.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); }
      g.closePath(); g.stroke();
      g.restore();
    },
  },

  /* ---- VEX: the Siphon tether. The draining itself happens in her move;
         this is the line everyone can see, guests included. ---- */
  tether: {
    update(e) {
      const t = e.tgt, o = e.owner;
      if (!t || o.state !== ST.ATTACK || !o.attack || o.attack.kind !== "special" || !t.alive) return true;
      e.x = t.x; e.y = t.y;
      return false;
    },
    draw(g, e, c) {
      const o = e.owner;
      g.save();
      g.strokeStyle = hexA(c, 0.7); g.lineWidth = 3; g.shadowColor = c; g.shadowBlur = 14;
      g.setLineDash([6, 6]); g.lineDashOffset = -e.life * 2;
      g.beginPath(); g.moveTo(o.x, o.y - 8); g.lineTo(e.x, e.y); g.stroke();
      g.setLineDash([]);
      // drops of health running back along it
      for (let i = 0; i < 4; i++) {
        const t = ((e.life * 0.04 + i / 4) % 1);
        g.fillStyle = "#ff8fb0";
        g.beginPath(); g.arc(lerp(e.x, o.x, t), lerp(e.y, o.y - 8, t), 3.2, 0, 7); g.fill();
      }
      g.restore();
    },
  },
};


/* ===== src/09_render.js ===== */
/* ==========================================================================
   10. RENDER — stage, fighters and HUD

   Everything that moves is drawn at an interpolated position between the two
   most recent fixed-timestep frames, so motion stays smooth on 120Hz and
   144Hz displays instead of stepping at 60.
   ========================================================================== */

const cv = document.getElementById("cv");
const g = cv.getContext("2d", { alpha: false });
let RA = 1;   // render alpha: 0..1 between the previous and current sim step

function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 18) / H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = Math.floor(W * scale) + "px";
  cv.style.height = Math.floor(H * scale) + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas);

let bgT = 0;
function drawBackground() {
  bgT += 1 / 60;
  (Stage.def.drawBg || STAGES[0].drawBg).call(Stage.def, g, bgT);
}

/* The underside of a platform, drawn differently per stage. This is where a
   map stops being "the same deck in another colour": the Foundry's beam is
   cast iron with molten seams, the Drift's is weathered stone, the Vault's is
   bolted grating. Called already clipped to the platform body and rotated
   into its local space, so x runs along the deck and y down into it. */
function drawDeckDetail(kind, len, th, depth, pal, main, flare, t) {
  const bot = th / 2 + depth;

  if (kind === "cast") {
    // ribs, then molten seams that flare when the deck is struck
    g.strokeStyle = hexA("#000000", 0.5); g.lineWidth = 7;
    for (let x = 18; x < len; x += 46) {
      g.beginPath(); g.moveTo(x, th / 2); g.lineTo(x - 7, bot); g.stroke();
    }
    g.save();
    g.globalCompositeOperation = "lighter";
    const heat = 0.3 + flare * 0.5 + Math.sin(t * 1.4) * 0.08;
    g.strokeStyle = hexA("#ff7a1f", heat); g.lineWidth = 2.5;
    g.beginPath();
    for (let x = 0; x <= len; x += 16)
      g.lineTo(x, th / 2 + 10 + Math.sin(x * 0.07 + t) * 5);
    g.stroke();
    g.strokeStyle = hexA("#ffd27a", heat * 0.7); g.lineWidth = 1;
    g.stroke();
    g.restore();
    // drips
    g.fillStyle = hexA("#ff8a1f", 0.5);
    for (let i = 0; i < 5; i++) {
      const x = ((i * 137) % len);
      const d = 6 + (Math.sin(t * 1.1 + i * 2) * 0.5 + 0.5) * 16;
      g.beginPath(); g.ellipse(x, bot - 6, 2.4, d * 0.5, 0, 0, 7); g.fill();
    }

  } else if (kind === "cloud") {
    // weathered stone: soft strata and a mossy lip, no neon at all
    for (let i = 0; i < 3; i++) {
      g.fillStyle = hexA("#8e79b4", 0.18 - i * 0.04);
      g.fillRect(0, th / 2 + 4 + i * 11, len, 5);
    }
    g.fillStyle = hexA("#c9a7e8", 0.3);
    for (let i = 0; i < 14; i++) {
      const x = (i * 97) % len;
      g.beginPath(); g.ellipse(x, th / 2 + 2, 10 + (i % 4) * 5, 3, 0, 0, 7); g.fill();
    }
    // the stone tapers, hinting it is floating
    g.fillStyle = hexA(pal.ink, 0.5);
    poly(g, [0, bot - 22, len, bot - 22, len * 0.78, bot, len * 0.22, bot]); g.fill();

  } else if (kind === "grate") {
    // bolted plate: hazard stripes along the lip, a grille, rivet rows
    hatch(g, 0, th / 2, len, 9, "#39ff9e", 12, 0.3);
    g.strokeStyle = hexA("#000000", 0.55); g.lineWidth = 2;
    for (let x = 6; x < len; x += 11) {
      g.beginPath(); g.moveTo(x, th / 2 + 11); g.lineTo(x, bot); g.stroke();
    }
    g.strokeStyle = hexA(pal.platEdge, 0.2); g.lineWidth = 1;
    for (let y = th / 2 + 14; y < bot; y += 9) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(len, y); g.stroke();
    }
    for (let x = 14; x < len; x += 52) screw(g, x, th / 2 + 18, 2.4, "#1e7a56");

  } else if (kind === "steel") {
    // an I-beam: flange lines, web stiffeners, rows of rivets
    g.fillStyle = hexA("#000000", 0.35); g.fillRect(0, th / 2 + 8, len, 4);
    g.fillRect(0, bot - 10, len, 4);
    g.strokeStyle = hexA(pal.soft, 0.22); g.lineWidth = 3;
    for (let x = 20; x < len; x += 40) {
      g.beginPath(); g.moveTo(x, th / 2 + 12); g.lineTo(x, bot - 10); g.stroke();
    }
    for (let x = 10; x < len; x += 20) screw(g, x, th / 2 + 4, 1.8, "#8fa3c8");
    if (main) hatch(g, 0, bot - 8, len, 8, "#ffc23d", 12, 0.35);

  } else if (kind === "belt") {
    // the conveyor's rollers, turning with the belt
    for (let x = 22; x < len; x += 44) {
      g.fillStyle = "#15140f"; g.strokeStyle = hexA(pal.platEdge, 0.35); g.lineWidth = 2;
      g.beginPath(); g.arc(x, th / 2 + 18, 14, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = hexA(pal.platEdge, 0.5);
      g.beginPath();
      g.moveTo(x + Math.cos(beltRoll) * 12, th / 2 + 18 + Math.sin(beltRoll) * 12);
      g.lineTo(x - Math.cos(beltRoll) * 12, th / 2 + 18 - Math.sin(beltRoll) * 12);
      g.stroke();
    }
    hatch(g, 0, bot - 9, len, 9, "#f5d90a", 12, 0.4);

  } else if (kind === "moss") {
    // living wood: glowing fungus shelves and roots trailing off the bottom
    g.fillStyle = hexA("#2a1846", 0.8); g.fillRect(0, th / 2, len, depth);
    for (let i = 0; i < len / 30; i++) {
      const x = (i * 53) % len, gl = 0.4 + Math.sin(t * 1.2 + i) * 0.25;
      g.fillStyle = hexA(i % 2 ? "#7dffd0" : "#c46bff", gl);
      g.beginPath(); g.ellipse(x, th / 2 + 10 + (i % 3) * 9, 6, 3, 0, 0, 7); g.fill();
    }
    g.strokeStyle = hexA("#7dffd0", 0.25); g.lineWidth = 2;
    for (let x = 16; x < len; x += 38) {
      g.beginPath(); g.moveTo(x, bot - 14);
      g.quadraticCurveTo(x + 8, bot - 4, x + 2 + Math.sin(t + x) * 3, bot + 4); g.stroke();
    }

  } else if (kind === "ice") {
    // blue ice: frost bands and icicles hanging from the bottom edge
    for (let i = 0; i < 3; i++) {
      g.fillStyle = hexA("#bfe9ff", 0.12 - i * 0.03);
      g.fillRect(0, th / 2 + 6 + i * 12, len, 6);
    }
    g.fillStyle = hexA("#e6f6ff", 0.5);
    for (let x = 8; x < len; x += 22) {
      const d = 8 + hash(x) * (main ? 22 : 8);
      poly(g, [x - 5, bot - 12, x + 5, bot - 12, x, bot - 12 + d]); g.fill();
    }
    g.strokeStyle = hexA("#ffffff", 0.25); g.lineWidth = 1;
    for (let x = 30; x < len; x += 70) {
      g.beginPath(); g.moveTo(x, th / 2 + 2); g.lineTo(x + 10, th / 2 + 14); g.lineTo(x + 4, th / 2 + 24); g.stroke();
    }

  } else {
    // "neon": a lit circuit substrate under a dark deck
    g.strokeStyle = hexA(pal.platEdge, 0.16 + flare * 0.3); g.lineWidth = 3;
    for (let x = 10; x < len; x += 26) {
      g.beginPath(); g.moveTo(x, th / 2 + 4); g.lineTo(x + 12, th / 2 + 30); g.stroke();
    }
    g.strokeStyle = hexA(pal.platEdge, 0.1); g.lineWidth = 1;
    for (let x = 22; x < len; x += 64) {
      g.beginPath();
      g.moveTo(x, th / 2 + 6); g.lineTo(x, bot - 14); g.lineTo(x + 18, bot - 14);
      g.stroke();
      g.fillStyle = hexA(pal.platEdge, 0.3);
      g.beginPath(); g.arc(x + 18, bot - 14, 2, 0, 7); g.fill();
    }
  }
}

let beltRoll = 0, beltScroll = 0;

/* The support column under the deck. Same job on every map, eight different machines. */
function drawPivotColumn(P, kind, pal, t) {
  g.save();
  g.translate(P.x, P.y);

  if (kind === "steel") {
    // a lattice mast, the same kind as the crane in the background
    g.strokeStyle = hexA(pal.soft, 0.55); g.lineWidth = 4;
    g.beginPath(); g.moveTo(-20, 14); g.lineTo(-20, 340); g.moveTo(20, 14); g.lineTo(20, 340); g.stroke();
    g.lineWidth = 2.5;
    for (let y = 14; y < 330; y += 36) {
      g.beginPath(); g.moveTo(-20, y); g.lineTo(20, y + 36); g.moveTo(20, y); g.lineTo(-20, y + 36); g.stroke();
    }

  } else if (kind === "belt") {
    // a gearbox stack driving the conveyor (this runs once a frame, so it
    // also turns the rollers drawn under the deck)
    beltRoll += ((Stage.pfx[0] && Stage.pfx[0].belt) || 0) * 0.02;
    for (let i = 0; i < 4; i++) {
      const y = 50 + i * 76, r = 30 - i * 3;
      g.save(); g.translate(0, y); g.rotate(beltRoll * (i % 2 ? -1 : 1));
      g.fillStyle = "#1c1b16"; g.strokeStyle = hexA(pal.platEdge, 0.4); g.lineWidth = 3;
      g.beginPath();
      for (let k = 0; k < 20; k++) {
        const a = (k / 20) * Math.PI * 2, rr = k % 2 ? r : r + 7;
        g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }

  } else if (kind === "moss") {
    // the deck is the cap of one enormous mushroom
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, "#3a2560"); q.addColorStop(1, hexA("#1c1730", 0));
    g.fillStyle = q;
    poly(g, [-34, 10, 34, 10, 24, 340, -24, 340]); g.fill();
    g.fillStyle = hexA("#7dffd0", 0.3 + Math.sin(t) * 0.1);
    for (let y = 40; y < 300; y += 46) { g.beginPath(); g.arc(Math.sin(y) * 14, y, 4, 0, 7); g.fill(); }

  } else if (kind === "ice") {
    // a column of rock wrapped in ice
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, "#2d4363"); q.addColorStop(1, hexA("#1d2b3c", 0));
    g.fillStyle = q;
    poly(g, [-40, 10, 40, 10, 28, 180, 18, 340, -18, 340, -30, 170]); g.fill();
    g.strokeStyle = hexA("#bfe9ff", 0.35); g.lineWidth = 2;
    g.beginPath(); g.moveTo(-26, 30); g.lineTo(-12, 160); g.lineTo(-16, 300); g.stroke();

  } else if (kind === "cast") {
    // a chain hoist, because the Foundry's beam hangs rather than stands
    g.strokeStyle = "rgba(120,84,56,.75)"; g.lineWidth = 9;
    g.beginPath(); g.moveTo(0, 14); g.lineTo(0, 330); g.stroke();
    g.strokeStyle = "rgba(60,38,22,.9)"; g.lineWidth = 3;
    for (let y = 26; y < 330; y += 18) {
      g.beginPath(); g.ellipse(0, y, 7, 9, 0, 0, 7); g.stroke();
    }
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA("#ff8a1f", 0.3); g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 14); g.lineTo(0, 330); g.stroke();
    g.restore();

  } else if (kind === "cloud") {
    // a slender stone spire that frays into cloud
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, hexA("#efe3f3", 0.9));
    q.addColorStop(0.55, hexA("#c9a7e8", 0.45));
    q.addColorStop(1, hexA("#c9a7e8", 0));
    g.fillStyle = q;
    poly(g, [-13, 10, 13, 10, 5, 340, -5, 340]); g.fill();
    g.strokeStyle = hexA("#8e79b4", 0.35); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-4, 20); g.lineTo(-2, 300); g.stroke();

  } else if (kind === "grate") {
    // a hydraulic piston, with a visible rod and collar
    g.fillStyle = "#0a1a14"; g.strokeStyle = pal.ink; g.lineWidth = 4;
    roundRect(g, -16, 12, 32, 330, 5); g.stroke(); g.fill();
    g.fillStyle = hexA("#1e7a56", 0.8);
    roundRect(g, -7, 12, 14, 330, 4); g.fill();
    g.fillStyle = hexA(pal.platEdge, 0.25);
    g.fillRect(-5, 12, 3, 330);
    for (let y = 40; y < 330; y += 54) {
      g.fillStyle = "#0a1a14"; g.strokeStyle = pal.ink; g.lineWidth = 3;
      roundRect(g, -19, y, 38, 12, 3); g.stroke(); g.fill();
      screw(g, -13, y + 6, 2.2, "#1e7a56");
      screw(g, 13, y + 6, 2.2, "#1e7a56");
    }

  } else {
    // "neon": a lit strut with energy running down it
    g.strokeStyle = hexA(pal.ink, 0.9); g.lineWidth = 14;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    g.strokeStyle = hexA(pal.soft, 0.5); g.lineWidth = 10;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(pal.platEdge, 0.4); g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    // a pulse travelling down the strut
    const py = 12 + ((t * 120) % 328);
    const pg = g.createLinearGradient(0, py - 40, 0, py + 40);
    pg.addColorStop(0, hexA(pal.platEdge, 0));
    pg.addColorStop(0.5, hexA("#ffffff", 0.5));
    pg.addColorStop(1, hexA(pal.platEdge, 0));
    g.strokeStyle = pg; g.lineWidth = 5;
    g.beginPath(); g.moveTo(0, py - 40); g.lineTo(0, py + 40); g.stroke();
    g.restore();
    // cross braces
    g.strokeStyle = hexA(pal.soft, 0.3); g.lineWidth = 3;
    for (let y = 60; y < 330; y += 70) {
      g.beginPath(); g.moveTo(-18, y + 18); g.lineTo(0, y); g.lineTo(18, y + 18); g.stroke();
    }
  }

  g.restore();
}

/* ------------------------------------------------------------------ stage */
function drawStage(alpha) {
  const def = Stage.def, pal = def.pal;
  const P = Stage.pivot;
  const toW = (lx, ly) => Stage.toWorld(lx, ly);

  // the deck edge flares white while a Tipping Point goes off
  const snap = Stage.flashT > 0;
  const flare = clamp(Stage.flashT / 20, 0, 1);
  const kind = def.deck || "neon";

  /* ---- the support column, built differently per stage ---- */
  drawPivotColumn(P, kind, pal, bgT);

  def.layout.forEach((p, pi) => {
    /* Live platform state: drifting offset, how hot it is, and how solid it
       currently is. A platform that has crumbled or retracted draws nothing,
       matching the fact that it is also absent from Stage.segs. */
    const st = Stage.pfx[pi] || { dx: 0, dy: 0, present: true, heat: 0, alpha: 1 };
    const sdy = st.dy || 0;
    const hidden = !st.present && st.alpha <= 0.02;
    if (hidden && !p.retract) return;
    if (hidden) {
      /* A retracted shelf still shows its empty rails, so the gap reads as
         "the platform is away" rather than "there was never one here". */
      const ra = toW(p.x1, p.y1), rb = toW(p.x2, p.y2);
      g.save();
      g.translate(ra.x, ra.y);
      g.rotate(Math.atan2(rb.y - ra.y, rb.x - ra.x));
      const rl = Math.hypot(rb.x - ra.x, rb.y - ra.y);
      g.globalAlpha = 0.35; g.strokeStyle = hexA(pal.platEdge, 0.6); g.lineWidth = 2;
      g.setLineDash([5, 6]);
      g.beginPath(); g.moveTo(-18, 0); g.lineTo(rl + 18, 0); g.stroke();
      g.setLineDash([]);
      g.restore();
      return;
    }

    const a = toW(p.x1 + st.dx, p.y1 + sdy), b = toW(p.x2 + st.dx, p.y2 + sdy);
    const dx = b.x - a.x, dy = b.y - a.y;

    if (p.lift) {
      // the lift's cables, running up out of the top of the shot
      g.save();
      g.strokeStyle = hexA(pal.soft, 0.5); g.lineWidth = 2;
      for (const cx of [a.x + 12, b.x - 12]) {
        g.beginPath(); g.moveTo(cx, a.y - 4); g.lineTo(cx, a.y - 900); g.stroke();
      }
      // the guide rail it travels along, with its range marked
      const top = toW(p.x1, p.y1 - p.lift.range).y, low = toW(p.x1, p.y1 + p.lift.range).y;
      g.strokeStyle = hexA(pal.platEdge, 0.18); g.lineWidth = 6;
      g.beginPath(); g.moveTo((a.x + b.x) / 2, top - 10); g.lineTo((a.x + b.x) / 2, low + 30); g.stroke();
      g.restore();
    }

    if (p.bounce) {
      // a mushroom cap instead of a slab: it squashes when someone lands
      const sq = (st.squash || 0) / 14;
      const cx = (a.x + b.x) / 2, w2 = (b.x - a.x) / 2;
      g.save();
      g.globalAlpha = clamp(st.alpha, 0, 1);
      g.fillStyle = "#2a1c40";
      g.fillRect(cx - 9, a.y + 8, 18, 120);
      const capH = 30 * (1 - sq * 0.45);
      g.translate(cx, a.y);
      g.scale(1 + sq * 0.15, 1);
      const cg = g.createLinearGradient(0, -6, 0, capH);
      cg.addColorStop(0, "#d48aff"); cg.addColorStop(1, "#5a2a8a");
      g.fillStyle = cg; g.strokeStyle = pal.ink; g.lineWidth = 4;
      g.beginPath(); g.ellipse(0, capH * 0.6, w2 + 8, capH, 0, Math.PI, 0); g.closePath();
      g.stroke(); g.fill();
      g.shadowColor = "#7dffd0"; g.shadowBlur = 12;
      g.fillStyle = hexA("#7dffd0", 0.65 + Math.sin(bgT * 3) * 0.2);
      for (const ox of [-0.5, 0, 0.5]) {
        g.beginPath(); g.arc(ox * w2, capH * 0.6 - capH * (ox ? 0.55 : 0.8), 5, 0, 7); g.fill();
      }
      g.shadowBlur = 0;
      // an up-chevron so the bounce is never a surprise
      g.strokeStyle = hexA("#ffffff", 0.35 + 0.3 * Math.abs(Math.sin(bgT * 2.5))); g.lineWidth = 3;
      g.beginPath(); g.moveTo(-10, -18); g.lineTo(0, -28); g.lineTo(10, -18); g.stroke();
      g.restore();
      return;
    }
    const len = Math.hypot(dx, dy);
    const th = p.thick, main = !!p.main;
    let edge = main
      ? (snap ? "#ffffff" : pal.platEdge)
      : pal.soft;
    // a heating shelf shifts toward molten, and flashes while it warns
    if (st.heat >= 1) edge = "#ff5a19";
    else if (st.heat > 0) edge = Math.floor(bgT * 10) % 2 ? "#ffb347" : pal.soft;

    g.save();
    g.globalAlpha = clamp(st.alpha, 0, 1);
    g.translate(a.x, a.y);
    g.rotate(Math.atan2(dy, dx));

    const depth = main ? 48 : 15;
    const top = -th / 2, bot = th / 2 + depth;
    const round = kind === "cloud" ? Math.min(16, th) : 5;

    // cast shadow under the deck, so it floats above the background
    g.save();
    g.globalAlpha = 0.4; g.fillStyle = "#000";
    roundRect(g, 2, top + 5, len, th + depth, round); g.fill();
    g.restore();

    // the body: ink edge, then a top-lit gradient
    const lg = g.createLinearGradient(0, top, 0, bot);
    lg.addColorStop(0, shade(pal.plat, 0.3));
    lg.addColorStop(0.22, shade(pal.plat, 0.06));
    lg.addColorStop(1, pal.ink);
    roundRect(g, 0, top, len, th + depth, round);
    g.strokeStyle = pal.ink; g.lineWidth = 4; g.lineJoin = "round"; g.stroke();
    g.fillStyle = lg; g.fill();

    /* ---- per-stage underside construction ---- */
    g.save();
    roundRect(g, 0, top, len, th + depth, round); g.clip();
    drawDeckDetail(kind, len, th, depth, pal, main, main ? flare : 0, bgT);
    g.restore();

    // the walking surface, lit
    g.shadowColor = edge; g.shadowBlur = snap ? 36 : kind === "cloud" ? 10 : 20;
    g.strokeStyle = edge; g.lineWidth = main ? 5 : 3;
    g.beginPath(); g.moveTo(0, top); g.lineTo(len, top); g.stroke();
    g.shadowBlur = 0;
    // a thin bright bevel just below it reads as a machined lip
    g.strokeStyle = hexA("#ffffff", kind === "cloud" ? 0.5 : 0.28); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(1, top + 3.5); g.lineTo(len - 1, top + 3.5); g.stroke();

    if (!p.solid) {
      g.strokeStyle = hexA(pal.soft, 0.45); g.lineWidth = 2;
      g.setLineDash([8, 10]);
      g.beginPath(); g.moveTo(0, th / 2 + 11); g.lineTo(len, th / 2 + 11); g.stroke();
      g.setLineDash([]);
    }

    if (main) {
      // ledge caps — the thing you are actually aiming for when recovering
      g.fillStyle = edge; g.shadowColor = edge; g.shadowBlur = 16;
      g.beginPath(); g.arc(3, top, 5, 0, 7); g.fill();
      g.beginPath(); g.arc(len - 3, top, 5, 0, 7); g.fill();
      g.shadowBlur = 0;
    }

    /* ---- the platform's own state, drawn on top of its body ---- */
    if (st.heat > 0) {
      // molten glow rising off a hot shelf
      g.save();
      g.globalCompositeOperation = "lighter";
      const q = g.createLinearGradient(0, top - 22, 0, top + 6);
      const k = st.heat >= 1 ? 0.75 : 0.3;
      q.addColorStop(0, hexA("#ff5a19", 0)); q.addColorStop(1, hexA("#ffb347", k));
      g.fillStyle = q; g.fillRect(0, top - 22, len, 28);
      if (st.heat >= 1 && Math.random() < 0.5)
        FX.spark(a.x + Math.random() * dx, a.y - 4 + Math.random() * dy, "#ff8a1f");
      g.restore();
    }
    if (p.crumble && st.present && st.stood > 0) {
      // stress cracks appear as a cloud shelf takes weight
      g.save();
      g.globalAlpha = Math.min(0.8, st.stood / p.crumble.delay);
      g.strokeStyle = "#6b5a85"; g.lineWidth = 1.6; g.lineCap = "round";
      for (let i = 1; i < 5; i++) {
        const cx2 = (len * i) / 5;
        g.beginPath(); g.moveTo(cx2, top + 1); g.lineTo(cx2 + 5, top + th + 3); g.stroke();
      }
      g.restore();
    }
    if (p.belt) {
      // chevrons riding the tread, flashing amber before the belt reverses
      beltScroll += (st.belt || 0) / Math.max(1, def.layout.filter(q => q.belt).length);
      const dir = (st.belt || 0) >= 0 ? 1 : -1;
      const warn = st.beltWarn && Math.floor(bgT * 8) % 2;
      g.save();
      g.beginPath(); g.rect(0, top - 2, len, th); g.clip();
      g.strokeStyle = warn ? "#ff5a19" : hexA(pal.platEdge, 0.55); g.lineWidth = 3;
      const off = ((beltScroll % 40) + 40) % 40;
      for (let x = -40 + off; x < len + 40; x += 40) {
        g.beginPath();
        g.moveTo(x - 6 * dir, top + 4); g.lineTo(x + 4 * dir, top + th / 2); g.lineTo(x - 6 * dir, top + th - 4);
        g.stroke();
      }
      g.restore();
    }
    if (p.retract) {
      // guide rails the shelf slides back into
      g.save();
      g.globalAlpha = 0.5; g.strokeStyle = hexA(pal.platEdge, 0.5); g.lineWidth = 2;
      g.setLineDash([5, 6]);
      g.beginPath(); g.moveTo(-18, top + th / 2); g.lineTo(len + 18, top + th / 2); g.stroke();
      g.setLineDash([]);
      g.restore();
    }
    g.restore();
  });

  if (def.wind) drawWind(P);
}

/* Howling Peak: streaks blowing across the deck during a gust, and pulsing
   arrows under the clock while one is building (drawWindWarning). */
function drawWind(P) {
  const w = Stage.windNow();
  if (!w.x && !w.warn) return;
  g.save();
  if (w.x) {
    const k = Math.abs(w.x) / Stage.def.wind.push, dir = Math.sign(w.x);
    g.strokeStyle = hexA("#e6f6ff", 0.35 * k); g.lineWidth = 2; g.lineCap = "round";
    for (let i = 0; i < 26; i++) {
      const y = P.y - 460 + hash(i * 3) * 520;
      const span = 1500;
      const x = P.x - 750 + (((hash(i) * span + bgT * 900 * dir) % span) + span) % span;
      const l = 40 + hash(i * 7) * 80;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - l * dir, y); g.stroke();
    }
  }
  g.restore();
}

/** The gust warning lives in the HUD, under the clock, so the camera can
    never push it behind the timer or the player cards. */
function drawWindWarning() {
  if (!Stage.def.wind) return;
  const w = Stage.windNow();
  if (!w.warn) return;
  const dir = w.dir, pulse = 0.4 + 0.6 * Math.abs(Math.sin(bgT * 6));
  g.save();
  g.translate(W / 2, 142);         // the clock panel ends at 118
  g.globalAlpha = Math.min(1, w.warn * 2) * pulse;
  g.fillStyle = "#e6f6ff"; g.shadowColor = "#bfe9ff"; g.shadowBlur = 18;
  for (let i = 0; i < 3; i++) {
    const x = (i - 1) * 40 * dir;
    poly(g, [x - 12 * dir, -15, x + 12 * dir, 0, x - 12 * dir, 15, x - 3 * dir, 0]); g.fill();
  }
  g.font = `900 14px ${FONT_DISPLAY}`; g.textAlign = "center";
  g.fillText("GUST INCOMING", 0, 34);
  g.restore();
}

/* --------------------------------------------------------------- fighter */
function drawFighter(f, alpha) {
  if (f.state === ST.DEAD) return;
  const ch = f.ch;
  const rx = lerp(f.px, f.x, alpha);
  const ry = lerp(f.py, f.y, alpha);

  /* Contact shadow on the deck below. It tracks the fighter's own feet rather
     than a fixed offset, so it stays glued to a tilted surface, and it shrinks
     and fades with height — which is most of what sells a jump. */
  {
    let sy = null;
    if (f.grounded) sy = f.feetY;
    else {
      // nearest surface under him, so the shadow still reads mid-jump
      const feet = ry + ch.size.h / 2;
      for (const s of Stage.segs) {
        const y = Stage.surfaceY(s, rx);
        if (y != null && y >= feet - 4 && (sy === null || y < sy)) sy = y;
      }
    }
    if (sy != null && isFinite(sy)) {
      const drop = clamp((sy - (ry + ch.size.h / 2)) / 160, 0, 1);
      const k = 1 - drop;
      if (k > 0.05) {
        g.save();
        g.globalAlpha = 0.34 * k;
        g.fillStyle = "#000000";
        g.beginPath();
        g.ellipse(rx, sy - 1, ch.size.w * 0.48 * (0.55 + k * 0.45),
                  4.5 * (0.5 + k * 0.5), 0, 0, 7);
        g.fill();
        g.restore();
      }
    }
  }

  /* Team ring: in a 2v2 a coloured ellipse under the feet says which side a
     fighter is on even when the tags are lost in a pile-up. */
  if (f.team != null && f.grounded) {
    g.save();
    g.globalAlpha = 0.55;
    g.strokeStyle = f.tint; g.lineWidth = 2.5;
    g.shadowColor = f.tint; g.shadowBlur = 10;
    g.beginPath(); g.ellipse(rx, f.feetY - 1, ch.size.w * 0.62, 6, 0, 0, 7); g.stroke();
    g.restore();
  }

  // afterimage trail
  if (f.trail.length) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (const t of f.trail) {
      g.globalAlpha = (t.life / 10) * (f.inSuper ? 0.3 : 0.18);
      g.save();
      g.translate(t.x, t.y);
      g.scale(t.facing, 1);
      g.fillStyle = ch.color;
      roundRect(g, -ch.size.w / 2, -ch.size.h / 2, ch.size.w, ch.size.h, 9);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  // --- anim context handed to the character's own draw() ---
  const atk = f.attack;
  const A = {
    time: f.animTime,
    runPhase: f.runPhase,
    running: f.state === ST.RUN && f.grounded,
    air: !f.grounded,
    vx: f.vx, vy: f.vy,
    state: f.state,
    flash: f.hitFlash > 0,
    atkPhase: (atk && atk.data.r) ? clamp(atk.t / Math.max(1, atk.total), 0, 1) : -1,
    atkKind: atk ? atk.kind : null,
    // real frame data, so swing() can line the pose up with the hitbox
    atkT: atk ? atk.t : 0,
    atkStartup: atk ? atk.data.startup : 0,
    atkActive: atk ? atk.data.active : 0,
    atkTotal: atk ? atk.total : 0,
    move: atk ? atk.data : null,
  };

  g.save();
  g.translate(rx, ry);

  let lean;
  if (f.grounded && f.groundSeg) lean = f.groundSeg.angle * 0.85;
  else lean = clamp(f.vx * 0.016, -0.3, 0.3);
  if (f.state === ST.HITSTUN) lean = Math.sin(f.hitstun * 0.6) * 0.5;
  if (f.pinned) lean = 0;
  g.rotate(lean);

  const squash = f.state === ST.JUMPSQUAT ? 0.80
               : f.state === ST.LANDLAG ? 0.90
               : f.state === ST.SPOTDODGE ? 0.74 : 1;
  const stretch = (!f.grounded && f.vy < -4) ? 1.09 : 1;
  const breathe = (f.state === ST.IDLE && f.grounded) ? 1 + Math.sin(f.animTime * 0.055) * 0.015 : 1;
  g.scale(f.facing, squash * stretch * breathe);

  if (f.intangible()) g.globalAlpha = 0.42;
  /* Shade's Fade: nearly gone. Online, her own player still sees her
     clearly enough to play; on a shared screen everyone sees the shimmer. */
  if (f.stealthT > 0) {
    const mine = Net.active && f.slot === Net.slot;
    g.globalAlpha = (mine ? 0.42 : 0.1) + 0.06 * Math.sin(f.animTime * 0.3);
  }
  ch.draw(g, A);
  g.restore();

  drawStatus(f, rx, ry);

  /* ---- world-space overlays ---- */
  if (f.shielding()) {
    const k = f.shield / CFG.shieldMax;
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.22 + k * 0.3;
    const rr = ch.hurt * 1.5 * (0.6 + k * 0.5);
    const rgd = g.createRadialGradient(rx, ry, rr * 0.2, rx, ry, rr);
    rgd.addColorStop(0, "rgba(255,255,255,.5)"); rgd.addColorStop(1, f.tint);
    g.fillStyle = rgd;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.fill();
    g.globalAlpha = 0.5; g.strokeStyle = "#ffffff"; g.lineWidth = 2;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.stroke();
    g.restore();
  }

  if (f.state === ST.SHIELDBREAK) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const a = f.animTime / 14 + i * Math.PI / 2;
      g.fillStyle = "#ffe36b";
      g.beginPath(); g.arc(rx + Math.cos(a) * 26, ry - ch.size.h * 0.6 + Math.sin(a) * 8, 4, 0, 7); g.fill();
    }
    g.restore();
  }

  if (f.state === ST.RESPAWN) {
    g.save();
    g.globalAlpha = 0.6 + 0.3 * Math.sin(f.animTime * 0.1);
    g.strokeStyle = f.tint; g.lineWidth = 4;
    g.shadowColor = f.tint; g.shadowBlur = 20;
    g.beginPath(); g.ellipse(rx, ry + ch.size.h * 0.55, 42, 9, 0, 0, 7); g.stroke();
    g.restore();
  }

  if (f.anchorGlow > 0) {
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.3;
    g.strokeStyle = ch.color; g.lineWidth = 3;
    g.beginPath(); g.arc(rx, ry, ch.hurt * 1.9 + Math.sin(f.animTime * 0.1) * 4, 0, 7); g.stroke();
    g.restore();
  }

  // super aura
  if (f.inSuper) {
    g.save(); g.globalCompositeOperation = "lighter";
    const p = f.attack.t * 0.2;
    for (let i = 0; i < 3; i++) {
      g.globalAlpha = 0.26 - i * 0.07;
      g.strokeStyle = ch.accent; g.lineWidth = 2.5;
      g.beginPath();
      g.ellipse(rx, ry, ch.hurt * (1.5 + i * 0.5), ch.hurt * (0.7 + i * 0.3), p + i, 0, 7);
      g.stroke();
    }
    g.restore();
  }

  if (f.attack && f.hitboxActive() && Settings.get("showHitboxGlow")) {
    const hb = f.hitboxWorld();
    g.save(); g.globalCompositeOperation = "lighter";
    const rgd = g.createRadialGradient(hb.x, hb.y, 1, hb.x, hb.y, hb.r);
    rgd.addColorStop(0, "rgba(255,255,255,.5)");
    rgd.addColorStop(0.5, hexA(ch.color, 0.32));
    rgd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rgd;
    g.beginPath(); g.arc(hb.x, hb.y, hb.r, 0, 7); g.fill();
    g.restore();
  }

  /* Player tag. Online, the fighter this screen controls is marked YOU with
     a pointer, because with four players on one stage "which one am I" is
     the first question after every respawn. */
  const mine = Net.active && f.slot === Net.slot;
  const tagY = ry - ch.size.h * 0.82;
  g.save();
  g.font = `700 12px ${FONT_MONO}`;
  g.textAlign = "center";
  g.globalAlpha = 0.9;
  g.fillStyle = f.tint;
  const label = mine ? "YOU" : `P${f.slot + 1}${f.isCPU ? " CPU" : ""}`;
  if (mine) { g.shadowColor = f.tint; g.shadowBlur = 10; }
  g.fillText(label, rx, tagY);
  if (mine) {
    const bob = Math.sin(f.animTime * 0.12) * 2;
    poly(g, [rx - 6, tagY + 4 + bob, rx + 6, tagY + 4 + bob, rx, tagY + 10 + bob]);
    g.fill();
  }
  g.restore();
}

function drawOffscreenMarkers(fighters, cam) {
  for (const f of fighters) {
    if (!f.alive || f.state === ST.DEAD) continue;
