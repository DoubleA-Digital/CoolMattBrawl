             + def.percent * CFG.kbPercentScale * scale * 1.9;
    const mag = kb * ((CFG.kbWeightRef + 0.55) / (def.ch.weight + 0.55));
    const rad = (move.angle != null ? move.angle : 45) * Math.PI / 180;

    def.applyKnockback(Math.cos(rad) * mag * dirX, -Math.sin(rad) * mag, dmg, mag, atk);
    atk.stats.damageDealt += dmg;
    atk.addMeter(dmg * CFG.meter.onDeal);
    atk.recordMove(move);
    if (move.onHit) move.onHit(atk, def);

    /* Hit confirm: a clean connect refunds part of the remaining endlag, so
       landing a commital move leaves you safer than whiffing it. Multi-hit
       moves and supers are excluded — cutting their recovery would truncate
       the move itself. */
    const a2 = atk.attack;
    if (a2 && a2.kind !== "super" && !(move.hits > 1)) {
      const left = a2.total - a2.t;
      if (left > 0) a2.t += Math.round(left * K.hitConfirmCut);
    }

    // the pivot feels every hit
    Stage.nudge(clamp((def.x - Stage.pivot.x) / 310, -1, 1) * mag * Stage.cfg.hitNudge);
    Stage.lastPusher = atk;

    // ---------------- feel ----------------
    const pause = Math.round(CFG.hitPauseBase + dmg * CFG.hitPausePerDmg);
    FX.hitPause(pause);
    FX.shake(3 + dmg * 0.85);
    FX.burst(hx, hy, Math.round(6 + dmg * 1.1), atk.ch.color, 3 + dmg * 0.35);
    FX.ring(hx, hy, 6, 30 + dmg * 5, "#ffffff", 2);
    FX.hitmark(hx, hy, dmg);
    // the bigger the hit, the more it throws off
    if (dmg >= 6) {
      const away = Math.atan2(-Math.sin(rad), Math.cos(rad) * dirX);
      FX.impactLines(hx, hy, away, Math.round(3 + dmg * 0.45),
                     dmg >= 13 ? "#ffffff" : atk.ch.accent, 30 + dmg * 2.4);
    }
    FX.damageText(hx, hy - 24, dmg, tip ? "#ffffff" : atk.ch.accent);
    Snd.hit(dmg);
    if (dmg >= 13) { Snd.bigHit(); FX.flash(atk.ch.color, 0.12); FX.punch(0.5); }
    else if (dmg >= 7) FX.punch(0.22);

    /* Tell the player why the number was what it was — a skill mechanic the
       player cannot see is just inconsistency. */
    if (tip) {
      FX.ring(hx, hy, 4, 44, "#ffffff", 3);
      FX.damageText(hx, hy - 44, "TIP", "#ffffff");
      Snd.tone(1500, 0.05, "square", 0.09, 2300);
    }
    if (staleMul < 0.95) FX.damageText(hx, hy - 44, "STALE", "#8f8cb5");
  },
};

/* ------------------------------------------------------------------- CPU */
const CPU = {
  think(f, match) {
    f._ai = f._ai || { t: 0, cur: {}, prev: {} };
    const ai = f._ai;
    ai.prev = Object.assign({}, ai.cur);
    ai.cur = {}; BUTTONS.forEach(b => ai.cur[b] = false);
    ai.t++;

    const inp = {
      ax: 0, ay: 0,
      held: b => !!ai.cur[b],
      hit: b => !!ai.cur[b] && !ai.prev[b],
      released: b => !ai.cur[b] && !!ai.prev[b],
    };
    const press = b => { ai.cur[b] = true; };

    const foes = match.fighters.filter(o => o !== f && o.alive && o.state !== ST.DEAD);
    if (!foes.length) return inp;
    let target = foes[0], bd = Infinity;
    for (const o of foes) { const d = dist(f.x, f.y, o.x, o.y); if (d < bd) { bd = d; target = o; } }

    const centerX = Stage.pivot.x;
    const onStage = f.groundSeg !== null;
    const halfDeck = Math.abs(Stage.def.layout[0].x2);

    // --- recovery first ---
    if (!onStage && (Math.abs(f.x - centerX) > halfDeck || f.y > Stage.pivot.y + 70)) {
      const dir = f.x < centerX ? "right" : "left";
      press(dir); inp.ax = dir === "right" ? 1 : -1;
      if (f.vy > 1 && f.airJumps > 0 && ai.t % 14 < 2) press("up");
      if (f.y > Stage.pivot.y + 20 && ai.t % 10 < 2) press("up");
      return inp;
    }

    // --- climb uphill when the deck is steep ---
    const tiltSign = Math.sign(Stage.tilt);
    if (Math.abs(Stage.tilt) > Stage.cfg.limit * 0.62 && onStage &&
        Math.sign(f.x - centerX) === tiltSign && Math.abs(f.x - centerX) > halfDeck * 0.55) {
      const dir = tiltSign > 0 ? "left" : "right";
      press(dir); inp.ax = dir === "right" ? 1 : -1;
      if (ai.t % 30 < 2 && f.ch.id !== "BOLDER") press("up");
      return inp;
    }

    const dx = target.x - f.x, dy = target.y - f.y, adx = Math.abs(dx);

    // --- super when it's up and the target is worth it ---
    if (f.meterFull && Math.random() < CFG.cpu.superChance && (adx < 320 || f.ch.id === "PIVOT")) {
      press("super"); return inp;
    }

    if (Math.random() < CFG.cpu.dodgeChance && f.grounded) { press("shield"); return inp; }

    if (adx > 54) { const dir = dx > 0 ? "right" : "left"; press(dir); inp.ax = dx > 0 ? 1 : -1; }
    if (dy < -70 && f.grounded && ai.t % 24 < 2) press("up");
    if (dy < -50 && !f.grounded && f.airJumps > 0 && ai.t % 20 < 2) press("up");
    if (dy > 90 && !f.grounded) { press("down"); inp.ay = 1; }

    const inLight = adx < 58 && Math.abs(dy) < 52;
    const inHeavy = adx < 76 && Math.abs(dy) < 58;
    if (inLight && Math.random() < CFG.cpu.aggression * 0.3) {
      if (target.percent > 70 && Math.random() < 0.5) press("heavy");
      else if (Math.random() < 0.18) press("grab");
      else press("light");
    } else if (inHeavy && Math.random() < 0.16) press("heavy");

    if (f.specialCD <= 0 && Math.random() < 0.012) {
      const t = Math.abs(Stage.balance());
      switch (f.ch.id) {
        case "BOLDER": if (adx < 120) press("special"); break;
        case "ZIP":    if (t > 0.4 || adx < 170) press("special"); break;
        case "ORBIT":  if (t > 0.45 || adx < 260) press("special"); break;
        case "PIVOT":  if (t > 0.2) press("special"); break;
        // drop a cube on whichever side is already heavy, to push it over
        case "BALLAST": if (adx < 340) press("special"); break;
        // ride an updraft when recovering, or to escape a steep deck
        case "KITE":    if (!f.grounded || t > 0.5) press("special"); break;
        // plant only when the deck is leaning his way and a foe is close
        case "HUSK":    if (adx < 150 && t > 0.15) press("special"); break;
        // hold the counter when someone is in swinging range
        case "MIRA":    if (adx < 90) press("special"); break;
      }
    }
    if (f.state === ST.ATTACK && f.ch.id === "PIVOT" && f.attack && f.attack.kind === "special") {
      press("special");
      const side = Math.sign(target.x - centerX) || 1;
      if (side > 0) { press("right"); inp.ax = 1; } else { press("left"); inp.ax = -1; }
    }
    if (f.state === ST.GRABBED && ai.t % 3 === 0) press("light");
    return inp;
  },
};


/* ===== src/09_render.js ===== */
/* ==========================================================================
   10. RENDER — stage, fighters and HUD

   Everything that moves is drawn at an interpolated position between the two
   most recent fixed-timestep frames, so motion stays smooth on 120Hz and
   144Hz displays instead of stepping at 60.
   ========================================================================== */

const cv = document.getElementById("cv");
const g = cv.getContext("2d", { alpha: false });
let RA = 1;   // render alpha: 0..1 between the previous and current sim step

function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 18) / H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = Math.floor(W * scale) + "px";
  cv.style.height = Math.floor(H * scale) + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas);

let bgT = 0;
function drawBackground() {
  bgT += 1 / 60;
  (Stage.def.drawBg || STAGES[0].drawBg).call(Stage.def, g, bgT);
}

/* The underside of a platform, drawn differently per stage. This is where a
   map stops being "the same deck in another colour": the Foundry's beam is
   cast iron with molten seams, the Drift's is weathered stone, the Vault's is
   bolted grating. Called already clipped to the platform body and rotated
   into its local space, so x runs along the deck and y down into it. */
function drawDeckDetail(kind, len, th, depth, pal, main, near, t) {
  const bot = th / 2 + depth;

  if (kind === "cast") {
    // ribs, then molten seams that brighten as the beam nears its limit
    g.strokeStyle = hexA("#000000", 0.5); g.lineWidth = 7;
    for (let x = 18; x < len; x += 46) {
      g.beginPath(); g.moveTo(x, th / 2); g.lineTo(x - 7, bot); g.stroke();
    }
    g.save();
    g.globalCompositeOperation = "lighter";
    const heat = 0.3 + near * 0.5 + Math.sin(t * 1.4) * 0.08;
    g.strokeStyle = hexA("#ff7a1f", heat); g.lineWidth = 2.5;
    g.beginPath();
    for (let x = 0; x <= len; x += 16)
      g.lineTo(x, th / 2 + 10 + Math.sin(x * 0.07 + t) * 5);
    g.stroke();
    g.strokeStyle = hexA("#ffd27a", heat * 0.7); g.lineWidth = 1;
    g.stroke();
    g.restore();
    // drips
    g.fillStyle = hexA("#ff8a1f", 0.5);
    for (let i = 0; i < 5; i++) {
      const x = ((i * 137) % len);
      const d = 6 + (Math.sin(t * 1.1 + i * 2) * 0.5 + 0.5) * 16;
      g.beginPath(); g.ellipse(x, bot - 6, 2.4, d * 0.5, 0, 0, 7); g.fill();
    }

  } else if (kind === "cloud") {
    // weathered stone: soft strata and a mossy lip, no neon at all
    for (let i = 0; i < 3; i++) {
      g.fillStyle = hexA("#8e79b4", 0.18 - i * 0.04);
      g.fillRect(0, th / 2 + 4 + i * 11, len, 5);
    }
    g.fillStyle = hexA("#c9a7e8", 0.3);
    for (let i = 0; i < 14; i++) {
      const x = (i * 97) % len;
      g.beginPath(); g.ellipse(x, th / 2 + 2, 10 + (i % 4) * 5, 3, 0, 0, 7); g.fill();
    }
    // the stone tapers, hinting it is floating
    g.fillStyle = hexA(pal.ink, 0.5);
    poly(g, [0, bot - 22, len, bot - 22, len * 0.78, bot, len * 0.22, bot]); g.fill();

  } else if (kind === "grate") {
    // bolted plate: hazard stripes along the lip, a grille, rivet rows
    hatch(g, 0, th / 2, len, 9, "#39ff9e", 12, 0.3);
    g.strokeStyle = hexA("#000000", 0.55); g.lineWidth = 2;
    for (let x = 6; x < len; x += 11) {
      g.beginPath(); g.moveTo(x, th / 2 + 11); g.lineTo(x, bot); g.stroke();
    }
    g.strokeStyle = hexA(pal.platEdge, 0.2); g.lineWidth = 1;
    for (let y = th / 2 + 14; y < bot; y += 9) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(len, y); g.stroke();
    }
    for (let x = 14; x < len; x += 52) screw(g, x, th / 2 + 18, 2.4, "#1e7a56");

  } else {
    // "neon": a lit circuit substrate under a dark deck
    g.strokeStyle = hexA(pal.platEdge, 0.16 + near * 0.3); g.lineWidth = 3;
    for (let x = 10; x < len; x += 26) {
      g.beginPath(); g.moveTo(x, th / 2 + 4); g.lineTo(x + 12, th / 2 + 30); g.stroke();
    }
    g.strokeStyle = hexA(pal.platEdge, 0.1); g.lineWidth = 1;
    for (let x = 22; x < len; x += 64) {
      g.beginPath();
      g.moveTo(x, th / 2 + 6); g.lineTo(x, bot - 14); g.lineTo(x + 18, bot - 14);
      g.stroke();
      g.fillStyle = hexA(pal.platEdge, 0.3);
      g.beginPath(); g.arc(x + 18, bot - 14, 2, 0, 7); g.fill();
    }
  }
}

/* The support column under the deck. Same job on every map, four different machines. */
function drawPivotColumn(P, kind, pal, anch, t) {
  g.save();
  g.translate(P.x, P.y);

  if (kind === "cast") {
    // a chain hoist, because the Foundry's beam hangs rather than stands
    g.strokeStyle = "rgba(120,84,56,.75)"; g.lineWidth = 9;
    g.beginPath(); g.moveTo(0, 14); g.lineTo(0, 330); g.stroke();
    g.strokeStyle = "rgba(60,38,22,.9)"; g.lineWidth = 3;
    for (let y = 26; y < 330; y += 18) {
      g.beginPath(); g.ellipse(0, y, 7, 9, 0, 0, 7); g.stroke();
    }
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA("#ff8a1f", 0.3); g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 14); g.lineTo(0, 330); g.stroke();
    g.restore();

  } else if (kind === "cloud") {
    // a slender stone spire that frays into cloud
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, hexA("#efe3f3", 0.9));
    q.addColorStop(0.55, hexA("#c9a7e8", 0.45));
    q.addColorStop(1, hexA("#c9a7e8", 0));
    g.fillStyle = q;
    poly(g, [-13, 10, 13, 10, 5, 340, -5, 340]); g.fill();
    g.strokeStyle = hexA("#8e79b4", 0.35); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-4, 20); g.lineTo(-2, 300); g.stroke();

  } else if (kind === "grate") {
    // a hydraulic piston, with a visible rod and collar
    g.fillStyle = "#0a1a14"; g.strokeStyle = pal.ink; g.lineWidth = 4;
    roundRect(g, -16, 12, 32, 330, 5); g.stroke(); g.fill();
    g.fillStyle = hexA("#1e7a56", 0.8);
    roundRect(g, -7, 12, 14, 330, 4); g.fill();
    g.fillStyle = hexA(pal.platEdge, 0.25);
    g.fillRect(-5, 12, 3, 330);
    for (let y = 40; y < 330; y += 54) {
      g.fillStyle = "#0a1a14"; g.strokeStyle = pal.ink; g.lineWidth = 3;
      roundRect(g, -19, y, 38, 12, 3); g.stroke(); g.fill();
      screw(g, -13, y + 6, 2.2, "#1e7a56");
      screw(g, 13, y + 6, 2.2, "#1e7a56");
    }

  } else {
    // "neon": a lit strut with energy running down it
    g.strokeStyle = hexA(pal.ink, 0.9); g.lineWidth = 14;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    g.strokeStyle = hexA(pal.soft, 0.5); g.lineWidth = 10;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(pal.platEdge, 0.4); g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    // a pulse travelling down the strut
    const py = 12 + ((t * 120) % 328);
    const pg = g.createLinearGradient(0, py - 40, 0, py + 40);
    pg.addColorStop(0, hexA(pal.platEdge, 0));
    pg.addColorStop(0.5, hexA("#ffffff", 0.5));
    pg.addColorStop(1, hexA(pal.platEdge, 0));
    g.strokeStyle = pg; g.lineWidth = 5;
    g.beginPath(); g.moveTo(0, py - 40); g.lineTo(0, py + 40); g.stroke();
    g.restore();
    // cross braces
    g.strokeStyle = hexA(pal.soft, 0.3); g.lineWidth = 3;
    for (let y = 60; y < 330; y += 70) {
      g.beginPath(); g.moveTo(-18, y + 18); g.lineTo(0, y); g.lineTo(18, y + 18); g.stroke();
    }
  }

  if (anch) {
    // anchor bolts clamp the column when Orbit locks the stage
    g.fillStyle = "#b6ff3b"; g.shadowColor = "#b6ff3b"; g.shadowBlur = 18;
    for (const s of [-1, 1]) {
      poly(g, [s * 20, 30, s * 46, 18, s * 46, 44]); g.fill();
    }
    g.shadowBlur = 0;
  }
  g.restore();
}

/* ------------------------------------------------------------------ stage */
function drawStage(alpha) {
  const def = Stage.def, pal = def.pal;
  const tilt = lerp(Stage.prevTilt, Stage.tilt, alpha);
  const c = Math.cos(tilt), s = Math.sin(tilt);
  const P = Stage.pivot;
  const toW = (lx, ly) => ({ x: P.x + lx * c - ly * s, y: P.y + lx * s + ly * c });

  const anch = Stage.anchorTimer > 0;
  const snap = Stage.snapFlash > 0;
  const near = Math.abs(clamp(tilt / Stage.cfg.limit, -1, 1));
  const kind = def.deck || "neon";

  /* ---- the support column, built differently per stage ---- */
  drawPivotColumn(P, kind, pal, anch, bgT);

  def.layout.forEach((p, pi) => {
    /* Live platform state: drifting offset, how hot it is, and how solid it
       currently is. A platform that has crumbled or retracted draws nothing,
       matching the fact that it is also absent from Stage.segs. */
    const st = Stage.pfx[pi] || { dx: 0, present: true, heat: 0, alpha: 1 };
    const hidden = !st.present && st.alpha <= 0.02;
    if (hidden && !p.retract) return;
    if (hidden) {
      /* A retracted shelf still shows its empty rails, so the gap reads as
         "the platform is away" rather than "there was never one here". */
      const ra = toW(p.x1, p.y1), rb = toW(p.x2, p.y2);
      g.save();
      g.translate(ra.x, ra.y);
      g.rotate(Math.atan2(rb.y - ra.y, rb.x - ra.x));
      const rl = Math.hypot(rb.x - ra.x, rb.y - ra.y);
      g.globalAlpha = 0.35; g.strokeStyle = hexA(pal.platEdge, 0.6); g.lineWidth = 2;
      g.setLineDash([5, 6]);
      g.beginPath(); g.moveTo(-18, 0); g.lineTo(rl + 18, 0); g.stroke();
      g.setLineDash([]);
      g.restore();
      return;
    }

    const a = toW(p.x1 + st.dx, p.y1), b = toW(p.x2 + st.dx, p.y2);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const th = p.thick, main = !!p.main;
    let edge = main
      ? (snap ? "#ffffff" : near > 0.8 ? "#ff2e88" : anch ? "#b6ff3b" : pal.platEdge)
      : pal.soft;
    // a heating shelf shifts toward molten, and flashes while it warns
    if (st.heat >= 1) edge = "#ff5a19";
    else if (st.heat > 0) edge = Math.floor(bgT * 10) % 2 ? "#ffb347" : pal.soft;

    g.save();
    g.globalAlpha = clamp(st.alpha, 0, 1);
    g.translate(a.x, a.y);
    g.rotate(Math.atan2(dy, dx));

    const depth = main ? 48 : 15;
    const top = -th / 2, bot = th / 2 + depth;
    const round = kind === "cloud" ? Math.min(16, th) : 5;

    // cast shadow under the deck, so it floats above the background
    g.save();
    g.globalAlpha = 0.4; g.fillStyle = "#000";
    roundRect(g, 2, top + 5, len, th + depth, round); g.fill();
    g.restore();

    // the body: ink edge, then a top-lit gradient
    const lg = g.createLinearGradient(0, top, 0, bot);
    lg.addColorStop(0, shade(pal.plat, 0.3));
    lg.addColorStop(0.22, shade(pal.plat, 0.06));
    lg.addColorStop(1, pal.ink);
    roundRect(g, 0, top, len, th + depth, round);
    g.strokeStyle = pal.ink; g.lineWidth = 4; g.lineJoin = "round"; g.stroke();
    g.fillStyle = lg; g.fill();

    /* ---- per-stage underside construction ---- */
    g.save();
    roundRect(g, 0, top, len, th + depth, round); g.clip();
    drawDeckDetail(kind, len, th, depth, pal, main, near, bgT);
    g.restore();

    // the walking surface, lit
    g.shadowColor = edge; g.shadowBlur = snap ? 36 : kind === "cloud" ? 10 : 20;
    g.strokeStyle = edge; g.lineWidth = main ? 5 : 3;
    g.beginPath(); g.moveTo(0, top); g.lineTo(len, top); g.stroke();
    g.shadowBlur = 0;
    // a thin bright bevel just below it reads as a machined lip
    g.strokeStyle = hexA("#ffffff", kind === "cloud" ? 0.5 : 0.28); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(1, top + 3.5); g.lineTo(len - 1, top + 3.5); g.stroke();

    if (!p.solid) {
      g.strokeStyle = hexA(pal.soft, 0.45); g.lineWidth = 2;
      g.setLineDash([8, 10]);
      g.beginPath(); g.moveTo(0, th / 2 + 11); g.lineTo(len, th / 2 + 11); g.stroke();
      g.setLineDash([]);
    }

    if (main) {
      // ledge caps — the thing you are actually aiming for when recovering
      g.fillStyle = edge; g.shadowColor = edge; g.shadowBlur = 16;
      g.beginPath(); g.arc(3, top, 5, 0, 7); g.fill();
      g.beginPath(); g.arc(len - 3, top, 5, 0, 7); g.fill();
      g.shadowBlur = 0;
      // and a danger wash along the deck when it is near its limit
      if (near > 0.6) {
        g.save();
        g.globalAlpha = (near - 0.6) * 1.6;
        g.fillStyle = "#ff2e88";
        g.fillRect(0, top, len, 3);
        g.restore();
      }
    }

    /* ---- the platform's own state, drawn on top of its body ---- */
    if (st.heat > 0) {
      // molten glow rising off a hot shelf
      g.save();
      g.globalCompositeOperation = "lighter";
      const q = g.createLinearGradient(0, top - 22, 0, top + 6);
      const k = st.heat >= 1 ? 0.75 : 0.3;
      q.addColorStop(0, hexA("#ff5a19", 0)); q.addColorStop(1, hexA("#ffb347", k));
      g.fillStyle = q; g.fillRect(0, top - 22, len, 28);
      if (st.heat >= 1 && Math.random() < 0.5)
        FX.spark(a.x + Math.random() * dx, a.y - 4 + Math.random() * dy, "#ff8a1f");
      g.restore();
    }
    if (p.crumble && st.present && st.stood > 0) {
      // stress cracks appear as a cloud shelf takes weight
      g.save();
      g.globalAlpha = Math.min(0.8, st.stood / p.crumble.delay);
      g.strokeStyle = "#6b5a85"; g.lineWidth = 1.6; g.lineCap = "round";
      for (let i = 1; i < 5; i++) {
        const cx2 = (len * i) / 5;
        g.beginPath(); g.moveTo(cx2, top + 1); g.lineTo(cx2 + 5, top + th + 3); g.stroke();
      }
      g.restore();
    }
    if (p.retract) {
      // guide rails the shelf slides back into
      g.save();
      g.globalAlpha = 0.5; g.strokeStyle = hexA(pal.platEdge, 0.5); g.lineWidth = 2;
      g.setLineDash([5, 6]);
      g.beginPath(); g.moveTo(-18, top + th / 2); g.lineTo(len + 18, top + th / 2); g.stroke();
      g.setLineDash([]);
      g.restore();
    }
    g.restore();
  });

  if (anch) {
    // soft wash, not a box — a hard-edged rect read as a UI artifact
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.5 + 0.22 * Math.sin(Stage.anchorTimer * 0.3);
    const ag = g.createRadialGradient(P.x, P.y - 40, 20, P.x, P.y - 40, 430);
    ag.addColorStop(0, "rgba(182,255,59,.20)");
    ag.addColorStop(0.55, "rgba(182,255,59,.08)");
    ag.addColorStop(1, "rgba(182,255,59,0)");
    g.fillStyle = ag;
    g.beginPath(); g.arc(P.x, P.y - 40, 430, 0, 7); g.fill();
    g.restore();
  }
}

/* --------------------------------------------------------------- fighter */
function drawFighter(f, alpha) {
  if (f.state === ST.DEAD) return;
  const ch = f.ch;
  const rx = lerp(f.px, f.x, alpha);
  const ry = lerp(f.py, f.y, alpha);

  /* Contact shadow on the deck below. It tracks the fighter's own feet rather
     than a fixed offset, so it stays glued to a tilted surface, and it shrinks
     and fades with height — which is most of what sells a jump. */
  {
    let sy = null;
    if (f.grounded) sy = f.feetY;
    else {
      // nearest surface under him, so the shadow still reads mid-jump
      const feet = ry + ch.size.h / 2;
      for (const s of Stage.segs) {
        const y = Stage.surfaceY(s, rx);
        if (y != null && y >= feet - 4 && (sy === null || y < sy)) sy = y;
      }
    }
    if (sy != null && isFinite(sy)) {
      const drop = clamp((sy - (ry + ch.size.h / 2)) / 160, 0, 1);
      const k = 1 - drop;
      if (k > 0.05) {
        g.save();
        g.globalAlpha = 0.34 * k;
        g.fillStyle = "#000000";
        g.beginPath();
        g.ellipse(rx, sy - 1, ch.size.w * 0.48 * (0.55 + k * 0.45),
                  4.5 * (0.5 + k * 0.5), 0, 0, 7);
        g.fill();
        g.restore();
      }
    }
  }

  // afterimage trail
  if (f.trail.length) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (const t of f.trail) {
      g.globalAlpha = (t.life / 10) * (f.inSuper ? 0.3 : 0.18);
      g.save();
      g.translate(t.x, t.y);
      g.scale(t.facing, 1);
      g.fillStyle = ch.color;
      roundRect(g, -ch.size.w / 2, -ch.size.h / 2, ch.size.w, ch.size.h, 9);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  // --- anim context handed to the character's own draw() ---
  const atk = f.attack;
  const A = {
    time: f.animTime,
    runPhase: f.runPhase,
    running: f.state === ST.RUN && f.grounded,
    air: !f.grounded,
    vx: f.vx, vy: f.vy,
    state: f.state,
    flash: f.hitFlash > 0,
    atkPhase: (atk && atk.data.r) ? clamp(atk.t / Math.max(1, atk.total), 0, 1) : -1,
    atkKind: atk ? atk.kind : null,
    // real frame data, so swing() can line the pose up with the hitbox
    atkT: atk ? atk.t : 0,
    atkStartup: atk ? atk.data.startup : 0,
    atkActive: atk ? atk.data.active : 0,
    atkTotal: atk ? atk.total : 0,
    move: atk ? atk.data : null,
  };

  g.save();
  g.translate(rx, ry);

  let lean;
  if (f.grounded && f.groundSeg) lean = f.groundSeg.angle * 0.85;
  else lean = clamp(f.vx * 0.016, -0.3, 0.3);
  if (f.state === ST.HITSTUN) lean = Math.sin(f.hitstun * 0.6) * 0.5;
  if (f.pinned) lean = 0;
  g.rotate(lean);

  const squash = f.state === ST.JUMPSQUAT ? 0.80
               : f.state === ST.LANDLAG ? 0.90
               : f.state === ST.SPOTDODGE ? 0.74 : 1;
  const stretch = (!f.grounded && f.vy < -4) ? 1.09 : 1;
  const breathe = (f.state === ST.IDLE && f.grounded) ? 1 + Math.sin(f.animTime * 0.055) * 0.015 : 1;
  g.scale(f.facing, squash * stretch * breathe);

  if (f.intangible()) g.globalAlpha = 0.42;
  ch.draw(g, A);
  g.restore();

  /* ---- world-space overlays ---- */
  if (f.shielding()) {
    const k = f.shield / CFG.shieldMax;
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.22 + k * 0.3;
    const rr = ch.hurt * 1.5 * (0.6 + k * 0.5);
    const rgd = g.createRadialGradient(rx, ry, rr * 0.2, rx, ry, rr);
    rgd.addColorStop(0, "rgba(255,255,255,.5)"); rgd.addColorStop(1, f.tint);
    g.fillStyle = rgd;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.fill();
    g.globalAlpha = 0.5; g.strokeStyle = "#ffffff"; g.lineWidth = 2;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.stroke();
    g.restore();
  }

  if (f.state === ST.SHIELDBREAK) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const a = f.animTime / 14 + i * Math.PI / 2;
      g.fillStyle = "#ffe36b";
      g.beginPath(); g.arc(rx + Math.cos(a) * 26, ry - ch.size.h * 0.6 + Math.sin(a) * 8, 4, 0, 7); g.fill();
    }
    g.restore();
  }

  if (f.state === ST.RESPAWN) {
    g.save();
    g.globalAlpha = 0.6 + 0.3 * Math.sin(f.animTime * 0.1);
    g.strokeStyle = f.tint; g.lineWidth = 4;
    g.shadowColor = f.tint; g.shadowBlur = 20;
    g.beginPath(); g.ellipse(rx, ry + ch.size.h * 0.55, 42, 9, 0, 0, 7); g.stroke();
    g.restore();
  }

  if (f.crankDir !== 0) {
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.5;
    g.strokeStyle = ch.color; g.lineWidth = 4;
    g.shadowColor = ch.color; g.shadowBlur = 18;
    g.beginPath(); g.moveTo(rx, ry);
    g.lineTo(Stage.pivot.x + f.crankDir * 300, Stage.pivot.y - 20); g.stroke();
    g.restore();
  }

  if (f.anchorGlow > 0) {
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.3;
    g.strokeStyle = ch.color; g.lineWidth = 3;
    g.beginPath(); g.arc(rx, ry, ch.hurt * 1.9 + Math.sin(f.animTime * 0.1) * 4, 0, 7); g.stroke();
    g.restore();
  }

  // super aura
  if (f.inSuper) {
    g.save(); g.globalCompositeOperation = "lighter";
    const p = f.attack.t * 0.2;
    for (let i = 0; i < 3; i++) {
      g.globalAlpha = 0.26 - i * 0.07;
      g.strokeStyle = ch.accent; g.lineWidth = 2.5;
      g.beginPath();
      g.ellipse(rx, ry, ch.hurt * (1.5 + i * 0.5), ch.hurt * (0.7 + i * 0.3), p + i, 0, 7);
      g.stroke();
    }
    g.restore();
  }

  if (f.attack && f.hitboxActive() && Settings.get("showHitboxGlow")) {
    const hb = f.hitboxWorld();
    g.save(); g.globalCompositeOperation = "lighter";
    const rgd = g.createRadialGradient(hb.x, hb.y, 1, hb.x, hb.y, hb.r);
    rgd.addColorStop(0, "rgba(255,255,255,.5)");
    rgd.addColorStop(0.5, hexA(ch.color, 0.32));
    rgd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rgd;
    g.beginPath(); g.arc(hb.x, hb.y, hb.r, 0, 7); g.fill();
    g.restore();
  }

  // player tag
  g.save();
  g.font = `700 12px ${FONT_MONO}`;
  g.textAlign = "center";
  g.globalAlpha = 0.85;
  g.fillStyle = f.tint;
  g.fillText(`P${f.slot + 1}${f.isCPU ? " CPU" : ""}`, rx, ry - ch.size.h * 0.82);
  g.restore();
}

function drawOffscreenMarkers(fighters, cam) {
  for (const f of fighters) {
    if (!f.alive || f.state === ST.DEAD) continue;
    const sx = (f.x - cam.x) * cam.z + W / 2, sy = (f.y - cam.y) * cam.z + H / 2;
    if (sx > 26 && sx < W - 26 && sy > 26 && sy < H - 26) continue;
    const cx = clamp(sx, 38, W - 38), cy = clamp(sy, 54, H - 40);
    g.save();
    g.translate(cx, cy);
    g.rotate(Math.atan2(sy - H / 2, sx - W / 2));
    g.fillStyle = f.tint; g.shadowColor = f.tint; g.shadowBlur = 16;
    g.beginPath(); g.moveTo(15, 0); g.lineTo(-10, -11); g.lineTo(-10, 11); g.closePath(); g.fill();
    g.restore();
    g.save();
    g.font = `700 16px ${FONT_MONO}`; g.textAlign = "center";
    g.fillStyle = f.tint;
    outlineText(g, `${Math.floor(f.percent)}%`, cx, cy + 30, f.tint, 4);
    g.restore();
  }
}

/* -------------------------------------------------------------------- HUD */
/* The balance gauge, built as an instrument: a machined housing, a scale with
   tick marks, hatched danger bands at both ends, and a needle that leans with
   the deck. It used to be a flat capsule with a block of colour in it, which
   told you the number but never that the stage was a pair of scales. */
function drawBalanceBar() {
  const bw = 520, bh = 18, bx = (W - bw) / 2, by = 28;
  const b = Stage.balance();
  const anch = Stage.anchorTimer > 0;
  const danger = Math.abs(b) > 0.8;
  const col = anch ? "#b6ff3b" : danger ? "#ff2e88" : Stage.pal.platEdge;
  const cxp = bx + bw / 2;

  g.save();

  // housing
  panel(g, bx - 14, by - 13, bw + 28, bh + 30, {
    cut: 11, fill: "#120f26", accent: col,
    accentA: danger ? 0.95 : 0.5, glow: danger ? 20 : 8,
  });
  screw(g, bx - 7, by - 6, 2, UI.line);
  screw(g, bx + bw + 7, by - 6, 2, UI.line);
  screw(g, bx - 7, by + bh + 11, 2, UI.line);
  screw(g, bx + bw + 7, by + bh + 11, 2, UI.line);

  // the scale itself, recessed
  slot(g, bx, by, bw, bh, 5);
  // hatched danger bands — the ends where a Snap-Back lives
  g.save();
  g.beginPath(); roundRect(g, bx, by, bw, bh, 5); g.clip();
  hatch(g, bx, by, bw * 0.12, bh, "#ff2e88", 9, 0.32);
  hatch(g, bx + bw * 0.88, by, bw * 0.12, bh, "#ff2e88", 9, 0.32);
  g.restore();
  ticks(g, bx, by + bh - 6, bw, 5, 20, "#ffffff", 0.16);
  ticks(g, bx, by + bh - 9, bw, 8, 4, "#ffffff", 0.3);

  // the load bar, growing from centre toward the heavy side
  const wFill = (bw / 2 - 2) * Math.abs(b);
  if (b >= 0) bar(g, cxp, by + 3, wFill, bh - 6, 1, col, { glow: 14, r: 3 });
  else bar(g, cxp - wFill, by + 3, wFill, bh - 6, 1, col, { glow: 14, r: 3 });

  // centre post + the needle, which actually leans with the tilt
  g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(cxp, by - 2); g.lineTo(cxp, by + bh + 2); g.stroke();

  const nx = cxp + b * (bw / 2 - 6);
  g.save();
  g.translate(nx, by + bh / 2);
  g.rotate(b * 0.5);
  g.fillStyle = "#ffffff"; g.shadowColor = col; g.shadowBlur = 14;
  poly(g, [0, -bh / 2 - 5, 4, -bh / 2 + 2, 0, bh / 2 + 5, -4, -bh / 2 + 2]);
  g.fill();
  g.restore();

  // readout
  g.font = `700 10px ${FONT_MONO}`; g.textAlign = "center";
  g.fillStyle = anch ? "#b6ff3b" : danger ? "#ff2e88" : UI.dim;
  g.fillText(anch ? `KEEL ANCHOR ${Math.ceil(Stage.anchorTimer / 60)}s`
                  : danger ? "SNAP-BACK IMMINENT" : "BALANCE", cxp, by + bh + 12);
  g.textAlign = "left"; g.fillStyle = UI.dimmer;
  g.fillText("◀ HEAVY", bx + 2, by + bh + 12);
  g.textAlign = "right"; g.fillText("HEAVY ▶", bx + bw - 2, by + bh + 12);
  g.restore();
}

function drawClock(framesLeft) {
  const secs = Math.max(0, Math.ceil(framesLeft / 60));
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const low = secs <= 10;
  const col = low ? "#ff2e88" : UI.text;

  // the clock sits in its own hanging plate under the gauge
  g.save();
  const cw = 132, cx = W / 2 - cw / 2, cy = 82;
  panel(g, cx, cy, cw, 36, {
    cut: 9, fill: "#120f26", accent: col,
    accentA: low ? 0.95 : 0.4, glow: low ? 18 : 0,
    only: { bl: 1, br: 1 },
  });
  g.textAlign = "center";
  g.font = `900 26px ${FONT_DISPLAY}`;
  g.globalAlpha = low && Math.floor(framesLeft / 8) % 2 === 0 ? 0.55 : 1;
  if (low) { g.shadowColor = "#ff2e88"; g.shadowBlur = 18; }
  g.fillStyle = col;
  g.fillText(`${mm}:${String(ss).padStart(2, "0")}`, W / 2, cy + 27);
  g.restore();

  // stage name + snap counter, top right
  g.save();
  chip(g, Stage.def.name, W - 16, 22, Stage.pal.platEdge, { align: "right" });
  if (Stage.snapCount > 0)
    chip(g, `SNAP-BACKS ${Stage.snapCount}`, W - 16, 46, UI.dim, { align: "right" });
  g.restore();
}

/* Player cards. Each one is a stamped plate in that fighter's colour, with a
   coloured header bar carrying the name, a recessed well for the damage
   readout, stock pips as diamonds and the meter as a segmented charge rail.
   The percentage is the single most-read number on screen, so it gets the
   deepest recess and the most contrast. */
function drawPlayerHUD(fighters) {
  const n = fighters.length;
  const cardW = 206, gap = 14, cardH = 92;
  let x = (W - (n * cardW + (n - 1) * gap)) / 2;
  const y = H - 108;

  for (const f of fighters) {
    const dead = f.stocks <= 0;
    const col = f.ch.color;
    g.save();
    g.globalAlpha = dead ? 0.3 : 1;

    // the plate, with the top corners cut toward the centre of the screen
    panel(g, x, y, cardW, cardH, {
      cut: 12, fill: "#14112a", accent: col,
      accentA: f.meterFull ? 1 : 0.6,
      glow: f.meterFull ? 20 : 6,
      only: { tl: 1, tr: 1 },
    });

    // header bar in the fighter's colour
    g.save();
    notchPath(g, x, y, cardW, 24, 12, { tl: 1, tr: 1 });
    g.clip();
    const hq = g.createLinearGradient(0, y, 0, y + 24);
    hq.addColorStop(0, shade(col, 0.1));
    hq.addColorStop(1, shade(col, -0.4));
    g.fillStyle = hq; g.fillRect(x, y, cardW, 24);
    hatch(g, x + cardW - 48, y, 48, 24, "#000000", 7, 0.18);
    g.restore();

    g.font = `700 13px ${FONT_MONO}`; g.textAlign = "left";
    g.fillStyle = "rgba(0,0,0,.45)"; g.fillText(f.ch.name, x + 44.5, y + 17.5);
    g.fillStyle = "#ffffff"; g.fillText(f.ch.name, x + 44, y + 17);
    g.font = `700 9px ${FONT_MONO}`; g.textAlign = "right";
    g.fillStyle = "rgba(255,255,255,.75)";
    g.fillText(`P${f.slot + 1}${f.isCPU ? "·CPU" : ""}`, x + cardW - 10, y + 17);

    // portrait, inset into the header so it breaks the bar's line
    g.save();
    const px0 = x + 7, py0 = y + 5;
    notchPath(g, px0, py0, 32, 32, 7); g.clip();
    g.fillStyle = shade(f.ch.color2, -0.4); g.fillRect(px0, py0, 32, 32);
    g.translate(px0 + 16, py0 + 30); g.scale(0.52, 0.52);
    f.ch.draw(g, { time: f.animTime, runPhase: 0, running: false, air: false,
                   vx: 0, vy: 0, state: ST.IDLE, flash: false, atkPhase: -1 });
    g.restore();
    notchPath(g, px0, py0, 32, 32, 7);
    g.strokeStyle = UI.ink; g.lineWidth = 2.5; g.stroke();

    /* ---- damage readout, in a recessed well ---- */
    const p = Math.floor(f.percent);
    const heat = clamp(p / 160, 0, 1);
    const pc = mixColor("#ffffff", "#ff2e88", heat);
    const wx = x + cardW - 96, wy = y + 30;
    slot(g, wx, wy, 88, 34, 6);
    g.save();
    g.beginPath(); roundRect(g, wx, wy, 88, 34, 6); g.clip();
    if (heat > 0.4) hatch(g, wx, wy, 88, 34, "#ff2e88", 11, (heat - 0.4) * 0.28);
    g.font = `900 ${29 + heat * 7}px ${FONT_DISPLAY}`;
    g.textAlign = "right";
    g.shadowColor = pc; g.shadowBlur = 8 + heat * 16;
    g.fillStyle = pc;
    g.fillText(`${p}%`, wx + 83, wy + 28);
    g.restore();

    /* ---- stocks as diamonds ---- */
    for (let i = 0; i < CFG.stocks; i++) {
      const on = i < f.stocks;
      g.save();
      g.translate(x + 18 + i * 16, y + 40); g.rotate(Math.PI / 4);
      g.strokeStyle = UI.ink; g.lineWidth = 2.5;
      g.strokeRect(-4.5, -4.5, 9, 9);
      g.fillStyle = on ? col : "rgba(255,255,255,.10)";
      if (on) { g.shadowColor = col; g.shadowBlur = 9; }
      g.fillRect(-4.5, -4.5, 9, 9);
      g.restore();
    }

    /* ---- special-ready pip ---- */
    const ready = f.specialCD <= 0;
    g.save();
    g.translate(x + 18 + CFG.stocks * 16 + 4, y + 40);
    g.rotate(Math.PI / 4 + (ready ? f.animTime * 0.02 : 0));
    g.strokeStyle = UI.ink; g.lineWidth = 2.5; g.strokeRect(-4, -4, 8, 8);
    g.fillStyle = ready ? f.ch.accent : "rgba(255,255,255,.10)";
    if (ready) { g.shadowColor = f.ch.accent; g.shadowBlur = 10; }
    g.fillRect(-4, -4, 8, 8);
    g.restore();

    /* ---- shield rail ---- */
    const sw = 96;
    slot(g, x + 12, y + 52, sw, 5, 2.5);
    bar(g, x + 12, y + 52, sw, 5, f.shield / CFG.shieldMax,
        f.shield < 30 ? "#ff2e88" : "#7fd9ff", { r: 2.5 });

    /* ---- super meter: a segmented charge rail across the card's foot ---- */
    const mw = cardW - 24, mx = x + 12, my = y + 66;
    slot(g, mx, my, mw, 14, 4);
    const mk = f.meter / CFG.meter.max;
    if (f.meterFull) {
      const pulse = 0.72 + Math.sin(f.animTime * 0.18) * 0.28;
      g.globalAlpha = (dead ? 0.3 : 1) * pulse;
      bar(g, mx + 1, my + 1, mw - 2, 12, 1, f.ch.accent, { glow: 18, r: 3 });
      g.globalAlpha = dead ? 0.3 : 1;
    } else {
      bar(g, mx + 1, my + 1, mw - 2, 12, mk, col, { glow: 8, r: 3 });
    }
    ticks(g, mx, my + 1, mw, 12, 8, "#000000", 0.45);
    g.font = `700 8px ${FONT_MONO}`; g.textAlign = "center";
    if (f.meterFull) {
      g.fillStyle = "#07060f";
      g.fillText("SUPER READY", mx + mw / 2, my + 10);
    } else {
      g.fillStyle = "rgba(255,255,255,.4)";
      g.fillText(`${Math.floor(mk * 100)}%`, mx + mw / 2, my + 10);
    }

    if (dead) {
      // a struck-out card reads faster than a faded one
      g.save();
      g.strokeStyle = "#ff2e88"; g.lineWidth = 3; g.globalAlpha = 0.5;
      g.beginPath(); g.moveTo(x + 6, y + cardH - 6); g.lineTo(x + cardW - 6, y + 6); g.stroke();
      g.restore();
    }

    g.restore();
    x += cardW + gap;
  }
}

function drawBanner() {
  if (FX.bannerTimer <= 0 || !FX.bannerText) return;
  const t = FX.bannerTimer / 72;
  g.save();
  g.translate(W / 2, H * 0.29);
  const pop = 1 + (1 - t) * 0.12;
  g.scale(pop, pop);
  g.globalAlpha = Math.min(1, t * 2.4);
  g.textAlign = "center";
  g.font = `900 66px ${FONT_DISPLAY}`;
  g.shadowColor = FX.bannerColor; g.shadowBlur = 30;
  outlineText(g, FX.bannerText, 0, 0, FX.bannerColor, 9);
  g.restore();
}


/* ===== src/10_match.js ===== */
/* ==========================================================================
   11. MATCH — one bout from countdown to results
   ========================================================================== */

class Match {
  constructor(slots, stageDef) {
    Match.current = this;
    Stage.select(stageDef);
    this.fighters = [];
    slots.forEach((s, i) => {
      if (s.mode === "off") return;
      this.fighters.push(new Fighter(i, s.charId, s.mode === "cpu"));
    });
    Entities.reset();
    FX.reset();
    this.countdown = 170;
    this.over = false; this.endTimer = 0;
    this.frames = 0; this.lastCount = -1;
    this.timeLeft = CFG.matchSeconds * 60;
    this.endedBy = null; this.winner = null;
    Snd.startMusic(stageDef);
  }

  onKO() {
    const standing = this.fighters.filter(x => x.stocks > 0);
    if (standing.length <= 1) this.endMatch(standing[0] || null, "ko");
  }

  endOnTime() {
    const live = this.fighters.filter(f => f.stocks > 0);
    let best = null, tie = false;
    for (const f of live) {
      if (!best) { best = f; continue; }
      if (f.stocks > best.stocks) { best = f; tie = false; }
      else if (f.stocks === best.stocks) {
        if (f.percent < best.percent) { best = f; tie = false; }
        else if (f.percent === best.percent) tie = true;
      }
    }
    this.endMatch(tie ? null : best, "time");
  }

  endMatch(winner, reason) {
    if (this.over) return;
    this.over = true; this.endTimer = 120;
    this.winner = winner; this.endedBy = reason;
    Snd.stopMusic();
    FX.flash("#ffffff", 0.3);
    if (reason === "time") FX.banner("TIME!", "#ffc83d");
    else FX.banner(winner ? `${winner.ch.name} WINS` : "DRAW", winner ? winner.tint : "#fff");
  }

  update() {
    // Hit pause freezes the simulation but keeps FX alive. Inputs are not
    // polled here, so a press during the freeze still lands on the next frame.
    if (FX.pause > 0) { FX.pause--; FX.update(this.fighters); return; }

    if (this.countdown > 0) {
      this.countdown--;
      const step = Math.floor(this.countdown / 40);
      if (step !== this.lastCount) { this.lastCount = step; Snd.count(step); }
      for (const f of this.fighters) { f.pad.poll(); f.px = f.x; f.py = f.y; f.integrate(); }
      Stage.update(this.fighters);
      FX.update(this.fighters);
      return;
    }

    /* Once the match is decided the fighters freeze for the victory beat.
       Letting them keep playing would also let the winner lose their last
       stock during the flourish, which would corrupt the final standings. */
    if (this.over) {
      FX.update(this.fighters);
      Stage.update(this.fighters);
      if (--this.endTimer <= 0) Game.toResults(this);
      return;
    }

    this.frames++;
    if (--this.timeLeft <= 0) { this.timeLeft = 0; this.endOnTime(); }
    else if (this.timeLeft === 10 * 60) FX.banner("10 SECONDS", "#ffc83d");

    for (const f of this.fighters) f.update(this);
    Combat.resolve(this.fighters);
    Entities.update(this.fighters);
    Stage.update(this.fighters);
    FX.update(this.fighters);
  }

  draw(alpha) {
    drawBackground();
    g.save();
    const cam = FX.applyCamera(g, alpha);
    drawStage(alpha);
    Entities.draw(g);
    for (const f of this.fighters) drawFighter(f, alpha);
    FX.drawWorld(g);
    g.restore();

    /* The banner and the countdown are drawn before the post pass rather than
       after it, so SNAP-BACK! and BRAWL! bloom like everything else in the
       world. The HUD stays after it and therefore stays crisp. */
    drawBanner();
    this.drawCountdown();

    /* Post-processing runs on the world only: bloom, chroma, flash and
       vignette land here, underneath the HUD, so the readouts stay legible. */
    Light.post(g, cv, W, H);

    FX.drawOverlay(g);
    drawOffscreenMarkers(this.fighters, cam);
    drawBalanceBar();
    drawClock(this.timeLeft);
    drawPlayerHUD(this.fighters);

    g.save();
    g.font = `700 10px ${FONT_MONO}`;
    g.textAlign = "right"; g.fillStyle = "rgba(255,255,255,.16)";
    g.fillText("COOL MATT GAMES", W - 16, H - 10);
    g.restore();
  }

  drawCountdown() {
    if (this.countdown > 0) {
      const step = Math.floor(this.countdown / 40);
      const txt = step >= 3 ? "READY" : step >= 2 ? "SET" : step >= 1 ? "..." : "BRAWL!";
      const sub = (this.countdown % 40) / 40;
      g.save();
      g.translate(W / 2, H / 2 - 40);
      const s = 1 + (1 - sub) * 0.16;
      g.scale(s, s);
      g.textAlign = "center";
      g.font = `900 92px ${FONT_DISPLAY}`;
      g.shadowColor = step === 0 ? "#b6ff3b" : Stage.pal.platEdge;
      g.shadowBlur = 34;
      outlineText(g, txt, 0, 0, step === 0 ? "#b6ff3b" : Stage.pal.platEdge, 11);
      g.restore();
    }
  }
}
Match.current = null;


/* ===== src/11_screens.js ===== */
/* ==========================================================================
   12. SCREENS — title, fighter select, stage select, controls, settings,
                 pause and results
   ========================================================================== */

/* Immediate-mode button. Returns true on the frame it is clicked.
   Built from the same panel() as the HUD, so menus and match share one look:
   a stamped plate that physically presses in when hovered. */
function btn(x, y, w, h, label, opts) {
  opts = opts || {};
  const hov = Mouse.x > x && Mouse.x < x + w && Mouse.y > y && Mouse.y < y + h;
  const col = opts.color || "#00e5ff";
  const on = opts.active;
  const dim = opts.disabled;
  const live = (on || hov) && !dim;
  const press = hov && Mouse.down && !dim ? 2 : 0;   // travel on click

  g.save();
  g.translate(0, press);
  panel(g, x, y, w, h, {
    cut: Math.min(10, h * 0.34),
    fill: dim ? "#0d0b1a" : on ? mixColor("#14112a", col, 0.22) : "#14112a",
    // idle buttons keep a hint of their own colour, or a menu of them all
    // reads as one grey stack with nothing to aim at
    accent: dim ? "#2c2745" : live ? col : mixColor(UI.line, col, 0.5),
    accentA: live ? 0.95 : 0.6,
    glow: live ? 16 : 0,
    shadow: !press,
  });
  // a hovered button lights from inside, not just at its border
  if (live) {
    g.save();
    notchPath(g, x, y, w, h, Math.min(10, h * 0.34)); g.clip();
    const q = g.createLinearGradient(0, y, 0, y + h);
    q.addColorStop(0, hexA(col, on ? 0.2 : 0.13));
    q.addColorStop(1, hexA(col, 0));
    g.fillStyle = q; g.fillRect(x, y, w, h);
    g.restore();
  }
  g.fillStyle = dim ? "#55536e" : live ? "#ffffff" : "#b7b4d4";
  g.font = opts.font || `700 15px ${FONT_MONO}`;
  g.textAlign = "center"; g.textBaseline = "middle";
  if (live) { g.shadowColor = col; g.shadowBlur = 10; }
  g.fillText(label, x + w / 2, y + h / 2 + 1);
  g.textBaseline = "alphabetic";
  g.restore();
  return hov && Mouse.click && !dim;
}

/* Screen header: a stamped banner plate rather than floating text, with the
   Cool Matt Games mark above it and rules running out to the margins. */
function screenTitleBar(sub, title, accent) {
  const col = accent || "#00e5ff";
  g.save();
  g.textAlign = "center";

  g.font = `900 44px ${FONT_DISPLAY}`;
  const tw = g.measureText(title).width;
  const bw = Math.max(360, tw + 110), bx = W / 2 - bw / 2;

  // rules out to the edges, stopping clear of the plate
  g.strokeStyle = hexA(col, 0.28); g.lineWidth = 2;
  g.beginPath(); g.moveTo(40, 66); g.lineTo(bx - 18, 66); g.stroke();
  g.beginPath(); g.moveTo(bx + bw + 18, 66); g.lineTo(W - 40, 66); g.stroke();
  g.fillStyle = hexA(col, 0.5);
  for (const dx of [-26, 26]) {
    g.save(); g.translate(W / 2 + (dx < 0 ? bx - 18 - W / 2 : bx + bw + 18 - W / 2), 66);
    g.rotate(Math.PI / 4); g.fillRect(-3, -3, 6, 6); g.restore();
  }

  panel(g, bx, 40, bw, 52, { cut: 16, fill: "#140f2c", accent: col, accentA: 0.8, glow: 14 });
  g.save();
  notchPath(g, bx, 40, bw, 52, 16); g.clip();
  hatch(g, bx, 40, 34, 52, col, 8, 0.2);
  hatch(g, bx + bw - 34, 40, 34, 52, col, 8, 0.2);
  g.restore();

  g.font = `900 44px ${FONT_DISPLAY}`;
  g.shadowColor = col; g.shadowBlur = 20;
  outlineText(g, title, W / 2, 81, "#ffffff", 7);
  g.shadowBlur = 0;

  g.font = `700 11px ${FONT_MONO}`;
  g.fillStyle = "#ff2e88";
  g.fillText(sub, W / 2, 26);
  g.restore();
}

const Game = {
  screen: "title",
  match: null,
  results: null,
  titleT: 0,
  returnTo: "title",      // where Controls/Settings go back to
  rebind: null,           // { player, action } while capturing a key
  stageIndex: 0,
  hoverAction: null,
  joinEntry: null,        // the code being typed on the online screen

  slots: [
    { charId: "BOLDER", mode: "human" },
    { charId: "ZIP",    mode: "cpu" },
    { charId: "ORBIT",  mode: "off" },
    { charId: "PIVOT",  mode: "off" },
  ],
  selIndex: 0,

  start() {
    if (this.slots.filter(s => s.mode !== "off").length < 2) return;
    if (Net.active && Net.isHost) { Net.startMatch(); Snd.uiBig(); return; }
    if (Net.active && Net.isGuest) return;          // only the host may start
    this.match = new Match(this.slots, STAGES[this.stageIndex]);
    this.screen = "match";
    Snd.uiBig();
  },

  toResults(match) {
    this.results = {
      fighters: match.fighters.slice(),
      winner: match.winner,
      snapbacks: Stage.snapCount,
      frames: match.frames,
      endedBy: match.endedBy,
      stage: Stage.def,
    };
    this.screen = "results";
    Snd.uiBig();
  },

  /* ------------------------------------------------------------- update */
  update() {
    /* A guest can be told to start at any moment, from any screen it is
       sitting on, so the check lives outside the screen switch. */
    if (Net.isGuest && Net.pendingStart) {
      const p = Net.pendingStart; Net.pendingStart = null;
      Net.beginLocal(p);
    }
    switch (this.screen) {
      case "title":    this.updateTitle(); break;
      case "select":   if (Keys.pressed["Escape"]) { this.screen = "title"; Snd.ui(); }
                       else if (Keys.pressed["Enter"]) this.screen = "stage";
                       break;
      case "stage":    if (Keys.pressed["Escape"]) { this.screen = "select"; Snd.ui(); }
                       else if (Keys.pressed["Enter"]) this.start();
                       break;
      case "controls": if (Keys.pressed["Escape"] && !this.rebind) { this.screen = this.returnTo; Snd.ui(); } break;
      case "settings": if (Keys.pressed["Escape"]) { this.screen = this.returnTo; Snd.ui(); } break;
      case "howto":    if (Keys.pressed["Escape"] || Keys.pressed["Enter"]) { this.screen = "title"; Snd.ui(); } break;
      case "guide":
        if (Keys.pressed["Escape"]) { this.screen = "title"; Snd.ui(); break; }
        if (Keys.pressed["ArrowLeft"])  { this.guidePage = Math.max(0, (this.guidePage || 0) - 1); Snd.ui(); }
        if (Keys.pressed["ArrowRight"]) { this.guidePage = Math.min(ROSTER.length, (this.guidePage || 0) + 1); Snd.ui(); }
        break;
      case "online":   this.updateOnline(); break;
      case "match":
        /* Online play pauses nobody: the other player is still fighting, so
           Escape leaves the match instead of freezing a fight they can see. */
        if (Keys.pressed["Escape"]) {
          if (Net.active) { Net.reset(); this.match = null; this.screen = "title"; Snd.ui(); }
          else { this.screen = "pause"; Snd.ui(); }
          break;
        }
        if (Net.active) Net.update(); else this.match.update();
        break;
      case "pause":    if (Keys.pressed["Escape"]) { this.screen = "match"; Snd.ui(); } break;
      case "results":
        if (Keys.pressed["Enter"]) this.start();
        if (Keys.pressed["Escape"]) { this.screen = "select"; Snd.ui(); }
        break;
    }
  },

  draw(alpha) {
    switch (this.screen) {
      case "title":    this.drawTitle(); Light.post(g, cv, W, H); break;
      case "select":   this.drawSelect(); break;
      case "stage":    this.drawStageSelect(); break;
      case "controls": this.drawControls(); break;
      case "settings": this.drawSettings(); break;
      case "howto":    this.drawHowto(); break;
      case "guide":    this.drawGuide(); break;
      case "online":   this.drawOnline(); break;
      case "match":    this.match.draw(alpha); break;
      case "pause":    this.match.draw(alpha); this.drawPause(); break;
      case "results":  this.drawResults(); break;
    }
  },

  /* ================================================================ TITLE */
  updateTitle() {
    this.titleT++;
    if (Keys.pressed["Enter"] || Keys.pressed["Space"]) { this.screen = "select"; Snd.uiBig(); }
  },
  drawTitle() {
    Stage.def = STAGES[0];
    drawBackground();

    // decorative tilting beam with the roster riding it
    const a = Math.sin(this.titleT * 0.011) * 0.15;
    /* The beam and the roster share one half-width so they can never disagree.
       This used to be a hard-coded 340 with fighters placed every 156 units
       from -234, which fitted a roster of four exactly -- at eight, the last
       four stood on thin air past the end of the beam. */
    const beamHalf = 430;
    g.save();
    g.translate(W / 2, H * 0.84); g.rotate(a);
    g.fillStyle = "#15102b";
    roundRect(g, -beamHalf, -12, beamHalf * 2, 52, 8); g.fill();
    g.strokeStyle = "#00e5ff"; g.lineWidth = 5;
    g.shadowColor = "#00e5ff"; g.shadowBlur = 24;
    g.beginPath(); g.moveTo(-beamHalf, -12); g.lineTo(beamHalf, -12); g.stroke();
    g.restore();
    g.save();
    g.strokeStyle = "rgba(120,110,170,.4)"; g.lineWidth = 10;
    g.beginPath(); g.moveTo(W / 2, H * 0.84); g.lineTo(W / 2, H); g.stroke();
    g.fillStyle = "#2a2250"; g.shadowColor = "#00e5ff"; g.shadowBlur = 16;
    g.beginPath(); g.arc(W / 2, H * 0.84, 15, 0, 7); g.fill();
    g.restore();

    // spread whatever the roster is evenly along the beam, inside its ends
    const inset = 52, n = ROSTER.length;
    const span = (beamHalf - inset) * 2;
    const step = n > 1 ? span / (n - 1) : 0;
    ROSTER.forEach((c, i) => {
      const lx = -(beamHalf - inset) + i * step;
      const x = W / 2 + lx * Math.cos(a), y = H * 0.84 + lx * Math.sin(a);
      g.save();
      g.translate(x, y - 28); g.rotate(a);
      g.scale(0.78, 0.78);
      c.draw(g, { time: this.titleT + i * 40, runPhase: 0, running: false, air: false,
                  vx: 0, vy: 0, state: ST.IDLE, flash: false, atkPhase: -1 });
      g.restore();
    });

    g.save();
    g.textAlign = "center";
    g.font = `700 14px ${FONT_MONO}`;
    g.fillStyle = "#ff2e88"; g.shadowColor = "#ff2e88"; g.shadowBlur = 18;
    g.fillText("C O O L   M A T T   G A M E S", W / 2, 96);
    g.shadowBlur = 0;

    const bob = Math.sin(this.titleT * 0.028) * 4;
    /* Fit the wordmark to the canvas rather than trusting a fixed size: at
       104px Archivo Black it ran past both edges. */
    let logoPx = 104;
    g.font = `900 ${logoPx}px ${FONT_DISPLAY}`;
    const maxLogoW = W - 120;
    const measured = g.measureText("COOL MATT BRAWL").width;
    if (measured > maxLogoW) {
      logoPx = Math.floor(logoPx * (maxLogoW / measured));
      g.font = `900 ${logoPx}px ${FONT_DISPLAY}`;
    }
    const lg = g.createLinearGradient(W / 2 - 400, 140, W / 2 + 400, 220);
    lg.addColorStop(0, "#00e5ff"); lg.addColorStop(0.5, "#ffffff"); lg.addColorStop(1, "#ff2e88");
    g.shadowColor = "#00e5ff"; g.shadowBlur = 32;
    outlineText(g, "COOL MATT BRAWL", W / 2, 196 + bob, lg, 12);
    g.shadowBlur = 0;

    g.restore();

    const bx = W / 2 - 130;
    if (btn(bx, 266, 260, 50, "START BRAWL", { color: "#b6ff3b", font: `700 19px ${FONT_MONO}` }))
      { this.screen = "select"; Snd.uiBig(); }
    if (btn(bx, 324, 260, 46, "PLAY ONLINE", { color: "#ff2e88", font: `700 17px ${FONT_MONO}` }))
      { Net.reset(); this.joinEntry = null; this.screen = "online"; Snd.uiBig(); }
    if (btn(bx, 378, 260, 40, "CONTROLS", { color: "#00e5ff" }))
      { this.returnTo = "title"; this.screen = "controls"; Snd.ui(); }
    if (btn(bx, 424, 260, 40, "SETTINGS", { color: "#ffc83d" }))
      { this.returnTo = "title"; this.screen = "settings"; Snd.ui(); }
    if (btn(bx, 470, 260, 40, "HOW TO PLAY", { color: "#8a7fff" }))
      { this.screen = "howto"; Snd.ui(); }

    g.save();
    g.textAlign = "center"; g.font = `700 11px ${FONT_MONO}`;
    g.fillStyle = "#6b6a85";
    /* Sits under the wordmark, not under the buttons: down there the tilting
       beam swings the leftmost fighters up through it. */
    g.fillText("2-4 PLAYERS LOCAL  ·  2 PLAYERS ONLINE  ·  GAMEPADS SUPPORTED", W / 2, 243);
    g.restore();
  },

  /* ======================================================= FIGHTER SELECT */
  drawSelect() {
    Stage.def = STAGES[this.stageIndex];
    drawBackground();
    g.save(); g.fillStyle = "rgba(6,5,14,.68)"; g.fillRect(0, 0, W, H); g.restore();
    screenTitleBar("COOL MATT GAMES", "CHOOSE YOUR FIGHTERS");

    /* Eight fighters will not fit in one row, so the roster is a 4x2 grid of
       compact cards. The full write-up for whichever one you are pointing at
       goes in the panel underneath, which is where there is actually room to
       explain what a character does. */
    const cols = 4, cw = 236, chh = 136, gapX = 18, gapY = 14;
    const gridW = cols * cw + (cols - 1) * gapX;
    const gx0 = (W - gridW) / 2, gy0 = 104;
    let hoverChar = null;

    ROSTER.forEach((c, i) => {
      const col = i % cols, row = (i / cols) | 0;
      const x = gx0 + col * (cw + gapX);
      const cy = gy0 + row * (chh + gapY);
      const hov = Mouse.x > x && Mouse.x < x + cw && Mouse.y > cy && Mouse.y < cy + chh;
      if (hov) hoverChar = c;
      const picked = this.slots.map((s, k) => (s.mode !== "off" && s.charId === c.id) ? k : -1)
                               .filter(k => k >= 0);

      g.save();
      g.translate(0, hov ? -3 : 0);
      panel(g, x, cy, cw, chh, {
        cut: 13, fill: "#110e24", accent: c.color,
        accentA: hov ? 1 : picked.length ? 0.7 : 0.4,
        glow: hov ? 20 : picked.length ? 10 : 0,
      });
      // colour wash + initial watermark
      g.save();
      notchPath(g, x, cy, cw, chh, 13); g.clip();
      const wq = g.createLinearGradient(0, cy + chh, 0, cy + 30);
      wq.addColorStop(0, hexA(c.color, hov ? 0.22 : 0.1));
      wq.addColorStop(1, hexA(c.color, 0));
      g.fillStyle = wq; g.fillRect(x, cy, cw, chh);
      g.globalAlpha = 0.06;
      g.font = `900 120px ${FONT_DISPLAY}`; g.textAlign = "center";
      g.fillStyle = c.color;
      g.fillText(c.name[0], x + cw - 44, cy + 112);
      g.restore();

      /* Art on the left, text on the right. Clipped to the card: several
         fighters are wider than their hurtbox (Kite's sail, Ballast's jib)
         and spilled over the neighbouring card without this. */
      g.save();
      notchPath(g, x + 2, cy + 2, cw - 4, chh - 4, 12); g.clip();
      g.translate(x + 58, cy + chh - 30);
      const sc2 = hov ? 1.20 : 1.12;
      g.scale(sc2, sc2);
      c.draw(g, { time: performance.now() / 16, runPhase: 0, running: false,
                  air: false, vx: 0, vy: 0, state: ST.IDLE, flash: false, atkPhase: -1 });
      g.restore();

      g.textAlign = "left";
      g.font = `900 24px ${FONT_DISPLAY}`;
      g.shadowColor = c.color; g.shadowBlur = hov ? 14 : 8;
      outlineText(g, c.name, x + 104, cy + 40, c.color, 6);
      g.shadowBlur = 0;
      g.font = `700 8px ${FONT_MONO}`;
      g.fillStyle = "#8f8cb5"; g.fillText(c.tag, x + 104, cy + 54);

      const stats = [["WGT", c.weight / 1.5], ["SPD", c.speed / 6], ["JMP", (c.jump - 10.5) / 3.2]];
      let sy = cy + 68;
      stats.forEach(([label, v]) => {
        g.font = `700 8px ${FONT_MONO}`;
        g.fillStyle = "#6b6a85"; g.fillText(label, x + 104, sy + 7);
        slot(g, x + 130, sy + 1, cw - 146, 6, 3);
        bar(g, x + 130, sy + 1, cw - 146, 6, clamp(v, 0.08, 1), c.color, { r: 3 });
        sy += 13;
      });

      picked.forEach((pi, k) => {
        g.save();
        notchPath(g, x + cw - 34 - k * 32, cy + 8, 28, 17, 5);
        g.fillStyle = PLAYER_TINT[pi];
        g.shadowColor = PLAYER_TINT[pi]; g.shadowBlur = 12; g.fill();
        g.restore();
        g.fillStyle = "#07060f"; g.font = `700 10px ${FONT_MONO}`; g.textAlign = "center";
        g.fillText("P" + (pi + 1), x + cw - 20 - k * 32, cy + 20.5);
        g.textAlign = "left";
      });
      g.restore();

      if (hov && Mouse.click) {
        const sl = this.slots[this.selIndex];
        if (sl.mode === "off") sl.mode = this.selIndex === 0 ? "human" : "cpu";
        sl.charId = c.id;
        Snd.ui();
      }
    });

    // ---- slot row ----
    const sw = 268, sgap = 16;
    let sx = (W - (4 * sw + 3 * sgap)) / 2;
    const sy2 = gy0 + 2 * (chh + gapY) + 6;
    this.slots.forEach((s, i) => {
      const c = CHAR_BY_ID[s.charId];
      const sel = this.selIndex === i, off = s.mode === "off";
      g.save();
      g.globalAlpha = off ? 0.5 : 1;
      panel(g, sx, sy2, sw, 92, {
        cut: 12, fill: sel ? mixColor("#14112a", PLAYER_TINT[i], 0.14) : "#110e22",
        accent: PLAYER_TINT[i], accentA: sel ? 1 : 0.45, glow: sel ? 20 : 0,
        only: { tl: 1, br: 1 },
      });
      g.save();
      notchPath(g, sx, sy2, sw, 92, 12, { tl: 1, br: 1 }); g.clip();
      g.fillStyle = hexA(PLAYER_TINT[i], off ? 0.25 : 0.7);
      g.fillRect(sx, sy2, 4, 92);
      g.restore();
      g.textAlign = "left";
      g.font = `700 12px ${FONT_MONO}`; g.fillStyle = PLAYER_TINT[i];
      g.fillText(`PLAYER ${i + 1}`, sx + 14, sy2 + 19);
      g.font = `900 21px ${FONT_DISPLAY}`;
      g.fillStyle = off ? "#4a4866" : c.color;
      g.fillText(off ? "— EMPTY —" : c.name, sx + 14, sy2 + 42);
      g.font = `400 8px ${FONT_MONO}`; g.fillStyle = "#6b6a85";
      const b = Settings.binds[i];
      g.fillText(`${keyLabel(b.left)}${keyLabel(b.right)} move · ${keyLabel(b.light)} ${keyLabel(b.heavy)} ${keyLabel(b.special)} · ${keyLabel(b.super)} super`,
                 sx + 14, sy2 + 55);
      g.restore();

      [["OFF", "off"], ["HUMAN", "human"], ["CPU", "cpu"]].forEach(([lab, m], k) => {
        if (btn(sx + 12 + k * 80, sy2 + 62, 74, 22, lab, {
          active: s.mode === m,
          color: m === "cpu" ? "#ffc83d" : m === "human" ? "#b6ff3b" : "#6b6a85",
          font: `700 10px ${FONT_MONO}`,
        })) { s.mode = m; this.selIndex = i; Snd.ui(); }
      });
      if (Mouse.x > sx && Mouse.x < sx + sw && Mouse.y > sy2 && Mouse.y < sy2 + 58 && Mouse.click) {
        this.selIndex = i; Snd.ui();
      }
      sx += sw + sgap;
    });

    /* ---- the write-up: whoever you are pointing at, else your own slot ---- */
    const sc = hoverChar || CHAR_BY_ID[this.slots[this.selIndex].charId];
    const dy = sy2 + 104;
    panel(g, 90, dy, W - 180, 112, {
      cut: 14, fill: "#100d20", accent: sc.color, accentA: 0.6, glow: 8,
    });
    g.save();
    g.textAlign = "left";
    g.font = `900 20px ${FONT_DISPLAY}`; g.fillStyle = sc.color;
    g.fillText(sc.name, 110, dy + 27);
    const nameW = g.measureText(sc.name).width;      // measured in THIS font
    g.font = `700 9px ${FONT_MONO}`; g.fillStyle = "#8f8cb5";
    g.fillText(sc.tag, 110 + nameW + 14, dy + 26);

    g.font = `400 12px ${FONT_MONO}`; g.fillStyle = "#b7b4d4";
    g.fillText(sc.blurb, 110, dy + 48);
    if (sc.power) {
      g.font = `700 8px ${FONT_MONO}`; g.fillStyle = "#6b6a85";
      g.fillText("POWER", 110, dy + 66);
      g.font = `400 12px ${FONT_MONO}`; g.fillStyle = sc.accent;
      g.fillText(sc.power, 158, dy + 66);
    }

    const moves = [
      ["LIGHT", sc.light.name, "#b7b4d4"],
      ["HEAVY", sc.heavy.name, "#b7b4d4"],
      ["SPECIAL", sc.special.name, sc.accent],
      ["SUPER", sc.super.name, "#ffffff"],
    ];
    let mx = 110;
    moves.forEach(([lab, nm, col]) => {
      g.font = `700 8px ${FONT_MONO}`; g.fillStyle = "#6b6a85";
      g.fillText(lab, mx, dy + 88);
      g.font = `700 12px ${FONT_MONO}`; g.fillStyle = col;
      g.fillText(nm.toUpperCase(), mx, dy + 103);
      mx += 268;
    });
    g.restore();

    const active = this.slots.filter(s => s.mode !== "off").length;
    g.save();
    g.textAlign = "center";
    g.font = `700 10px ${FONT_MONO}`;
    g.fillStyle = active >= 2 ? "#b6ff3b" : "#ff2e88";
    g.fillText(active >= 2
      ? `SELECTED SLOT: PLAYER ${this.selIndex + 1} — click a fighter to assign`
      : "NEED AT LEAST 2 FIGHTERS", W / 2, dy + 128);
    g.restore();

    if (btn(W / 2 - 230, H - 62, 200, 42, "◀ BACK", { color: "#ff2e88" }))
      { this.screen = "title"; Snd.ui(); }
    if (btn(W / 2 + 30, H - 62, 200, 42, "PICK STAGE ▶",
        { color: active >= 2 ? "#b6ff3b" : "#444", disabled: active < 2, font: `700 16px ${FONT_MONO}` }))
      { this.screen = "stage"; Snd.uiBig(); }
  },

  /* ========================================================= STAGE SELECT */
  drawStageSelect() {
    Stage.def = STAGES[this.stageIndex];
    drawBackground();
    g.save(); g.fillStyle = "rgba(6,5,14,.55)"; g.fillRect(0, 0, W, H); g.restore();
    screenTitleBar("COOL MATT GAMES", "PICK YOUR STAGE");

    const cw = 282, gap = 18;
    let x = (W - (STAGES.length * cw + (STAGES.length - 1) * gap)) / 2;
    const cy = 124, chh = 320;

    STAGES.forEach((s, i) => {
      const hov = Mouse.x > x && Mouse.x < x + cw && Mouse.y > cy && Mouse.y < cy + chh;
      const sel = this.stageIndex === i;
      g.save();
      // the card as a stamped plate, lifting on hover
      const lift = hov && !sel ? -3 : 0;
      g.translate(0, lift);
      panel(g, x, cy, cw, chh, {
        cut: 15, fill: "#100d22", accent: s.pal.platEdge,
        accentA: sel ? 1 : hov ? 0.8 : 0.42,
        glow: sel ? 24 : hov ? 14 : 0,
      });

      // live thumbnail of the stage's own background + deck, in a recessed well
      g.save();
      notchPath(g, x + 10, cy + 10, cw - 20, 150, 9); g.clip();
      g.save();
      g.translate(x + 10, cy + 10);
      g.scale((cw - 20) / W, 150 / H * 2.0);
      g.translate(0, -H * 0.18);
      s.drawBg.call(s, g, performance.now() / 1000 + i * 7);
      g.restore();
      // mini deck line, drawn inside the clip so it can't escape the well
      g.save();
      g.translate(x + cw / 2, cy + 128);
      const ta = Math.sin(performance.now() / 900 + i) * 0.14;
      g.rotate(ta);
      const half = Math.abs(s.layout[0].x2) * 0.30;
      g.strokeStyle = s.pal.platEdge; g.lineWidth = 4;
      g.shadowColor = s.pal.platEdge; g.shadowBlur = 14;
      g.beginPath(); g.moveTo(-half, 0); g.lineTo(half, 0); g.stroke();
      g.restore();
      // a scanline wash sells it as a monitor feed rather than a picture
      g.globalAlpha = 0.14; g.fillStyle = "#000";
      for (let sy = cy + 10; sy < cy + 160; sy += 4) g.fillRect(x + 10, sy, cw - 20, 2);
      g.restore();
      notchPath(g, x + 10, cy + 10, cw - 20, 150, 9);
      g.strokeStyle = UI.ink; g.lineWidth = 3; g.stroke();
      screw(g, x + 19, cy + 19, 2.2, UI.line);
      screw(g, x + cw - 19, cy + 19, 2.2, UI.line);

      g.textAlign = "center";
      g.font = `900 26px ${FONT_DISPLAY}`;
      outlineText(g, s.name, x + cw / 2, cy + 192, s.pal.platEdge, 6);
      g.font = `700 9px ${FONT_MONO}`; g.fillStyle = "#8f8cb5";
      g.fillText(s.tag, x + cw / 2, cy + 208);
      // a divider rule under the title, in the stage's own colour
      g.strokeStyle = hexA(s.pal.platEdge, 0.3); g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x + 34, cy + 218); g.lineTo(x + cw - 34, cy + 218); g.stroke();

      // wrapped blurb
      g.font = `400 11px ${FONT_MONO}`; g.fillStyle = "#b7b4d4";
      const words = s.blurb.split(" ");
      let line = "", ly = cy + 230;
      for (const wd of words) {
        if (g.measureText(line + wd).width > cw - 34) { g.fillText(line, x + cw / 2, ly); line = wd + " "; ly += 15; }
        else line += wd + " ";
      }
      g.fillText(line, x + cw / 2, ly);

      if (sel) {
        g.fillStyle = s.pal.platEdge;
        g.font = `700 10px ${FONT_MONO}`;
        g.fillText("● SELECTED", x + cw / 2, cy + chh - 14);
      }
      g.restore();

      if (hov && Mouse.click) { this.stageIndex = i; Snd.ui(); }
      x += cw + gap;
    });

    g.save();
    g.textAlign = "center"; g.font = `700 11px ${FONT_MONO}`; g.fillStyle = "#6b6a85";
    g.fillText("EVERY STAGE RETUNES THE PIVOT AND MOVES THE BLAST ZONES — THEY ARE NOT RESKINS", W / 2, 474);
    g.restore();

    if (btn(W / 2 - 230, 500, 200, 48, "◀ FIGHTERS", { color: "#ff2e88" })) { this.screen = "select"; Snd.ui(); }
    if (btn(W / 2 + 30, 500, 200, 48, "BRAWL ▶", { color: "#b6ff3b", font: `700 19px ${FONT_MONO}` }))
      this.start();
  },

  /* ============================================================= CONTROLS */
  drawControls() {
    Stage.def = STAGES[0];
    drawBackground();
    g.save(); g.fillStyle = "rgba(5,4,12,.86)"; g.fillRect(0, 0, W, H); g.restore();
    screenTitleBar("COOL MATT GAMES", "CONTROLS");

    const colX = [330, 540, 750, 960];   // left edge of each player column
    const colW = 186;
    const rowH = 40, top = 148;

    // header
    g.save();
    g.textAlign = "left";
    g.font = `700 11px ${FONT_MONO}`; g.fillStyle = "#6b6a85";
    g.fillText("ACTION", 108, top - 14);
    g.textAlign = "center";
    for (let p = 0; p < 4; p++) {
      g.fillStyle = PLAYER_TINT[p];
      g.font = `700 13px ${FONT_MONO}`;
      g.fillText(`PLAYER ${p + 1}`, colX[p] + colW / 2, top - 14);
    }
    g.strokeStyle = "rgba(255,255,255,.14)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(96, top - 4); g.lineTo(W - 96, top - 4); g.stroke();
    g.restore();

    this.hoverAction = null;

    ACTIONS.forEach((act, r) => {
      const y = top + r * rowH;
      const rowHov = Mouse.y > y && Mouse.y < y + rowH - 4;
      if (rowHov) this.hoverAction = act;

      g.save();
      if (r % 2 === 0) { g.fillStyle = "rgba(255,255,255,.028)"; roundRect(g, 96, y, W - 192, rowH - 4, 6); g.fill(); }
      g.textAlign = "left";
      g.font = `700 13px ${FONT_MONO}`;
      g.fillStyle = rowHov ? "#ffffff" : "#d6d3ec";
      g.fillText(act.name, 108, y + rowH / 2 + 1);
      g.restore();

      for (let p = 0; p < 4; p++) {
        const cx = colX[p], cy = y + 3;
        const ch = rowH - 10;
        const capturing = this.rebind && this.rebind.player === p && this.rebind.action === act.id;
        const code = Settings.binds[p][act.id];
        const label = capturing ? "PRESS A KEY…" : keyLabel(code);
        const hov = Mouse.x > cx && Mouse.x < cx + colW && Mouse.y > cy && Mouse.y < cy + ch;

        /* Drawn as an actual keycap: a dark well, a raised cap sitting in it
           with a lit top face, and the cap pressing down when hovered. It
           makes the table read as a keyboard rather than a spreadsheet. */
        g.save();
        const press2 = hov && !capturing ? 1.5 : 0;
        const tint = PLAYER_TINT[p];

        // the well the cap sits in
        roundRect(g, cx, cy, colW, ch, 6);
        g.fillStyle = "rgba(0,0,0,.5)"; g.fill();

        const capY = cy + 1.5 + press2, capH = ch - 4;
        const capPath = () => roundRect(g, cx + 2, capY, colW - 4, capH, 5);
        const capBase = capturing ? mixColor("#1c1838", tint, 0.4)
                      : hov ? mixColor("#1c1838", tint, 0.18) : "#1a1733";
        const cq = g.createLinearGradient(0, capY, 0, capY + capH);
        cq.addColorStop(0, shade(capBase, 0.2));
        cq.addColorStop(1, shade(capBase, -0.3));
        capPath();
        g.strokeStyle = UI.ink; g.lineWidth = 2.5; g.stroke();
        g.fillStyle = cq; g.fill();
        // lit top face
        g.save(); capPath(); g.clip();
        g.fillStyle = hexA("#ffffff", press2 ? 0.07 : 0.13);
        g.fillRect(cx + 2, capY, colW - 4, capH * 0.42);
        g.restore();
        // accent edge while capturing or hovered
        if (capturing || hov) {
          capPath();
          g.strokeStyle = tint; g.lineWidth = capturing ? 2 : 1.4;
          if (capturing) { g.shadowColor = tint; g.shadowBlur = 14; }
          g.stroke(); g.shadowBlur = 0;
        }

        g.textAlign = "center"; g.textBaseline = "middle";
        g.font = `700 ${capturing ? 10 : 12}px ${FONT_MONO}`;
        g.fillStyle = capturing ? "#ffffff" : code ? "#e8e6f8" : "#ff2e88";
        g.fillText(label, cx + colW / 2, capY + capH / 2 + 0.5);
        g.textBaseline = "alphabetic";
        g.restore();

        if (hov && Mouse.click && !this.rebind) {
          this.rebind = { player: p, action: act.id };
          Snd.blip(900);
          Keys.capture = (newCode) => {
            if (newCode !== "Escape") {
              Settings.bind(p, act.id, newCode);
              Snd.uiBig();
            } else Snd.ui();
            this.rebind = null;
          };
        }
      }
    });

    // description of whatever row the mouse is on
    g.save();
    g.textAlign = "center";
    g.font = `400 12px ${FONT_MONO}`;
    g.fillStyle = "#8f8cb5";
    const d = this.hoverAction ? this.hoverAction.desc

    g.fillText(d, W / 2, top + ACTIONS.length * rowH + 22);
    g.font = `400 11px ${FONT_MONO}`; g.fillStyle = "#5d5b78";
    g.fillText("Gamepads work too and need no setup: A jump · X light · Y heavy · B special · R3 super · LB grab · RB shield.",
               W / 2, top + ACTIONS.length * rowH + 44);
    g.restore();

    if (btn(W / 2 - 230, H - 72, 200, 44, "RESET DEFAULTS", { color: "#ffc83d" })) {
      Settings.resetBinds(); Snd.uiBig();

    if (btn(W / 2 + 30, H - 72, 200, 44, "DONE", { color: "#b6ff3b", font: `700 17px ${FONT_MONO}` })) {
      this.screen = this.returnTo; Snd.ui();

  /* ================================================================ GUIDE

  drawGuide() {
    Stage.def = STAGES[0];
    drawBackground();
    g.save(); g.fillStyle = "rgba(5,4,12,.88)"; g.fillRect(0, 0, W, H); g.restore();

    const page = this.guidePage || 0;
    const lines = [];

    if (page === 0) {
      screenTitleBar("COOL MATT GAMES", "BASIC MECHANICS", "#ffc83d");
      lines.push(
        ["h", "DAMAGE & STOCKS"],
        ["b", "No health bars. Getting hit raises your damage %; a higher % means you fly further on the next hit."],
        ["b", "Three stocks each. Get knocked past a blast zone and you lose one. Last fighter standing wins."],
        ["", ""],
        ["h2", "OFFENSE"],
        ["b", "TIP — connect with the outer edge of a swing and it hits harder. Spacing pays."],
        ["b", "STALE — repeating one move makes it weaker. Rotate your attacks to keep your damage up."],
        ["b", "Landing a hit refunds some of your recovery; whiffing pays all of it, so you stay open."],
        ["", ""],
        ["h3", "DEFENSE"],
        ["b", "Shield — hold to block. Add a direction to roll, hold Down to spot dodge, or air-dodge in the air."],
        ["b", "Grab — beats a held shield. Press a direction to throw, or Light to pummel."],
        ["b", "A few moves (Husk's Dead Weight, Mira's Riposte/Perfect Answer) make you immune to knockback"],
        ["b", "outright while they're active — those are the exception, not the rule."],
        ["", ""],
        ["h4", "METER & SUPERS"],
        ["b", "Dealing and taking damage fills your super meter — the bar across the foot of your card."],
        ["b", "At full, Super fires a move only your fighter has. You have armor while it runs,"],
        ["w", "but that armor BREAKS under enough damage. A super can be contested, not just dodged."],
        ["", ""],
        ["h3", "WEIGHT"],
        ["b", "Heavier fighters fly less far from the same hit, but take more time to get moving in the first place."],
      );
    } else {
      const ch = ROSTER[page - 1];
      screenTitleBar(ch.tag, ch.name, ch.color);
      lines.push(
        ["b", ch.blurb],
        ["", ""],
        ["h2", "KIT"],
        ["b", ch.power],
        ["", ""],
      );
      for (const slot of ["light", "heavy", "special", "super"]) {

      { this.guidePage = Math.min(ROSTER.length, page + 1); Snd.ui(); }
    if (btn(W / 2 + 30, H - 76, 290, 44, "BACK", { color: "#ff2e88" })) { this.screen = "howto"; Snd.ui(); }

  /* =============================================================== ONLINE */
  updateOnline() {
    if (Keys.pressed["Escape"]) { Net.reset(); this.screen = "title"; Snd.ui(); return; }
    // typing a room code to join
    if (this.joinEntry !== null) {
      for (const k in Keys.pressed) {
        if (/^Key[A-Z]$/.test(k) && this.joinEntry.length < 4) this.joinEntry += k.slice(3);
        else if (/^Digit[2-9]$/.test(k) && this.joinEntry.length < 4) this.joinEntry += k.slice(5);
        else if (k === "Backspace") this.joinEntry = this.joinEntry.slice(0, -1);
        else if (k === "Enter" && this.joinEntry.length === 4) {
          Net.join(this.joinEntry); this.joinEntry = null; Snd.uiBig();
        }
      }
    }
    // host: once a guest is connected and has picked, go set the match up
    if (Net.isHost && Net.active && Net.guestPick && !Net.hostReady) {
      Net.hostReady = true;
      this.slots = [
        { charId: this.slots[0].charId, mode: "human" },
        { charId: Net.guestPick, mode: "human" },
        { charId: "ORBIT", mode: "off" },
        { charId: "PIVOT", mode: "off" },
      ];
      this.selIndex = 0;
      this.screen = "select";
      Snd.uiBig();
    }
  },

  drawOnline() {
    Stage.def = STAGES[0];
    drawBackground();
    g.save(); g.fillStyle = "rgba(5,4,12,.86)"; g.fillRect(0, 0, W, H); g.restore();
    screenTitleBar("COOL MATT GAMES", "PLAY ONLINE");

    const cx = W / 2;
    g.save();
    g.textAlign = "center";

    if (Net.mode === "off") {
      g.font = `400 14px ${FONT_MONO}`; g.fillStyle = UI.dim;
      g.fillText("One of you hosts and reads out the code. The other joins with it.",
                 cx, 152);
      g.fillText("Host plays Player 1, the one who joins plays Player 2.", cx, 174);
      g.restore();

      if (this.joinEntry === null) {
        if (btn(cx - 300, 220, 280, 64, "HOST A GAME", { color: "#b6ff3b", font: `700 18px ${FONT_MONO}` }))
          { Net.host(); Snd.uiBig(); }
        if (btn(cx + 20, 220, 280, 64, "JOIN A GAME", { color: "#00e5ff", font: `700 18px ${FONT_MONO}` }))
          { this.joinEntry = ""; Snd.ui(); }
      } else {
        g.save(); g.textAlign = "center";
        g.font = `700 13px ${FONT_MONO}`; g.fillStyle = UI.dim;
        g.fillText("TYPE THE 4-CHARACTER CODE, THEN PRESS ENTER", cx, 212);
        g.restore();
        for (let i = 0; i < 4; i++) {
          const bx = cx - 150 + i * 76;
          const ch = this.joinEntry[i] || "";
          panel(g, bx, 232, 64, 76, { cut: 10, fill: "#14112a",
            accent: ch ? "#00e5ff" : UI.line, accentA: ch ? 0.9 : 0.5, glow: ch ? 14 : 0 });
          g.save(); g.textAlign = "center";
          g.font = `900 40px ${FONT_DISPLAY}`; g.fillStyle = "#ffffff";
          g.fillText(ch, bx + 32, 285);
          g.restore();
        }
        if (btn(cx - 90, 334, 180, 42, "CANCEL", { color: "#ff2e88" }))
          { this.joinEntry = null; Snd.ui(); }
      }
      g.save(); g.textAlign = "center";
      g.font = `400 12px ${FONT_MONO}`; g.fillStyle = UI.dimmer;
      g.fillText("Runs peer-to-peer in the browser. No account, nothing to install.", cx, H - 150);
      g.restore();

    } else if (Net.mode === "error") {
      g.font = `900 26px ${FONT_DISPLAY}`; g.fillStyle = "#ff2e88";
      g.fillText("COULDN'T CONNECT", cx, 210);
      g.font = `400 14px ${FONT_MONO}`; g.fillStyle = "#b7b4d4";
      g.fillText(Net.error, cx, 244);
      g.restore();
      if (btn(cx - 110, 290, 220, 48, "TRY AGAIN", { color: "#00e5ff" }))
        { Net.reset(); Snd.ui(); }

    } else {
      // hosting / joining / connected
      if (Net.isHost && Net.code) {
        g.font = `700 13px ${FONT_MONO}`; g.fillStyle = UI.dim;
        g.fillText("YOUR ROOM CODE — READ THIS OUT", cx, 168);
        g.restore();
        for (let i = 0; i < Net.code.length; i++) {
          const bx = cx - 152 + i * 76;
          panel(g, bx, 186, 64, 80, { cut: 10, fill: "#14112a",
            accent: "#b6ff3b", accentA: 0.95, glow: 18 });
          g.save(); g.textAlign = "center";
          g.font = `900 42px ${FONT_DISPLAY}`;
          g.shadowColor = "#b6ff3b"; g.shadowBlur = 12; g.fillStyle = "#ffffff";
          g.fillText(Net.code[i], bx + 32, 243);
          g.restore();
        }
        g.save(); g.textAlign = "center";
      }

      const dots = ".".repeat(1 + (Math.floor(performance.now() / 400) % 3));
      g.font = `400 15px ${FONT_MONO}`; g.fillStyle = "#b7b4d4";
      g.fillText(Net.status + (Net.mode === "connected" ? "" : dots), cx, 310);

      if (Net.mode === "connected") {
        g.font = `700 13px ${FONT_MONO}`; g.fillStyle = "#b6ff3b";
        g.fillText(Net.ping ? `CONNECTED  ·  ${Net.ping} ms round trip` : "CONNECTED", cx, 338);
        if (Net.isGuest) {
          g.font = `400 13px ${FONT_MONO}`; g.fillStyle = UI.dim;
          g.fillText("The host picks the stage. You will drop straight into the fight.", cx, 366);
        }
      }
      g.restore();

      if (btn(cx - 110, H - 150, 220, 46, "CANCEL", { color: "#ff2e88" }))
        { Net.reset(); Snd.ui(); }
    }

    if (btn(24, H - 76, 170, 44, "BACK", { color: "#8f8cb5" }))
      { Net.reset(); this.screen = "title"; Snd.ui(); }
  },
