{
  id: "DRIFT", name: "CIRRUS DRIFT", tag: "DAWN · TWITCHY", deck: "cloud",
  blurb: "Dawn above the cloud deck. Side platforms drift fast, so footing never sits still for long.",
  pivot: { x: 800, y: 600 },
  // open sky: still the most forgiving map, but not so wide it stalemates
  // Tightened again: with damage output down across the board (stale moves,
  // smaller hitboxes, nerfed supers) the most forgiving stage started running
  // to the clock -- 3 of 12 test matches timed out at 106s average.
  blast: { left: -380, right: 1980, top: -620, bottom: 1235 },
  tilt: Object.assign({}, TILT_BASE, {
    torque: 0.0000030,
    spring: 0.0138,      // snaps level fast
    damp: 0.930,         // and does not keep ringing
    maxAngVel: 0.072,
    limit: 0.36,
    snapLaunch: 15.5,
    snapDamage: 4,
  }),
  pal: { a: "#ffb4d6", b: "#8fd7ff", plat: "#efe3f3", platEdge: "#ff9ec7",
         soft: "#b89ede", ink: "#2b2140" },
  music: { bpm: 96, root: 262, scale: [0, 2, 4, 7, 9], wave: "sine", hats: false,
           seq: [0, 2, 4, -1, 2, 4, 5, -1, 4, 2, 0, -1, 2, -1, -1, -1] },
  layout: [
    // wide deck with far-out islands — lots of stage, few blast zones
    { x1: -340, y1: 0,    x2: 340,  y2: 0,    solid: true,  main: true, thick: 24 },
    { x1: -430, y1: -150, x2: -266, y2: -150, solid: false, thick: 12,
      crumble: { delay: 54, gone: 150 } },
    { x1:  266, y1: -150, x2:  430, y2: -150, solid: false, thick: 12,
      crumble: { delay: 54, gone: 150 } },
    { x1: -110, y1: -284, x2:  110, y2: -284, solid: false, thick: 12 },
  ],

  drawBg(g, t) {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#2a2a63"); grad.addColorStop(0.38, "#7d5e97");
    grad.addColorStop(0.68, "#eb9a96"); grad.addColorStop(1, "#ffd3a6");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    // low sun
    const sx = W * 0.5, sy = H * 0.70;
    const sg = g.createRadialGradient(sx, sy, 10, sx, sy, 300);
    sg.addColorStop(0, "rgba(255,247,214,.95)");
    sg.addColorStop(0.3, "rgba(255,196,150,.45)");
    sg.addColorStop(1, "rgba(255,170,140,0)");
    g.fillStyle = sg; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,250,230,.9)";
    g.beginPath(); g.arc(sx, sy, 54, 0, 7); g.fill();

    // cloud decks at three parallax depths
    const deck = (yBase, speed, scale, alpha, col) => {
      g.save(); g.globalAlpha = alpha; g.fillStyle = col;
      for (let i = 0; i < 10; i++) {
        const seed = i * 13 + yBase;
        const span = W + 500;
        const x = ((hash(seed) * span) + t * speed) % span - 250;
        const y = yBase + hash(seed * 3) * 50;
        const w = (90 + hash(seed * 5) * 150) * scale;
        const h = (20 + hash(seed * 7) * 18) * scale;
        g.beginPath();
        g.ellipse(x, y, w, h, 0, 0, 7);
        g.ellipse(x - w * 0.45, y + h * 0.3, w * 0.55, h * 0.72, 0, 0, 7);
        g.ellipse(x + w * 0.5, y + h * 0.25, w * 0.5, h * 0.66, 0, 0, 7);
        g.fill();
      }
      g.restore();
    };
    /* Distant peaks. Drawn before any cloud deck and fairly opaque: at low
       alpha over a bright sky they read as ghostly triangles hanging in the
       air rather than mountains behind the weather. Their bases sit low
       enough that the lower cloud decks cover them. */
    g.save();
    {
      const base = H * 0.68;
      const peaks = [];
      for (let i = 0; i < 7; i++)
        peaks.push({ x: i * 230 - 90 + Math.sin(i) * 40, h: 80 + hash(i * 17) * 130 });

      /* Each layer is ONE path containing every peak, filled once. Filling
         them one at a time stacked the translucency wherever two peaks
         overlapped, which painted a hard dark V into the middle of the
         range that looked like an upside-down mountain. */
      const fillAll = (alpha, col, build) => {
        g.globalAlpha = alpha; g.fillStyle = col;
        g.beginPath();
        for (const p of peaks) build(p);
        g.fill();
      };
      fillAll(0.6, "#64487d", p => {
        g.moveTo(p.x - 160, base); g.lineTo(p.x, base - p.h);
        g.lineTo(p.x + 160, base); g.closePath();
      });
      // sunward faces, catching the dawn
      fillAll(0.3, "#c98ba0", p => {
        g.moveTo(p.x, base - p.h); g.lineTo(p.x + 160, base);
        g.lineTo(p.x + 20, base); g.closePath();
      });
      // snow caps, following the ridge so they do not float
      fillAll(0.5, "#fff0f6", p => {
        const cw2 = 36, ch2 = p.h * 0.2;
        g.moveTo(p.x, base - p.h);
        g.lineTo(p.x + cw2, base - p.h + ch2);
        g.lineTo(p.x + 12, base - p.h + ch2 * 0.7);
        g.lineTo(p.x - 10, base - p.h + ch2);
        g.lineTo(p.x - cw2, base - p.h + ch2 * 0.85);
        g.closePath();
      });
    }
    g.restore();

    deck(H * 0.30, 7, 0.8, 0.22, "#ffffff");
    deck(H * 0.52, 14, 1.0, 0.34, "#ffe9f2");

    // floating stone islands, drifting slowly past
    g.save();
    for (let i = 0; i < 4; i++) {
      const span = W + 700;
      const ix = ((hash(i * 23) * span) + t * (9 + i * 4)) % span - 350;
      const iy = H * (0.34 + hash(i * 29) * 0.22) + Math.sin(t * 0.4 + i) * 7;
      const s = 0.45 + hash(i * 31) * 0.5;
      g.save(); g.translate(ix, iy); g.scale(s, s);
      g.globalAlpha = 0.55;
      g.fillStyle = "#9a7fb8";
      poly(g, [-60, 0, 60, 0, 34, 30, -30, 30]); g.fill();
      g.fillStyle = "#7a5f98";
      poly(g, [-30, 30, 34, 30, 6, 72, -8, 72]); g.fill();
      g.fillStyle = "rgba(190,255,200,.5)";
      g.beginPath(); g.ellipse(0, -2, 58, 7, 0, 0, 7); g.fill();
      g.restore();
    }
    g.restore();

    deck(H * 0.86, 26, 1.5, 0.55, "#ffffff");

    // birds
    g.save();
    g.strokeStyle = "rgba(60,44,70,.45)"; g.lineWidth = 2; g.lineCap = "round";
    for (let i = 0; i < 5; i++) {
      const x = ((t * 34 + i * 260) % (W + 200)) - 100;
      const y = H * 0.24 + Math.sin(t * 0.8 + i) * 16 + i * 14;
      const f = Math.sin(t * 5 + i * 2) * 4;
      g.beginPath();
      g.moveTo(x - 8, y + f); g.lineTo(x, y - 2); g.lineTo(x + 8, y + f);
      g.stroke();
    }
    g.restore();

    // foreground wisps blowing across the camera
    g.save();
    g.globalAlpha = 0.3; g.fillStyle = "#ffffff";
    for (let i = 0; i < 4; i++) {
      const span = W + 900;
      const x = ((hash(i * 41) * span) + t * 70) % span - 450;
      const y = H * (0.78 + hash(i * 43) * 0.2);
      g.beginPath();
      g.ellipse(x, y, 260, 26, 0, 0, 7);
      g.ellipse(x - 150, y + 12, 140, 18, 0, 0, 7);
      g.fill();
    }
    g.restore();
  },
},

  drawBg(g, t) {
    g.fillStyle = "#030907"; g.fillRect(0, 0, W, H);

    // chamber shell
    g.save();
    const vg = g.createRadialGradient(W / 2, H * 0.5, 60, W / 2, H * 0.5, W * 0.62);

    vg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    g.restore();

    // the containment ring behind the deck: this is a test chamber, and
    // something is clearly meant to be held in the middle of it

    g.translate(W / 2, H * 0.52);
    g.strokeStyle = "rgba(57,255,158,.12)"; g.lineWidth = 20;
    g.beginPath(); g.arc(0, 0, 250, 0, 7); g.stroke();
    g.strokeStyle = "rgba(57,255,158,.22)"; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 260, 0, 7); g.stroke();
    g.beginPath(); g.arc(0, 0, 240, 0, 7); g.stroke();
    // emitter blocks at the cardinals, pulsing in sequence

      const a = (i / 8) * Math.PI * 2 + t * 0.12;
      const lit = (Math.sin(t * 2.4 - i * 0.7) + 1) / 2;

      g.translate(Math.cos(a) * 250, Math.sin(a) * 250);
      g.rotate(a);

      roundRect(g, -14, -20, 28, 40, 4); g.fill(); g.stroke();

      roundRect(g, -7, -13, 14, 26, 3); g.fill();

    // corner gussets
    g.fillStyle = "#04120c";
    for (const [cx, cy, sx, sy] of [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]]) {
      g.save(); g.translate(cx, cy); g.scale(sx, sy);
      poly(g, [0, 0, 74, 0, 0, 74]); g.fill();
      g.strokeStyle = "rgba(57,255,158,.18)"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(74, 0); g.lineTo(0, 74); g.stroke();
      g.restore();
    }
    g.restore();
  },
},
];

const STAGE_BY_ID = {};
STAGES.forEach(s => { STAGE_BY_ID[s.id] = s; });

/* ========================================================================== */
/* Stage runtime                                                              */
/* ========================================================================== */
const Stage = {
  def: STAGES[0],
  pivot: { x: 800, y: 580 },
  tilt: 0, prevTilt: 0, angVel: 0,
  anchorTimer: 0, snapFlash: 0, snapCount: 0, snapCooldown: 0,
  lastPusher: null,
  segs: [],
  pfx: [], platT: 0,
  forcing: 0,
  /* Weight on the deck that is not a fighter. Ballast's cubes register here
     each frame and Stage.update consumes the list, so a cube tilts the stage
     exactly as a body of the same mass standing in that spot would. */
  extraWeights: [],

  get cfg() { return this.def.tilt; },
  get anchorFrames() { return this.def.tilt.anchorFrames; },
  get blast() { return this.def.blast; },
  get pal() { return this.def.pal; },

  select(def) {
    this.def = def;
    this.pivot = { x: def.pivot.x, y: def.pivot.y };
    this.reset();
  },
  reset() {
    this.tilt = 0; this.prevTilt = 0; this.angVel = 0;
    this.resetPlatforms();
    this.anchorTimer = 0; this.snapFlash = 0; this.snapCount = 0; this.snapCooldown = 0;
    this.lastPusher = null; this.forcing = 0;
    this.extraWeights.length = 0;
    this.rebuild();
  },

  toWorld(lx, ly) {
    const c = Math.cos(this.tilt), s = Math.sin(this.tilt);
    return { x: this.pivot.x + lx * c - ly * s, y: this.pivot.y + lx * s + ly * c };
  },

  /* ---------------------------------------------------- platform state ----
     The side platforms are no longer inert scenery. Each stage gives its own
     a behaviour, and the live state of each one lives in pfx[i], parallel to
     def.layout. Absent platforms are simply left out of segs, so collision,
     combat's ground test and the contact shadows all respect them without
     any of those three needing to know this system exists. */
  resetPlatforms() {
    this.platT = 0;
    this.pfx = this.def.layout.map(() => ({
      dx: 0, present: true, heat: 0, stood: 0, gone: 0, alpha: 1,
    }));
  },

  platformTick(fighters) {
    this.platT++;
    const T = this.platT;

    this.def.layout.forEach((p, i) => {
      const s = this.pfx[i];
      if (p.main) return;                       // the deck itself never changes
      const ph = p.phase || 0;

      if (p.drift) {
        s.dx = Math.sin((T + ph) * p.drift.speed) * p.drift.range;
      }

      if (p.hot) {
        // cold → a warning flicker → hot. The warning is what makes it fair.
        const cyc = (T + ph) % p.hot.period;
        if (cyc < p.hot.on) s.heat = 1;
        else if (cyc < p.hot.on + p.hot.warn) s.heat = 0;
        else s.heat = (cyc > p.hot.period - p.hot.warn) ? 0.5 : 0;
      }

      if (p.crumble) {
        if (s.gone > 0) {
          s.gone--;
          s.present = false;
          s.alpha = s.gone < 20 ? 1 - s.gone / 20 : 0;   // fades back in
          if (s.gone === 0) { s.present = true; s.stood = 0; s.alpha = 1; }
        } else {
          const loaded = fighters.some(f =>
            f.alive && f.grounded && f.groundSeg && f.groundSeg.local === p);
          s.stood = loaded ? s.stood + 1 : Math.max(0, s.stood - 1);
          s.alpha = 1 - (s.stood / p.crumble.delay) * 0.55;
          if (s.stood >= p.crumble.delay) {
            s.gone = p.crumble.gone;
            s.present = false; s.alpha = 0;
            const a = this.toWorld(p.x1 + s.dx, p.y1), b = this.toWorld(p.x2 + s.dx, p.y2);
            FX.burst((a.x + b.x) / 2, (a.y + b.y) / 2, 18, this.pal.soft, 5);
            Snd.noise(0.25, 0.2, 700, 0.9);
          }
        }
      }

      if (p.retract) {
        const cyc = (T + ph) % p.retract.period;
        const open = cyc < p.retract.on;
        if (open !== s.present) {
          const a = this.toWorld(p.x1, p.y1), b = this.toWorld(p.x2, p.y2);
          FX.ring((a.x + b.x) / 2, (a.y + b.y) / 2, 8, 60, this.pal.platEdge, 2);
          Snd.tone(open ? 220 : 160, 0.14, "square", 0.1, open ? 420 : 90);
        }
        s.present = open;
        // the last 40 frames before it pulls back are telegraphed
        s.alpha = open ? (cyc > p.retract.on - 40 ? 0.45 + 0.4 * Math.abs(Math.sin(T * 0.4)) : 1) : 0;
      }
    });
  },

  /** Burn anyone standing on a hot platform. Called after collision resolves. */
  platformDamage(fighters) {
    this.def.layout.forEach((p, i) => {
      if (!p.hot || this.pfx[i].heat < 1) return;
      for (const f of fighters) {
        if (!f.alive || !f.grounded || !f.groundSeg || f.groundSeg.local !== p) continue;
        if (f.invuln > 0 || f.hotTick > 0) continue;
        f.hotTick = 14;
        f.applyKnockback(0, -5.5, p.hot.dmg || 1.6, 4, null);
        FX.burst(f.x, f.feetY, 8, "#ff8a1f", 4);
        Snd.tone(300, 0.06, "sawtooth", 0.09, 120);
      }
    });
  },

  rebuild() {
    this.segs = [];
    this.def.layout.forEach((p, i) => {
      const s = this.pfx[i];
      if (s && !s.present) return;              // retracted / crumbled away
      const dx = s ? s.dx : 0;
      const a = this.toWorld(p.x1 + dx, p.y1), b = this.toWorld(p.x2 + dx, p.y2);
      this.segs.push({
        ax: a.x, ay: a.y, bx: b.x, by: b.y,
        solid: !!p.solid, main: !!p.main, thick: p.thick,
        angle: Math.atan2(b.y - a.y, b.x - a.x), local: p, fx: s,
      });
    });
  },

  surfaceY(seg, x) {
    const lo = Math.min(seg.ax, seg.bx), hi = Math.max(seg.ax, seg.bx);
    if (x < lo - 2 || x > hi + 2) return null;
    const t = (x - seg.ax) / (seg.bx - seg.ax || 1e-6);
    return seg.ay + t * (seg.by - seg.ay);
  },

  /* Tilt mechanic removed: every deck stays flat. These stay as harmless
     no-ops so callers elsewhere (combat, net, the PIVOT character's special)
     don't need to know the mechanic is gone. */
  nudge(_amount) {},
  anchor() { this.anchorTimer = this.cfg.anchorFrames; this.angVel = 0; },
  flip() {},
  forceTilt(_dir, _power) {},
  balance() { return 0; },

  update(fighters) {
    this.prevTilt = this.tilt;
    this.tilt = 0;
    this.angVel = 0;

    if (this.anchorTimer > 0) {
      this.anchorTimer--;
      this.platformTick(fighters);
      this.rebuild();
      this.platformDamage(fighters);
      if (this.snapFlash > 0) this.snapFlash--;
      return;
    }

    this.extraWeights.length = 0;
    this.forcing = 0;
    if (this.snapFlash > 0) this.snapFlash--;
    this.platformTick(fighters);
    this.rebuild();
    this.platformDamage(fighters);
  },

  snapBack(fighters) {
    const C = this.cfg;
    const sign = Math.sign(this.tilt);
    /* The rebound has to BLEED energy. At full strength it carried the deck
       clean across to the opposite limit, which snapped again, forever. It now
       keeps less than half its swing and can't re-trigger for a moment. */
    this.tilt = sign * C.limit * 0.9;
    this.angVel = -sign * C.snapVel * 0.45;
    this.snapCooldown = 48;
    this.snapFlash = 26;
    this.snapCount++;
    Snd.snapback();
    FX.shake(26); FX.hitPause(8);
    FX.flash("#ffffff", 0.25);
    FX.punch(0.85);

    for (const f of fighters) {
      if (!f.alive || !f.grounded || !f.groundSeg || f.pinned) continue;
      const lean = clamp((f.x - this.pivot.x) / 310, -1, 1);
      f.applyKnockback(lean * 7.5 - sign * 3.0,
        -C.snapLaunch * (1.15 - Math.abs(lean) * 0.3), C.snapDamage, 26, null);
      FX.burst(f.x, f.y + f.ch.size.h * 0.5, 16, "#ffffff", 7);
    }
    const culprit = this.lastPusher;
    if (culprit && culprit.alive) { culprit.stats.snapbacks++; culprit.addMeter(CFG.meter.onSnapback); }
    FX.banner("SNAP-BACK!", "#ffffff");
    FX.ring(this.pivot.x, this.pivot.y, 60, 560, "#ffffff", 5);
  },
};

/** Register non-fighter weight on the deck for this frame. */
Stage.addWeight = function (x, y, w) { this.extraWeights.push({ x, y, w }); };


/* ===== src/065_uikit.js ===== */
/* ==========================================================================
   7. UI KIT — the fighters' drawing language, applied to panels and gauges

   The roster got ink outlines, top-lit gradients and a clipped rim light, and
   that is what made it stop looking like flat shapes. The HUD was still plain
   translucent rounded rectangles, so it read as a different, cheaper game
   sitting on top of a good-looking one. Everything here exists so a panel is
   built the same way a pauldron is.

   Shared with the roster: INK, ink(), rim(), vol(), plate(). Those are plain
   function declarations in one concatenated script, so load order is moot.
   ========================================================================== */

const UI = {
  ink:   "#07050f",
  panel: "#15122b",
  panel2:"#0c0a1c",
  line:  "#2c2745",
  text:  "#f2f0ff",
  dim:   "#8f8cb5",
  dimmer:"#6b6a85",
};

/* --------------------------------------------------------------- shapes */

/** Rectangle with its corners cut off — stamped plate rather than a web card.
    `cut` is the size of the chamfer; `only` picks which corners get one. */
function notchPath(g, x, y, w, h, cut, only) {
  const o = only || { tl: 1, tr: 1, br: 1, bl: 1 };
  const c = cut;
  g.beginPath();
  g.moveTo(x + (o.tl ? c : 0), y);
  g.lineTo(x + w - (o.tr ? c : 0), y);
  if (o.tr) g.lineTo(x + w, y + c);
  g.lineTo(x + w, y + h - (o.br ? c : 0));
  if (o.br) g.lineTo(x + w - c, y + h);
  g.lineTo(x + (o.bl ? c : 0), y + h);
  if (o.bl) g.lineTo(x, y + h - c);
  g.lineTo(x, y + (o.tl ? c : 0));
  g.closePath();
}

/** A machined panel: cast shadow, ink edge, top-lit face, rim light, and an
    optional accent hairline just inside the border. */
function panel(g, x, y, w, h, opts) {
  const o = opts || {};
  const cut = o.cut === undefined ? 10 : o.cut;
  const path = () => (cut > 0 ? notchPath(g, x, y, w, h, cut, o.only)
                              : roundRect(g, x, y, w, h, o.r || 12));
  const accent = o.accent || UI.line;

  g.save();

  // 1. a real cast shadow, so panels sit above the stage instead of in it
  if (o.shadow !== false) {
    g.save();
    g.globalAlpha = 0.5; g.fillStyle = "#000";
    g.translate(0, 4); path(); g.fill();
    g.restore();
  }

  // 2. ink edge + top-lit face
  const base = o.fill || UI.panel;
  const q = g.createLinearGradient(0, y, 0, y + h);
  q.addColorStop(0, shade(base, 0.12));
  q.addColorStop(0.5, base);
  q.addColorStop(1, shade(base, -0.42));
  path();
  g.strokeStyle = UI.ink; g.lineWidth = o.inkW || 4; g.lineJoin = "round"; g.stroke();
  g.fillStyle = q; g.fill();

  // 3. rim light along the top edge, clipped inside the panel
  g.save(); path(); g.clip();
  g.translate(0, 2.4); path();
  g.strokeStyle = "#ffffff"; g.lineWidth = 3; g.globalAlpha = 0.14; g.stroke();
  g.restore();

  // 4. accent hairline, glowing when the panel wants attention
  g.save(); path(); g.clip();
  g.translate(0, 1.4); path();
  g.strokeStyle = accent; g.lineWidth = o.accentW || 2;
  g.globalAlpha = o.accentA === undefined ? 0.75 : o.accentA;
  if (o.glow) { g.shadowColor = accent; g.shadowBlur = o.glow; }
  g.stroke();
  g.restore();

  g.restore();
}

/** Diagonal hazard hatching, clipped to a shape. Used for danger zones. */
function hatch(g, x, y, w, h, col, step, a) {
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.globalAlpha = a === undefined ? 0.3 : a;
  g.strokeStyle = col; g.lineWidth = (step || 10) * 0.45;
  for (let i = -h; i < w + h; i += step || 10) {
    g.beginPath(); g.moveTo(x + i, y + h); g.lineTo(x + i + h, y); g.stroke();
  }
  g.restore();
}

/** A recessed slot: the inverse of a panel, for bars and readouts to sit in. */
function slot(g, x, y, w, h, r) {
  const path = () => roundRect(g, x, y, w, h, r === undefined ? h / 2 : r);
  path();
  g.fillStyle = "rgba(0,0,0,.55)"; g.fill();
  // inner shadow at the top sells the depth
  g.save(); path(); g.clip();
  g.translate(0, 2); path();
  g.strokeStyle = "#000"; g.lineWidth = 3; g.globalAlpha = 0.5; g.stroke();
  g.restore();
}

/** A filled bar inside a slot, lit along its own top edge. */
function bar(g, x, y, w, h, frac, col, opts) {
  const o = opts || {};
  const fw = Math.max(0, w * clamp(frac, 0, 1));
  if (fw < 0.6) return;
  const r = o.r === undefined ? h / 2 : o.r;
  const path = () => roundRect(g, x, y, fw, h, Math.min(r, fw / 2));
  g.save();
  if (o.glow) { g.shadowColor = col; g.shadowBlur = o.glow; }
  path(); g.fillStyle = col; g.fill();
  g.shadowBlur = 0;
  // highlight stripe across the top third
  path(); g.clip();
  g.fillStyle = "rgba(255,255,255,.26)";
  g.fillRect(x, y, fw, Math.max(1, h * 0.34));
  g.restore();
}

/** Evenly spaced tick marks — turns a bar into an instrument. */
function ticks(g, x, y, w, h, n, col, a) {
  g.save();
  g.globalAlpha = a === undefined ? 0.4 : a;
  g.strokeStyle = col; g.lineWidth = 1;
  for (let i = 1; i < n; i++) {
    const tx = Math.round(x + (w * i) / n) + 0.5;
    g.beginPath(); g.moveTo(tx, y); g.lineTo(tx, y + h); g.stroke();
  }
  g.restore();
}

/** Small bolt head, for the corners of metal panels. */
function screw(g, x, y, r, col) {
  g.save();
  g.fillStyle = "rgba(0,0,0,.6)";
  g.beginPath(); g.arc(x, y + 0.8, r, 0, 7); g.fill();
  g.fillStyle = col || UI.line;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = "rgba(0,0,0,.55)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x - r * 0.55, y); g.lineTo(x + r * 0.55, y); g.stroke();
  g.restore();
}

/** A small label chip — stage names, counts, tags. */
function chip(g, text, x, y, col, opts) {
  const o = opts || {};
  g.save();
  g.font = o.font || `700 10px ${FONT_MONO}`;
  const tw = g.measureText(text).width;
  const padX = o.padX || 9, h = o.h || 20;
  const w = tw + padX * 2;
  const bx = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
  notchPath(g, bx, y, w, h, 5);
  g.fillStyle = "rgba(6,5,14,.88)"; g.fill();
  g.strokeStyle = hexA(col, 0.65); g.lineWidth = 1.5; g.stroke();
  g.fillStyle = col; g.textAlign = "left"; g.textBaseline = "middle";
  g.fillText(text, bx + padX, y + h / 2 + 0.5);
  g.textBaseline = "alphabetic";
  g.restore();
  return w;
}


/* ===== src/06_fx.js ===== */
/* ==========================================================================
   7. FX — particles, impact feedback, and the camera

   The camera is the part that was wrong in v1: it chased the exact midpoint of
   every fighter on every frame, so it drifted left and right constantly even
   when nothing was happening. This one holds completely still until the action
   leaves a dead zone, eases rather than snaps, and quantises its zoom so it
   never breathes in and out. Screen shake is short, capped, and switchable off.
   ========================================================================== */

const FX = {
  parts: [], rings: [], marks: [], streaks: [], texts: [],
  blades: [], bolts: [], cracks: [], glyphs: [],
  shakeMag: 0, shakeX: 0, shakeY: 0,
  pause: 0,
  flashCol: null, flashAmt: 0,
  chroma: 0,                 // red/blue separation, decays every frame
  bannerText: "", bannerTimer: 0, bannerColor: "#fff",

  cam: {
    x: 800, y: 440, zoom: 0.9,
    px: 800, py: 440, pz: 0.9,   // previous step, for render interpolation
    tz: 0.9,
  },

  reset() {
    this.parts.length = 0; this.rings.length = 0; this.marks.length = 0;
    this.streaks.length = 0; this.texts.length = 0;
    this.blades.length = 0; this.bolts.length = 0;
    this.cracks.length = 0; this.glyphs.length = 0;
    this.shakeMag = 0; this.pause = 0; this.bannerTimer = 0;
    this.flashAmt = 0; this.chroma = 0;
    const c = this.cam;
    c.x = c.px = Stage.pivot.x;
    c.y = c.py = Stage.pivot.y - 150;
    c.zoom = c.pz = c.tz = 0.88;
  },

  /* ----------------------------------------------------------- feedback */
  shake(m) {
    const amt = Settings.get("shakeAmount");
    if (amt <= 0) return;
    this.shakeMag = Math.min(CFG.cam.maxShake, this.shakeMag + m * amt);
  },
  hitPause(f) { this.pause = Math.max(this.pause, f); },
  flash(col, amt) { this.flashCol = col; this.flashAmt = Math.max(this.flashAmt, amt); },
  /** Kick the chromatic aberration. Heavy hits, Snap-Backs, KOs and supers. */
  punch(amt) { this.chroma = Math.min(1, this.chroma + amt); },
  banner(text, color) {
    if (!text) return;
    this.bannerText = text; this.bannerTimer = 72; this.bannerColor = color || "#fff";
  },

  get density() { return Settings.get("particles"); },

  burst(x, y, n, color, speed) {
    n = Math.min(40, Math.round(n * this.density));
    for (let i = 0; i < n; i++) {
      if (this.parts.length > CFG.maxParticles) break;
      const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random());
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        life: 16 + Math.random() * 22, max: 38, size: 1.6 + Math.random() * 3.4,
        color, grav: 0.22, drag: 0.985 });
    }
  },
  spark(x, y, color) {
    if (this.parts.length > CFG.maxParticles || this.density <= 0) return;
    this.parts.push({ x, y, vx: rnd(-1.2, 1.2), vy: rnd(-1.2, 1.2),
      life: 10 + Math.random() * 12, max: 22, size: 1.2 + Math.random() * 2,
      color, grav: 0.02, drag: 0.96 });
  },
  /** A fan of dust along the ground — used by heavy ground impacts. */
  dustLine(x, y, width, color) {
    const n = Math.round(14 * this.density);
    for (let i = 0; i < n; i++) {
      const s = (Math.random() * 2 - 1);
      this.parts.push({ x: x + s * width * 0.5, y: y - 2,
        vx: s * rnd(2, 7), vy: rnd(-4.5, -1),
        life: 18 + Math.random() * 18, max: 36, size: 2 + Math.random() * 3.6,
        color, grav: 0.16, drag: 0.97 });
    }
  },
  ring(x, y, r0, r1, color, lw) {
    this.rings.push({ x, y, r: r0, r1, cur: r0, life: 24, max: 24, color, lw: lw || 3 });
  },
  streak(x1, y1, x2, y2, color) {
    this.streaks.push({ x1, y1, x2, y2, color, life: 10, max: 10 });
  },
  /* ------------------------------------------------- attack primitives

     These exist so each move can have a signature rather than every attack
     producing the same puff of sparks. A blade is the workhorse: a crescent
     that sweeps outward and thins as it goes, which is what reads as "a thing
     was swung through here".

       rot     centre angle of the arc, radians, 0 = +x
       spread  how much of a circle it covers
       r0,r1   radius at birth and death — the sweep
       w       half-thickness at the middle of the crescent  */
  blade(x, y, rot, r0, r1, spread, color, opts) {
    if (this.density <= 0) return;
    const o = opts || {};
    this.blades.push({
      x, y, rot, r0, r1, spread, color,
      w: o.w || 10, life: o.life || 14, max: o.life || 14,
      spin: o.spin || 0, follow: o.follow || null,
      core: o.core !== false,
    });
  },

  /** Jagged lightning between two points. The zigzag is generated once and
      kept, so it reads as a bolt holding still rather than static noise. */
  bolt(x1, y1, x2, y2, color, opts) {
    if (this.density <= 0) return;
    const o = opts || {};
    const segs = o.segs || 6, jag = o.jag || 14;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const px = lerp(x1, x2, t), py = lerp(y1, y2, t);
      const off = (i === 0 || i === segs) ? 0 : rnd(-jag, jag);
      const nx = -(y2 - y1), ny = (x2 - x1);
      const nl = Math.hypot(nx, ny) || 1;
      pts.push({ x: px + (nx / nl) * off, y: py + (ny / nl) * off });
    }
    this.bolts.push({ pts, color, life: o.life || 9, max: o.life || 9, w: o.w || 3,
                      branch: o.branch !== false });
  },

  /** Cracks radiating along a surface from an impact. */
  crack(x, y, dir, len, color, n) {
    if (this.density <= 0) return;
    n = n || 3;
    const steps = 4;
    for (let i = 0; i < n; i++) {
      const pts = [{ x, y }];
      for (let s = 0; s < steps; s++) {
        const prev = pts[pts.length - 1];
        pts.push({
          x: prev.x + dir * (len / steps) * (0.6 + Math.random() * 0.7),
          y: prev.y + rnd(-5, 5),
        });
      }
      this.cracks.push({ pts, color, life: 26, max: 26, w: 2.6 - i * 0.5 });
    }
  },

  /** A brief symbol stamped in the world — scale marks, orbit rings, etc. */
  glyph(x, y, kind, size, color, life) {
    if (this.density <= 0) return;
    this.glyphs.push({ x, y, kind, size, color, life: life || 20, max: life || 20, rot: 0 });
  },

  /** Radial impact lines. Short, bright, and gone in a few frames — the thing
      that makes a heavy connect read as a BLOW rather than a touch. */
  impactLines(x, y, dir, n, color, len) {
    if (this.density <= 0) return;
    n = Math.round(n * Math.min(1, this.density));
    for (let i = 0; i < n; i++) {
      const spread = 1.5;
      const a = dir + rnd(-spread, spread);
      const r0 = 16 + Math.random() * 14;
      const l = (len || 42) * (0.55 + Math.random() * 0.8);
      this.streaks.push({
        x1: x + Math.cos(a) * r0, y1: y + Math.sin(a) * r0,
        x2: x + Math.cos(a) * (r0 + l), y2: y + Math.sin(a) * (r0 + l),
        color, life: 7 + (Math.random() * 4 | 0), max: 11,
      });
    }
  },

  hitmark(x, y, dmg) { this.marks.push({ x, y, life: 11, max: 11, size: 14 + dmg * 2.6 }); },
  /** Floating text at the point of impact — a damage number, or a short label
      like TIP/STALE when something modified that number. */
  damageText(x, y, dmg, color) {
    const text = typeof dmg === "number" ? Math.round(dmg).toString() : String(dmg);
    this.texts.push({ x, y, vy: -1.2, life: 42, max: 42, text, color,
                      small: typeof dmg !== "number" });
  },

  /* ------------------------------------------------------------- update */
  update(fighters) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= p.drag;
      if (--p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.cur = r.r + (r.r1 - r.r) * easeOut(1 - r.life / r.max);
      if (--r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.blades.length - 1; i >= 0; i--) {
      const b = this.blades[i];
      b.rot += b.spin;
      // a blade attached to a fighter tracks them, so a swing stays on the arm
      if (b.follow) { b.x = b.follow.x; b.y = b.follow.y + (b.follow.oy || 0); }
      if (--b.life <= 0) this.blades.splice(i, 1);
    }
    for (let i = this.bolts.length - 1; i >= 0; i--) if (--this.bolts[i].life <= 0) this.bolts.splice(i, 1);
    for (let i = this.cracks.length - 1; i >= 0; i--) if (--this.cracks[i].life <= 0) this.cracks.splice(i, 1);
    for (let i = this.glyphs.length - 1; i >= 0; i--) {
      const gl = this.glyphs[i];
      gl.rot += 0.04;
      if (--gl.life <= 0) this.glyphs.splice(i, 1);
    }
    for (let i = this.marks.length - 1; i >= 0; i--) if (--this.marks[i].life <= 0) this.marks.splice(i, 1);
    for (let i = this.streaks.length - 1; i >= 0; i--) if (--this.streaks[i].life <= 0) this.streaks.splice(i, 1);
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.y += t.vy; t.vy *= 0.94;
      if (--t.life <= 0) this.texts.splice(i, 1);
    }

    this.shakeMag *= CFG.cam.shakeDecay;
    if (this.shakeMag < 0.2) this.shakeMag = 0;
    this.shakeX = (Math.random() - 0.5) * this.shakeMag * 2;
    this.shakeY = (Math.random() - 0.5) * this.shakeMag * 2;

    this.flashAmt *= 0.84;
    if (this.flashAmt < 0.01) this.flashAmt = 0;
    this.chroma *= 0.80;
    if (this.chroma < 0.01) this.chroma = 0;
    if (this.bannerTimer > 0) this.bannerTimer--;

    this.updateCamera(fighters);
  },

  /* ------------------------------------------------------------- camera */
  updateCamera(fighters) {
    const c = this.cam, K = CFG.cam;
    c.px = c.x; c.py = c.y; c.pz = c.zoom;

    const live = fighters.filter(f => f.alive && f.state !== ST.DEAD);
    const home = { x: Stage.pivot.x, y: Stage.pivot.y - 150 };

    if (!live.length || Settings.get("cameraSway") <= 0) {
      // Pinned mode: sit over the stage and only change zoom.
      c.x += (home.x - c.x) * 0.08;
      c.y += (home.y - c.y) * 0.08;
      c.zoom += (0.86 - c.zoom) * K.zoomLerp;
      return;
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const f of live) {
      minX = Math.min(minX, f.x); maxX = Math.max(maxX, f.x);
      minY = Math.min(minY, f.y); maxY = Math.max(maxY, f.y);
    }
    // Always keep the stage itself in frame so the camera has an anchor.
    minX = Math.min(minX, home.x - 170); maxX = Math.max(maxX, home.x + 170);
    minY = Math.min(minY, home.y - 90);  maxY = Math.max(maxY, home.y + 110);

    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

    /* Dead zone: do nothing at all while the action's centre stays inside the
       box. Only the amount that pokes out of the box moves the camera, which
       is what stops the constant left-right drift. */
    const sway = Settings.get("cameraSway");
    const dx = cx - c.x, dy = cy - c.y;
    const dzX = K.deadX / sway, dzY = K.deadY / sway;
    let tx = c.x, ty = c.y;
    if (dx > dzX) tx = cx - dzX; else if (dx < -dzX) tx = cx + dzX;
    if (dy > dzY) ty = cy - dzY; else if (dy < -dzY) ty = cy + dzY;

    c.x += (tx - c.x) * K.follow;
    c.y += (ty - c.y) * K.follow;

    /* Zoom is quantised to discrete steps with hysteresis, so it settles on a
       value and stays there instead of micro-adjusting every frame. */
    const bw = (maxX - minX) + K.pad * 2, bh = (maxY - minY) + K.pad * 1.5;
    const want = clamp(Math.min(W / bw, H / bh), K.minZoom, K.maxZoom);
    const stepped = Math.round(want / K.zoomStep) * K.zoomStep;
    if (Math.abs(stepped - c.tz) > K.zoomStep * 0.75) c.tz = stepped;
    c.zoom += (c.tz - c.zoom) * K.zoomLerp;
  },

  /** Camera transform, interpolated between fixed steps for smooth motion. */
  applyCamera(g, alpha) {
    const c = this.cam;
    const x = lerp(c.px, c.x, alpha);
    const y = lerp(c.py, c.y, alpha);
    const z = lerp(c.pz, c.zoom, alpha);
    g.translate(W / 2 + this.shakeX, H / 2 + this.shakeY);
    g.scale(z, z);
    g.translate(-x, -y);
    return { x, y, z };
  },

  /* ------------------------------------------------------------ drawing */
  /** Crescent path: thickest in the middle, pointed at both tips. Canvas can't
      taper a stroke, so the arc is built as a polygon instead. */
  _bladePath(g, b, r, w) {
    const N = 14, a0 = b.rot - b.spread / 2;
    g.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = i / N, a = a0 + b.spread * t;
      const th = w * Math.sin(Math.PI * t);
      g.lineTo(b.x + Math.cos(a) * (r + th), b.y + Math.sin(a) * (r + th));
    }
    for (let i = N; i >= 0; i--) {
      const t = i / N, a = a0 + b.spread * t;
      const th = w * Math.sin(Math.PI * t);
      g.lineTo(b.x + Math.cos(a) * (r - th), b.y + Math.sin(a) * (r - th));
    }
    g.closePath();
  },

  drawWorld(g) {
    const litParts = Settings.get("postFx") > 0;
    g.save();
    g.globalCompositeOperation = "lighter";

    /* ---- swept blades: the signature of a melee swing ---- */
    for (const b of this.blades) {
      const k = 1 - b.life / b.max;              // 0 at birth, 1 at death
      const a = b.life / b.max;
      const r = lerp(b.r0, b.r1, easeOut(k));
      const w = b.w * (1 - k * 0.72);
      /* Hold near full brightness for the first half of the life, then fade.
         Squaring the alpha instead made the arc dimmest exactly when it was
         widest, so a swing read as a faint expanding ring rather than a swipe. */
      g.globalAlpha = Math.min(1, a * 1.9) * 0.9;
      g.fillStyle = b.color;
      this._bladePath(g, b, r, w);
      g.fill();
      if (b.core) {                               // hot inner edge
        g.globalAlpha = Math.min(1, a * 1.6) * 0.95;
        g.fillStyle = "#ffffff";
        this._bladePath(g, b, r, w * 0.32);
        g.fill();
      }
    }

    /* ---- lightning ---- */
    for (const b of this.bolts) {
      const a = b.life / b.max;
      g.globalAlpha = a;
      g.lineCap = "round"; g.lineJoin = "round";
      for (const pass of [[b.w * 2.4, b.color, 0.5], [b.w, "#ffffff", 1]]) {
        g.lineWidth = pass[0]; g.strokeStyle = pass[1];
        g.globalAlpha = a * pass[2];
        g.beginPath();
        g.moveTo(b.pts[0].x, b.pts[0].y);
        for (let i = 1; i < b.pts.length; i++) g.lineTo(b.pts[i].x, b.pts[i].y);
        g.stroke();
      }
    }

    for (const s of this.streaks) {
      const a = s.life / s.max;
      g.globalAlpha = a * 0.8; g.strokeStyle = s.color;
      g.lineWidth = 1 + a * 5; g.lineCap = "round";
      g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
    }
    for (const r of this.rings) {
      const a = r.life / r.max;
      g.globalAlpha = a * 0.85; g.strokeStyle = r.color;
      g.lineWidth = r.lw * (0.4 + a);
      g.beginPath(); g.arc(r.x, r.y, r.cur, 0, 7); g.stroke();
      // a soft bloom core inside a young ring, so impacts flare
      if (a > 0.55 && litParts)
        Light.draw(g, r.x, r.y, r.cur * 0.9, r.color, (a - 0.55) * 0.7, 0.02);
    }
    /* Particles cast light rather than being flat discs, so a burst reads as
       sparks instead of confetti. Measured at ~1.3us per halo, so only the
       larger particles get one: a 1px spark gains nothing visually from a
       halo, and at the 900-particle cap the difference is ~1ms a frame. */
    for (const p of this.parts) {
      const a = p.life / p.max;
      const r = p.size * (0.4 + a * 0.8);
      if (litParts && p.size > 2.1)
        Light.draw(g, p.x, p.y, r * 3.2, p.color, Math.min(1, a * 1.1) * 0.55, 0.12);
      g.globalAlpha = Math.min(1, a * 1.4); g.fillStyle = p.color;
      g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    }
    for (const m of this.marks) {
      const a = m.life / m.max;
      g.globalAlpha = a; g.fillStyle = "#ffffff";
      const s = m.size * (1.4 - a * 0.5);
      g.save(); g.translate(m.x, m.y); g.rotate(a * 2);
      g.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const rr = i % 2 ? s * 0.34 : s;
        g.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      g.closePath(); g.fill(); g.restore();
    }

    /* ---- stamped glyphs: a move's identity, left briefly in the world ---- */
    for (const gl of this.glyphs) {
      const a = gl.life / gl.max;
      const s = gl.size * (0.8 + (1 - a) * 0.5);
      g.save();
      g.translate(gl.x, gl.y);
      g.globalAlpha = a * 0.8;
      g.strokeStyle = gl.color; g.lineWidth = 2.4; g.lineCap = "round";
      if (gl.kind === "scale") {
        // Pivot: a tipping balance
        g.rotate(Math.sin(gl.rot * 2) * 0.3);
        g.beginPath(); g.moveTo(-s, 0); g.lineTo(s, 0); g.stroke();
        g.beginPath(); g.moveTo(0, -s * 0.5); g.lineTo(0, s * 0.3); g.stroke();
        g.beginPath(); g.arc(-s, s * 0.3, s * 0.3, 0, Math.PI); g.stroke();
        g.beginPath(); g.arc(s, s * 0.3, s * 0.3, 0, Math.PI); g.stroke();
      } else if (gl.kind === "orbit") {
        // Orbit: concentric rings at a tilt
        g.rotate(gl.rot);
        g.beginPath(); g.ellipse(0, 0, s, s * 0.38, 0, 0, 7); g.stroke();
        g.beginPath(); g.ellipse(0, 0, s * 0.6, s * 0.22, 0, 0, 7); g.stroke();
      } else if (gl.kind === "bolt") {
        // Zip: a chevron stack
        for (let i = 0; i < 3; i++) {
          g.globalAlpha = a * (0.8 - i * 0.2);
          g.beginPath();
          g.moveTo(-s * 0.6, -s * 0.4 + i * s * 0.4);
          g.lineTo(0, i * s * 0.4);
          g.lineTo(-s * 0.6, s * 0.4 + i * s * 0.4);
          g.stroke();
        }
      } else {
        // Bolder: an impact wedge
        g.beginPath();
        g.moveTo(-s, -s * 0.5); g.lineTo(s * 0.4, 0); g.lineTo(-s, s * 0.5);
        g.stroke();
      }
      g.restore();
    }
    g.restore();

    /* ---- cracks draw normally: they are in the surface, not glowing ---- */
    g.save();
    for (const c of this.cracks) {
      const a = c.life / c.max;
      g.globalAlpha = a * 0.75;
      g.lineCap = "round"; g.lineJoin = "round";
      g.strokeStyle = "#07050f"; g.lineWidth = c.w + 1.8;
      g.beginPath();
      g.moveTo(c.pts[0].x, c.pts[0].y);
      for (let i = 1; i < c.pts.length; i++) g.lineTo(c.pts[i].x, c.pts[i].y);
      g.stroke();
      g.strokeStyle = c.color; g.lineWidth = c.w;
      g.stroke();
    }
    g.restore();

    // damage numbers draw normally so they stay readable
    g.save();
    g.textAlign = "center";
    for (const t of this.texts) {
      const a = Math.min(1, t.life / t.max * 1.8);
      g.globalAlpha = a;
      g.font = t.small ? `900 12px ${FONT_MONO}`
                       : `900 ${20 + (1 - t.life / t.max) * 6}px ${FONT_DISPLAY}`;
      outlineText(g, t.text, t.x, t.y, t.color, t.small ? 4 : 5);
    }
    g.restore();
  },

  /** Kept for the menu screens, which do not run the post pass. */
  drawOverlay(g) {
    if (Settings.get("postFx") > 0) return;   // the post pass draws it instead
    if (this.flashAmt > 0.01) {
      g.save();
      g.globalAlpha = Math.min(0.75, this.flashAmt);
      g.fillStyle = this.flashCol || "#fff";
      g.fillRect(0, 0, W, H);
      g.restore();
    }
  },
};


/* ===== src/07_fighter.js ===== */
/* ==========================================================================
   8. FIGHTER — state machine, movement, attacks, meter
   ========================================================================== */

const ST = {
  IDLE: "idle", RUN: "run", JUMPSQUAT: "jumpsquat", AIR: "air", LANDLAG: "landlag",
  ATTACK: "attack", SHIELD: "shield", ROLL: "roll", SPOTDODGE: "spotdodge",
  AIRDODGE: "airdodge", HITSTUN: "hitstun", GRABBING: "grabbing", GRABBED: "grabbed",
  SHIELDBREAK: "shieldbreak", DEAD: "dead", RESPAWN: "respawn",
};

let HITID = 1;

class Fighter {
  constructor(slot, charId, isCPU) {
    this.slot = slot;
    this.ch = CHAR_BY_ID[charId];
    this.isCPU = isCPU;
    this.pad = new Pad(slot);
    this.tint = PLAYER_TINT[slot];
    this.stats = { kos: 0, damageDealt: 0, snapbacks: 0, falls: 0, supers: 0 };
    this.reset(true);
  }

  reset(full) {
    this.x = CFG.world.w / 2 + (this.slot - 1.5) * 150;
    this.y = 160;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0;
    this.facing = this.x < Stage.pivot.x ? 1 : -1;
    this.percent = 0;
    this.state = ST.AIR; this.stateTimer = 0;
    this.grounded = false; this.groundSeg = null;
    this.airJumps = CFG.airJumps;
    this.shield = CFG.shieldMax;
    this.invuln = 0; this.hitstun = 0;
    this.attack = null;
    this.fastFalling = false; this.dropThrough = 0;
    this.lastHitBy = null;
    this.grabTarget = null; this.grabHold = 0; this.grabbedBy = null;
    this.heavyStomp = 0; this.crankDir = 0;
    this.anchorGlow = 0; this.flipGlow = 0;
    this.specialCD = 0;
    this.pinned = false;
    this.hotTick = 0;         // cooldown between burns from a hot platform
    this.weightMul = 1;       // Husk doubles his own mass while planted
    this.counter = 0;         // Mira's riposte window, in frames
    this.counterFlash = 0;    // purely cosmetic afterglow on a successful one
    this.hover = 0;           // Kite's remaining hover charge
    this.moveLog = [];        // recent connects, for stale-move negation
    this.armorDamage = 0;     // damage absorbed by the current super's armour
    this.trail = [];
    this.alive = true; this.respawnTimer = 0;
    this.squatHeld = false; this.hitFlash = 0;
    this.runPhase = 0;
    this.animTime = Math.random() * 1000;
    if (full) { this.stocks = CFG.stocks; this.meter = 0; }
  }

  get h() { return this.ch.size.h; }
  get w() { return this.ch.size.w; }
  get feetY() { return this.y + this.h * 0.5; }
  get meterFull() { return this.meter >= CFG.meter.max; }
  get inSuper() { return this.attack && this.attack.kind === "super"; }

  addMeter(v) { this.meter = clamp(this.meter + v, 0, CFG.meter.max); }

  /* ---------------------------------------------------- stale moves ----
     Every connect is remembered for a while. The more of the recent window a
     move occupies, the less it does — so leaning on one strong button costs
     you damage and mixing your options is worth something. Only connects
     count: whiffing a move never stales it. */
  recordMove(move) {
    if (!move || !move.name) return;
    this.moveLog.push({ name: move.name, at: this.animTime });
    if (this.moveLog.length > CFG.skill.staleWindow) this.moveLog.shift();
  }
  staleMul(move) {
    if (!move || !move.name) return 1;
    const K = CFG.skill;
    // entries older than the refresh window have freshened and no longer count
    const recent = this.moveLog.filter(e => this.animTime - e.at < K.staleRefresh);
    const n = recent.filter(e => e.name === move.name).length;
    return K.staleSteps[Math.min(n, K.staleSteps.length - 1)];
  }
  setState(s, t = 0) { this.state = s; this.stateTimer = t; }
  canAct() { return [ST.IDLE, ST.RUN, ST.AIR].includes(this.state); }

  /* ================================================================ update */
  update(match) {
    this.px = this.x; this.py = this.y;
    this.animTime++;

    if (this.state === ST.DEAD) {
      this.respawnTimer--;
      if (this.respawnTimer <= 0) {
        if (this.stocks > 0) this.respawn(); else this.alive = false;
      }
      return;
    }
    if (!this.alive) return;

    this.pad.poll();
    const inp = this.isCPU ? CPU.think(this, match) : this.pad;

    if (this.invuln > 0) this.invuln--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.heavyStomp > 0) this.heavyStomp--;
    if (this.specialCD > 0) this.specialCD--;
    if (this.hotTick > 0) this.hotTick--;
    if (this.counter > 0) this.counter--;
    if (this.counterFlash > 0) this.counterFlash--;
    if (this.anchorGlow > 0) this.anchorGlow--;
    if (this.flipGlow > 0) this.flipGlow--;
    this.crankDir = 0;
    this.addMeter(CFG.meter.passive);

    switch (this.state) {
      case ST.IDLE: case ST.RUN: this.updateGroundFree(inp); break;
      case ST.AIR:               this.updateAirFree(inp); break;
      case ST.JUMPSQUAT:         this.updateJumpSquat(inp); break;
      case ST.LANDLAG:           this.tickTimer(ST.IDLE); break;
      case ST.ATTACK:            this.updateAttack(inp); break;
      case ST.SHIELD:            this.updateShield(inp); break;
      case ST.ROLL:              this.updateRoll(); break;
      case ST.SPOTDODGE:         this.tickTimer(ST.IDLE); break;
      case ST.AIRDODGE:          this.updateAirDodge(); break;
      case ST.HITSTUN:           this.updateHitstun(inp); break;
      case ST.GRABBING:          this.updateGrabbing(inp); break;
      case ST.GRABBED:           this.updateGrabbed(inp); break;
      case ST.SHIELDBREAK:       this.tickTimer(ST.IDLE); break;
      case ST.RESPAWN:           this.updateRespawn(inp); break;
    }

    if (this.state !== ST.SHIELD && this.state !== ST.SHIELDBREAK)
      this.shield = Math.min(CFG.shieldMax, this.shield + CFG.shieldRegen);

    this.integrate();
    this.checkBlastZones(match);

    // run-cycle phase drives the leg animation in every character's draw()
    if (this.grounded && Math.abs(this.vx) > 0.5) this.runPhase += Math.abs(this.vx) * 0.09;
    else this.runPhase *= 0.85;

    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 9 || this.inSuper) {
      this.trail.push({ x: this.x, y: this.y, life: 10, facing: this.facing });
      if (this.trail.length > 12) this.trail.shift();
    }
    for (let i = this.trail.length - 1; i >= 0; i--)
      if (--this.trail[i].life <= 0) this.trail.splice(i, 1);
  }

  tickTimer(next) { if (--this.stateTimer <= 0) this.setState(next); }

  /* ------------------------------------------------------------- grounded */
  updateGroundFree(inp) {
    const ch = this.ch, ax = inp.ax;

    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("shield")) {
      if (ax !== 0) { this.startRoll(ax); return; }
      if (inp.ay > 0) { this.setState(ST.SPOTDODGE, CFG.spotDodgeFrames); Snd.dodge(); return; }
      this.setState(ST.SHIELD); Snd.shield(); return;
    }
    if (inp.held("shield")) { this.setState(ST.SHIELD); return; }
    if (inp.hit("grab")) { this.startGrab(); return; }
    if (inp.hit("heavy")) { this.startAttack("heavy"); return; }
    if (inp.hit("light")) { this.startAttack("light"); return; }
    if (inp.hit("special")) { this.startSpecial(); return; }
    if (inp.hit("up")) { this.setState(ST.JUMPSQUAT, CFG.jumpSquat); this.squatHeld = true; return; }

    if (inp.ay > 0 && this.groundSeg && !this.groundSeg.solid) {
      this.grounded = false; this.groundSeg = null;
      this.dropThrough = 10; this.setState(ST.AIR); this.y += 6;
      return;
    }

    const target = ax * ch.speed;
    this.vx += (target - this.vx) * (ax !== 0 ? ch.accel * 0.45 : 0.35);
    this.setState(Math.abs(this.vx) > 0.6 ? ST.RUN : ST.IDLE);
    if (ax !== 0) this.facing = ax;
  }

  updateJumpSquat(inp) {
    this.squatHeld = this.squatHeld && inp.held("up");
    if (--this.stateTimer <= 0) {
      this.vy = -this.ch.jump * (this.squatHeld ? 1 : CFG.shortHopMul);
      this.grounded = false; this.groundSeg = null;
      this.setState(ST.AIR); this.fastFalling = false;
      Snd.jump();
      FX.burst(this.x, this.feetY, 7, this.ch.color, 3);
    }
  }

  /* ---------------------------------------------------------------- air */
  updateAirFree(inp) {
    const ch = this.ch;
    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("shield")) { this.startAirDodge(inp); return; }
    if (inp.hit("grab") || inp.hit("light")) { this.startAttack("light"); return; }
    if (inp.hit("heavy")) { this.startAttack("heavy"); return; }
    if (inp.hit("special")) { this.startSpecial(); return; }

    if (inp.hit("up") && this.airJumps > 0) {
      this.airJumps--;
      this.vy = -ch.jump * 0.94;
      this.vx += inp.ax * ch.airSpeed * 0.5;
      this.fastFalling = false;
      Snd.jump();
      FX.ring(this.x, this.y, 10, 56, ch.color, 2);
      return;
    }
    if (inp.hit("down") && this.vy > -1) this.fastFalling = true;
    if (inp.ax !== 0) {
      this.vx = clamp(this.vx + inp.ax * ch.accel * 0.42, -ch.airSpeed * 1.6, ch.airSpeed * 1.6);
      this.facing = inp.ax;
    }
  }

  startAirDodge(inp) {
    this.setState(ST.AIRDODGE, CFG.airDodgeFrames);
    this.invuln = Math.max(this.invuln, CFG.dodgeInvuln[1]);
    const a = Math.hypot(inp.ax, inp.ay);
    if (a > 0) { this.vx = (inp.ax / a) * CFG.airDodgeSpeed; this.vy = (inp.ay / a) * CFG.airDodgeSpeed; }
    else { this.vx *= 0.3; this.vy = -1; }
    Snd.dodge();
    FX.ring(this.x, this.y, 8, 50, "#ffffff", 2);
  }
  updateAirDodge() {
    this.vx *= 0.93; this.vy *= 0.93;
    if (--this.stateTimer <= 0) this.setState(ST.AIR);
  }

  /* ------------------------------------------------------------- shield */
  updateShield(inp) {
    this.vx *= 0.7;
    if (!this.grounded) { this.setState(ST.AIR); return; }
    this.shield -= CFG.shieldDrainIdle;
    if (this.shield <= 0) { this.breakShield(); return; }
    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("grab")) { this.startGrab(); return; }
    if (inp.ax !== 0 && inp.hit("shield")) { this.startRoll(inp.ax); return; }
    if (inp.hit("up")) { this.setState(ST.JUMPSQUAT, CFG.jumpSquat); this.squatHeld = true; return; }
    if (!inp.held("shield")) this.setState(ST.IDLE);
  }
  breakShield() {
    this.shield = 0;
    this.setState(ST.SHIELDBREAK, CFG.shieldBreakStun);
    this.vy = -6;
    Snd.shieldBreak(); FX.shake(14);
    FX.burst(this.x, this.y, 26, "#7fd9ff", 8);
    FX.banner("SHIELD BREAK", this.tint);
  }
  startRoll(dir) {
    this.setState(ST.ROLL, CFG.rollFrames);
    this.rollDir = dir;
    this.invuln = Math.max(this.invuln, CFG.dodgeInvuln[1]);
    Snd.dodge();
  }
  updateRoll() {
    this.vx = this.rollDir * CFG.rollSpeed * Math.sin(Math.PI * (this.stateTimer / CFG.rollFrames));
    if (--this.stateTimer <= 0) { this.facing = -this.rollDir; this.setState(ST.IDLE); }
  }

  /* ------------------------------------------------------------ attacks */
  startAttack(kind) {
    const m = this.ch[kind];
    this.attack = {
      kind, data: m, t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, lastHitFrame: -99,
    };
    this.setState(ST.ATTACK);
    if (this.grounded) this.vx *= 0.42;
    if (m.onStart) m.onStart(this);
    Snd.whoosh();
  }

  startSpecial() {
    if (this.specialCD > 0) return;    // the HUD diamond shows readiness
    this.specialCD = this.ch.specialCooldown;
    const m = this.ch.special;
    this.attack = {
      kind: "special", data: m, t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, fired: false,
    };
    this.setState(ST.ATTACK);
    if (m.onStart) m.onStart(this);
    Snd.whoosh(1.2);
  }

  startSuper() {
    const m = this.ch.super;
    this.meter = 0;
    this.armorDamage = 0;
    this.stats.supers++;
    this.attack = {
      kind: "super", data: Object.assign({}, m), t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, fired: false, landed: false,
    };
    this.setState(ST.ATTACK);
    this.invuln = Math.max(this.invuln, m.startup + 4);
    FX.punch(0.6);
    if (m.onStart) m.onStart(this);
    FX.banner(m.name.toUpperCase(), this.ch.color);
    FX.hitPause(10);
  }

  updateAttack(inp) {
    const a = this.attack;
    if (!a) { this.setState(this.grounded ? ST.IDLE : ST.AIR); return; }
    a.t++;

    if (a.data.tick) a.data.tick(this, a, inp);

    const m = a.data;

    /* Signature effects. vfx fires once, on the frame the hitbox opens, so the
       flourish and the hit are the same event; vfxTick runs every active frame
       for moves that need a continuous effect. */
    if (m.vfx && a.t === m.startup + 1) m.vfx(this, a);
    if (m.vfxTick && this.hitboxActive()) m.vfxTick(this, a);

    // multi-hit: re-arm the hitbox every hitGap frames
    if (m.hits && m.hits > 1 && this.hitboxActive()) {
      if (a.t - a.lastHitFrame >= (m.hitGap || 4)) {
        a.hitIds = null; a.lastHitFrame = a.t;
        a.hitIndex = (a.hitIndex || 0) + 1;
        if (m.vfxRehit) m.vfxRehit(this, a);
      }
    }

    if (this.grounded) this.vx *= 0.86;

    if (a.t >= a.total) {
      this.attack = null;
      this.pinned = false;
      this.setState(this.grounded ? ST.LANDLAG : ST.AIR, CFG.landLag);
    }
  }

  hitboxActive() {
    const a = this.attack;
    if (!a) return false;
    const m = a.data;
    if (!m.r) return false;
    return a.t > m.startup && a.t <= m.startup + m.active;
  }
  hitboxWorld() {
    const a = this.attack, m = a.data;
    let ox = m.ox || 0, oy = m.oy || 0;
    if (this.ch.id === "BOLDER" && (a.kind === "special" || a.kind === "super")) ox = 0;
    return { x: this.x + ox * this.facing, y: this.y + oy, r: m.r };
  }

  /* -------------------------------------------------------------- grabs */
  startGrab() {
    this.attack = {
      kind: "grab",
      data: { startup: CFG.grabStartup, active: CFG.grabActive,
              recovery: CFG.grabRecovery, ox: 34, oy: -6, r: 28, dmg: 0 },
      t: 0, total: CFG.grabStartup + CFG.grabActive + CFG.grabRecovery,
      hitId: HITID++, hitIds: null,
    };
    this.setState(ST.ATTACK);
    this.vx *= 0.3;
    Snd.whoosh(0.8);
  }
  lockGrab(target) {
    this.attack = null;
    this.grabTarget = target; this.grabHold = CFG.grabHoldBase;
    this.setState(ST.GRABBING);
    target.grabbedBy = this;
    target.setState(ST.GRABBED, CFG.grabHoldBase);
    target.vx = 0; target.vy = 0;
    Snd.grab();
    FX.burst(target.x, target.y, 10, this.ch.color, 4);
  }
  updateGrabbing(inp) {
    const t = this.grabTarget;
    if (!t || t.state !== ST.GRABBED || !t.alive) { this.releaseGrab(); return; }
    this.vx *= 0.5;
    t.x = this.x + this.facing * (this.w * 0.5 + t.w * 0.4);
    t.y = this.y - 2; t.vx = 0; t.vy = 0;

    if (inp.hit("light")) {
      t.percent += CFG.pummelDamage;
      this.stats.damageDealt += CFG.pummelDamage;
      this.addMeter(CFG.pummelDamage * CFG.meter.onDeal);
      t.hitFlash = 5;
      Snd.hit(4);
      FX.spark(t.x, t.y, "#ffffff");
      this.grabHold -= 4;
    }
    let thrown = null;
    if (inp.hit("right"))     thrown = { x:  0.98, y: -0.22 };
    else if (inp.hit("left")) thrown = { x: -0.98, y: -0.22 };
    else if (inp.hit("up"))   thrown = { x:  0.10, y: -0.99 };
    else if (inp.hit("down")) thrown = { x:  0.34, y:  0.94 };
    if (thrown) { this.doThrow(t, thrown); return; }

    if (--this.grabHold <= 0) this.releaseGrab();
  }
  doThrow(t, dir) {
    const kb = CFG.kbBase + CFG.throwDamage * CFG.kbDamageScale + t.percent * CFG.kbPercentScale * 1.1;
    const weightFix = (CFG.kbWeightRef + 0.55) / (t.ch.weight + 0.55);
    const mag = kb * weightFix * 0.9 + 4;
    t.applyKnockback(dir.x * mag, dir.y * mag, CFG.throwDamage, mag, this);
    this.stats.damageDealt += CFG.throwDamage;
    this.addMeter(CFG.throwDamage * CFG.meter.onDeal);
    Stage.nudge(Math.sign(t.x - Stage.pivot.x || 1) * mag * Stage.cfg.hitNudge * 0.6);
    Stage.lastPusher = this;
    Snd.throw_(); FX.shake(7);
    FX.burst(t.x, t.y, 14, this.ch.color, 6);
    this.releaseGrab();
    this.setState(ST.LANDLAG, 12);
  }
  releaseGrab() {
    const t = this.grabTarget;
    if (t) { t.grabbedBy = null; if (t.state === ST.GRABBED) t.setState(ST.AIR); }
    this.grabTarget = null;
    this.setState(this.grounded ? ST.IDLE : ST.AIR);
  }
  updateGrabbed(inp) {
    let mash = 0;
    for (const b of BUTTONS) if (inp.hit(b)) mash++;
    this.stateTimer -= 1 + mash * 5;
    if (this.stateTimer <= 0) {
      if (this.grabbedBy) this.grabbedBy.releaseGrab();
      this.setState(ST.AIR);
    }
  }

  /* ------------------------------------------------------------ hitstun */
  updateHitstun(inp) {
    this.hitstun--;
    if (inp.ax !== 0) this.vx += inp.ax * CFG.diStrength;
    if (inp.ay !== 0) this.vy += inp.ay * CFG.diStrength * 0.7;
    if (this.hitstun <= 0) {
      this.setState(this.grounded ? ST.IDLE : ST.AIR);
      this.airJumps = Math.max(this.airJumps, CFG.airJumps);
    }
  }

  applyKnockback(vx, vy, dmg, mag, from) {
    /* A live counter window eats the hit outright and answers it. Checked
       before armour and before `pinned` so a counter beats everything except
       being already dead. */
    if (this.counter > 0 && from && from.alive) {
      this.counter = 0;
      this.counterFlash = 24;
      this.invuln = Math.max(this.invuln, 14);
      const ripo = this.ch.riposte || { dmg: 11, base: 5.5, scale: 1.1, angle: 40 };
      const dirX = from.x >= this.x ? 1 : -1;
      const kb = CFG.kbBase + ripo.base + ripo.dmg * CFG.kbDamageScale
               + from.percent * CFG.kbPercentScale * ripo.scale * 1.9;
      const m2 = kb * ((CFG.kbWeightRef + 0.55) / (from.ch.weight + 0.55));
      const rad = ripo.angle * Math.PI / 180;
      from.applyKnockback(Math.cos(rad) * m2 * dirX, -Math.sin(rad) * m2,
                          ripo.dmg, m2, this);
      this.stats.damageDealt += ripo.dmg;
      this.addMeter(ripo.dmg * CFG.meter.onDeal);
      /* The answer lands on the pivot too: the deck lurches toward whoever
         just swung, which is Mira's version of bending the stage. */
      Stage.nudge(Math.sign(from.x - Stage.pivot.x || 1) * 0.020);
      Stage.lastPusher = this;
      FX.banner("RIPOSTE", this.ch.accent);
      FX.hitPause(12); FX.shake(13);
      FX.flash(this.ch.color, 0.2);
      FX.ring(this.x, this.y, 10, 150, this.ch.accent, 4);
      FX.blade(this.x, this.y - 6, dirX > 0 ? 0 : Math.PI, 30, 96, 2.4,
               this.ch.accent, { w: 16, life: 16, spin: dirX * 0.08 });
      Snd.superHit();
      return;
    }
    /* Supers have armour during their active window, but it is no longer
       unconditional: enough damage breaks through and interrupts the super.
       Unbreakable armour meant a super, once started, could never be
       contested — the opponent's only option was to run. */
    if (CFG.meter.superArmor && this.inSuper && this.attack.t > this.attack.data.startup) {
      this.armorDamage = (this.armorDamage || 0) + dmg;
      if (this.armorDamage < CFG.meter.superArmorHp) {
        this.percent = Math.min(999, this.percent + dmg * 0.5);
        this.hitFlash = 4;
        this.addMeter(dmg * CFG.meter.onTake);
        FX.ring(this.x, this.y, 8, this.ch.hurt * 2, "#ffffff", 2);
        return;
      }
      // armour broken: the super is cancelled and the hit lands in full
      this.attack = null;
      this.pinned = false;
      this.armorDamage = 0;
      FX.banner("ARMOUR BREAK", "#ffffff");
      FX.burst(this.x, this.y, 22, "#ffffff", 8);
      FX.shake(14);
      Snd.shieldBreak();
    }
    if (this.pinned) { this.percent += dmg * 0.4; this.hitFlash = 4; return; }

    this.percent = Math.min(999, this.percent + dmg);
    this.addMeter(dmg * CFG.meter.onTake);
    this.vx = vx; this.vy = vy;
    this.grounded = false; this.groundSeg = null;
    this.hitstun = Math.min(CFG.hitstunMax, Math.round(mag * CFG.hitstunPerKb) + 4);
    this.setState(ST.HITSTUN);
    this.hitFlash = 8;
    this.airJumps = CFG.airJumps;
    if (from) this.lastHitBy = from;
    if (this.grabbedBy) this.grabbedBy.releaseGrab();
  }

  /* ---------------------------------------------------------- integrate */
  integrate() {
    const ch = this.ch;
    if (this.dropThrough > 0) this.dropThrough--;
    const noGrav = this.state === ST.AIRDODGE || this.state === ST.RESPAWN || this.pinned;

    if (!this.grounded && !noGrav) {
      let g = CFG.gravity * ch.fallMul;
      if (this.fastFalling) g *= CFG.fastFallMul;
      this.vy = Math.min(this.vy + g, CFG.maxFall * (this.fastFalling ? CFG.fastFallMul : 1) * ch.fallMul);
      this.vx *= CFG.airDrag;
    }

    const prevFeet = this.feetY;
    this.x += this.vx;
    this.y += this.vy;

    /* Ground collision against the rotated segments. A fighter already riding a
       segment gets a wider capture band so a fast-tilting stage carries them
       along instead of dropping them through. */
    const wasSeg = this.groundSeg;
    this.grounded = false; this.groundSeg = null;
    let best = null, bestY = Infinity;
    for (const seg of Stage.segs) {
      if (!seg.solid && this.dropThrough > 0) continue;
      const sy = Stage.surfaceY(seg, this.x);
      if (sy === null) continue;
      const half = seg.thick * 0.5;
      const feet = this.feetY;
      const riding = seg === wasSeg;
      const up = riding ? 16 : 2;
      const tol = Math.max(10, Math.abs(this.vy) + 8) + (riding ? 10 : 0);
      const wasAbove = riding || prevFeet <= sy + half + 1;
      if (this.vy >= -0.5 && feet >= sy - up && feet <= sy + half + tol && wasAbove) {
        if (sy < bestY) { bestY = sy; best = seg; }
      }
    }

    if (best) {
      this.y = bestY - this.h * 0.5;
      this.vy = 0;
      this.grounded = true; this.groundSeg = best;
      this.airJumps = CFG.airJumps;
      this.fastFalling = false;

      if (this.state === ST.HITSTUN && this.hitstun > 0) {
        this.vy = -Math.abs(this.vy) * 0.2; this.vx *= 0.7;
      } else if (this.state === ST.AIR || this.state === ST.AIRDODGE) {
        this.setState(ST.LANDLAG, CFG.landLag);
        Snd.land();
        FX.burst(this.x, this.feetY, 5, "#b9b6d8", 2.4);
      }

      /* Slope: slide downhill and lose traction as it steepens. A fighter
         with slopeGrip keeps its footing instead — that is the whole identity
         of a character built to ignore the stage's tilt. */
      const sA = Math.sin(best.angle);
      this.vx += sA * CFG.slideStrength * (1 - (this.ch.slopeGrip || 0));
      const loss = Math.abs(sA) * CFG.slopeFrictionLoss;
      if ([ST.IDLE, ST.LANDLAG, ST.SHIELD, ST.SHIELDBREAK].includes(this.state))
        this.vx *= (CFG.groundFriction + loss * (1 - CFG.groundFriction));
      this.vx = clamp(this.vx, -ch.speed * 2.4, ch.speed * 2.4);
    }

    if (Math.abs(this.vx) < 0.02) this.vx = 0;
  }

  /* --------------------------------------------------------- blast zones */
  checkBlastZones(match) {
    const b = Stage.blast;
    if (this.x < b.left || this.x > b.right || this.y < b.top || this.y > b.bottom) this.ko(match);
  }

  ko(match) {
    this.stocks--;
    this.stats.falls++;
    const killer = this.lastHitBy;
    if (killer && killer !== this && killer.alive) { killer.stats.kos++; killer.addMeter(14); }
    Snd.ko();
    FX.shake(20); FX.hitPause(10); FX.flash(this.ch.color, 0.22);
    const ex = clamp(this.x, 40, CFG.world.w - 40), ey = clamp(this.y, 40, CFG.world.h - 40);
    FX.burst(ex, ey, 34, this.ch.color, 11);
    FX.ring(ex, ey, 16, 280, this.ch.color, 4);
    FX.punch(0.9);
    FX.banner(this.stocks > 0 ? "KO!" : `${this.ch.name} OUT!`, this.tint);
    this.setState(ST.DEAD);
    this.respawnTimer = CFG.respawnFrames;
    this.percent = 0; this.vx = 0; this.vy = 0;
    this.lastHitBy = null; this.pinned = false; this.attack = null;
    this.moveLog = []; this.armorDamage = 0;
    if (this.grabTarget) this.releaseGrab();
    if (this.grabbedBy) this.grabbedBy.releaseGrab();
    match.onKO(this);
  }

  respawn() {
    this.x = Stage.pivot.x + (this.slot - 1.5) * 90;
    this.y = Stage.pivot.y - 420;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0; this.percent = 0;
    this.shield = CFG.shieldMax;
    this.airJumps = CFG.airJumps;
    this.setState(ST.RESPAWN, CFG.respawnInvuln);
    this.invuln = CFG.respawnInvuln;
    this.alive = true; this.trail.length = 0;
  }
  updateRespawn(inp) {
    this.vy = 0; this.vx *= 0.9;
    if (inp.ax !== 0) { this.x += inp.ax * 3; this.facing = inp.ax; }
    if (--this.stateTimer <= 0 || inp.hit("down") || inp.hit("light")) {
      this.invuln = 40; this.setState(ST.AIR);
    }
  }

  intangible() {
    if (this.invuln > 0) return true;
    if (this.state === ST.AIRDODGE || this.state === ST.ROLL || this.state === ST.SPOTDODGE) {
      const total = this.state === ST.ROLL ? CFG.rollFrames
                  : this.state === ST.SPOTDODGE ? CFG.spotDodgeFrames : CFG.airDodgeFrames;
      const used = total - this.stateTimer;
      return used >= CFG.dodgeInvuln[0] && used <= CFG.dodgeInvuln[1];
    }
    return false;
  }
  shielding() { return this.state === ST.SHIELD; }
}


/* ===== src/08_combat.js ===== */
/* ==========================================================================
   9. COMBAT — hitbox resolution, super entities, and the CPU
   ========================================================================== */

/* ---------------------------------------------------------------- entities
   Orbs, shockwaves and gravity wells all live here so supers can put things
   into the world that outlive the move that spawned them. */
const Entities = {
  list: [],
  reset() { this.list.length = 0; },

  orb(owner, x, y, vx, vy, move) {
    this.list.push({ kind: "orb", owner, x, y, vx, vy, move, life: 90, r: 16, hitIds: [] });
  },
  shockwave(owner, x, y, dir, move) {
    this.list.push({ kind: "wave", owner, x, y, dir, move, life: 70, r: 46, hitIds: [] });
  },
  well(owner, x, y, move) {
    this.list.push({ kind: "well", owner, x, y, move, life: 62, r: 38, pull: 180, hitIds: [] });
  },
  /** Ballast's cube: falls, lands on the deck, then sits there as real weight
      on the pivot until it expires. The only way in the game to tilt a stage
      from somewhere you are not standing. */
  ballast(owner, x, y, vx, w, life, move) {
    this.list.push({ kind: "ballast", owner, x, y, vx, vy: -2, w, move,
                     life, r: 22, landed: false, hitIds: [] });
  },
  /** Kite's updraft: a rising column that carries anyone inside it upward. */
  updraft(owner, x, y, life) {
    this.list.push({ kind: "draft", owner, x, y, life, r: 62, hitIds: [] });
  },

  update(fighters) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      e.life--;
      let gone = e.life <= 0;

      if (e.kind === "orb") {
        e.x += e.vx; e.y += e.vy; e.vy += 0.04;
        if (e.life % 3 === 0) FX.spark(e.x, e.y, e.owner.ch.color);
        if (e.x < -300 || e.x > CFG.world.w + 300 || e.y > CFG.world.h + 300) gone = true;
        if (!gone) gone = this._touch(e, fighters, true);

      } else if (e.kind === "ballast") {
        if (!e.landed) {
          e.x += e.vx; e.y += e.vy; e.vy += 0.72; e.vx *= 0.995;
          for (const seg of Stage.segs) {
            const sy = Stage.surfaceY(seg, e.x);
            if (sy != null && e.y + e.r >= sy && e.y + e.r <= sy + 46 && e.vy > 0) {
              e.y = sy - e.r; e.vy = 0; e.vx = 0; e.landed = true;
              FX.burst(e.x, e.y + e.r, 16, e.owner.ch.color, 6);
              FX.dustLine(e.x, e.y + e.r, 90, e.owner.ch.color2);
              FX.crack(e.x, e.y + e.r - 2, 1, 22, e.owner.ch.color, 2);
              FX.shake(8); Snd.bigHit();
              break;
            }
          }
          if (e.y > CFG.world.h + 400) gone = true;
          if (!gone && !e.landed) gone = this._touch(e, fighters, false);
        } else {
          /* Resting: ride the deck as it tilts, and press on the pivot. */
          let sy = null, slope = 0;
          for (const seg of Stage.segs) {
            const y2 = Stage.surfaceY(seg, e.x);
            if (y2 != null && (sy === null || y2 < sy)) { sy = y2; slope = seg.angle; }
          }
          if (sy === null) { e.landed = false; e.vy = 0; }   // the deck moved away
          else {
            e.y = sy - e.r;
            Stage.addWeight(e.x, e.y, e.w);
            e.x += Math.sin(slope) * 1.6;                    // slides downhill
          }
        }

      } else if (e.kind === "draft") {
        e.y -= 1.2;
        if (e.life % 2 === 0)
          FX.spark(e.x + rnd(-e.r, e.r), e.y + rnd(-40, 60), e.owner.ch.accent);
        for (const f of fighters) {
          if (!f.alive || f.state === ST.DEAD) continue;
          if (Math.abs(f.x - e.x) > e.r + f.ch.hurt) continue;
          if (Math.abs(f.y - e.y) > 150) continue;
          // her own lift is stronger: this is Kite's recovery tool
          const lift = f === e.owner ? -1.15 : -0.6;
          f.vy = Math.max(f.vy + lift, -13);
          f.grounded = false; f.groundSeg = null;
        }

      } else if (e.kind === "wave") {
        // rides the deck, following the tilted surface
        e.x += e.dir * 13;
        let best = null;
        for (const seg of Stage.segs) {
          if (!seg.main) continue;
          const sy = Stage.surfaceY(seg, e.x);
          if (sy !== null) best = sy;
        }
        if (best !== null) e.y = best - 10; else gone = true;
        e.r = 46 * (0.5 + e.life / 70);
        if (e.life % 2 === 0) {
          FX.spark(e.x + rnd(-14, 14), e.y + rnd(-10, 6), e.owner.ch.color);
          FX.spark(e.x, e.y - rnd(0, 30), "#ffffff");
        }
        if (!gone) this._touch(e, fighters, false);

      } else if (e.kind === "well") {
        const t = 1 - e.life / 62;
        e.r = 38 + Math.sin(t * Math.PI) * 54;
        // drag everyone toward the singularity
        for (const f of fighters) {
          if (f === e.owner || !f.alive || f.state === ST.DEAD) continue;
          const d = dist(e.x, e.y, f.x, f.y);
          if (d < e.pull && d > 1) {
            const k = (1 - d / e.pull) * 0.9;
            f.vx += (e.x - f.x) / d * k;
            f.vy += (e.y - f.y) / d * k;
            if (f.grounded && Math.abs(e.y - f.y) > 30) { f.grounded = false; f.groundSeg = null; }
          }
        }
        for (let k = 0; k < 2; k++) {
          const a = Math.random() * 7, rr = e.pull * (0.4 + Math.random() * 0.6);
          FX.parts.push({ x: e.x + Math.cos(a) * rr, y: e.y + Math.sin(a) * rr,
            vx: -Math.cos(a) * 3.4, vy: -Math.sin(a) * 3.4,
            life: 18, max: 18, size: 2.2, color: e.owner.ch.color, grav: 0, drag: 1 });
        }
        if (e.life === 1) {                       // collapse
          Snd.superHit(); FX.shake(28); FX.hitPause(12);
          FX.flash("#ffffff", 0.4);
          FX.ring(e.x, e.y, 10, 420, "#ffffff", 6);
          FX.ring(e.x, e.y, 10, 300, e.owner.ch.color, 4);
          FX.burst(e.x, e.y, 50, e.owner.ch.color, 14);
          for (const f of fighters) {
            if (f === e.owner || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
            if (dist(e.x, e.y, f.x, f.y) < 190) Combat.land(e.owner, f, e.move, e.x, e.y);
          }
        }
      }

      if (gone) {
        if (e.kind === "orb") FX.burst(e.x, e.y, 8, e.owner.ch.color, 4);
        this.list.splice(i, 1);
      }
    }
  },

  /** Returns true if the entity should be consumed by the hit. */
  _touch(e, fighters, consume) {
    for (const f of fighters) {
      if (f === e.owner || !f.alive || f.state === ST.DEAD) continue;
      if (f.intangible() || e.hitIds.includes(f.slot)) continue;
      if (dist(e.x, e.y, f.x, f.y) < e.r + f.ch.hurt) {
        e.hitIds.push(f.slot);
        Combat.land(e.owner, f, e.move, e.x, e.y);
        if (consume) return true;
      }
    }
    return false;
  },

  draw(g) {
    for (const e of this.list) {
      const c = e.owner.ch.color;
      g.save();
      g.globalCompositeOperation = "lighter";

      if (e.kind === "orb") {
        g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 24;
        g.beginPath(); g.arc(e.x, e.y, e.r, 0, 7); g.fill();
        g.fillStyle = "#fff"; g.shadowBlur = 8;
        g.beginPath(); g.arc(e.x, e.y, e.r * 0.45, 0, 7); g.fill();

      } else if (e.kind === "ballast") {
        /* A solid object, not an energy effect — so it draws normally with an
           ink outline like the fighters, not additively like a projectile. */
        g.globalCompositeOperation = "source-over";
        const blink = e.life < 40 && Math.floor(e.life / 4) % 2 === 0;
        g.globalAlpha = blink ? 0.45 : 1;
        g.save();
        g.translate(e.x, e.y);
        if (!e.landed) g.rotate(e.life * 0.09);
        plate(g, [-e.r, -e.r, e.r, -e.r, e.r, e.r, -e.r, e.r], e.owner.ch.color,
              { up: 0.3, down: 0.4, under: true });
        g.fillStyle = hexA("#000000", 0.35);
        g.fillRect(-e.r + 5, -3, e.r * 2 - 10, 6);
        g.fillStyle = hexA(e.owner.ch.accent, 0.8);
        g.fillRect(-e.r + 5, -3, e.r * 2 - 10, 2);
        rivets(g, -e.r + 7, -e.r + 7, 3, (e.r * 2 - 14) / 2, e.owner.ch.accent);
        g.restore();
        // a weight gauge under a resting cube, so its pull on the pivot is legible
        if (e.landed) {
          g.globalCompositeOperation = "lighter";
          g.strokeStyle = hexA(c, 0.5); g.lineWidth = 2;
          g.beginPath(); g.moveTo(e.x - e.r, e.y + e.r + 5);
          g.lineTo(e.x - e.r + (e.r * 2) * clamp(e.life / 480, 0, 1), e.y + e.r + 5);
          g.stroke();
        }

      } else if (e.kind === "draft") {
        const a = clamp(e.life / 110, 0, 1);
        const q = g.createLinearGradient(0, e.y + 90, 0, e.y - 120);
        q.addColorStop(0, hexA(e.owner.ch.accent, 0));
        q.addColorStop(0.4, hexA(c, 0.26 * a));
        q.addColorStop(1, hexA(e.owner.ch.accent, 0));
        g.fillStyle = q;
        g.fillRect(e.x - e.r, e.y - 120, e.r * 2, 210);
        g.strokeStyle = hexA(e.owner.ch.accent, 0.4 * a); g.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const ox = -e.r + 10 + i * ((e.r * 2 - 20) / 3);
          const wob = Math.sin(e.life * 0.18 + i) * 7;
          g.beginPath();
          g.moveTo(e.x + ox + wob, e.y + 80);
          g.quadraticCurveTo(e.x + ox - wob, e.y - 10, e.x + ox + wob, e.y - 110);
          g.stroke();
        }

      } else if (e.kind === "wave") {
        const a = clamp(e.life / 70, 0, 1);
        g.globalAlpha = a;
        g.strokeStyle = c; g.lineWidth = 5; g.shadowColor = c; g.shadowBlur = 22;
        g.beginPath();
        g.moveTo(e.x - e.dir * 26, e.y + 12);
        g.quadraticCurveTo(e.x, e.y - 52 * a, e.x + e.dir * 26, e.y + 12);
        g.stroke();
        g.strokeStyle = "#fff"; g.lineWidth = 2;
        g.beginPath();
        g.moveTo(e.x - e.dir * 16, e.y + 10);
        g.quadraticCurveTo(e.x, e.y - 34 * a, e.x + e.dir * 16, e.y + 10);
        g.stroke();

      } else if (e.kind === "well") {
        const t = 1 - e.life / 62;
        const rg = g.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.r * 1.7);
        rg.addColorStop(0, "rgba(0,0,0,1)");
        rg.addColorStop(0.45, hexA(c, 0.5));
        rg.addColorStop(1, "rgba(0,0,0,0)");
        g.globalCompositeOperation = "source-over";
        g.fillStyle = rg;
        g.beginPath(); g.arc(e.x, e.y, e.r * 1.7, 0, 7); g.fill();
        g.globalCompositeOperation = "lighter";
        g.strokeStyle = c; g.lineWidth = 3; g.shadowColor = c; g.shadowBlur = 20;
        for (let i = 0; i < 3; i++) {
          const rr = e.r * (0.6 + i * 0.28);
          g.globalAlpha = 0.7 - i * 0.18;
          g.beginPath();
          g.ellipse(e.x, e.y, rr, rr * 0.42, t * 5 + i, 0, 7);
          g.stroke();
        }
      }
      g.restore();
    }
  },
};

/* ---------------------------------------------------------------- combat */
const Combat = {
  nearestFoe(f) {
    let best = null, bd = Infinity;
    for (const o of Match.current.fighters) {
      if (o === f || !o.alive || o.state === ST.DEAD) continue;
      const d = dist(f.x, f.y, o.x, o.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },

  resolve(fighters) {
    for (const atk of fighters) {
      if (!atk.alive || atk.state === ST.DEAD) continue;
      if (!atk.attack || !atk.hitboxActive()) continue;
      const a = atk.attack;
      const hb = atk.hitboxWorld();

      for (const def of fighters) {
        if (def === atk || !def.alive || def.state === ST.DEAD) continue;
        if (def.state === ST.GRABBED && def.grabbedBy === atk) continue;
        if (a.hitIds && a.hitIds.includes(def.slot)) continue;
        if (dist(hb.x, hb.y, def.x, def.y) > hb.r + def.ch.hurt) continue;

        if (a.kind === "grab") {
          if (def.intangible() || def.state === ST.HITSTUN) continue;
          atk.lockGrab(def);
          return;
        }
        if (def.intangible()) { FX.spark(def.x, def.y, "#ffffff"); continue; }

        a.hitIds = a.hitIds || [];
        a.hitIds.push(def.slot);
        this.land(atk, def, a.data, hb.x, hb.y, hb.r);
      }
    }
  },

  land(atk, def, move, hx, hy, hbR) {
    const dirX = def.x >= atk.x ? 1 : -1;
    const isSuper = move === (atk.ch.super) || (atk.attack && atk.attack.kind === "super" && atk.attack.data === move);
    const K = CFG.skill;

    /* ---- skill modifiers, applied before anything reads move.dmg ----
       Spacing: connecting with the outer edge of the hitbox pays a bonus, so
       there is a reason to measure a strike instead of walking into the
       opponent. Staleness: repeating the same move weakens it, so the strong
       button is not simply the best button. Neither applies to throws. */
    let tip = false, staleMul = 1;
    if (hbR) {
      const d = dist(hx, hy, def.x, def.y);
      tip = d > hbR * K.tipZone;
    }
    staleMul = atk.staleMul(move);
    const dmg = move.dmg * staleMul * (tip ? K.tipBonus : 1);

    // ---------------- shield ----------------
    if (def.shielding() && !isSuper) {
      const facingHit = (def.facing === -dirX) || Math.abs(def.x - atk.x) < 8;
      if (facingHit) {
        def.shield -= dmg * CFG.shieldDamageMul + 4;
        def.vx += dirX * dmg * 0.12;
        Snd.shield();
        FX.ring(def.x, def.y, 10, def.ch.hurt * 2.2, "#7fd9ff", 2);
        FX.hitPause(3); FX.shake(3);
        if (def.shield <= 0) def.breakShield();
        return;
      }
    }

    // ---------------- knockback ----------------
    const base = move.base || 2, scale = move.scale || 0.5;
    const kb = CFG.kbBase + base + dmg * CFG.kbDamageScale
