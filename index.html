    g.beginPath(); g.moveTo(24, 0); g.lineTo(24, H); g.moveTo(W - 24, 0); g.lineTo(W - 24, H); g.stroke();
    g.restore();

    // scanlines
    g.save(); g.globalAlpha = 0.16; g.fillStyle = "#000";
    for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
    g.restore();
    g.save();
    g.globalAlpha = 0.05 + Math.abs(Math.sin(t * 0.7)) * 0.05;
    g.fillStyle = "#39ff9e"; g.fillRect(0, (t * 180) % H, W, 60);
    g.restore();
  },
},
];

const STAGE_BY_ID = {};
STAGES.forEach(s => { STAGE_BY_ID[s.id] = s; });

/* ========================================================================== */
/* Stage runtime                                                              */
/* ========================================================================== */
const Stage = {
  def: STAGES[0],
  pivot: { x: 800, y: 580 },
  tilt: 0, prevTilt: 0, angVel: 0,
  anchorTimer: 0, snapFlash: 0, snapCount: 0, snapCooldown: 0,
  lastPusher: null,
  segs: [],
  forcing: 0,

  get cfg() { return this.def.tilt; },
  get anchorFrames() { return this.def.tilt.anchorFrames; },
  get blast() { return this.def.blast; },
  get pal() { return this.def.pal; },

  select(def) {
    this.def = def;
    this.pivot = { x: def.pivot.x, y: def.pivot.y };
    this.reset();
  },
  reset() {
    this.tilt = 0; this.prevTilt = 0; this.angVel = 0;
    this.anchorTimer = 0; this.snapFlash = 0; this.snapCount = 0; this.snapCooldown = 0;
    this.lastPusher = null; this.forcing = 0;
    this.rebuild();
  },

  toWorld(lx, ly) {
    const c = Math.cos(this.tilt), s = Math.sin(this.tilt);
    return { x: this.pivot.x + lx * c - ly * s, y: this.pivot.y + lx * s + ly * c };
  },

  rebuild() {
    this.segs = this.def.layout.map(p => {
      const a = this.toWorld(p.x1, p.y1), b = this.toWorld(p.x2, p.y2);
      return {
        ax: a.x, ay: a.y, bx: b.x, by: b.y,
        solid: !!p.solid, main: !!p.main, thick: p.thick,
        angle: Math.atan2(b.y - a.y, b.x - a.x), local: p,
      };
    });
  },

  surfaceY(seg, x) {
    const lo = Math.min(seg.ax, seg.bx), hi = Math.max(seg.ax, seg.bx);
    if (x < lo - 2 || x > hi + 2) return null;
    const t = (x - seg.ax) / (seg.bx - seg.ax || 1e-6);
    return seg.ay + t * (seg.by - seg.ay);
  },

  nudge(amount) {
    if (this.anchorTimer > 0) return;
    this.angVel = clamp(this.angVel + amount, -this.cfg.maxAngVel, this.cfg.maxAngVel);
  },
  anchor() { this.anchorTimer = this.cfg.anchorFrames; this.angVel = 0; },
  flip() {
    if (this.anchorTimer > 0) return;
    this.tilt = -this.tilt; this.angVel = -this.angVel;
  },
  /** Pivot's super: drive the tilt one way regardless of who is standing where. */
  forceTilt(dir, power) {
    this.anchorTimer = 0;
    this.forcing = dir;
    this.angVel = clamp(this.angVel + dir * power, -this.cfg.maxAngVel * 1.5, this.cfg.maxAngVel * 1.5);
  },
  balance() { return clamp(this.tilt / this.cfg.limit, -1, 1); },

  update(fighters) {
    this.prevTilt = this.tilt;
    const C = this.cfg;

    if (this.anchorTimer > 0) {
      this.anchorTimer--;
      this.tilt += (0 - this.tilt) * 0.22;
      this.angVel = 0;
      this.rebuild();
      if (this.snapFlash > 0) this.snapFlash--;
      return;
    }

    let torque = 0;
    for (const f of fighters) {
      if (!f.alive || !f.grounded || !f.groundSeg || !f.groundSeg.main) continue;
      const arm = (f.x - this.pivot.x) * Math.cos(this.tilt) + (f.y - this.pivot.y) * Math.sin(this.tilt);
      torque += f.ch.weight * arm;
      if (f.heavyStomp > 0) torque += f.ch.weight * arm * C.stompTorque;
    }
    for (const f of fighters) if (f.alive && f.crankDir !== 0) torque += f.crankDir * C.crankTorque;
    if (this.forcing) { torque += this.forcing * C.crankTorque * 2.4; this.forcing = 0; }

    let acc = torque * C.torque - this.tilt * C.spring;
    this.angVel = clamp((this.angVel + acc) * C.damp, -C.maxAngVel, C.maxAngVel);
    this.tilt += this.angVel;

    if (this.snapCooldown > 0) this.snapCooldown--;
    if (Math.abs(this.tilt) > C.limit) {
      if (this.snapCooldown > 0) {
        // Still recovering from the last one: the deck just jams at its stop.
        this.tilt = Math.sign(this.tilt) * C.limit;
        this.angVel *= 0.5;
      } else this.snapBack(fighters);
    }
    if (this.snapFlash > 0) this.snapFlash--;
    this.rebuild();
  },

  snapBack(fighters) {
    const C = this.cfg;
    const sign = Math.sign(this.tilt);
    /* The rebound has to BLEED energy. At full strength it carried the deck
       clean across to the opposite limit, which snapped again, forever. It now
       keeps less than half its swing and can't re-trigger for a moment. */
    this.tilt = sign * C.limit * 0.9;
    this.angVel = -sign * C.snapVel * 0.45;
    this.snapCooldown = 48;
    this.snapFlash = 26;
    this.snapCount++;
    Snd.snapback();
    FX.shake(26); FX.hitPause(8);
    FX.flash("#ffffff", 0.25);

    for (const f of fighters) {
      if (!f.alive || !f.grounded || !f.groundSeg || f.pinned) continue;
      const lean = clamp((f.x - this.pivot.x) / 310, -1, 1);
      f.applyKnockback(lean * 7.5 - sign * 3.0,
        -C.snapLaunch * (1.15 - Math.abs(lean) * 0.3), C.snapDamage, 26, null);
      FX.burst(f.x, f.y + f.ch.size.h * 0.5, 16, "#ffffff", 7);
    }
    const culprit = this.lastPusher;
    if (culprit && culprit.alive) { culprit.stats.snapbacks++; culprit.addMeter(CFG.meter.onSnapback); }
    FX.banner("SNAP-BACK!", "#ffffff");
    FX.ring(this.pivot.x, this.pivot.y, 60, 560, "#ffffff", 5);
  },
};


/* ===== src/06_fx.js ===== */
/* ==========================================================================
   7. FX — particles, impact feedback, and the camera

   The camera is the part that was wrong in v1: it chased the exact midpoint of
   every fighter on every frame, so it drifted left and right constantly even
   when nothing was happening. This one holds completely still until the action
   leaves a dead zone, eases rather than snaps, and quantises its zoom so it
   never breathes in and out. Screen shake is short, capped, and switchable off.
   ========================================================================== */

const FX = {
  parts: [], rings: [], marks: [], streaks: [], texts: [],
  shakeMag: 0, shakeX: 0, shakeY: 0,
  pause: 0,
  flashCol: null, flashAmt: 0,
  bannerText: "", bannerTimer: 0, bannerColor: "#fff",

  cam: {
    x: 800, y: 440, zoom: 0.9,
    px: 800, py: 440, pz: 0.9,   // previous step, for render interpolation
    tz: 0.9,
  },

  reset() {
    this.parts.length = 0; this.rings.length = 0; this.marks.length = 0;
    this.streaks.length = 0; this.texts.length = 0;
    this.shakeMag = 0; this.pause = 0; this.bannerTimer = 0;
    this.flashAmt = 0;
    const c = this.cam;
    c.x = c.px = Stage.pivot.x;
    c.y = c.py = Stage.pivot.y - 150;
    c.zoom = c.pz = c.tz = 0.88;
  },

  /* ----------------------------------------------------------- feedback */
  shake(m) {
    const amt = Settings.get("shakeAmount");
    if (amt <= 0) return;
    this.shakeMag = Math.min(CFG.cam.maxShake, this.shakeMag + m * amt);
  },
  hitPause(f) { this.pause = Math.max(this.pause, f); },
  flash(col, amt) { this.flashCol = col; this.flashAmt = Math.max(this.flashAmt, amt); },
  banner(text, color) {
    if (!text) return;
    this.bannerText = text; this.bannerTimer = 72; this.bannerColor = color || "#fff";
  },

  get density() { return Settings.get("particles"); },

  burst(x, y, n, color, speed) {
    n = Math.min(40, Math.round(n * this.density));
    for (let i = 0; i < n; i++) {
      if (this.parts.length > CFG.maxParticles) break;
      const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random());
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        life: 16 + Math.random() * 22, max: 38, size: 1.6 + Math.random() * 3.4,
        color, grav: 0.22, drag: 0.985 });
    }
  },
  spark(x, y, color) {
    if (this.parts.length > CFG.maxParticles || this.density <= 0) return;
    this.parts.push({ x, y, vx: rnd(-1.2, 1.2), vy: rnd(-1.2, 1.2),
      life: 10 + Math.random() * 12, max: 22, size: 1.2 + Math.random() * 2,
      color, grav: 0.02, drag: 0.96 });
  },
  /** A fan of dust along the ground — used by heavy ground impacts. */
  dustLine(x, y, width, color) {
    const n = Math.round(14 * this.density);
    for (let i = 0; i < n; i++) {
      const s = (Math.random() * 2 - 1);
      this.parts.push({ x: x + s * width * 0.5, y: y - 2,
        vx: s * rnd(2, 7), vy: rnd(-4.5, -1),
        life: 18 + Math.random() * 18, max: 36, size: 2 + Math.random() * 3.6,
        color, grav: 0.16, drag: 0.97 });
    }
  },
  ring(x, y, r0, r1, color, lw) {
    this.rings.push({ x, y, r: r0, r1, cur: r0, life: 24, max: 24, color, lw: lw || 3 });
  },
  streak(x1, y1, x2, y2, color) {
    this.streaks.push({ x1, y1, x2, y2, color, life: 10, max: 10 });
  },
  hitmark(x, y, dmg) { this.marks.push({ x, y, life: 11, max: 11, size: 14 + dmg * 2.6 }); },
  /** Floating damage number at the point of impact. */
  damageText(x, y, dmg, color) {
    this.texts.push({ x, y, vy: -1.2, life: 42, max: 42,
      text: Math.round(dmg).toString(), color });
  },

  /* ------------------------------------------------------------- update */
  update(fighters) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= p.drag;
      if (--p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.cur = r.r + (r.r1 - r.r) * easeOut(1 - r.life / r.max);
      if (--r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.marks.length - 1; i >= 0; i--) if (--this.marks[i].life <= 0) this.marks.splice(i, 1);
    for (let i = this.streaks.length - 1; i >= 0; i--) if (--this.streaks[i].life <= 0) this.streaks.splice(i, 1);
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.y += t.vy; t.vy *= 0.94;
      if (--t.life <= 0) this.texts.splice(i, 1);
    }

    this.shakeMag *= CFG.cam.shakeDecay;
    if (this.shakeMag < 0.2) this.shakeMag = 0;
    this.shakeX = (Math.random() - 0.5) * this.shakeMag * 2;
    this.shakeY = (Math.random() - 0.5) * this.shakeMag * 2;

    this.flashAmt *= 0.84;
    if (this.flashAmt < 0.01) this.flashAmt = 0;
    if (this.bannerTimer > 0) this.bannerTimer--;

    this.updateCamera(fighters);
  },

  /* ------------------------------------------------------------- camera */
  updateCamera(fighters) {
    const c = this.cam, K = CFG.cam;
    c.px = c.x; c.py = c.y; c.pz = c.zoom;

    const live = fighters.filter(f => f.alive && f.state !== ST.DEAD);
    const home = { x: Stage.pivot.x, y: Stage.pivot.y - 150 };

    if (!live.length || Settings.get("cameraSway") <= 0) {
      // Pinned mode: sit over the stage and only change zoom.
      c.x += (home.x - c.x) * 0.08;
      c.y += (home.y - c.y) * 0.08;
      c.zoom += (0.86 - c.zoom) * K.zoomLerp;
      return;
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const f of live) {
      minX = Math.min(minX, f.x); maxX = Math.max(maxX, f.x);
      minY = Math.min(minY, f.y); maxY = Math.max(maxY, f.y);
    }
    // Always keep the stage itself in frame so the camera has an anchor.
    minX = Math.min(minX, home.x - 170); maxX = Math.max(maxX, home.x + 170);
    minY = Math.min(minY, home.y - 90);  maxY = Math.max(maxY, home.y + 110);

    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

    /* Dead zone: do nothing at all while the action's centre stays inside the
       box. Only the amount that pokes out of the box moves the camera, which
       is what stops the constant left-right drift. */
    const sway = Settings.get("cameraSway");
    const dx = cx - c.x, dy = cy - c.y;
    const dzX = K.deadX / sway, dzY = K.deadY / sway;
    let tx = c.x, ty = c.y;
    if (dx > dzX) tx = cx - dzX; else if (dx < -dzX) tx = cx + dzX;
    if (dy > dzY) ty = cy - dzY; else if (dy < -dzY) ty = cy + dzY;

    c.x += (tx - c.x) * K.follow;
    c.y += (ty - c.y) * K.follow;

    /* Zoom is quantised to discrete steps with hysteresis, so it settles on a
       value and stays there instead of micro-adjusting every frame. */
    const bw = (maxX - minX) + K.pad * 2, bh = (maxY - minY) + K.pad * 1.5;
    const want = clamp(Math.min(W / bw, H / bh), K.minZoom, K.maxZoom);
    const stepped = Math.round(want / K.zoomStep) * K.zoomStep;
    if (Math.abs(stepped - c.tz) > K.zoomStep * 0.75) c.tz = stepped;
    c.zoom += (c.tz - c.zoom) * K.zoomLerp;
  },

  /** Camera transform, interpolated between fixed steps for smooth motion. */
  applyCamera(g, alpha) {
    const c = this.cam;
    const x = lerp(c.px, c.x, alpha);
    const y = lerp(c.py, c.y, alpha);
    const z = lerp(c.pz, c.zoom, alpha);
    g.translate(W / 2 + this.shakeX, H / 2 + this.shakeY);
    g.scale(z, z);
    g.translate(-x, -y);
    return { x, y, z };
  },

  /* ------------------------------------------------------------ drawing */
  drawWorld(g) {
    g.save();
    g.globalCompositeOperation = "lighter";

    for (const s of this.streaks) {
      const a = s.life / s.max;
      g.globalAlpha = a * 0.8; g.strokeStyle = s.color;
      g.lineWidth = 1 + a * 5; g.lineCap = "round";
      g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
    }
    for (const r of this.rings) {
      const a = r.life / r.max;
      g.globalAlpha = a * 0.85; g.strokeStyle = r.color;
      g.lineWidth = r.lw * (0.4 + a);
      g.beginPath(); g.arc(r.x, r.y, r.cur, 0, 7); g.stroke();
    }
    for (const p of this.parts) {
      const a = p.life / p.max;
      g.globalAlpha = Math.min(1, a * 1.4); g.fillStyle = p.color;
      g.beginPath(); g.arc(p.x, p.y, p.size * (0.4 + a * 0.8), 0, 7); g.fill();
    }
    for (const m of this.marks) {
      const a = m.life / m.max;
      g.globalAlpha = a; g.fillStyle = "#ffffff";
      const s = m.size * (1.4 - a * 0.5);
      g.save(); g.translate(m.x, m.y); g.rotate(a * 2);
      g.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const rr = i % 2 ? s * 0.34 : s;
        g.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      g.closePath(); g.fill(); g.restore();
    }
    g.restore();

    // damage numbers draw normally so they stay readable
    g.save();
    g.textAlign = "center";
    for (const t of this.texts) {
      const a = Math.min(1, t.life / t.max * 1.8);
      g.globalAlpha = a;
      g.font = `900 ${20 + (1 - t.life / t.max) * 6}px ${FONT_DISPLAY}`;
      outlineText(g, t.text, t.x, t.y, t.color, 5);
    }
    g.restore();
  },

  drawOverlay(g) {
    if (this.flashAmt > 0.01) {
      g.save();
      g.globalAlpha = Math.min(0.75, this.flashAmt);
      g.fillStyle = this.flashCol || "#fff";
      g.fillRect(0, 0, W, H);
      g.restore();
    }
  },
};


/* ===== src/07_fighter.js ===== */
/* ==========================================================================
   8. FIGHTER — state machine, movement, attacks, meter
   ========================================================================== */

const ST = {
  IDLE: "idle", RUN: "run", JUMPSQUAT: "jumpsquat", AIR: "air", LANDLAG: "landlag",
  ATTACK: "attack", SHIELD: "shield", ROLL: "roll", SPOTDODGE: "spotdodge",
  AIRDODGE: "airdodge", HITSTUN: "hitstun", GRABBING: "grabbing", GRABBED: "grabbed",
  SHIELDBREAK: "shieldbreak", DEAD: "dead", RESPAWN: "respawn",
};

let HITID = 1;

class Fighter {
  constructor(slot, charId, isCPU) {
    this.slot = slot;
    this.ch = CHAR_BY_ID[charId];
    this.isCPU = isCPU;
    this.pad = new Pad(slot);
    this.tint = PLAYER_TINT[slot];
    this.stats = { kos: 0, damageDealt: 0, snapbacks: 0, falls: 0, supers: 0 };
    this.reset(true);
  }

  reset(full) {
    this.x = CFG.world.w / 2 + (this.slot - 1.5) * 150;
    this.y = 160;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0;
    this.facing = this.x < Stage.pivot.x ? 1 : -1;
    this.percent = 0;
    this.state = ST.AIR; this.stateTimer = 0;
    this.grounded = false; this.groundSeg = null;
    this.airJumps = CFG.airJumps;
    this.shield = CFG.shieldMax;
    this.invuln = 0; this.hitstun = 0;
    this.attack = null;
    this.fastFalling = false; this.dropThrough = 0;
    this.lastHitBy = null;
    this.grabTarget = null; this.grabHold = 0; this.grabbedBy = null;
    this.heavyStomp = 0; this.crankDir = 0;
    this.anchorGlow = 0; this.flipGlow = 0;
    this.specialCD = 0;
    this.pinned = false;
    this.trail = [];
    this.alive = true; this.respawnTimer = 0;
    this.squatHeld = false; this.hitFlash = 0;
    this.runPhase = 0;
    this.animTime = Math.random() * 1000;
    if (full) { this.stocks = CFG.stocks; this.meter = 0; }
  }

  get h() { return this.ch.size.h; }
  get w() { return this.ch.size.w; }
  get feetY() { return this.y + this.h * 0.5; }
  get meterFull() { return this.meter >= CFG.meter.max; }
  get inSuper() { return this.attack && this.attack.kind === "super"; }

  addMeter(v) { this.meter = clamp(this.meter + v, 0, CFG.meter.max); }
  setState(s, t = 0) { this.state = s; this.stateTimer = t; }
  canAct() { return [ST.IDLE, ST.RUN, ST.AIR].includes(this.state); }

  /* ================================================================ update */
  update(match) {
    this.px = this.x; this.py = this.y;
    this.animTime++;

    if (this.state === ST.DEAD) {
      this.respawnTimer--;
      if (this.respawnTimer <= 0) {
        if (this.stocks > 0) this.respawn(); else this.alive = false;
      }
      return;
    }
    if (!this.alive) return;

    this.pad.poll();
    const inp = this.isCPU ? CPU.think(this, match) : this.pad;

    if (this.invuln > 0) this.invuln--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.heavyStomp > 0) this.heavyStomp--;
    if (this.specialCD > 0) this.specialCD--;
    if (this.anchorGlow > 0) this.anchorGlow--;
    if (this.flipGlow > 0) this.flipGlow--;
    this.crankDir = 0;
    this.addMeter(CFG.meter.passive);

    switch (this.state) {
      case ST.IDLE: case ST.RUN: this.updateGroundFree(inp); break;
      case ST.AIR:               this.updateAirFree(inp); break;
      case ST.JUMPSQUAT:         this.updateJumpSquat(inp); break;
      case ST.LANDLAG:           this.tickTimer(ST.IDLE); break;
      case ST.ATTACK:            this.updateAttack(inp); break;
      case ST.SHIELD:            this.updateShield(inp); break;
      case ST.ROLL:              this.updateRoll(); break;
      case ST.SPOTDODGE:         this.tickTimer(ST.IDLE); break;
      case ST.AIRDODGE:          this.updateAirDodge(); break;
      case ST.HITSTUN:           this.updateHitstun(inp); break;
      case ST.GRABBING:          this.updateGrabbing(inp); break;
      case ST.GRABBED:           this.updateGrabbed(inp); break;
      case ST.SHIELDBREAK:       this.tickTimer(ST.IDLE); break;
      case ST.RESPAWN:           this.updateRespawn(inp); break;
    }

    if (this.state !== ST.SHIELD && this.state !== ST.SHIELDBREAK)
      this.shield = Math.min(CFG.shieldMax, this.shield + CFG.shieldRegen);

    this.integrate();
    this.checkBlastZones(match);

    // run-cycle phase drives the leg animation in every character's draw()
    if (this.grounded && Math.abs(this.vx) > 0.5) this.runPhase += Math.abs(this.vx) * 0.09;
    else this.runPhase *= 0.85;

    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 9 || this.inSuper) {
      this.trail.push({ x: this.x, y: this.y, life: 10, facing: this.facing });
      if (this.trail.length > 12) this.trail.shift();
    }
    for (let i = this.trail.length - 1; i >= 0; i--)
      if (--this.trail[i].life <= 0) this.trail.splice(i, 1);
  }

  tickTimer(next) { if (--this.stateTimer <= 0) this.setState(next); }

  /* ------------------------------------------------------------- grounded */
  updateGroundFree(inp) {
    const ch = this.ch, ax = inp.ax;

    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("shield")) {
      if (ax !== 0) { this.startRoll(ax); return; }
      if (inp.ay > 0) { this.setState(ST.SPOTDODGE, CFG.spotDodgeFrames); Snd.dodge(); return; }
      this.setState(ST.SHIELD); Snd.shield(); return;
    }
    if (inp.held("shield")) { this.setState(ST.SHIELD); return; }
    if (inp.hit("grab")) { this.startGrab(); return; }
    if (inp.hit("heavy")) { this.startAttack("heavy"); return; }
    if (inp.hit("light")) { this.startAttack("light"); return; }
    if (inp.hit("special")) { this.startSpecial(); return; }
    if (inp.hit("up")) { this.setState(ST.JUMPSQUAT, CFG.jumpSquat); this.squatHeld = true; return; }

    if (inp.ay > 0 && this.groundSeg && !this.groundSeg.solid) {
      this.grounded = false; this.groundSeg = null;
      this.dropThrough = 10; this.setState(ST.AIR); this.y += 6;
      return;
    }

    const target = ax * ch.speed;
    this.vx += (target - this.vx) * (ax !== 0 ? ch.accel * 0.45 : 0.35);
    this.setState(Math.abs(this.vx) > 0.6 ? ST.RUN : ST.IDLE);
    if (ax !== 0) this.facing = ax;
  }

  updateJumpSquat(inp) {
    this.squatHeld = this.squatHeld && inp.held("up");
    if (--this.stateTimer <= 0) {
      this.vy = -this.ch.jump * (this.squatHeld ? 1 : CFG.shortHopMul);
      this.grounded = false; this.groundSeg = null;
      this.setState(ST.AIR); this.fastFalling = false;
      Snd.jump();
      FX.burst(this.x, this.feetY, 7, this.ch.color, 3);
    }
  }

  /* ---------------------------------------------------------------- air */
  updateAirFree(inp) {
    const ch = this.ch;
    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("shield")) { this.startAirDodge(inp); return; }
    if (inp.hit("grab") || inp.hit("light")) { this.startAttack("light"); return; }
    if (inp.hit("heavy")) { this.startAttack("heavy"); return; }
    if (inp.hit("special")) { this.startSpecial(); return; }

    if (inp.hit("up") && this.airJumps > 0) {
      this.airJumps--;
      this.vy = -ch.jump * 0.94;
      this.vx += inp.ax * ch.airSpeed * 0.5;
      this.fastFalling = false;
      Snd.jump();
      FX.ring(this.x, this.y, 10, 56, ch.color, 2);
      return;
    }
    if (inp.hit("down") && this.vy > -1) this.fastFalling = true;
    if (inp.ax !== 0) {
      this.vx = clamp(this.vx + inp.ax * ch.accel * 0.42, -ch.airSpeed * 1.6, ch.airSpeed * 1.6);
      this.facing = inp.ax;
    }
  }

  startAirDodge(inp) {
    this.setState(ST.AIRDODGE, CFG.airDodgeFrames);
    this.invuln = Math.max(this.invuln, CFG.dodgeInvuln[1]);
    const a = Math.hypot(inp.ax, inp.ay);
    if (a > 0) { this.vx = (inp.ax / a) * CFG.airDodgeSpeed; this.vy = (inp.ay / a) * CFG.airDodgeSpeed; }
    else { this.vx *= 0.3; this.vy = -1; }
    Snd.dodge();
    FX.ring(this.x, this.y, 8, 50, "#ffffff", 2);
  }
  updateAirDodge() {
    this.vx *= 0.93; this.vy *= 0.93;
    if (--this.stateTimer <= 0) this.setState(ST.AIR);
  }

  /* ------------------------------------------------------------- shield */
  updateShield(inp) {
    this.vx *= 0.7;
    if (!this.grounded) { this.setState(ST.AIR); return; }
    this.shield -= CFG.shieldDrainIdle;
    if (this.shield <= 0) { this.breakShield(); return; }
    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("grab")) { this.startGrab(); return; }
    if (inp.ax !== 0 && inp.hit("shield")) { this.startRoll(inp.ax); return; }
    if (inp.hit("up")) { this.setState(ST.JUMPSQUAT, CFG.jumpSquat); this.squatHeld = true; return; }
    if (!inp.held("shield")) this.setState(ST.IDLE);
  }
  breakShield() {
    this.shield = 0;
    this.setState(ST.SHIELDBREAK, CFG.shieldBreakStun);
    this.vy = -6;
    Snd.shieldBreak(); FX.shake(14);
    FX.burst(this.x, this.y, 26, "#7fd9ff", 8);
    FX.banner("SHIELD BREAK", this.tint);
  }
  startRoll(dir) {
    this.setState(ST.ROLL, CFG.rollFrames);
    this.rollDir = dir;
    this.invuln = Math.max(this.invuln, CFG.dodgeInvuln[1]);
    Snd.dodge();
  }
  updateRoll() {
    this.vx = this.rollDir * CFG.rollSpeed * Math.sin(Math.PI * (this.stateTimer / CFG.rollFrames));
    if (--this.stateTimer <= 0) { this.facing = -this.rollDir; this.setState(ST.IDLE); }
  }

  /* ------------------------------------------------------------ attacks */
  startAttack(kind) {
    const m = this.ch[kind];
    this.attack = {
      kind, data: m, t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, lastHitFrame: -99,
    };
    this.setState(ST.ATTACK);
    if (this.grounded) this.vx *= 0.42;
    if (m.onStart) m.onStart(this);
    Snd.whoosh();
  }

  startSpecial() {
    if (this.specialCD > 0) return;    // the HUD diamond shows readiness
    this.specialCD = this.ch.specialCooldown;
    const m = this.ch.special;
    this.attack = {
      kind: "special", data: m, t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, fired: false,
    };
    this.setState(ST.ATTACK);
    if (m.onStart) m.onStart(this);
    Snd.whoosh(1.2);
  }

  startSuper() {
    const m = this.ch.super;
    this.meter = 0;
    this.stats.supers++;
    this.attack = {
      kind: "super", data: Object.assign({}, m), t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, fired: false, landed: false,
    };
    this.setState(ST.ATTACK);
    this.invuln = Math.max(this.invuln, m.startup + 4);
    if (m.onStart) m.onStart(this);
    FX.banner(m.name.toUpperCase(), this.ch.color);
    FX.hitPause(10);
  }

  updateAttack(inp) {
    const a = this.attack;
    if (!a) { this.setState(this.grounded ? ST.IDLE : ST.AIR); return; }
    a.t++;

    if (a.data.tick) a.data.tick(this, a, inp);

    // multi-hit: re-arm the hitbox every hitGap frames
    const m = a.data;
    if (m.hits && m.hits > 1 && this.hitboxActive()) {
      if (a.t - a.lastHitFrame >= (m.hitGap || 4)) { a.hitIds = null; a.lastHitFrame = a.t; }
    }

    if (this.grounded) this.vx *= 0.86;

    if (a.t >= a.total) {
      this.attack = null;
      this.pinned = false;
      this.setState(this.grounded ? ST.LANDLAG : ST.AIR, CFG.landLag);
    }
  }

  hitboxActive() {
    const a = this.attack;
    if (!a) return false;
    const m = a.data;
    if (!m.r) return false;
    return a.t > m.startup && a.t <= m.startup + m.active;
  }
  hitboxWorld() {
    const a = this.attack, m = a.data;
    let ox = m.ox || 0, oy = m.oy || 0;
    if (this.ch.id === "BOLDER" && (a.kind === "special" || a.kind === "super")) ox = 0;
    return { x: this.x + ox * this.facing, y: this.y + oy, r: m.r };
  }

  /* -------------------------------------------------------------- grabs */
  startGrab() {
    this.attack = {
      kind: "grab",
      data: { startup: CFG.grabStartup, active: CFG.grabActive,
              recovery: CFG.grabRecovery, ox: 34, oy: -6, r: 28, dmg: 0 },
      t: 0, total: CFG.grabStartup + CFG.grabActive + CFG.grabRecovery,
      hitId: HITID++, hitIds: null,
    };
    this.setState(ST.ATTACK);
    this.vx *= 0.3;
    Snd.whoosh(0.8);
  }
  lockGrab(target) {
    this.attack = null;
    this.grabTarget = target; this.grabHold = CFG.grabHoldBase;
    this.setState(ST.GRABBING);
    target.grabbedBy = this;
    target.setState(ST.GRABBED, CFG.grabHoldBase);
    target.vx = 0; target.vy = 0;
    Snd.grab();
    FX.burst(target.x, target.y, 10, this.ch.color, 4);
  }
  updateGrabbing(inp) {
    const t = this.grabTarget;
    if (!t || t.state !== ST.GRABBED || !t.alive) { this.releaseGrab(); return; }
    this.vx *= 0.5;
    t.x = this.x + this.facing * (this.w * 0.5 + t.w * 0.4);
    t.y = this.y - 2; t.vx = 0; t.vy = 0;

    if (inp.hit("light")) {
      t.percent += CFG.pummelDamage;
      this.stats.damageDealt += CFG.pummelDamage;
      this.addMeter(CFG.pummelDamage * CFG.meter.onDeal);
      t.hitFlash = 5;
      Snd.hit(4);
      FX.spark(t.x, t.y, "#ffffff");
      this.grabHold -= 4;
    }
    let thrown = null;
    if (inp.hit("right"))     thrown = { x:  0.98, y: -0.22 };
    else if (inp.hit("left")) thrown = { x: -0.98, y: -0.22 };
    else if (inp.hit("up"))   thrown = { x:  0.10, y: -0.99 };
    else if (inp.hit("down")) thrown = { x:  0.34, y:  0.94 };
    if (thrown) { this.doThrow(t, thrown); return; }

    if (--this.grabHold <= 0) this.releaseGrab();
  }
  doThrow(t, dir) {
    const kb = CFG.kbBase + CFG.throwDamage * CFG.kbDamageScale + t.percent * CFG.kbPercentScale * 1.1;
    const weightFix = (CFG.kbWeightRef + 0.55) / (t.ch.weight + 0.55);
    const mag = kb * weightFix * 0.9 + 4;
    t.applyKnockback(dir.x * mag, dir.y * mag, CFG.throwDamage, mag, this);
    this.stats.damageDealt += CFG.throwDamage;
    this.addMeter(CFG.throwDamage * CFG.meter.onDeal);
    Stage.nudge(Math.sign(t.x - Stage.pivot.x || 1) * mag * Stage.cfg.hitNudge * 0.6);
    Stage.lastPusher = this;
    Snd.throw_(); FX.shake(7);
    FX.burst(t.x, t.y, 14, this.ch.color, 6);
    this.releaseGrab();
    this.setState(ST.LANDLAG, 12);
  }
  releaseGrab() {
    const t = this.grabTarget;
    if (t) { t.grabbedBy = null; if (t.state === ST.GRABBED) t.setState(ST.AIR); }
    this.grabTarget = null;
    this.setState(this.grounded ? ST.IDLE : ST.AIR);
  }
  updateGrabbed(inp) {
    let mash = 0;
    for (const b of BUTTONS) if (inp.hit(b)) mash++;
    this.stateTimer -= 1 + mash * 5;
    if (this.stateTimer <= 0) {
      if (this.grabbedBy) this.grabbedBy.releaseGrab();
      this.setState(ST.AIR);
    }
  }

  /* ------------------------------------------------------------ hitstun */
  updateHitstun(inp) {
    this.hitstun--;
    if (inp.ax !== 0) this.vx += inp.ax * CFG.diStrength;
    if (inp.ay !== 0) this.vy += inp.ay * CFG.diStrength * 0.7;
    if (this.hitstun <= 0) {
      this.setState(this.grounded ? ST.IDLE : ST.AIR);
      this.airJumps = Math.max(this.airJumps, CFG.airJumps);
    }
  }

  applyKnockback(vx, vy, dmg, mag, from) {
    // Supers have armour during their active window so they can't be poked out.
    if (CFG.meter.superArmor && this.inSuper && this.attack.t > this.attack.data.startup) {
      this.percent = Math.min(999, this.percent + dmg * 0.5);
      this.hitFlash = 4;
      this.addMeter(dmg * CFG.meter.onTake);
      return;
    }
    if (this.pinned) { this.percent += dmg * 0.4; this.hitFlash = 4; return; }

    this.percent = Math.min(999, this.percent + dmg);
    this.addMeter(dmg * CFG.meter.onTake);
    this.vx = vx; this.vy = vy;
    this.grounded = false; this.groundSeg = null;
    this.hitstun = Math.min(CFG.hitstunMax, Math.round(mag * CFG.hitstunPerKb) + 4);
    this.setState(ST.HITSTUN);
    this.hitFlash = 8;
    this.airJumps = CFG.airJumps;
    if (from) this.lastHitBy = from;
    if (this.grabbedBy) this.grabbedBy.releaseGrab();
  }

  /* ---------------------------------------------------------- integrate */
  integrate() {
    const ch = this.ch;
    if (this.dropThrough > 0) this.dropThrough--;
    const noGrav = this.state === ST.AIRDODGE || this.state === ST.RESPAWN || this.pinned;

    if (!this.grounded && !noGrav) {
      let g = CFG.gravity * ch.fallMul;
      if (this.fastFalling) g *= CFG.fastFallMul;
      this.vy = Math.min(this.vy + g, CFG.maxFall * (this.fastFalling ? CFG.fastFallMul : 1) * ch.fallMul);
      this.vx *= CFG.airDrag;
    }

    const prevFeet = this.feetY;
    this.x += this.vx;
    this.y += this.vy;

    /* Ground collision against the rotated segments. A fighter already riding a
       segment gets a wider capture band so a fast-tilting stage carries them
       along instead of dropping them through. */
    const wasSeg = this.groundSeg;
    this.grounded = false; this.groundSeg = null;
    let best = null, bestY = Infinity;
    for (const seg of Stage.segs) {
      if (!seg.solid && this.dropThrough > 0) continue;
      const sy = Stage.surfaceY(seg, this.x);
      if (sy === null) continue;
      const half = seg.thick * 0.5;
      const feet = this.feetY;
      const riding = seg === wasSeg;
      const up = riding ? 16 : 2;
      const tol = Math.max(10, Math.abs(this.vy) + 8) + (riding ? 10 : 0);
      const wasAbove = riding || prevFeet <= sy + half + 1;
      if (this.vy >= -0.5 && feet >= sy - up && feet <= sy + half + tol && wasAbove) {
        if (sy < bestY) { bestY = sy; best = seg; }
      }
    }

    if (best) {
      this.y = bestY - this.h * 0.5;
      this.vy = 0;
      this.grounded = true; this.groundSeg = best;
      this.airJumps = CFG.airJumps;
      this.fastFalling = false;

      if (this.state === ST.HITSTUN && this.hitstun > 0) {
        this.vy = -Math.abs(this.vy) * 0.2; this.vx *= 0.7;
      } else if (this.state === ST.AIR || this.state === ST.AIRDODGE) {
        this.setState(ST.LANDLAG, CFG.landLag);
        Snd.land();
        FX.burst(this.x, this.feetY, 5, "#b9b6d8", 2.4);
      }

      // slope: slide downhill, lose traction as it steepens
      const sA = Math.sin(best.angle);
      this.vx += sA * CFG.slideStrength;
      const loss = Math.abs(sA) * CFG.slopeFrictionLoss;
      if ([ST.IDLE, ST.LANDLAG, ST.SHIELD, ST.SHIELDBREAK].includes(this.state))
        this.vx *= (CFG.groundFriction + loss * (1 - CFG.groundFriction));
      this.vx = clamp(this.vx, -ch.speed * 2.4, ch.speed * 2.4);
    }

    if (Math.abs(this.vx) < 0.02) this.vx = 0;
  }

  /* --------------------------------------------------------- blast zones */
  checkBlastZones(match) {
    const b = Stage.blast;
    if (this.x < b.left || this.x > b.right || this.y < b.top || this.y > b.bottom) this.ko(match);
  }

  ko(match) {
    this.stocks--;
    this.stats.falls++;
    const killer = this.lastHitBy;
    if (killer && killer !== this && killer.alive) { killer.stats.kos++; killer.addMeter(14); }
    Snd.ko();
    FX.shake(20); FX.hitPause(10); FX.flash(this.ch.color, 0.22);
    const ex = clamp(this.x, 40, CFG.world.w - 40), ey = clamp(this.y, 40, CFG.world.h - 40);
    FX.burst(ex, ey, 34, this.ch.color, 11);
    FX.ring(ex, ey, 16, 280, this.ch.color, 4);
    FX.banner(this.stocks > 0 ? "KO!" : `${this.ch.name} OUT!`, this.tint);
    this.setState(ST.DEAD);
    this.respawnTimer = CFG.respawnFrames;
    this.percent = 0; this.vx = 0; this.vy = 0;
    this.lastHitBy = null; this.pinned = false; this.attack = null;
    if (this.grabTarget) this.releaseGrab();
    if (this.grabbedBy) this.grabbedBy.releaseGrab();
    match.onKO(this);
  }

  respawn() {
    this.x = Stage.pivot.x + (this.slot - 1.5) * 90;
    this.y = Stage.pivot.y - 420;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0; this.percent = 0;
    this.shield = CFG.shieldMax;
    this.airJumps = CFG.airJumps;
    this.setState(ST.RESPAWN, CFG.respawnInvuln);
    this.invuln = CFG.respawnInvuln;
    this.alive = true; this.trail.length = 0;
  }
  updateRespawn(inp) {
    this.vy = 0; this.vx *= 0.9;
    if (inp.ax !== 0) { this.x += inp.ax * 3; this.facing = inp.ax; }
    if (--this.stateTimer <= 0 || inp.hit("down") || inp.hit("light")) {
      this.invuln = 40; this.setState(ST.AIR);
    }
  }

  intangible() {
    if (this.invuln > 0) return true;
    if (this.state === ST.AIRDODGE || this.state === ST.ROLL || this.state === ST.SPOTDODGE) {
      const total = this.state === ST.ROLL ? CFG.rollFrames
                  : this.state === ST.SPOTDODGE ? CFG.spotDodgeFrames : CFG.airDodgeFrames;
      const used = total - this.stateTimer;
      return used >= CFG.dodgeInvuln[0] && used <= CFG.dodgeInvuln[1];
    }
    return false;
  }
  shielding() { return this.state === ST.SHIELD; }
}


/* ===== src/08_combat.js ===== */
/* ==========================================================================
   9. COMBAT — hitbox resolution, super entities, and the CPU
   ========================================================================== */

/* ---------------------------------------------------------------- entities
   Orbs, shockwaves and gravity wells all live here so supers can put things
   into the world that outlive the move that spawned them. */
const Entities = {
  list: [],
  reset() { this.list.length = 0; },

  orb(owner, x, y, vx, vy, move) {
    this.list.push({ kind: "orb", owner, x, y, vx, vy, move, life: 90, r: 16, hitIds: [] });
  },
  shockwave(owner, x, y, dir, move) {
    this.list.push({ kind: "wave", owner, x, y, dir, move, life: 70, r: 46, hitIds: [] });
  },
  well(owner, x, y, move) {
    this.list.push({ kind: "well", owner, x, y, move, life: 62, r: 38, pull: 180, hitIds: [] });
  },

  update(fighters) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      e.life--;
      let gone = e.life <= 0;

      if (e.kind === "orb") {
        e.x += e.vx; e.y += e.vy; e.vy += 0.04;
        if (e.life % 3 === 0) FX.spark(e.x, e.y, e.owner.ch.color);
        if (e.x < -300 || e.x > CFG.world.w + 300 || e.y > CFG.world.h + 300) gone = true;
        if (!gone) gone = this._touch(e, fighters, true);

      } else if (e.kind === "wave") {
        // rides the deck, following the tilted surface
        e.x += e.dir * 13;
        let best = null;
        for (const seg of Stage.segs) {
          if (!seg.main) continue;
          const sy = Stage.surfaceY(seg, e.x);
          if (sy !== null) best = sy;
        }
        if (best !== null) e.y = best - 10; else gone = true;
        e.r = 46 * (0.5 + e.life / 70);
        if (e.life % 2 === 0) {
          FX.spark(e.x + rnd(-14, 14), e.y + rnd(-10, 6), e.owner.ch.color);
          FX.spark(e.x, e.y - rnd(0, 30), "#ffffff");
        }
        if (!gone) this._touch(e, fighters, false);

      } else if (e.kind === "well") {
        const t = 1 - e.life / 62;
        e.r = 38 + Math.sin(t * Math.PI) * 54;
        // drag everyone toward the singularity
        for (const f of fighters) {
          if (f === e.owner || !f.alive || f.state === ST.DEAD) continue;
          const d = dist(e.x, e.y, f.x, f.y);
          if (d < e.pull && d > 1) {
            const k = (1 - d / e.pull) * 0.9;
            f.vx += (e.x - f.x) / d * k;
            f.vy += (e.y - f.y) / d * k;
            if (f.grounded && Math.abs(e.y - f.y) > 30) { f.grounded = false; f.groundSeg = null; }
          }
        }
        for (let k = 0; k < 2; k++) {
          const a = Math.random() * 7, rr = e.pull * (0.4 + Math.random() * 0.6);
          FX.parts.push({ x: e.x + Math.cos(a) * rr, y: e.y + Math.sin(a) * rr,
            vx: -Math.cos(a) * 3.4, vy: -Math.sin(a) * 3.4,
            life: 18, max: 18, size: 2.2, color: e.owner.ch.color, grav: 0, drag: 1 });
        }
        if (e.life === 1) {                       // collapse
          Snd.superHit(); FX.shake(28); FX.hitPause(12);
          FX.flash("#ffffff", 0.4);
          FX.ring(e.x, e.y, 10, 420, "#ffffff", 6);
          FX.ring(e.x, e.y, 10, 300, e.owner.ch.color, 4);
          FX.burst(e.x, e.y, 50, e.owner.ch.color, 14);
          for (const f of fighters) {
            if (f === e.owner || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
            if (dist(e.x, e.y, f.x, f.y) < 190) Combat.land(e.owner, f, e.move, e.x, e.y);
          }
        }
      }

      if (gone) {
        if (e.kind === "orb") FX.burst(e.x, e.y, 8, e.owner.ch.color, 4);
        this.list.splice(i, 1);
      }
    }
  },

  /** Returns true if the entity should be consumed by the hit. */
  _touch(e, fighters, consume) {
    for (const f of fighters) {
      if (f === e.owner || !f.alive || f.state === ST.DEAD) continue;
      if (f.intangible() || e.hitIds.includes(f.slot)) continue;
      if (dist(e.x, e.y, f.x, f.y) < e.r + f.ch.hurt) {
        e.hitIds.push(f.slot);
        Combat.land(e.owner, f, e.move, e.x, e.y);
        if (consume) return true;
      }
    }
    return false;
  },

  draw(g) {
    for (const e of this.list) {
      const c = e.owner.ch.color;
      g.save();
      g.globalCompositeOperation = "lighter";

      if (e.kind === "orb") {
        g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 24;
        g.beginPath(); g.arc(e.x, e.y, e.r, 0, 7); g.fill();
        g.fillStyle = "#fff"; g.shadowBlur = 8;
        g.beginPath(); g.arc(e.x, e.y, e.r * 0.45, 0, 7); g.fill();

      } else if (e.kind === "wave") {
        const a = clamp(e.life / 70, 0, 1);
        g.globalAlpha = a;
        g.strokeStyle = c; g.lineWidth = 5; g.shadowColor = c; g.shadowBlur = 22;
        g.beginPath();
        g.moveTo(e.x - e.dir * 26, e.y + 12);
        g.quadraticCurveTo(e.x, e.y - 52 * a, e.x + e.dir * 26, e.y + 12);
        g.stroke();
        g.strokeStyle = "#fff"; g.lineWidth = 2;
        g.beginPath();
        g.moveTo(e.x - e.dir * 16, e.y + 10);
        g.quadraticCurveTo(e.x, e.y - 34 * a, e.x + e.dir * 16, e.y + 10);
        g.stroke();

      } else if (e.kind === "well") {
        const t = 1 - e.life / 62;
        const rg = g.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.r * 1.7);
        rg.addColorStop(0, "rgba(0,0,0,1)");
        rg.addColorStop(0.45, hexA(c, 0.5));
        rg.addColorStop(1, "rgba(0,0,0,0)");
        g.globalCompositeOperation = "source-over";
        g.fillStyle = rg;
        g.beginPath(); g.arc(e.x, e.y, e.r * 1.7, 0, 7); g.fill();
        g.globalCompositeOperation = "lighter";
        g.strokeStyle = c; g.lineWidth = 3; g.shadowColor = c; g.shadowBlur = 20;
        for (let i = 0; i < 3; i++) {
          const rr = e.r * (0.6 + i * 0.28);
          g.globalAlpha = 0.7 - i * 0.18;
          g.beginPath();
          g.ellipse(e.x, e.y, rr, rr * 0.42, t * 5 + i, 0, 7);
          g.stroke();
        }
      }
      g.restore();
    }
  },
};

/* ---------------------------------------------------------------- combat */
const Combat = {
  nearestFoe(f) {
    let best = null, bd = Infinity;
    for (const o of Match.current.fighters) {
      if (o === f || !o.alive || o.state === ST.DEAD) continue;
      const d = dist(f.x, f.y, o.x, o.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },

  resolve(fighters) {
    for (const atk of fighters) {
      if (!atk.alive || atk.state === ST.DEAD) continue;
      if (!atk.attack || !atk.hitboxActive()) continue;
      const a = atk.attack;
      const hb = atk.hitboxWorld();

      for (const def of fighters) {
        if (def === atk || !def.alive || def.state === ST.DEAD) continue;
        if (def.state === ST.GRABBED && def.grabbedBy === atk) continue;
        if (a.hitIds && a.hitIds.includes(def.slot)) continue;
        if (dist(hb.x, hb.y, def.x, def.y) > hb.r + def.ch.hurt) continue;

        if (a.kind === "grab") {
          if (def.intangible() || def.state === ST.HITSTUN) continue;
          atk.lockGrab(def);
          return;
        }
        if (def.intangible()) { FX.spark(def.x, def.y, "#ffffff"); continue; }

        a.hitIds = a.hitIds || [];
        a.hitIds.push(def.slot);
        this.land(atk, def, a.data, hb.x, hb.y);
      }
    }
  },

  land(atk, def, move, hx, hy) {
    const dirX = def.x >= atk.x ? 1 : -1;
    const isSuper = move === (atk.ch.super) || (atk.attack && atk.attack.kind === "super" && atk.attack.data === move);

    // ---------------- shield ----------------
    if (def.shielding() && !isSuper) {
      const facingHit = (def.facing === -dirX) || Math.abs(def.x - atk.x) < 8;
      if (facingHit) {
        def.shield -= move.dmg * CFG.shieldDamageMul + 4;
        def.vx += dirX * move.dmg * 0.12;
        Snd.shield();
        FX.ring(def.x, def.y, 10, def.ch.hurt * 2.2, "#7fd9ff", 2);
        FX.hitPause(3); FX.shake(3);
        if (def.shield <= 0) def.breakShield();
        return;
      }
    }

    // ---------------- knockback ----------------
    const base = move.base || 2, scale = move.scale || 0.5;
    const kb = CFG.kbBase + base + move.dmg * CFG.kbDamageScale
             + def.percent * CFG.kbPercentScale * scale * 1.9;
    const mag = kb * ((CFG.kbWeightRef + 0.55) / (def.ch.weight + 0.55));
    const rad = (move.angle != null ? move.angle : 45) * Math.PI / 180;

    def.applyKnockback(Math.cos(rad) * mag * dirX, -Math.sin(rad) * mag, move.dmg, mag, atk);
    atk.stats.damageDealt += move.dmg;
    atk.addMeter(move.dmg * CFG.meter.onDeal);
    if (move.onHit) move.onHit(atk, def);

    // the pivot feels every hit
    Stage.nudge(clamp((def.x - Stage.pivot.x) / 310, -1, 1) * mag * Stage.cfg.hitNudge);
    Stage.lastPusher = atk;

    // ---------------- feel ----------------
    const pause = Math.round(CFG.hitPauseBase + move.dmg * CFG.hitPausePerDmg);
    FX.hitPause(pause);
    FX.shake(3 + move.dmg * 0.85);
    FX.burst(hx, hy, Math.round(6 + move.dmg * 1.1), atk.ch.color, 3 + move.dmg * 0.35);
    FX.ring(hx, hy, 6, 30 + move.dmg * 5, "#ffffff", 2);
    FX.hitmark(hx, hy, move.dmg);
    FX.damageText(hx, hy - 24, move.dmg, atk.ch.accent);
    Snd.hit(move.dmg);
    if (move.dmg >= 13) { Snd.bigHit(); FX.flash(atk.ch.color, 0.12); }
  },
};

/* ------------------------------------------------------------------- CPU */
const CPU = {
  think(f, match) {
    f._ai = f._ai || { t: 0, cur: {}, prev: {} };
    const ai = f._ai;
    ai.prev = Object.assign({}, ai.cur);
    ai.cur = {}; BUTTONS.forEach(b => ai.cur[b] = false);
    ai.t++;

    const inp = {
      ax: 0, ay: 0,
      held: b => !!ai.cur[b],
      hit: b => !!ai.cur[b] && !ai.prev[b],
      released: b => !ai.cur[b] && !!ai.prev[b],
    };
    const press = b => { ai.cur[b] = true; };

    const foes = match.fighters.filter(o => o !== f && o.alive && o.state !== ST.DEAD);
    if (!foes.length) return inp;
    let target = foes[0], bd = Infinity;
    for (const o of foes) { const d = dist(f.x, f.y, o.x, o.y); if (d < bd) { bd = d; target = o; } }

    const centerX = Stage.pivot.x;
    const onStage = f.groundSeg !== null;
    const halfDeck = Math.abs(Stage.def.layout[0].x2);

    // --- recovery first ---
    if (!onStage && (Math.abs(f.x - centerX) > halfDeck || f.y > Stage.pivot.y + 70)) {
      const dir = f.x < centerX ? "right" : "left";
      press(dir); inp.ax = dir === "right" ? 1 : -1;
      if (f.vy > 1 && f.airJumps > 0 && ai.t % 14 < 2) press("up");
      if (f.y > Stage.pivot.y + 20 && ai.t % 10 < 2) press("up");
      return inp;
    }

    // --- climb uphill when the deck is steep ---
    const tiltSign = Math.sign(Stage.tilt);
    if (Math.abs(Stage.tilt) > Stage.cfg.limit * 0.62 && onStage &&
        Math.sign(f.x - centerX) === tiltSign && Math.abs(f.x - centerX) > halfDeck * 0.55) {
      const dir = tiltSign > 0 ? "left" : "right";
      press(dir); inp.ax = dir === "right" ? 1 : -1;
      if (ai.t % 30 < 2 && f.ch.id !== "BOLDER") press("up");
      return inp;
    }

    const dx = target.x - f.x, dy = target.y - f.y, adx = Math.abs(dx);

    // --- super when it's up and the target is worth it ---
    if (f.meterFull && Math.random() < CFG.cpu.superChance && (adx < 320 || f.ch.id === "PIVOT")) {
      press("super"); return inp;
    }

    if (Math.random() < CFG.cpu.dodgeChance && f.grounded) { press("shield"); return inp; }

    if (adx > 54) { const dir = dx > 0 ? "right" : "left"; press(dir); inp.ax = dx > 0 ? 1 : -1; }
    if (dy < -70 && f.grounded && ai.t % 24 < 2) press("up");
    if (dy < -50 && !f.grounded && f.airJumps > 0 && ai.t % 20 < 2) press("up");
    if (dy > 90 && !f.grounded) { press("down"); inp.ay = 1; }

    const inLight = adx < 58 && Math.abs(dy) < 52;
    const inHeavy = adx < 76 && Math.abs(dy) < 58;
    if (inLight && Math.random() < CFG.cpu.aggression * 0.3) {
      if (target.percent > 70 && Math.random() < 0.5) press("heavy");
      else if (Math.random() < 0.18) press("grab");
      else press("light");
    } else if (inHeavy && Math.random() < 0.16) press("heavy");

    if (f.specialCD <= 0 && Math.random() < 0.012) {
      const t = Math.abs(Stage.balance());
      switch (f.ch.id) {
        case "BOLDER": if (adx < 120) press("special"); break;
        case "ZIP":    if (t > 0.4 || adx < 170) press("special"); break;
        case "ORBIT":  if (t > 0.45 || adx < 260) press("special"); break;
        case "PIVOT":  if (t > 0.2) press("special"); break;
      }
    }
    if (f.state === ST.ATTACK && f.ch.id === "PIVOT" && f.attack && f.attack.kind === "special") {
      press("special");
      const side = Math.sign(target.x - centerX) || 1;
      if (side > 0) { press("right"); inp.ax = 1; } else { press("left"); inp.ax = -1; }
    }
    if (f.state === ST.GRABBED && ai.t % 3 === 0) press("light");
    return inp;
  },
};


/* ===== src/09_render.js ===== */
/* ==========================================================================
   10. RENDER — stage, fighters and HUD

   Everything that moves is drawn at an interpolated position between the two
   most recent fixed-timestep frames, so motion stays smooth on 120Hz and
   144Hz displays instead of stepping at 60.
   ========================================================================== */

const cv = document.getElementById("cv");
const g = cv.getContext("2d", { alpha: false });
let RA = 1;   // render alpha: 0..1 between the previous and current sim step

function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 18) / H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = Math.floor(W * scale) + "px";
  cv.style.height = Math.floor(H * scale) + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas);

let bgT = 0;
function drawBackground() {
  bgT += 1 / 60;
  (Stage.def.drawBg || STAGES[0].drawBg).call(Stage.def, g, bgT);
}

/* ------------------------------------------------------------------ stage */
function drawStage(alpha) {
  const def = Stage.def, pal = def.pal;
  const tilt = lerp(Stage.prevTilt, Stage.tilt, alpha);
  const c = Math.cos(tilt), s = Math.sin(tilt);
  const P = Stage.pivot;
  const toW = (lx, ly) => ({ x: P.x + lx * c - ly * s, y: P.y + lx * s + ly * c });

  const anch = Stage.anchorTimer > 0;
  const snap = Stage.snapFlash > 0;
  const near = Math.abs(clamp(tilt / Stage.cfg.limit, -1, 1));

  // support column
  g.save();
  g.strokeStyle = hexA(pal.soft, 0.4); g.lineWidth = 11;
  g.beginPath(); g.moveTo(P.x, P.y + 10); g.lineTo(P.x, P.y + 340); g.stroke();
  g.strokeStyle = hexA(pal.platEdge, 0.3); g.lineWidth = 3;
  g.beginPath(); g.moveTo(P.x, P.y + 10); g.lineTo(P.x, P.y + 340); g.stroke();
  g.restore();

  for (const p of def.layout) {
    const a = toW(p.x1, p.y1), b = toW(p.x2, p.y2);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const th = p.thick, main = !!p.main;
    const edge = main
      ? (snap ? "#ffffff" : near > 0.8 ? "#ff2e88" : anch ? "#b6ff3b" : pal.platEdge)
      : pal.soft;

    g.save();
    g.translate(a.x, a.y);
    g.rotate(Math.atan2(dy, dx));

    const depth = main ? 48 : 15;
    const lg = g.createLinearGradient(0, -th / 2, 0, th / 2 + depth);
    lg.addColorStop(0, shade(pal.plat, 0.16));
    lg.addColorStop(0.35, pal.plat);
    lg.addColorStop(1, pal.ink);
    g.fillStyle = lg;
    roundRect(g, 0, -th / 2, len, th + depth, 6); g.fill();

    g.shadowColor = edge; g.shadowBlur = snap ? 36 : 20;
    g.strokeStyle = edge; g.lineWidth = main ? 5 : 3;
    g.beginPath(); g.moveTo(0, -th / 2); g.lineTo(len, -th / 2); g.stroke();
    g.shadowBlur = 0;

    if (!p.solid) {
      g.strokeStyle = hexA(pal.soft, 0.4); g.lineWidth = 2;
      g.setLineDash([8, 10]);
      g.beginPath(); g.moveTo(0, th / 2 + 11); g.lineTo(len, th / 2 + 11); g.stroke();
      g.setLineDash([]);
    }

    if (main) {
      g.globalAlpha = 0.16 + near * 0.36;
      g.strokeStyle = near > 0.8 ? "#ff2e88" : pal.platEdge;
      g.lineWidth = 3;
      for (let x = 10; x < len; x += 26) {
        g.beginPath(); g.moveTo(x, th / 2 + 4); g.lineTo(x + 12, th / 2 + 30); g.stroke();
      }
      g.globalAlpha = 1;
      g.fillStyle = edge; g.shadowColor = edge; g.shadowBlur = 16;
      g.beginPath(); g.arc(3, -th / 2, 5, 0, 7); g.fill();
      g.beginPath(); g.arc(len - 3, -th / 2, 5, 0, 7); g.fill();
      g.shadowBlur = 0;
    }
    g.restore();
  }

  // pivot hub
  g.save();
  g.translate(P.x, P.y); g.rotate(tilt);
  g.fillStyle = anch ? "#b6ff3b" : shade(pal.plat, 0.25);
  g.shadowColor = anch ? "#b6ff3b" : pal.platEdge; g.shadowBlur = anch ? 30 : 14;
  g.beginPath(); g.arc(0, 0, 16, 0, 7); g.fill();
  g.strokeStyle = pal.ink; g.lineWidth = 4;
  g.beginPath(); g.moveTo(-10, 0); g.lineTo(10, 0); g.stroke();
  g.restore();

  if (anch) {
    // soft wash, not a box — a hard-edged rect read as a UI artifact
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.5 + 0.22 * Math.sin(Stage.anchorTimer * 0.3);
    const ag = g.createRadialGradient(P.x, P.y - 40, 20, P.x, P.y - 40, 430);
    ag.addColorStop(0, "rgba(182,255,59,.20)");
    ag.addColorStop(0.55, "rgba(182,255,59,.08)");
    ag.addColorStop(1, "rgba(182,255,59,0)");
    g.fillStyle = ag;
    g.beginPath(); g.arc(P.x, P.y - 40, 430, 0, 7); g.fill();
    g.restore();
  }
}

/* --------------------------------------------------------------- fighter */
function drawFighter(f, alpha) {
  if (f.state === ST.DEAD) return;
  const ch = f.ch;
  const rx = lerp(f.px, f.x, alpha);
  const ry = lerp(f.py, f.y, alpha);

  // afterimage trail
  if (f.trail.length) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (const t of f.trail) {
      g.globalAlpha = (t.life / 10) * (f.inSuper ? 0.3 : 0.18);
      g.save();
      g.translate(t.x, t.y);
      g.scale(t.facing, 1);
      g.fillStyle = ch.color;
      roundRect(g, -ch.size.w / 2, -ch.size.h / 2, ch.size.w, ch.size.h, 9);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  // --- anim context handed to the character's own draw() ---
  const atk = f.attack;
  const A = {
    time: f.animTime,
    runPhase: f.runPhase,
    running: f.state === ST.RUN && f.grounded,
    air: !f.grounded,
    vx: f.vx, vy: f.vy,
    state: f.state,
    flash: f.hitFlash > 0,
    atkPhase: (atk && atk.data.r) ? clamp(atk.t / Math.max(1, atk.total), 0, 1) : -1,
    atkKind: atk ? atk.kind : null,
  };

  g.save();
  g.translate(rx, ry);

  let lean;
  if (f.grounded && f.groundSeg) lean = f.groundSeg.angle * 0.85;
  else lean = clamp(f.vx * 0.016, -0.3, 0.3);
  if (f.state === ST.HITSTUN) lean = Math.sin(f.hitstun * 0.6) * 0.5;
  if (f.pinned) lean = 0;
  g.rotate(lean);

  const squash = f.state === ST.JUMPSQUAT ? 0.80
               : f.state === ST.LANDLAG ? 0.90
               : f.state === ST.SPOTDODGE ? 0.74 : 1;
  const stretch = (!f.grounded && f.vy < -4) ? 1.09 : 1;
  const breathe = (f.state === ST.IDLE && f.grounded) ? 1 + Math.sin(f.animTime * 0.055) * 0.015 : 1;
  g.scale(f.facing, squash * stretch * breathe);

  if (f.intangible()) g.globalAlpha = 0.42;
  ch.draw(g, A);
  g.restore();

  /* ---- world-space overlays ---- */
  if (f.shielding()) {
    const k = f.shield / CFG.shieldMax;
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.22 + k * 0.3;
    const rr = ch.hurt * 1.5 * (0.6 + k * 0.5);
    const rgd = g.createRadialGradient(rx, ry, rr * 0.2, rx, ry, rr);
    rgd.addColorStop(0, "rgba(255,255,255,.5)"); rgd.addColorStop(1, f.tint);
    g.fillStyle = rgd;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.fill();
    g.globalAlpha = 0.5; g.strokeStyle = "#ffffff"; g.lineWidth = 2;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.stroke();
    g.restore();
  }

  if (f.state === ST.SHIELDBREAK) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const a = f.animTime / 14 + i * Math.PI / 2;
      g.fillStyle = "#ffe36b";
      g.beginPath(); g.arc(rx + Math.cos(a) * 26, ry - ch.size.h * 0.6 + Math.sin(a) * 8, 4, 0, 7); g.fill();
    }
    g.restore();
  }

  if (f.state === ST.RESPAWN) {
    g.save();
    g.globalAlpha = 0.6 + 0.3 * Math.sin(f.animTime * 0.1);
    g.strokeStyle = f.tint; g.lineWidth = 4;
    g.shadowColor = f.tint; g.shadowBlur = 20;
    g.beginPath(); g.ellipse(rx, ry + ch.size.h * 0.55, 42, 9, 0, 0, 7); g.stroke();
    g.restore();
  }

  if (f.crankDir !== 0) {
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.5;
    g.strokeStyle = ch.color; g.lineWidth = 4;
    g.shadowColor = ch.color; g.shadowBlur = 18;
    g.beginPath(); g.moveTo(rx, ry);
    g.lineTo(Stage.pivot.x + f.crankDir * 300, Stage.pivot.y - 20); g.stroke();
    g.restore();
  }

  if (f.anchorGlow > 0) {
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.3;
    g.strokeStyle = ch.color; g.lineWidth = 3;
    g.beginPath(); g.arc(rx, ry, ch.hurt * 1.9 + Math.sin(f.animTime * 0.1) * 4, 0, 7); g.stroke();
    g.restore();
  }

  // super aura
  if (f.inSuper) {
    g.save(); g.globalCompositeOperation = "lighter";
    const p = f.attack.t * 0.2;
    for (let i = 0; i < 3; i++) {
      g.globalAlpha = 0.26 - i * 0.07;
      g.strokeStyle = ch.accent; g.lineWidth = 2.5;
      g.beginPath();
      g.ellipse(rx, ry, ch.hurt * (1.5 + i * 0.5), ch.hurt * (0.7 + i * 0.3), p + i, 0, 7);
      g.stroke();
    }
    g.restore();
  }

  if (f.attack && f.hitboxActive() && Settings.get("showHitboxGlow")) {
    const hb = f.hitboxWorld();
    g.save(); g.globalCompositeOperation = "lighter";
    const rgd = g.createRadialGradient(hb.x, hb.y, 1, hb.x, hb.y, hb.r);
    rgd.addColorStop(0, "rgba(255,255,255,.5)");
    rgd.addColorStop(0.5, hexA(ch.color, 0.32));
    rgd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rgd;
    g.beginPath(); g.arc(hb.x, hb.y, hb.r, 0, 7); g.fill();
    g.restore();
  }

  // player tag
  g.save();
  g.font = `700 12px ${FONT_MONO}`;
  g.textAlign = "center";
  g.globalAlpha = 0.85;
  g.fillStyle = f.tint;
  g.fillText(`P${f.slot + 1}${f.isCPU ? " CPU" : ""}`, rx, ry - ch.size.h * 0.82);
  g.restore();
}

function drawOffscreenMarkers(fighters, cam) {
  for (const f of fighters) {
    if (!f.alive || f.state === ST.DEAD) continue;
    const sx = (f.x - cam.x) * cam.z + W / 2, sy = (f.y - cam.y) * cam.z + H / 2;
    if (sx > 26 && sx < W - 26 && sy > 26 && sy < H - 26) continue;
    const cx = clamp(sx, 38, W - 38), cy = clamp(sy, 54, H - 40);
    g.save();
    g.translate(cx, cy);
    g.rotate(Math.atan2(sy - H / 2, sx - W / 2));
    g.fillStyle = f.tint; g.shadowColor = f.tint; g.shadowBlur = 16;
    g.beginPath(); g.moveTo(15, 0); g.lineTo(-10, -11); g.lineTo(-10, 11); g.closePath(); g.fill();
    g.restore();
    g.save();
    g.font = `700 16px ${FONT_MONO}`; g.textAlign = "center";
    g.fillStyle = f.tint;
    outlineText(g, `${Math.floor(f.percent)}%`, cx, cy + 30, f.tint, 4);
    g.restore();
  }
}

/* -------------------------------------------------------------------- HUD */
function drawBalanceBar() {
  const bw = 520, bh = 20, bx = (W - bw) / 2, by = 24;
  const b = Stage.balance();
  const anch = Stage.anchorTimer > 0;
  const danger = Math.abs(b) > 0.8;
  const col = anch ? "#b6ff3b" : danger ? "#ff2e88" : Stage.pal.platEdge;

  g.save();
  g.fillStyle = "rgba(8,6,18,.80)";
  roundRect(g, bx - 8, by - 8, bw + 16, bh + 16, 12); g.fill();
  g.strokeStyle = anch ? "#b6ff3b" : danger ? "#ff2e88" : hexA(Stage.pal.platEdge, 0.6);
  g.lineWidth = 2; g.shadowColor = col; g.shadowBlur = danger ? 24 : 10;
  roundRect(g, bx - 8, by - 8, bw + 16, bh + 16, 12); g.stroke();
  g.shadowBlur = 0;

  g.fillStyle = "rgba(255,255,255,.06)";
  roundRect(g, bx, by, bw, bh, 8); g.fill();
  g.fillStyle = "rgba(255,46,136,.22)";
  roundRect(g, bx, by, bw * 0.1, bh, 8); g.fill();
  roundRect(g, bx + bw * 0.9, by, bw * 0.1, bh, 8); g.fill();

  const cxp = bx + bw / 2, wFill = (bw / 2) * Math.abs(b);
  g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 16;
  if (b >= 0) roundRect(g, cxp, by + 2, wFill, bh - 4, 6);
  else roundRect(g, cxp - wFill, by + 2, wFill, bh - 4, 6);
  g.fill(); g.shadowBlur = 0;

  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cxp, by - 4); g.lineTo(cxp, by + bh + 4); g.stroke();

  g.font = `700 11px ${FONT_MONO}`; g.textAlign = "center";
  g.fillStyle = anch ? "#b6ff3b" : danger ? "#ff2e88" : "#8f8cb5";
  g.fillText(anch ? `KEEL ANCHOR ${Math.ceil(Stage.anchorTimer / 60)}s`
                  : danger ? "SNAP-BACK IMMINENT" : "BALANCE", cxp, by + bh + 17);
  g.textAlign = "left"; g.fillStyle = "#6b6a85"; g.fillText("◀", bx - 2, by + bh + 17);
  g.textAlign = "right"; g.fillText("▶", bx + bw + 2, by + bh + 17);
  g.restore();
}

function drawClock(framesLeft) {
  const secs = Math.max(0, Math.ceil(framesLeft / 60));
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const low = secs <= 10;
  g.save();
  g.textAlign = "center";
  g.font = `900 32px ${FONT_DISPLAY}`;
  g.globalAlpha = low && Math.floor(framesLeft / 8) % 2 === 0 ? 0.55 : 1;
  if (low) { g.shadowColor = "#ff2e88"; g.shadowBlur = 20; }
  outlineText(g, `${mm}:${String(ss).padStart(2, "0")}`, W / 2, 104, low ? "#ff2e88" : "#f2f0ff", 6);
  g.restore();

  // stage name chip
  g.save();
  g.textAlign = "right";
  g.font = `700 10px ${FONT_MONO}`;
  g.fillStyle = "rgba(255,255,255,.3)";
  g.fillText(Stage.def.name, W - 16, 30);
  g.restore();
}

function drawPlayerHUD(fighters) {
  const n = fighters.length;
  const cardW = 198, gap = 16;
  let x = (W - (n * cardW + (n - 1) * gap)) / 2;
  const y = H - 104;

  for (const f of fighters) {
    const dead = f.stocks <= 0;
    g.save();
    g.globalAlpha = dead ? 0.32 : 1;

    g.fillStyle = "rgba(8,6,18,.84)";
    roundRect(g, x, y, cardW, 88, 14); g.fill();
    g.strokeStyle = hexA(f.ch.color, f.meterFull ? 0.95 : 0.6);
    g.lineWidth = f.meterFull ? 3 : 2;
    g.shadowColor = f.ch.color; g.shadowBlur = f.meterFull ? 22 : 12;
    roundRect(g, x, y, cardW, 88, 14); g.stroke();
    g.shadowBlur = 0;

    // tiny portrait
    g.save();
    g.beginPath(); roundRect(g, x + 9, y + 9, 36, 36, 9); g.clip();
    g.fillStyle = shade(f.ch.color2, -0.25); g.fillRect(x + 9, y + 9, 36, 36);
    g.translate(x + 27, y + 46); g.scale(0.62, 0.62);
    f.ch.draw(g, { time: f.animTime, runPhase: 0, running: false, air: false,
                   vx: 0, vy: 0, state: ST.IDLE, flash: false, atkPhase: -1 });
    g.restore();

    g.font = `700 15px ${FONT_MONO}`; g.textAlign = "left";
    g.fillStyle = "#f2f0ff"; g.fillText(f.ch.name, x + 52, y + 23);
    g.font = `700 10px ${FONT_MONO}`; g.fillStyle = f.tint;
    g.fillText(`P${f.slot + 1}${f.isCPU ? " · CPU" : ""}`, x + 52, y + 37);

    const p = Math.floor(f.percent);
    const heat = clamp(p / 160, 0, 1);
    const pc = mixColor("#ffffff", "#ff2e88", heat);
    g.font = `900 ${32 + heat * 10}px ${FONT_DISPLAY}`;
    g.textAlign = "right";
    g.shadowColor = pc; g.shadowBlur = 10 + heat * 18;
    g.fillStyle = pc; g.fillText(`${p}%`, x + cardW - 12, y + 74);
    g.shadowBlur = 0;

    // stocks
    for (let i = 0; i < CFG.stocks; i++) {
      const on = i < f.stocks;
      g.beginPath(); g.arc(x + 18 + i * 17, y + 58, 5.5, 0, 7);
      g.fillStyle = on ? f.ch.color : "rgba(255,255,255,.14)";
      if (on) { g.shadowColor = f.ch.color; g.shadowBlur = 10; }
      g.fill(); g.shadowBlur = 0;
    }

    // special-ready diamond
    const ready = f.specialCD <= 0;
    g.save();
    g.translate(x + 78, y + 58); g.rotate(Math.PI / 4);
    g.fillStyle = ready ? f.ch.accent : "rgba(255,255,255,.12)";
    if (ready) { g.shadowColor = f.ch.accent; g.shadowBlur = 10; }
    g.fillRect(-4.5, -4.5, 9, 9);
    g.restore();

    // shield rail + super meter
    const sw = cardW - 24;
    g.fillStyle = "rgba(255,255,255,.1)";
    roundRect(g, x + 12, y + 68, sw, 3, 2); g.fill();
    g.fillStyle = f.shield < 30 ? "#ff2e88" : "#7fd9ff";
    roundRect(g, x + 12, y + 68, sw * (f.shield / CFG.shieldMax), 3, 2); g.fill();

    const mk = f.meter / CFG.meter.max;
    g.fillStyle = "rgba(255,255,255,.08)";
    roundRect(g, x + 12, y + 76, sw, 7, 3.5); g.fill();
    if (f.meterFull) {
      const pulse = 0.65 + Math.sin(f.animTime * 0.18) * 0.35;
      g.globalAlpha = pulse;
      g.fillStyle = f.ch.accent; g.shadowColor = f.ch.accent; g.shadowBlur = 16;
    } else {
      g.fillStyle = f.ch.color;
    }
    roundRect(g, x + 12, y + 76, sw * mk, 7, 3.5); g.fill();
    g.shadowBlur = 0; g.globalAlpha = dead ? 0.32 : 1;
    if (f.meterFull) {
      g.font = `700 8px ${FONT_MONO}`; g.textAlign = "center";
      g.fillStyle = "#07060f";
      g.fillText("SUPER READY", x + 12 + sw / 2, y + 82);
    }

    g.restore();
    x += cardW + gap;
  }
}

function drawBanner() {
  if (FX.bannerTimer <= 0 || !FX.bannerText) return;
  const t = FX.bannerTimer / 72;
  g.save();
  g.translate(W / 2, H * 0.29);
  const pop = 1 + (1 - t) * 0.12;
  g.scale(pop, pop);
  g.globalAlpha = Math.min(1, t * 2.4);
  g.textAlign = "center";
  g.font = `900 66px ${FONT_DISPLAY}`;
  g.shadowColor = FX.bannerColor; g.shadowBlur = 30;
  outlineText(g, FX.bannerText, 0, 0, FX.bannerColor, 9);
  g.restore();
}

/* ==========================================================================
   11. MATCH — one bout from countdown to results
   ========================================================================== */

class Match {
  constructor(slots, stageDef) {
    Match.current = this;
    Stage.select(stageDef);
    this.fighters = [];
    slots.forEach((s, i) => {
      if (s.mode === "off") return;
      this.fighters.push(new Fighter(i, s.charId, s.mode === "cpu"));
    });
    Entities.reset();
    FX.reset();
    this.countdown = 170;
    this.over = false; this.endTimer = 0;
    this.frames = 0; this.lastCount = -1;
    this.timeLeft = CFG.matchSeconds * 60;
    this.endedBy = null; this.winner = null;
    Snd.startMusic(stageDef);
  }

  onKO() {
    const standing = this.fighters.filter(x => x.stocks > 0);
    if (standing.length <= 1) this.endMatch(standing[0] || null, "ko");
  }

  endOnTime() {
    const live = this.fighters.filter(f => f.stocks > 0);
    let best = null, tie = false;
    for (const f of live) {
      if (!best) { best = f; continue; }
      if (f.stocks > best.stocks) { best = f; tie = false; }
      else if (f.stocks === best.stocks) {
        if (f.percent < best.percent) { best = f; tie = false; }
        else if (f.percent === best.percent) tie = true;
      }
    }
    this.endMatch(tie ? null : best, "time");
  }

  endMatch(winner, reason) {
    if (this.over) return;
    this.over = true; this.endTimer = 120;
    this.winner = winner; this.endedBy = reason;
    Snd.stopMusic();
    FX.flash("#ffffff", 0.3);
    if (reason === "time") FX.banner("TIME!", "#ffc83d");
    else FX.banner(winner ? `${winner.ch.name} WINS` : "DRAW", winner ? winner.tint : "#fff");
  }

  update() {
    // Hit pause freezes the simulation but keeps FX alive. Inputs are not
    // polled here, so a press during the freeze still lands on the next frame.
    if (FX.pause > 0) { FX.pause--; FX.update(this.fighters); return; }

    if (this.countdown > 0) {
      this.countdown--;
      const step = Math.floor(this.countdown / 40);
      if (step !== this.lastCount) { this.lastCount = step; Snd.count(step); }
      for (const f of this.fighters) { f.pad.poll(); f.px = f.x; f.py = f.y; f.integrate(); }
      Stage.update(this.fighters);
      FX.update(this.fighters);
      return;
    }

    /* Once the match is decided the fighters freeze for the victory beat.
       Letting them keep playing would also let the winner lose their last
       stock during the flourish, which would corrupt the final standings. */
    if (this.over) {
      FX.update(this.fighters);
      Stage.update(this.fighters);
      if (--this.endTimer <= 0) Game.toResults(this);
      return;
    }

    this.frames++;
    if (--this.timeLeft <= 0) { this.timeLeft = 0; this.endOnTime(); }
    else if (this.timeLeft === 10 * 60) FX.banner("10 SECONDS", "#ffc83d");

    for (const f of this.fighters) f.update(this);
    Combat.resolve(this.fighters);
    Entities.update(this.fighters);
    Stage.update(this.fighters);
    FX.update(this.fighters);
  }

  draw(alpha) {
    drawBackground();
    g.save();
    const cam = FX.applyCamera(g, alpha);
    drawStage(alpha);
    Entities.draw(g);
    for (const f of this.fighters) drawFighter(f, alpha);
    FX.drawWorld(g);
    g.restore();

    FX.drawOverlay(g);
    drawOffscreenMarkers(this.fighters, cam);
    drawBalanceBar();
    drawClock(this.timeLeft);
    drawPlayerHUD(this.fighters);
    drawBanner();

    if (this.countdown > 0) {
      const step = Math.floor(this.countdown / 40);
      const txt = step >= 3 ? "READY" : step >= 2 ? "SET" : step >= 1 ? "..." : "BRAWL!";
      const sub = (this.countdown % 40) / 40;
      g.save();
      g.translate(W / 2, H / 2 - 40);
      const s = 1 + (1 - sub) * 0.16;
      g.scale(s, s);
      g.textAlign = "center";
      g.font = `900 92px ${FONT_DISPLAY}`;
      g.shadowColor = step === 0 ? "#b6ff3b" : Stage.pal.platEdge;
      g.shadowBlur = 34;
      outlineText(g, txt, 0, 0, step === 0 ? "#b6ff3b" : Stage.pal.platEdge, 11);
      g.restore();
    }

    g.save();
    g.font = `700 10px ${FONT_MONO}`;
    g.textAlign = "right"; g.fillStyle = "rgba(255,255,255,.16)";
    g.fillText("COOL MATT GAMES", W - 16, H - 10);
    g.restore();
  }
}
Match.current = null;

                 pause and results
