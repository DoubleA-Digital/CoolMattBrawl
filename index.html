        // the chain itself
        if (a.t % 2 === 0 && !a.slammed)
          FX.streak(f.x + f.facing * 14, f.y - 10, t.x, t.y, f.ch.accent);
      }
    } },

  /* ---- art: cracked stone over something lit. No face — just a gap in the
           shroud with light coming out of it. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c2;      // the SHELL is the dark colour:
    const lit = A.flash ? "#ffffff" : c;        // the light inside is the bright one
    const deep = A.flash ? "#cdb3ff" : c3;
    const sw = swing(A, -11, 44);
    const planted = A.state === ST.ATTACK && A.atkKind === "special";
    const pulse = 0.55 + Math.sin(A.time * 0.06) * 0.45;

    aura(g, 0, 0, 46, c, 0.1 + (planted ? 0.2 : 0) + pulse * 0.05);

    /* --- legs: squat, planted wide, wrapped in shroud --- */
    const st = Math.sin(A.runPhase) * (A.running ? 7 : 0);
    jointLimb(g, -9, 12, -14 + st, 29, -4, 12, body);
    jointLimb(g, 10, 12, 15 - st, 29, 4, 12, body);
    plateRect(g, -22 + st * 0.5, 26, 17, 9, 2.5, deep, { up: 0.14 });
    plateRect(g, 5 - st * 0.5, 26, 17, 9, 2.5, deep, { up: 0.14 });

    /* --- the shroud: a heavy mantle over the whole upper body --- */
    const mantle = () => poly(g, [-24, -14, 24, -14, 28, 16, -28, 16]);
    ink(g, mantle, vol(g, -16, 18, body, 0.24, 0.4));
    rim(g, mantle, "#ffffff", 3, 0.22);
    // cracks with light coming through them
    g.save();
    mantle(); g.clip();
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(lit, 0.35 + pulse * 0.45); g.lineWidth = 2.2;
    g.lineCap = "round"; g.lineJoin = "round";
    const seams = [[-16, -12, -9, -2, -13, 12], [4, -13, 9, 0, 3, 14], [16, -10, 21, 4]];
    for (const sm of seams) {
      g.beginPath(); g.moveTo(sm[0], sm[1]);
      for (let i = 2; i < sm.length; i += 2) g.lineTo(sm[i], sm[i + 1]);
      g.stroke();
    }
    g.restore();

    /* --- the core, burning behind the shroud's gap --- */
    g.fillStyle = INK;
    poly(g, [-8, -7, 8, -7, 6, 9, -6, 9]); g.fill();
    lens(g, () => { g.beginPath(); g.ellipse(0, 1, 5.2, 6.6, 0, 0, 7); },
         lit, lit, 18 + pulse * 14);

    /* A heavy collar yoke across the shoulders. Drawn as a full ellipse it
       sat under the hood like a grin, so it is a flattened band with raised
       shoulder bosses instead. */
    g.save();
    plate(g, [-20, -17, 20, -17, 17, -11, -17, -11], deep, { up: 0.26, rimA: 0.4 });
    for (const bx of [-13, 13]) screw(g, bx, -14, 2.2, ac);
    plate(g, [-25, -15, -14, -17, -13, -9, -23, -8], deep, { up: 0.3, rim: false });
    plate(g, [25, -15, 14, -17, 13, -9, 23, -8], deep, { up: 0.3, rim: false });
    g.restore();

    /* --- head: a hood with nothing in it but two lights --- */
    const hood = () => poly(g, [-12, -20, 12, -20, 9, -38, 0, -43, -10, -36]);
    ink(g, hood, vol(g, -43, -20, body, 0.26, 0.34));
    rim(g, hood, "#ffffff", 3, 0.3);
    g.fillStyle = INK; poly(g, [-11, -20, 11, -20, 9, -29, -10, -29]); g.fill();
    for (const ex of [-4.5, 4.5])
      lens(g, () => { g.beginPath(); g.arc(ex, -24.5, 2.4, 0, 7); },
           A.flash ? "#ff2e88" : lit, lit, 12 + pulse * 10);

    /* --- arms: long, heavy, ending in stone fists --- */
    jointLimb(g, -18, -10, -25 - (A.running ? st * 0.4 : 0), 6, -4, 11, body);
    g.fillStyle = deep; g.strokeStyle = INK; g.lineWidth = 2.6;
    g.beginPath(); g.arc(-28, 9, 8, 0, 7); g.stroke(); g.fill();
    const ax = 20 + sw, ay = -3;
    jointLimb(g, 18, -10, (18 + ax) / 2, ay - 1, 2.5, 11, body);
    limb(g, (18 + ax) / 2, ay - 1, ax - 3, ay, 13, mid_(c2, c3));
    /* A fist, not a slab: knuckles that step down toward the front, with a
       dark wrist behind them so the hand reads as held rather than carried. */
    g.save(); g.translate(ax, ay);
    plateRect(g, -12, -7, 8, 14, 3, deep, { up: 0.12, rim: false });
    // the back of the hand
    const fistPts = [-5, -9, 6, -11, 11, -7, 12, 4, 8, 10, -4, 10];
    plate(g, fistPts, body, { up: 0.3, down: 0.38, under: true });
    // three curled fingers stepping down the front, so it reads as a fist
    for (let i = 0; i < 3; i++) {
      const fy = -7 + i * 6;
      plateRect(g, 8, fy, 7, 5.4, 2.6, shade(body, 0.08 - i * 0.04),
                { up: 0.2, rim: false, ink: 2.2 });
    }
    // and a thumb across the near side
    plate(g, [-4, 0, 4, -2, 6, 4, -3, 7], shade(body, -0.12),
          { up: 0.16, rim: false, ink: 2.2 });
    g.save();
    poly(g, fistPts); g.clip();
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(lit, 0.3 + pulse * 0.4); g.lineWidth = 2;
    g.beginPath(); g.moveTo(-2, -7); g.lineTo(3, -1); g.stroke();
    g.restore();
    g.restore();

    /* --- when planted, show the ground giving up --- */
    if (planted) {
      g.save();
      g.globalCompositeOperation = "lighter";
      g.strokeStyle = hexA(lit, 0.5); g.lineWidth = 2.4;
      for (let i = -2; i <= 2; i++) {
        if (!i) continue;
        g.beginPath(); g.moveTo(i * 8, 30); g.lineTo(i * 17, 38); g.stroke();
      }
      g.restore();
    }
  },
},

/* ======================================================================== */
/* MIRA — THE ANSWER                                                         */
/* The only fighter who wins by being hit: a live counter eats the blow and  */
/* answers it with a hit of her own, straight back at whoever swung.         */
/* ======================================================================== */
{
  id: "MIRA", name: "MIRA", tag: "THE ANSWER",
  blurb: "A duelist who would rather you swung first. Reads the attack, eats it, and sends it back harder.",
  power: "Counters: a hit during her stance is cancelled and answered on the spot, hard.",
  color: "#ff4d6d", color2: "#5e1024", color3: "#2a0710", accent: "#ffe3ea",
  weight: 0.94, speed: 4.40, accel: 0.92, jump: 12.0, airSpeed: 4.2, fallMul: 1.00,
  riposte: { dmg: 12, base: 5.8, scale: 1.15, angle: 42 },
  size: { w: 32, h: 52 }, hurt: 25,
  specialCooldown: 210,

  light: { name: "Feint", startup: 3, active: 3, recovery: 8,
    dmg: 3.4, base: 1.6, scale: 0.42, angle: 46, ox: 38, oy: -8, r: 22,
    vfx(f) {
      const ang = faceAng(f);
      // a thin, fast line — a fencer's point, not a slash
      FX.blade(f.x + f.facing * 10, f.y - 8, ang, 30, 62, 0.22, f.ch.color,
               { w: 16, life: 9 });
      FX.spark(hbAt(f, this).x, f.y - 8, f.ch.accent);
      Snd.tone(1400, 0.035, "square", 0.06, 2100);
    } },

  heavy: { name: "Lunge", startup: 12, active: 4, recovery: 27,
    dmg: 14, base: 4.2, scale: 1.02, angle: 40, ox: 56, oy: -6, r: 28,
    onStart(f) { f.vx += f.facing * 6.2; Snd.whoosh(1.2); },
    vfx(f) {
      const ang = faceAng(f);
      FX.blade(f.x + f.facing * 8, f.y - 6, ang, 36, 98, 0.3, f.ch.color,
               { w: 26, life: 13 });
      FX.blade(f.x + f.facing * 8, f.y - 6, ang, 34, 88, 0.16, "#ffffff",
               { w: 12, life: 9, core: false });
      FX.streak(f.x, f.y - 6, f.x + f.facing * 100, f.y - 6, f.ch.accent);
      FX.shake(5);
      Snd.tone(900, 0.08, "sawtooth", 0.1, 240);
    } },

  special: { name: "Riposte", startup: 4, active: 26, recovery: 26,
    dmg: 0, base: 0, scale: 0, angle: 0, ox: 0, oy: 0, r: 0,
    desc: "A stance. Anything that hits her during it is cancelled and answered on the spot. If nobody swings, she ends it with a quick lunging thrust.",
    // the same idea as her super's closer: the stance is never spent on nothing
    closer: { name: "Thrust", dmg: 6, base: 3.6, scale: 0.75, angle: 34 },
    onStart(f) { Snd.tone(600, 0.14, "sine", 0.1, 1100); },
    tick(f, a) {
      const m = a.data;
      if (a.t >= m.startup && a.t < m.startup + m.active) {
        f.counter = 2;                       // re-armed every frame of the window
        f.vx *= 0.7;
        if (a.t % 6 === 0) {
          FX.ring(f.x, f.y, 4, 34, f.ch.accent, 2);
          FX.spark(f.x + rnd(-16, 16), f.y + rnd(-18, 18), f.ch.color);
        }
        if (f.counterFlash > 20) a.answered = true;
      }
      if (a.t === m.startup + m.active && !a.answered) {
        a.answered = true;
        f.counter = 0;
        f.vx = f.facing * 7.5;
        FX.blade(f.x + f.facing * 8, f.y - 6, faceAng(f), 30, 90, 0.25, f.ch.accent, { w: 18, life: 12 });
        FX.streak(f.x, f.y - 6, f.x + f.facing * 130, f.y - 6, f.ch.accent);
        Snd.tone(900, 0.08, "sawtooth", 0.1, 260);
        for (const o of Combat.foes(f)) {
          const ahead = (o.x - f.x) * f.facing;
          if (ahead < -10 || ahead > 130 || Math.abs(o.y - f.y) > 46 || o.intangible()) continue;
          Combat.land(f, o, m.closer, o.x, o.y);
        }
      }
    } },

  /* Its data carried r:150 as if it were a hitbox, so during the "stance"
     anyone within 150 was simply hit for 16 -- the counter almost never got
     the chance to fire. The answer radius is its own field now, and if the
     window closes with nothing to answer she cuts forward anyway, so the bar
     is never spent on nothing. */
  super: { name: "Perfect Answer",
    desc: "A long stance. One hit during it is answered with a blast that hits every foe around her. If nobody swings, she closes the stance with a lunging cut.",
    startup: 12, active: 60, recovery: 34,
    dmg: 16, base: 5.4, scale: 1.05, angle: 46, ox: 0, oy: 0, r: 0,
    radius: 150,
    closer: { name: "Final Word", dmg: 10, base: 4.6, scale: 1.0, angle: 38 },
    onStart(f) { Snd.superCharge(); FX.flash("#ff4d6d", 0.3); },
    tick(f, a) {
      const m = a.data;
      if (a.t < m.startup) { f.vx *= 0.82; FX.spark(f.x + rnd(-26, 26), f.y + rnd(-30, 30), f.ch.color); }
      if (a.t === m.startup) {
        FX.banner("PERFECT ANSWER", f.ch.color);
        a.answered = false;
      }
      if (a.t >= m.startup && a.t < m.startup + m.active && !a.answered) {
        f.counter = 2;
        f.vx *= 0.86;
        if (a.t % 4 === 0) {
          FX.ring(f.x, f.y, 6, 70, f.ch.accent, 2);
          FX.spark(f.x + rnd(-30, 30), f.y + rnd(-30, 30), f.ch.accent);
        }
        /* counterFlash is set by the riposte in applyKnockback, so it is how
           the super learns that its counter actually fired */
        if (f.counterFlash > 20) {
          a.answered = true;
          for (const o of Combat.foes(f)) {
            if (dist(o.x, o.y, f.x, f.y) > m.radius || o.intangible()) continue;
            const dirX = o.x >= f.x ? 1 : -1;
            const rad = m.angle * Math.PI / 180;
            const mag = CFG.kbBase + m.base + m.dmg * CFG.kbDamageScale
                      + o.percent * CFG.kbPercentScale * m.scale * 1.9;
            o.applyKnockback(Math.cos(rad) * mag * dirX, -Math.sin(rad) * mag,
                             m.dmg, mag, f);
            f.stats.damageDealt += m.dmg;
          }
          FX.flash("#ffffff", 0.45);
          FX.hitPause(16); FX.shake(28);
          FX.ring(f.x, f.y, 20, 420, "#ffffff", 6);
          FX.blade(f.x, f.y, 0, 40, 220, 6.28, f.ch.color, { w: 18, life: 20 });
          Snd.superHit();
        }
      }
      // nobody swung: close the stance with a lunging cut
      if (a.t === m.startup + m.active && !a.answered) {
        a.answered = true;
        f.vx = f.facing * 9;
        FX.blade(f.x + f.facing * 8, f.y - 6, faceAng(f), 36, 110, 0.3, f.ch.color, { w: 26, life: 14 });
        FX.streak(f.x, f.y - 6, f.x + f.facing * 160, f.y - 6, f.ch.accent);
        Snd.tone(900, 0.1, "sawtooth", 0.12, 240);
        for (const o of Combat.foes(f)) {
          const ahead = (o.x - f.x) * f.facing;
          // she lunges 9px/frame, so the cut covers the ground she is about to take
          if (ahead < -10 || ahead > 160 || Math.abs(o.y - f.y) > 50 || o.intangible()) continue;
          Combat.land(f, o, m.closer, o.x, o.y);
        }
      }
    } },

  /* ---- art: a duelist. Long coat tails, a faceted mirror mask, and a thin
           blade she holds point-forward rather than swung. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c;
    const dark = A.flash ? "#ffd3dc" : c2;
    const deep = A.flash ? "#ffb3c2" : c3;
    const sw = swing(A, -14, 46);
    const guard = A.state === ST.ATTACK && (A.atkKind === "special" || A.atkKind === "super");

    if (guard) aura(g, 0, -6, 44, ac, 0.3);
    else aura(g, 0, -6, 30, c, 0.12);

    /* --- coat tails, behind, lagging the motion --- */
    for (let t = 0; t < 2; t++) {
      g.save();
      const path = () => {
        g.beginPath(); g.moveTo(-4, -6 + t * 4);
        for (let s = 1; s <= 4; s++)
          g.lineTo(-4 - s * 7 - Math.abs(A.vx) * 0.7 * s * 0.3,
                   -6 + t * 4 + Math.sin(A.time * 0.11 + s * 0.8 + t) * (2 + s * 1.7) + s * 4.5);
      };
      g.lineCap = "round"; g.lineJoin = "round";
      path(); g.strokeStyle = INK; g.lineWidth = (t ? 2.8 : 4.6) + 1.6; g.stroke();
      path(); g.strokeStyle = t ? deep : dark; g.lineWidth = t ? 2.8 : 4.6; g.stroke();
      path(); g.strokeStyle = hexA(ac, 0.28); g.lineWidth = 1.3; g.stroke();
      g.restore();
    }

    /* --- legs: a fencer's stance, front leg forward --- */
    const st = Math.sin(A.runPhase) * (A.running ? 12 : 0);
    jointLimb(g, -5, 9, -11 + st, 26, -4, 5.5, dark);
    jointLimb(g, 6, 9, 13 - st, 26, 5, 5.5, dark);
    plateRect(g, -17 + st, 24, 12, 6, 2, deep, { up: 0.16 });
    plateRect(g, 8 - st, 24, 13, 6, 2, deep, { up: 0.16 });

    /* --- torso: slim, with a sash and a high collar --- */
    plate(g, [-9, -15, 10, -15, 8, 11, -8, 11], body, { up: 0.3, down: 0.34, under: true });
    plate(g, [-7, -11, 8, -11, 6, 1, -6, 1], dark, { up: 0.12, down: 0.3, rimA: 0.28 });
    plate(g, [-9, -3, 10, -11, 11, -6, -8, 2], deep, { up: 0.2, ink: 2.2, rimA: 0.35 });
    // collar
    plate(g, [-10, -15, 10, -15, 7, -21, -7, -21], deep, { up: 0.24, rim: false });

    /* --- head: a faceted mirror mask. Reflective, not lit --- */
    g.save(); g.translate(1, -26);
    const maskPath = () => poly(g, [-6.5, -5, 6.5, -6.5, 8.5, 2.5, -6, 5]);
    ink(g, maskPath, vol(g, -9, 7, body, 0.34, 0.3));
    // the facets: hard-edged highlights that read as polished metal
    g.save(); maskPath(); g.clip();
    g.fillStyle = hexA("#ffffff", 0.42); poly(g, [-6.5, -5, 0.5, -6, -2.5, 5, -6, 4]); g.fill();
    g.fillStyle = hexA("#ffffff", 0.18); poly(g, [2.5, -6, 6.5, -6, 7.5, 1, 3.5, 1.5]); g.fill();
    g.fillStyle = hexA(INK, 0.4); poly(g, [-2, -1.5, 8.5, 0, 8.5, 2.5, -2.5, 3.5]); g.fill();
    g.restore();
    rim(g, maskPath, "#ffffff", 3, 0.6);
    // one visor slit, dimmer than the others' — she is reading, not glowing
    lens(g, () => poly(g, [0, -2.6, 7.6, -1.3, 7.6, 0.7, -1, 0]), ac, c, guard ? 18 : 9);
    g.restore();

    /* --- back arm tucked behind, as a fencer holds it --- */
    jointLimb(g, -8, -11, -16, -15, -3, 5, dark);
    g.fillStyle = shade(c2, 0.1); g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.arc(-17, -15.5, 3, 0, 7); g.stroke(); g.fill();

    /* --- sword arm: the blade is a line, held point-forward --- */
    const ax = 16 + sw, ay = -8;
    jointLimb(g, 8, -11, (8 + ax) / 2, ay - 1, 2.5, 5.5, dark);
    limb(g, (8 + ax) / 2, ay - 1, ax - 2, ay, 7, mid_(c, c2));
    g.save(); g.translate(ax, ay);
    g.rotate(guard ? -0.5 : A.atkPhase >= 0 ? 0.06 : 0.18);
    // guard and grip
    plateRect(g, -5, -5, 9, 10, 3, deep, { up: 0.2, rim: false });
    g.strokeStyle = INK; g.lineWidth = 4.5; g.lineCap = "round";
    g.beginPath(); g.moveTo(4, -7); g.lineTo(4, 7); g.stroke();
    g.strokeStyle = ac; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(4, -7); g.lineTo(4, 7); g.stroke();
    // the blade: ink line, bright core, hot tip
    g.strokeStyle = INK; g.lineWidth = 5.5; g.lineCap = "butt";
    g.beginPath(); g.moveTo(5, 0); g.lineTo(52, 0); g.stroke();
    g.strokeStyle = mid_(c, "#ffffff"); g.lineWidth = 3;
    g.beginPath(); g.moveTo(5, 0); g.lineTo(52, 0); g.stroke();
    glow(g, ac, guard ? 16 : 7, () => {
      g.strokeStyle = ac; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(16, -0.6); g.lineTo(54, -0.6); g.stroke();
    });
    g.restore();

    /* --- the counter window, drawn as a mirror shell around her --- */
    if (guard) {
      g.save();
      g.globalCompositeOperation = "lighter";
      const k = 0.5 + Math.sin(A.time * 0.4) * 0.3;
      g.strokeStyle = hexA(ac, 0.5 * k); g.lineWidth = 2.4;
      for (let i = 0; i < 6; i++) {
        const a2 = (i / 6) * Math.PI * 2 + A.time * 0.05;
        g.save(); g.rotate(a2);
        g.beginPath(); g.moveTo(26, -7); g.lineTo(32, 0); g.lineTo(26, 7); g.stroke();
        g.restore();
      }
      g.restore();
    }
  },
},
];

/* ==========================================================================
   5a. NEWCOMERS — nine fighters, each built on a mechanic nobody else has

     RIME    freezing        chill slows; a freeze is shattered by the next hit
     HEX     curses          cursed foes fly further; Doom calls lightning
     SHADE   stealth         fades out; the first hit from hiding is an ambush
     VEX     lifesteal       every hit heals her; Siphon drains a foe directly
     FUSE    explosives      sticky bombs and a countdown Payload (replaces Ballast)
     RICO    ricochet        a disc that hits going out and coming back
     SPROUT  healing/roots   a flower that heals her; roots every grounded foe
     ECHO    time            Recall rewinds her; Deja Vu makes damage land twice
     TEMPO   rhythm          hits on the music's beat pay more; waves break shields

   Their numbers sit inside the original roster's ranges: lights 3-5%, heavies
   13-17%, supers worth roughly 18-26% when they fully land. The status effects
   live on Fighter (07_fighter.js) and the things they spawn in 08a_kinds.js.
   ========================================================================== */

/** A move object for an entity's hit, named so stale-move tracking works. */
function hitMove(name, o) { return Object.assign({ name, base: 2, scale: 0.5, angle: 45 }, o); }

const NEWCOMERS = [

/* ======================================================================== */
/* RIME — THE FROSTBITE                                                      */
/* ======================================================================== */
{
  id: "RIME", name: "RIME", tag: "THE FROSTBITE",
  blurb: "A walking cold front. Slows you down, then stops you dead.",

  light: { name: "Rime Jab", startup: 3, active: 3, recovery: 9,
    dmg: 4.2, base: 1.9, scale: 0.46, angle: 44, ox: 38, oy: -8, r: 23,
    onHit(f, d) { d.slowT = Math.max(d.slowT, 45); },

      FX.spark(hbAt(f, this).x, f.y - 8, f.ch.accent);
      Snd.tone(1800, 0.04, "triangle", 0.07, 2600);

  heavy: { name: "Glacier Spike", startup: 13, active: 4, recovery: 26,
    dmg: 15.5, base: 4.7, scale: 1.06, angle: 58, ox: 46, oy: 0, r: 32,
    onHit(f, d) { d.slowT = Math.max(d.slowT, 90); },
    onStart() { Snd.whoosh(1.3); },
    vfx(f) {
      const p = hbAt(f, this);
      // a spike of ice punching up out of the floor in front of her
      for (let i = 0; i < 3; i++)
        FX.blade(p.x + f.facing * (i - 1) * 14, p.y + 22, -Math.PI / 2 + (i - 1) * 0.25, 10, 60 - i * 8, 0.18,
                 i === 1 ? "#ffffff" : f.ch.color, { w: 14 - i * 3, life: 16 });
      FX.burst(p.x, p.y + 16, 12, "#d4f1ff", 5);

    } },

  special: { name: "Ice Lance", startup: 9, active: 2, recovery: 18,
    dmg: 0, base: 0, scale: 0, angle: 0, ox: 0, oy: 0, r: 0,
    desc: "Fires a lance of ice straight ahead. Whoever it hits is chilled for 2.5 seconds — slower on the ground and in the air.",
    tick(f, a) {

  super: { name: "Absolute Zero",
    desc: "A burst of cold around her deals 10% and freezes every foe in range solid for almost two seconds. The next hit on a frozen foe shatters the ice for +7% and extra knockback.",
    startup: 18, active: 6, recovery: 30,
    dmg: 10, base: 1.2, scale: 0.1, angle: 85, kbMul: 0.4, ox: 0, oy: 0, r: 0, radius: 230,
    onStart(f) { Snd.superCharge(); FX.flash("#a8e4ff", 0.35); },
    tick(f, a) {

/* ==========================================================================
   5b. WAVE 3A — four more fighters, each on a mechanic nobody else has

     MAGNA   magnetism     her hits magnetise; Pulse yanks them in, Reversal hurls
     GLITCH  teleporting   Blink hops behind you; Stack Overflow hops five times
     GRUDGE  rage          hits harder the more hurt he is; bottles a hit for later
     PRISM   light beams   a beam that bounces off the floor; a sweeping spectrum

   Numbers sit inside the 04a ranges: lights 3-5%, heavies 13-17%, supers
   18-26% when they fully land. What they spawn lives in 08b_kinds_a.js, and
   every kind there is prefixed with its fighter's id.

   cpuSpecial(f, target, d) / cpuSuperRange are hints for CPU.think(): when to
   fire the special, and how close a foe should be before the super is worth it.
   ========================================================================== */

/** The six bands Prism splits light into — her art and her beams share them. */
const PRISM_RAINBOW = ["#ff3b5c", "#ff9f1c", "#ffe14d", "#3dff8a", "#3db8ff", "#b05bff"];

/** Magna: magnetise a foe for six seconds. The filings that swarm them are an
    entity, so guests see who is magnetised without a new Fighter field. */
function magnaMark(f, d) {
  if (!d.alive || d.state === ST.DEAD) return;
  d.markT = 360; d.markBy = f;
  if (Entities.list.some(e => e.kind === "magna_mark" && e.owner === f && e.tgt === d)) return;

/** Glitch: drop an afterimage where she was and reappear somewhere else. */
function glitchHop(f, x, y) {
  const b = Stage.blast;
  x = clamp(x, b.left + 90, b.right - 90);
  y = clamp(y, b.top + 90, b.bottom - 140);

  FX.streak(f.x - 2, f.y, x - 2, y, "#ff2b4a");
  FX.streak(f.x + 2, f.y, x + 2, y, "#2bd8ff");
  f.x = f.px = x; f.y = f.py = y;
  f.grounded = false; f.groundSeg = null;

/** Grudge: 0 at 0%, 1 at 150% and beyond — how angry he is. */
function grudgeRage(f) { return clamp(f.percent / 150, 0, 1); }
const grudgeR1 = v => Math.round(v * 10) / 10;

/** Grudge's light and heavy: swap in a copy of the move scaled by his rage
    (up to +35% damage) and, if he bottled a hit, spend it on this swing. */
function grudgeArm(f, m) {

  if (!a || a.data !== m) return;

  d.dmg = m.dmg * (1 + 0.35 * p);
  d.kbMul = (m.kbMul || 1) * (1 + 0.18 * p);
  if (v.bt > 0 && v.sk === f.stocks) {

  }
  v.bt = 0;
  d.dmg = grudgeR1(d.dmg);
  a.data = d;
}

/** Volt's passive: arc a fraction of a hit on to the nearest OTHER foe
    within 220px of whoever was just struck. */
function voltChain(f, from, dmg) {
  let best = null, bd = 220;
  for (const o of Combat.foes(f)) {
    if (o === from || o.intangible()) continue;
    const d = dist(from.x, from.y, o.x, o.y);
    if (d < bd) { bd = d; best = o; }
  }
  if (!best) return;
  Entities.add("volt_link", f, { x: from.x, y: from.y - 6, r: 0, w: best.slot + 1, life: 10 });
  Combat.land(f, best, hitMove("Chain Arc", { dmg, base: 1.6, scale: 0.32, angle: 50 }), best.x, best.y);
  Snd.tone(2200, 0.05, "sawtooth", 0.07, 900);
}

/* ===== src/04d_wave3c.js ===== */
/* ==========================================================================
   5d. WAVE 3C — four more fighters, each on a mechanic nobody else has

     BULWARK  reflection    Reflector sends projectiles back as his; Aegis domes
     WRAITH   summoning     skeletons that walk to a foe and claw; Legion of four
     DRIFT    momentum      glides instead of stopping; faster = harder (+40%)
     QUILL    traps         caltrops that trip; a needle storm; light hits prick

   Numbers sit in the roster's ranges (lights 3-5%, heavies 13-17%, supers
   ~18-26% when they fully land). What they spawn lives in 08d_kinds_c.js,
   together with the reflect helpers and the two passive "watchers".
   ========================================================================== */

/* ---- Drift: momentum. Each attack remembers how fast he was going when he
        started it (f.v.spd); that speed pays out as bonus damage and knockback
        on the hit, up to +40% at a full Kickflip. ---- */
function w3cDriftBonus(f) { return clamp(((f.v.spd || 0) - 1.5) / 9, 0, 1) * 0.4; }
/** startAttack bleeds 58% of a grounded fighter's speed; a skater keeps 80%. */
function w3cDriftStart(f, keep) {
  w3cWatch(f, "drift_board");
  if (keep && f.grounded) f.vx *= 0.8 / 0.42;
  f.v.spd = Math.round(Math.abs(f.vx) * 10) / 10;
}
/** During his own attacks he rolls on: 5% decay a frame instead of 14%. */
function w3cDriftGlide(f) { if (f.grounded) f.vx *= 0.95 / 0.86; }
function w3cDriftHit(f, d, move) {
  if (d.state !== ST.HITSTUN || d.lastHitBy !== f) return;      // shielded, countered, armoured
  const b = w3cDriftBonus(f);
  if (b < 0.03) return;
  const extra = Math.round(move.dmg * b * 10) / 10;
  d.percent = Math.min(999, d.percent + extra);
  d.vx *= 1 + b * 0.5; d.vy *= 1 + b * 0.5;
  f.stats.damageDealt += extra;
  FX.damageText(d.x, d.y - 62, "+" + Math.round(b * 100) + "% SPEED", f.ch.accent);
}

/** Wraith: put a skeleton on the floor at (x, y). */
function w3cRaise(f, x, y, legion, log) {
  const fl = Stage.floorBelow(x, y - 30);
  const landed = fl !== null && fl - y < 60;
  return Entities.add("wraith_minion", f, { x, y: landed ? fl : y, vy: 0, landed, dir: f.facing,
    r: 14, w: 0, storm: !!legion, life: legion ? 300 : 360, cap: legion ? 2 : 3, hits: 0, cd: 0,
    spd: legion ? 3.4 : 2.4, log: log || null,
    move: legion ? hitMove("Legion", { dmg: 4, base: 2.4, scale: 0.5, angle: 50 })
                 : hitMove("Raise", { dmg: 3.2, base: 1.8, scale: 0.4, angle: 48 }) });
}

/* ==========================================================================
   5e. WAVE 3D — four fighters built on input and timing, not on statuses

     NOVA    charge shot    hold special to build a star; let go to throw it
     HOOK    grapple        a hook on a chain that reels whoever it catches in
     BLITZ   combo counter  every chained hit makes the next one hit harder
     TWIN    mirror clone   a copy of her that throws every attack she does

   Same balance bands as 04a: lights 3-5%, heavies 13-17%, supers ~18-26%
   when they fully land. Per-fighter scratch state lives in f.v (shipped in
   every snapshot); the things they spawn are in 08e_kinds_d.js, along with
   the CPU's notes on how to use each special.
   ========================================================================== */

/** Frames Blitz has to land his next hit before the combo drops. */
const BLITZ_WINDOW = 70;
/** Frames of charge for a full Star Charge. */
const NOVA_MAX_CHARGE = 60;

/** Blitz's combo bookkeeping, run from every one of his moves' onHit. The
    bonus is paid as extra damage (and a little extra launch) on top of the
    hit that just landed, using the combo count from *before* this hit. Moves
    flagged noBonus (the Ultra Combo, which scales on its own) still count. */
function blitzComboHit(f, d, m) {
  const v = f.v, now = Match.current ? Match.current.frames : 0;
  if (!v.combo || now - (v.at || 0) > BLITZ_WINDOW || v.stk !== f.stocks) v.combo = 0;
  const bonus = Math.min(0.48, v.combo * 0.06);
  if (bonus > 0 && !m.noBonus && d.state === ST.HITSTUN) {
    const extra = m.dmg * bonus;
    d.percent = Math.min(999, d.percent + extra);
    f.stats.damageDealt += extra;
    d.vx *= 1 + bonus * 0.5; d.vy *= 1 + bonus * 0.5;
    FX.damageText(d.x, d.y - 66, "+" + extra.toFixed(1), f.ch.accent);
  }
  v.combo = Math.min(99, v.combo + 1); v.at = now; v.stk = f.stocks;
  if (v.combo % 5 === 0) {
    FX.ring(f.x, f.y - 50, 6, 46, f.ch.accent, 3);
    Snd.tone(600 + v.combo * 40, 0.08, "square", 0.08, 1400);
  }
}

/** Live combo count for draw(): zero once the window has lapsed. */
function blitzComboNow(v) {
  if (!v || !v.combo) return 0;
  const now = Match.current ? Match.current.frames : 0;
  return now - (v.at || 0) <= BLITZ_WINDOW ? v.combo : 0;
}

/** Undo the canvas's facing flip so text reads the right way round. */
function w3dUnflip(g) { if (g.getTransform && g.getTransform().a < 0) g.scale(-1, 1); }

/** A five-point star path, centred on the origin. */
function w3dStarPath(g, ro, ri, rot) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const an = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? ri : ro;
    g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
  }
  g.closePath();
}

  id: "TWIN", name: "TWIN", tag: "THE DOUBLE",
  blurb: "There are two of her. Neither one will tell you which is the copy.",
  power: "Split leaves a mirror clone where she stood for five seconds. Facing the other way, it throws every light and heavy she does at 60% power. Doppelganger surrounds the nearest foe with three clones that strike at once.",
  color: "#ffb4c8", color2: "#5c1f3a", color3: "#2a0c1b", accent: "#9ff7ff",
  weight: 0.86, speed: 4.7, accel: 0.95, jump: 12.9, airSpeed: 4.6, fallMul: 0.96,
  size: { w: 30, h: 52 }, hurt: 24,
  specialCooldown: 330,

  light: { name: "Mirror Tap", startup: 3, active: 3, recovery: 9,
    dmg: 3.6, base: 1.6, scale: 0.42, angle: 45, ox: 36, oy: -8, r: 22,
    vfx(f) {
      FX.blade(f.x + f.facing * 8, f.y - 8, faceAng(f), 22, 52, 0.6, f.ch.color, { w: 7, life: 9 });
      Snd.tone(1400, 0.04, "triangle", 0.07, 1900);
    } },

  heavy: { name: "Reflection Kick", startup: 13, active: 4, recovery: 26,
    dmg: 14, base: 4.3, scale: 1.04, angle: 42, ox: 42, oy: 4, r: 31,
    onStart() { Snd.whoosh(1.3); },
    vfx(f) {
      FX.blade(f.x, f.y + 4, faceAng(f) + 0.8 * f.facing, 30, 76, 1.5, f.ch.color, { w: 12, life: 13, spin: -f.facing * 0.08 });
      FX.blade(f.x, f.y + 4, faceAng(f) + 0.7 * f.facing, 28, 70, 1.2, f.ch.accent, { w: 3, life: 10, core: false, spin: -f.facing * 0.08 });
      FX.shake(5);
      Snd.tone(600, 0.12, "triangle", 0.1, 300);
    } },

  special: { name: "Split", startup: 8, active: 2, recovery: 14,
    dmg: 0, base: 0, scale: 0, angle: 0, ox: 0, oy: 0, r: 0,
    desc: "Steps out of herself, leaving a mirror clone in place for five seconds. It faces the opposite way to her and throws every light and heavy she does at 60% power — catch a foe between the two of you.",
    tick(f, a) {
      if (a.t !== a.data.startup || a.fired) return;
      a.fired = true;
      for (const e of Entities.list) if (e.kind === "twin_clone" && e.owner === f) e.life = 1;
      Entities.add("twin_clone", f, { x: f.x, y: f.y, dir: -f.facing, r: 0, life: 300 });
      FX.ring(f.x, f.y, 6, 60, f.ch.accent, 3);
      FX.burst(f.x, f.y, 14, f.ch.accent, 4);
      f.vx = f.facing * 7;
      Snd.tone(1200, 0.14, "sine", 0.1, 600); Snd.tone(600, 0.14, "sine", 0.08, 1200, 0.05);
    } },

  super: { name: "Doppelganger",
    desc: "Three clones blink in around the nearest foe — left, right and above — and strike together for 7% each.",
    startup: 14, active: 30, recovery: 26,
    dmg: 0, base: 0, scale: 0, angle: 0, ox: 0, oy: 0, r: 0,
    strike: { name: "Doppelganger", dmg: 7, base: 3.4, scale: 0.78, angle: 55, unblockable: true },
    onStart(f) { Snd.superCharge(); FX.flash("#9ff7ff", 0.3); },
    tick(f, a) {
      const m = a.data;
      if (a.t !== m.startup) { if (a.t < m.startup) f.vx *= 0.7; return; }
      FX.banner("DOPPELGANGER", f.ch.accent);
      const t = Combat.nearestFoe(f, 700);
      const cx = t ? t.x : f.x, cy = t ? t.y : f.y;
      [[-78, 0], [78, 0], [0, -86]].forEach(([dx, dy], i) => {
        Entities.add("twin_double", f, { x: cx + dx, y: cy + dy, dir: dx > 0 ? -1 : dx < 0 ? 1 : f.facing,
          r: 0, life: 24, tgt: t && !t.intangible() ? t : null, ox: dx, oy: dy,
          move: Object.assign({}, m.strike, { name: m.strike.name + " " + (i + 1) }) });   // own names: no staling each other
        FX.ring(cx + dx, cy + dy, 4, 44, f.ch.accent, 2);
      });
      Snd.tone(900, 0.2, "sine", 0.1, 1800);
    } },

  /* ---- art: a mime-sharp duelist split down the middle — one half rose,
           one half mirror-cyan — with a cracked hand mirror for a weapon.
           Her clones are this same drawing, faded. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c, dark = A.flash ? "#ffd4e0" : c2, deep = A.flash ? "#ffb8cc" : c3;
    const half = A.flash ? "#ffffff" : ac;
    const v = A.v || {}, sw = swing(A, -10, 42);
    if (!v.clone) aura(g, 0, -4, 30, c, 0.14);

    // twin ribbons trailing from the back of the head, one of each colour
    g.save(); g.lineCap = "round";
    for (let i = 0; i < 2; i++) {
      const wv = Math.sin(A.time * 0.12 + i * 2) * 3 - (A.vx || 0) * 0.6;
      g.strokeStyle = INK; g.lineWidth = 5;
      g.beginPath(); g.moveTo(-5, -30 + i * 3); g.quadraticCurveTo(-14, -30 + wv + i * 4, -20, -20 + wv + i * 3); g.stroke();
      g.strokeStyle = i ? half : body; g.lineWidth = 2.8; g.stroke();
    }
    g.restore();

    const st = Math.sin(A.runPhase) * (A.running ? 12 : 0);
    jointLimb(g, -4, 8, -8 + st, 24, -4, 5, dark);
    jointLimb(g, 5, 8, 9 - st, 24, 4, 5, deep);
    plateRect(g, -13 + st, 22, 10, 6, 2.5, body, { up: 0.3 });
    plateRect(g, 4 - st, 22, 10, 6, 2.5, half, { up: 0.3 });

    // bodysuit, split down the middle: rose behind, mirror in front
    plate(g, [-8, -15, 0, -15, 0, 9, -9, 9], body, { up: 0.3, down: 0.36, under: true });
    plate(g, [0, -15, 8, -15, 9, 9, 0, 9], half, { up: 0.3, down: 0.36, under: true });
    // a diamond ruff at the collar
    plate(g, [-9, -15, 0, -11, 9, -15, 0, -18], dark, { ink: 2, up: 0.3 });

    // head: a half-and-half mask
    g.save(); g.translate(1, -25);
    const head = () => { g.beginPath(); g.ellipse(0, 0, 6.6, 7.4, 0, 0, 7); };
    ink(g, head, vol(g, -8, 8, "#fbeef2", 0.2, 0.3));
    g.save(); head(); g.clip();
    g.fillStyle = hexA(ac, 0.5); g.fillRect(0, -8, 8, 16);
    g.restore();
    lens(g, () => poly(g, [1.5, -1.5, 5.5, -2, 5.5, 0, 1.5, 0.4]), A.flash ? c : "#ffffff", ac, 10);
    g.fillStyle = INK; g.fillRect(1, 3.6, 4, 1.1);
    plate(g, [-7, -3, -4, -9, 5, -9, 7, -4, 0, -6], dark, { ink: 2, up: 0.4 });   // bob cut
    g.restore();

    jointLimb(g, -7, -11, -13, -1, -3, 4.4, dark);

    // mirror arm: a hand mirror held out, its glass catching the light
    const ax = 13 + sw, ay = -6;
    jointLimb(g, 7, -11, (7 + ax) / 2, ay - 1, 2.5, 4.6, deep);
    limb(g, (7 + ax) / 2, ay - 1, ax - 2, ay, 5.2, "#fbeef2");
    g.save(); g.translate(ax + 2, ay); g.rotate(A.atkPhase >= 0 ? 0 : -0.5);
    g.strokeStyle = INK; g.lineWidth = 4; g.lineCap = "round";
    g.beginPath(); g.moveTo(0, 0); g.lineTo(8, 0); g.stroke();
    g.strokeStyle = "#c9a24a"; g.lineWidth = 2; g.stroke();
    ink(g, () => { g.beginPath(); g.ellipse(15, 0, 7, 9, 0, 0, 7); }, "#c9a24a", 2.4);
    lens(g, () => { g.beginPath(); g.ellipse(15, 0, 5, 7, 0, 0, 7); }, hexA(ac, 0.9), ac, 8);
    g.strokeStyle = hexA("#ffffff", 0.8); g.lineWidth = 1;
    g.beginPath(); g.moveTo(12, -4); g.lineTo(16, 1); g.lineTo(14, 5); g.stroke();      // the crack
    g.restore();
  },
},
];

WAVE3D.forEach(c => { CHAR_BY_ID[c.id] = c; });

/* ==========================================================================
   6. STAGES — eight maps that each play and read differently

   Platforms are authored in stage-local space around a fixed pivot point and
   never rotate — every deck stays flat. Side platforms still drift, heat up,
   crumble, retract, ride up and down, or bounce on their own schedules; one
   deck is a conveyor and one summit has wind. Blast zones move too, so some
   maps kill far earlier than others.
   ========================================================================== */

const STAGES = [

/* ------------------------------------------------------------------ 1 --- */
{
  id: "YARD", name: "NEON YARD", tag: "NEON · BALANCED", deck: "neon",
  blurb: "The proving ground. Flat deck, generous ledges, room to learn the swing.",
  pivot: { x: 800, y: 580 },
  blast: { left: -420, right: 2020, top: -520, bottom: 1420 },
  pal: { a: "#00e5ff", b: "#ff2e88", plat: "#1b1536", platEdge: "#00e5ff",
         soft: "#8a7fff", ink: "#07060f" },
  music: { bpm: 124, root: 196, scale: [0, 3, 5, 7, 10], wave: "triangle", hats: true,
           seq: [0, -1, 2, -1, 4, -1, 2, 3, 0, -1, 5, -1, 4, 2, -1, -1] },
  layout: [
    { x1: -310, y1: 0,    x2: 310,  y2: 0,    solid: true,  main: true,  thick: 26 },
    { x1: -322, y1: -186, x2: -150, y2: -186, solid: false, thick: 12,
      drift: { range: 54, speed: 0.011 }, phase: 0 },
    { x1:  150, y1: -186, x2:  322, y2: -186, solid: false, thick: 12,
      drift: { range: 54, speed: 0.011 }, phase: 286 },
    { x1:  -82, y1: -316, x2:   82, y2: -316, solid: false, thick: 12 },
  ],

  drawBg(g, t) {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0b0820"); grad.addColorStop(0.55, "#0a0718"); grad.addColorStop(1, "#15062a");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    const rg = g.createRadialGradient(W / 2, H * 0.72, 40, W / 2, H * 0.72, W * 0.72);
    rg.addColorStop(0, "rgba(255,46,136,.17)");
    rg.addColorStop(0.5, "rgba(0,229,255,.07)");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H);

    // a slow rotating emblem ring, far back — gives the void a centre
    g.save();
    g.translate(W / 2, H * 0.46);
    g.rotate(t * 0.04);
    g.strokeStyle = "rgba(0,229,255,.07)"; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 230, 0, 7); g.stroke();
    g.beginPath(); g.arc(0, 0, 178, 0, 7); g.stroke();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      g.strokeStyle = `rgba(255,46,136,${i % 3 === 0 ? 0.12 : 0.05})`;
      g.lineWidth = i % 3 === 0 ? 5 : 2;
      g.beginPath();
      g.moveTo(Math.cos(a) * 178, Math.sin(a) * 178);
      g.lineTo(Math.cos(a) * 230, Math.sin(a) * 230);
      g.stroke();
    }
    g.restore();

    // distant neon skyline on the horizon
    g.save();
    const hz = H * 0.56;
    for (let i = 0; i < 26; i++) {
      const bw = 34 + hash(i * 3) * 46;
      const bx = i * 52 - 20 + Math.sin(t * 0.05 + i) * 1.5;
      const bh = 40 + hash(i * 7) * 150;
      g.fillStyle = "rgba(9,6,24,.92)";
      g.fillRect(bx, hz - bh, bw, bh);
      g.fillStyle = i % 2 ? "rgba(0,229,255,.16)" : "rgba(255,46,136,.14)";
      g.fillRect(bx, hz - bh, bw, 2);
      // lit windows
      for (let k = 0; k < 4; k++) {
        if (hash(i * 13 + k) > 0.6) {
          g.fillStyle = i % 2 ? "rgba(0,229,255,.22)" : "rgba(255,46,136,.2)";
          g.fillRect(bx + 6 + k * 9, hz - bh + 14 + (k % 3) * 22, 4, 7);
        }
      }
    }
    g.restore();

    // perspective grid
    g.save();
    g.strokeStyle = "rgba(0,229,255,.12)"; g.lineWidth = 1;
    for (let i = -14; i <= 14; i++) {
      g.beginPath(); g.moveTo(W / 2 + i * 26, hz);
      g.lineTo(W / 2 + i * 120 + Math.sin(t * 0.3 + i) * 8, H); g.stroke();
    }
    for (let j = 1; j < 16; j++) {
      const p = j / 16, y = hz + Math.pow(p, 2.3) * (H - hz);
      g.globalAlpha = 0.10 + p * 0.14;
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    g.restore();

    // drifting motes
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 30; i++) {
      const p = (t * 24 + i * 97) % (H + 120);
      g.globalAlpha = 0.2;
      g.fillStyle = i % 3 === 0 ? "#ff2e88" : i % 3 === 1 ? "#00e5ff" : "#b6ff3b";
      g.beginPath(); g.arc(hash(i) * W, H - p, 1.6 + (i % 3), 0, 7); g.fill();
    }
    g.restore();

    // foreground: gantry rails across the bottom corners, out of focus
    g.save();
    g.globalAlpha = 0.5;
    g.strokeStyle = "#06040f"; g.lineWidth = 16; g.lineCap = "round";
    g.beginPath(); g.moveTo(-20, H + 10); g.lineTo(150, H - 70); g.stroke();
    g.beginPath(); g.moveTo(W + 20, H + 10); g.lineTo(W - 150, H - 70); g.stroke();
    g.strokeStyle = "rgba(0,229,255,.1)"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-20, H + 2); g.lineTo(150, H - 78); g.stroke();
    g.beginPath(); g.moveTo(W + 20, H + 2); g.lineTo(W - 150, H - 78); g.stroke();
    g.restore();
  },
},

/* ------------------------------------------------------------------ 2 --- */
{
  id: "FOUNDRY", name: "CINDER FOUNDRY", tag: "MOLTEN · CLOSE QUARTERS", deck: "cast",
  blurb: "A casting beam over an open crucible. Tight deck, the floor is very close, and the drop is fatal.",
  pivot: { x: 800, y: 560 },

  blast: { left: -430, right: 2030, top: -560, bottom: 1140 },
  pal: { a: "#ff8a1f", b: "#ff3b1f", plat: "#241711", platEdge: "#ff8a1f",
         soft: "#c2683a", ink: "#140a06" },
  music: { bpm: 104, root: 147, scale: [0, 2, 3, 7, 8], wave: "sawtooth", hats: false,
           seq: [0, -1, -1, 1, 3, -1, 0, -1, 4, -1, 3, 1, 0, -1, -1, -1] },
  layout: [

    { x1: -302, y1: 0,    x2: 302,  y2: 0,    solid: true,  main: true, thick: 30 },
    { x1: -348, y1: -168, x2: -214, y2: -168, solid: false, thick: 11,
      hot: { period: 320, on: 110, warn: 55, dmg: 1.8 }, phase: 0 },
    { x1:  214, y1: -168, x2:  348, y2: -168, solid: false, thick: 11,
      hot: { period: 320, on: 110, warn: 55, dmg: 1.8 }, phase: 160 },
  ],

  drawBg(g, t) {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#160b06"); grad.addColorStop(0.5, "#1d0d06"); grad.addColorStop(1, "#3d1205");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    // the crucible glow from below, breathing
    const pulse = 0.72 + Math.sin(t * 1.1) * 0.12;
    const rg = g.createRadialGradient(W / 2, H * 1.04, 20, W / 2, H * 1.04, W * 0.78 * pulse);
    rg.addColorStop(0, "rgba(255,196,60,.55)");
    rg.addColorStop(0.35, "rgba(255,90,25,.30)");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H);

    g.save();
    g.fillStyle = "#0d0604";
    g.beginPath();
    g.moveTo(W * 0.5 - 430, H);
    g.lineTo(W * 0.5 - 430, H * 0.42);
    g.arc(W * 0.5, H * 0.42, 430, Math.PI, 0);
    g.lineTo(W * 0.5 + 430, H);

    /* The arch as one continuous masonry band with joint lines cut across it.

    g.strokeStyle = "rgba(255,138,31,.26)";

    g.beginPath(); g.arc(W * 0.5, H * 0.42, 453, Math.PI, 0); g.stroke();
    // joints

    for (let i = 0; i <= 20; i++) {
      const a = Math.PI + (i / 20) * Math.PI;

      g.lineTo(W * 0.5 + Math.cos(a) * 453, H * 0.42 + Math.sin(a) * 453);

    for (let i = 0; i < 6; i++) {

      g.fillStyle = "#0b0402";
      roundRect(g, x, H * 0.30, 112, 180, 8); g.fill();
      const f = 0.5 + Math.sin(t * 2 + i * 1.7) * 0.5;

      roundRect(g, x + 14, H * 0.30 + 20, 84, 140, 6); g.fill();
      // grate bars over each bay

      for (let k = 0; k < 4; k++) {
        g.beginPath();
        g.moveTo(x + 22 + k * 23, H * 0.30 + 20);
        g.lineTo(x + 22 + k * 23, H * 0.30 + 160); g.stroke();
      }
      g.strokeStyle = "rgba(255,138,31,.14)"; g.lineWidth = 2;
      roundRect(g, x, H * 0.30, 112, 180, 8); g.stroke();
    }
    g.restore();

    // A ladle pouring, hung far enough in that it is not clipped by the frame.
    g.save();
    const swing2 = Math.sin(t * 0.35) * 0.09;
    g.translate(W * 0.16, H * 0.055);
    g.rotate(swing2);
    g.strokeStyle = "rgba(80,54,36,.9)"; g.lineWidth = 7;
    g.beginPath(); g.moveTo(0, -H * 0.06); g.lineTo(0, 46); g.stroke();
    // the bucket, solid with a hot rim

    g.strokeStyle = "rgba(14,7,3,.95)"; g.lineWidth = 5;
    poly(g, [-36, 46, 36, 46, 25, 100, -25, 100]); g.stroke(); g.fill();
    g.strokeStyle = "rgba(255,150,40,.5)"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-36, 48); g.lineTo(36, 48); g.stroke();
    g.fillStyle = "rgba(255,200,90,.5)";
    g.beginPath(); g.ellipse(0, 48, 34, 5, 0, 0, 7); g.fill();
    // the pour
    g.save(); g.globalCompositeOperation = "lighter";
    const pg = g.createLinearGradient(0, 100, 0, H);
    pg.addColorStop(0, "rgba(255,220,120,.7)");
    pg.addColorStop(0.4, "rgba(255,130,30,.28)");
    pg.addColorStop(1, "rgba(255,80,20,0)");
    g.fillStyle = pg;

    g.moveTo(-5, 100); g.lineTo(5, 100);
    g.lineTo(13 + Math.sin(t * 3) * 4, H); g.lineTo(-13 + Math.sin(t * 3) * 4, H);

    g.strokeStyle = "rgba(120,84,56,.5)"; g.lineWidth = 3;

      const x = 60 + i * 150 + Math.sin(t * 0.5 + i) * 5;
      const len = 120 + hash(i * 3) * 180;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + Math.sin(t * 0.6 + i) * 9, len); g.stroke();

    g.restore();

    // rising embers
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 54; i++) {
      const sp = 26 + hash(i) * 50;
      const p = (t * sp + i * 131) % (H + 180);
      const x = hash(i * 7) * W + Math.sin(t * 1.4 + i) * 22;
      const a = 0.65 * (1 - p / (H + 180));
      g.globalAlpha = Math.max(0, a);
      g.fillStyle = i % 4 === 0 ? "#ffe9a8" : "#ff7a1f";
      g.beginPath(); g.arc(x, H + 60 - p, 1 + hash(i * 11) * 2.4, 0, 7); g.fill();
    }
    g.restore();

    // heat haze band
    g.save(); g.globalAlpha = 0.12; g.fillStyle = "#ff6a18";
    g.fillRect(0, H * 0.86, W, H * 0.14); g.restore();

    // foreground: pipework across the bottom, nearly black
    g.save();
    g.strokeStyle = "#0a0503"; g.lineWidth = 26; g.lineCap = "butt";
    g.beginPath(); g.moveTo(-10, H - 26); g.lineTo(W + 10, H - 40); g.stroke();
    g.strokeStyle = "rgba(255,138,31,.09)"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(-10, H - 36); g.lineTo(W + 10, H - 50); g.stroke();
    for (let i = 0; i < 6; i++) {
      const x = 80 + i * 230;
      g.fillStyle = "#0a0503";
      roundRect(g, x, H - 48, 26, 48, 4); g.fill();
    }
    g.restore();
  },
},

{
  id: "DRIFT", name: "CIRRUS DRIFT", tag: "DAWN · TWITCHY", deck: "cloud",
  blurb: "Dawn above the cloud deck. Side platforms drift fast, so footing never sits still for long.",
  pivot: { x: 800, y: 600 },
  // open sky: still the most forgiving map, but not so wide it stalemates
  // Tightened again: with damage output down across the board (stale moves,
  // smaller hitboxes, nerfed supers) the most forgiving stage started running
  // to the clock -- 3 of 12 test matches timed out at 106s average.
  blast: { left: -380, right: 1980, top: -620, bottom: 1235 },
  pal: { a: "#ffb4d6", b: "#8fd7ff", plat: "#efe3f3", platEdge: "#ff9ec7",
         soft: "#b89ede", ink: "#2b2140" },
  music: { bpm: 96, root: 262, scale: [0, 2, 4, 7, 9], wave: "sine", hats: false,
           seq: [0, 2, 4, -1, 2, 4, 5, -1, 4, 2, 0, -1, 2, -1, -1, -1] },
  layout: [
    // wide deck with far-out islands — lots of stage, few blast zones
    { x1: -340, y1: 0,    x2: 340,  y2: 0,    solid: true,  main: true, thick: 24 },
    { x1: -430, y1: -150, x2: -266, y2: -150, solid: false, thick: 12,
      crumble: { delay: 54, gone: 150 } },
    { x1:  266, y1: -150, x2:  430, y2: -150, solid: false, thick: 12,
      crumble: { delay: 54, gone: 150 } },
    { x1: -110, y1: -284, x2:  110, y2: -284, solid: false, thick: 12 },
  ],

  drawBg(g, t) {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#2a2a63"); grad.addColorStop(0.38, "#7d5e97");
    grad.addColorStop(0.68, "#eb9a96"); grad.addColorStop(1, "#ffd3a6");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    // low sun
    const sx = W * 0.5, sy = H * 0.70;
    const sg = g.createRadialGradient(sx, sy, 10, sx, sy, 300);
    sg.addColorStop(0, "rgba(255,247,214,.95)");
    sg.addColorStop(0.3, "rgba(255,196,150,.45)");
    sg.addColorStop(1, "rgba(255,170,140,0)");
    g.fillStyle = sg; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,250,230,.9)";
    g.beginPath(); g.arc(sx, sy, 54, 0, 7); g.fill();

    // cloud decks at three parallax depths
    const deck = (yBase, speed, scale, alpha, col) => {
      g.save(); g.globalAlpha = alpha; g.fillStyle = col;
      for (let i = 0; i < 10; i++) {
        const seed = i * 13 + yBase;
        const span = W + 500;
        const x = ((hash(seed) * span) + t * speed) % span - 250;
        const y = yBase + hash(seed * 3) * 50;
        const w = (90 + hash(seed * 5) * 150) * scale;
        const h = (20 + hash(seed * 7) * 18) * scale;
        g.beginPath();
        g.ellipse(x, y, w, h, 0, 0, 7);
        g.ellipse(x - w * 0.45, y + h * 0.3, w * 0.55, h * 0.72, 0, 0, 7);
        g.ellipse(x + w * 0.5, y + h * 0.25, w * 0.5, h * 0.66, 0, 0, 7);
        g.fill();
      }
      g.restore();
    };
    /* Distant peaks. Drawn before any cloud deck and fairly opaque: at low
       alpha over a bright sky they read as ghostly triangles hanging in the
       air rather than mountains behind the weather. Their bases sit low
       enough that the lower cloud decks cover them. */
    g.save();
    {
      const base = H * 0.68;
      const peaks = [];
      for (let i = 0; i < 7; i++)
        peaks.push({ x: i * 230 - 90 + Math.sin(i) * 40, h: 80 + hash(i * 17) * 130 });

      /* Each layer is ONE path containing every peak, filled once. Filling
         them one at a time stacked the translucency wherever two peaks
         overlapped, which painted a hard dark V into the middle of the
         range that looked like an upside-down mountain. */
      const fillAll = (alpha, col, build) => {
        g.globalAlpha = alpha; g.fillStyle = col;
        g.beginPath();
        for (const p of peaks) build(p);
        g.fill();
      };
      fillAll(0.6, "#64487d", p => {
        g.moveTo(p.x - 160, base); g.lineTo(p.x, base - p.h);
        g.lineTo(p.x + 160, base); g.closePath();
      });
      // sunward faces, catching the dawn
      fillAll(0.3, "#c98ba0", p => {
        g.moveTo(p.x, base - p.h); g.lineTo(p.x + 160, base);
        g.lineTo(p.x + 20, base); g.closePath();
      });
      // snow caps, following the ridge so they do not float
      fillAll(0.5, "#fff0f6", p => {
        const cw2 = 36, ch2 = p.h * 0.2;
        g.moveTo(p.x, base - p.h);
        g.lineTo(p.x + cw2, base - p.h + ch2);
        g.lineTo(p.x + 12, base - p.h + ch2 * 0.7);
        g.lineTo(p.x - 10, base - p.h + ch2);
        g.lineTo(p.x - cw2, base - p.h + ch2 * 0.85);
        g.closePath();
      });
    }
    g.restore();

    deck(H * 0.30, 7, 0.8, 0.22, "#ffffff");
    deck(H * 0.52, 14, 1.0, 0.34, "#ffe9f2");

    // floating stone islands, drifting slowly past
    g.save();
    for (let i = 0; i < 4; i++) {
      const span = W + 700;
      const ix = ((hash(i * 23) * span) + t * (9 + i * 4)) % span - 350;
      const iy = H * (0.34 + hash(i * 29) * 0.22) + Math.sin(t * 0.4 + i) * 7;
      const s = 0.45 + hash(i * 31) * 0.5;
      g.save(); g.translate(ix, iy); g.scale(s, s);
      g.globalAlpha = 0.55;
      g.fillStyle = "#9a7fb8";
      poly(g, [-60, 0, 60, 0, 34, 30, -30, 30]); g.fill();
      g.fillStyle = "#7a5f98";
      poly(g, [-30, 30, 34, 30, 6, 72, -8, 72]); g.fill();
      g.fillStyle = "rgba(190,255,200,.5)";
      g.beginPath(); g.ellipse(0, -2, 58, 7, 0, 0, 7); g.fill();
      g.restore();
    }
    g.restore();

    deck(H * 0.86, 26, 1.5, 0.55, "#ffffff");

    // birds
    g.save();
    g.strokeStyle = "rgba(60,44,70,.45)"; g.lineWidth = 2; g.lineCap = "round";
    for (let i = 0; i < 5; i++) {
      const x = ((t * 34 + i * 260) % (W + 200)) - 100;
      const y = H * 0.24 + Math.sin(t * 0.8 + i) * 16 + i * 14;
      const f = Math.sin(t * 5 + i * 2) * 4;
      g.beginPath();
      g.moveTo(x - 8, y + f); g.lineTo(x, y - 2); g.lineTo(x + 8, y + f);
      g.stroke();
    }
    g.restore();

    // foreground wisps blowing across the camera
    g.save();
    g.globalAlpha = 0.3; g.fillStyle = "#ffffff";
    for (let i = 0; i < 4; i++) {
      const span = W + 900;
      const x = ((hash(i * 41) * span) + t * 70) % span - 450;
      const y = H * (0.78 + hash(i * 43) * 0.2);
      g.beginPath();
      g.ellipse(x, y, 260, 26, 0, 0, 7);
      g.ellipse(x - 150, y + 12, 140, 18, 0, 0, 7);
      g.fill();
    }
    g.restore();
  },
},

{
  id: "VAULT", name: "NULL VAULT", tag: "CRAMPED · LETHAL", deck: "grate",
  blurb: "A sealed test chamber. Tiny deck, walls right there, and nowhere far to run.",
  pivot: { x: 800, y: 560 },
  // walls are close — everything kills much earlier here
  blast: { left: -215, right: 1815, top: -360, bottom: 1250 },
  pal: { a: "#39ff9e", b: "#17c0ff", plat: "#0a1a14", platEdge: "#39ff9e",
         soft: "#1e7a56", ink: "#030a07" },
  music: { bpm: 140, root: 165, scale: [0, 1, 5, 7, 8], wave: "square", hats: true,
           seq: [0, 0, -1, 1, 0, -1, 2, -1, 4, -1, 2, 1, 0, -1, 3, -1] },
  layout: [
    // short deck, one high centre platform, nothing to run to
    { x1: -256, y1: 0,    x2: 256,  y2: 0,    solid: true,  main: true, thick: 26 },
    { x1: -118, y1: -172, x2:  118, y2: -172, solid: false, thick: 11,
      retract: { period: 420, on: 260 } },
  ],

  drawBg(g, t) {
    g.fillStyle = "#030907"; g.fillRect(0, 0, W, H);

    // chamber shell
    g.save();
    const vg = g.createRadialGradient(W / 2, H * 0.5, 60, W / 2, H * 0.5, W * 0.62);
    vg.addColorStop(0, "rgba(57,255,158,.10)");
    vg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    g.restore();

    // the containment ring behind the deck: this is a test chamber, and
    // something is clearly meant to be held in the middle of it
    g.save();
    g.translate(W / 2, H * 0.52);
    g.strokeStyle = "rgba(57,255,158,.12)"; g.lineWidth = 20;
    g.beginPath(); g.arc(0, 0, 250, 0, 7); g.stroke();
    g.strokeStyle = "rgba(57,255,158,.22)"; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 260, 0, 7); g.stroke();
    g.beginPath(); g.arc(0, 0, 240, 0, 7); g.stroke();
    // emitter blocks at the cardinals, pulsing in sequence
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + t * 0.12;
      const lit = (Math.sin(t * 2.4 - i * 0.7) + 1) / 2;
      g.save();
      g.translate(Math.cos(a) * 250, Math.sin(a) * 250);
      g.rotate(a);
      g.fillStyle = "#061a12";
      g.strokeStyle = `rgba(57,255,158,${0.2 + lit * 0.4})`; g.lineWidth = 2;
      roundRect(g, -14, -20, 28, 40, 4); g.fill(); g.stroke();
      g.fillStyle = `rgba(57,255,158,${0.15 + lit * 0.5})`;
      roundRect(g, -7, -13, 14, 26, 3); g.fill();
      g.restore();
    }
    g.restore();

    // stencilled chamber markings
    g.save();
    g.globalAlpha = 0.14;
    g.font = `900 72px ${FONT_DISPLAY}`;
    g.textAlign = "center"; g.fillStyle = "#39ff9e";
    g.fillText("VAULT 04", W / 2, H * 0.26);
    g.font = `700 13px ${FONT_MONO}`;
    g.fillText("STRUCTURAL TOLERANCE EXCEEDED · CONTAINMENT ADVISED", W / 2, H * 0.30);
    g.restore();

    // falling glyph columns
    g.save();
    g.font = '13px ui-monospace, Menlo, monospace';
    g.textAlign = "center";
    const cols = 40;
    for (let i = 0; i < cols; i++) {
      const x = (i + 0.5) * (W / cols);
      const speed = 40 + hash(i) * 110;
      const head = ((t * speed + hash(i * 5) * 900) % (H + 420)) - 60;
      for (let j = 0; j < 9; j++) {
        const y = head - j * 17;
        if (y < -20 || y > H + 20) continue;
        const a = (1 - j / 9) * 0.5;
        g.fillStyle = j === 0 ? `rgba(220,255,240,${a + 0.4})` : `rgba(57,255,158,${a * 0.6})`;
        const ch = String.fromCharCode(0x30a0 + ((i * 7 + j * 13 + ((t * 6) | 0)) % 90));
        g.fillText(ch, x, y);
      }
    }
    g.restore();

    // wall ribs, marking how close the blast zones are
    g.save();
    g.strokeStyle = "rgba(57,255,158,.16)"; g.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const y = 40 + i * 72;
      g.beginPath(); g.moveTo(0, y); g.lineTo(58, y + 22); g.stroke();
      g.beginPath(); g.moveTo(W, y); g.lineTo(W - 58, y + 22); g.stroke();
    }
    g.strokeStyle = "rgba(57,255,158,.30)"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(24, 0); g.lineTo(24, H); g.moveTo(W - 24, 0); g.lineTo(W - 24, H); g.stroke();
    g.restore();

    // scanlines
    g.save(); g.globalAlpha = 0.16; g.fillStyle = "#000";
    for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
    g.restore();
    g.save();
    g.globalAlpha = 0.05 + Math.abs(Math.sin(t * 0.7)) * 0.05;
    g.fillStyle = "#39ff9e"; g.fillRect(0, (t * 180) % H, W, 60);
    g.restore();

    // foreground: the chamber's own window frame, hard black, hugging the edges
    g.save();
    g.fillStyle = "#020705";
    g.fillRect(0, 0, 14, H); g.fillRect(W - 14, 0, 14, H);
    g.fillRect(0, 0, W, 10); g.fillRect(0, H - 10, W, 10);
    // corner gussets
    g.fillStyle = "#04120c";
    for (const [cx, cy, sx, sy] of [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]]) {
      g.save(); g.translate(cx, cy); g.scale(sx, sy);
      poly(g, [0, 0, 74, 0, 0, 74]); g.fill();
      g.strokeStyle = "rgba(57,255,158,.18)"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(74, 0); g.lineTo(0, 74); g.stroke();
      g.restore();
    }
    g.restore();
  },
},

{
  id: "SPIRE", name: "STEEL SPIRE", tag: "NIGHT · VERTICAL", deck: "steel",
  blurb: "A skyscraper going up at midnight. Two work lifts ride the frame, so the high ground keeps moving.",
  pivot: { x: 800, y: 600 },
  blast: { left: -390, right: 1990, top: -520, bottom: 1340 },
  pal: { a: "#ffc23d", b: "#3d8bff", plat: "#20232c", platEdge: "#ffc23d",
         soft: "#8fa3c8", ink: "#07080d" },
  music: { bpm: 116, root: 175, scale: [0, 3, 5, 7, 10], wave: "square", hats: true,
           seq: [0, -1, 3, -1, 0, 2, -1, 4, 0, -1, 3, -1, 5, -1, 4, 2] },
  layout: [
    { x1: -360, y1: 0,    x2: 360,  y2: 0,    solid: true,  main: true, thick: 28 },
    // the two lifts run out of step: one is always near the top as the other bottoms out
    { x1: -330, y1: -150, x2: -176, y2: -150, solid: false, thick: 13,
      lift: { range: 95, speed: 0.016 }, phase: 0 },
    { x1:  176, y1: -150, x2:  330, y2: -150, solid: false, thick: 13,
      lift: { range: 95, speed: 0.016 }, phase: 196 },
    { x1:  -92, y1: -340, x2:   92, y2: -340, solid: false, thick: 12 },
  ],

  drawBg(g, t) {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#04060f"); grad.addColorStop(0.6, "#0c1430"); grad.addColorStop(1, "#1b2142");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    // stars and a hazy moon
    g.save();
    for (let i = 0; i < 60; i++) {
      g.globalAlpha = 0.25 + hash(i * 5) * 0.5 * (0.6 + Math.sin(t * 1.3 + i) * 0.4);
      g.fillStyle = "#dfe8ff";
      g.fillRect(hash(i) * W, hash(i * 3) * H * 0.45, 1.6, 1.6);
    }
    g.globalAlpha = 1;
    const mg = g.createRadialGradient(W * 0.78, H * 0.17, 10, W * 0.78, H * 0.17, 120);
    mg.addColorStop(0, "rgba(255,240,210,.9)"); mg.addColorStop(0.25, "rgba(255,226,170,.35)");
    mg.addColorStop(1, "rgba(255,220,160,0)");
    g.fillStyle = mg; g.fillRect(0, 0, W, H);
    g.fillStyle = "#fff4dc"; g.beginPath(); g.arc(W * 0.78, H * 0.17, 30, 0, 7); g.fill();
    g.restore();

    // two layers of skyline, the far one blue, the near one with lit windows
    const skyline = (base, seed, col, lit, scale) => {
      g.save();
      for (let i = 0; i < 18; i++) {
        const bw = (50 + hash(seed + i * 3) * 60) * scale;
        const bx = i * 78 * scale - 30 + hash(seed + i) * 20;
        const bh = (90 + hash(seed + i * 7) * 220) * scale;
        g.fillStyle = col; g.fillRect(bx, base - bh, bw, bh + 4);
        if (!lit) continue;
        for (let r = 0; r < bh / 18 - 1; r++) for (let c = 0; c < bw / 14 - 1; c++) {
          const k = hash(seed + i * 97 + r * 13 + c * 7);
          if (k < 0.62) continue;
          const on = 0.5 + Math.sin(t * 0.4 + k * 40) * 0.5 > 0.12;
          if (!on) continue;
          g.fillStyle = k > 0.9 ? "rgba(140,190,255,.5)" : "rgba(255,206,120,.42)";
          g.fillRect(bx + 6 + c * 14, base - bh + 8 + r * 18, 6, 8);
        }
      }
      g.restore();
    };
    skyline(H * 0.74, 11, "#111a38", false, 0.8);
    skyline(H * 0.86, 41, "#0a0f22", true, 1.0);

    // a tower crane swinging slowly behind the site
    g.save();
    g.translate(W * 0.2, H * 0.12);
    g.strokeStyle = "rgba(255,194,61,.32)"; g.lineWidth = 3;
    for (let y = 0; y < H * 0.75; y += 34) {
      g.beginPath(); g.moveTo(-14, y); g.lineTo(14, y + 34); g.moveTo(14, y); g.lineTo(-14, y + 34); g.stroke();
    }
    g.beginPath(); g.moveTo(-14, 0); g.lineTo(-14, H); g.moveTo(14, 0); g.lineTo(14, H); g.stroke();
    g.rotate(Math.sin(t * 0.08) * 0.12);
    g.lineWidth = 4;
    g.beginPath(); g.moveTo(-120, 0); g.lineTo(480, 0); g.stroke();
    g.lineWidth = 2;
    for (let x = -120; x < 480; x += 30) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 15, -22); g.lineTo(x + 30, 0); g.stroke();
    }
    const hook = 260 + Math.sin(t * 0.3) * 120;
    g.beginPath(); g.moveTo(hook, 0); g.lineTo(hook, 150); g.stroke();
    g.fillStyle = "rgba(255,194,61,.4)"; g.fillRect(hook - 30, 150, 60, 16);
    // the warning light on the jib tip
    g.fillStyle = Math.floor(t * 1.4) % 2 ? "rgba(255,60,60,.9)" : "rgba(255,60,60,.2)";
    g.beginPath(); g.arc(480, 0, 5, 0, 7); g.fill();
    g.restore();

    // the building's own steel frame rising out of the bottom of the shot
    g.save();
    g.strokeStyle = "rgba(143,163,200,.16)"; g.lineWidth = 10;
    for (const x of [W * 0.5 - 520, W * 0.5 - 260, W * 0.5 + 260, W * 0.5 + 520]) {
      g.beginPath(); g.moveTo(x, H * 0.52); g.lineTo(x, H); g.stroke();
    }
    g.lineWidth = 6;
    for (let y = H * 0.6; y < H; y += 70) {
      g.beginPath(); g.moveTo(W * 0.5 - 520, y); g.lineTo(W * 0.5 + 520, y); g.stroke();
    }
    g.restore();

    // a searchlight sweeping the sky
    g.save(); g.globalCompositeOperation = "lighter";
    g.translate(W * 0.64, H);
    g.rotate(-Math.PI / 2 + Math.sin(t * 0.25) * 0.55);
    const sl = g.createLinearGradient(0, 0, H * 1.2, 0);
    sl.addColorStop(0, "rgba(160,200,255,.16)"); sl.addColorStop(1, "rgba(160,200,255,0)");
    g.fillStyle = sl;
    poly(g, [0, -8, H * 1.2, -90, H * 1.2, 90, 0, 8]); g.fill();
    g.restore();
  },
},

{
  id: "LINE", name: "RUST LINE", tag: "FACTORY · SHIFTING", deck: "belt",
  blurb: "The whole deck is a conveyor belt. It carries everyone one way, then flips — arrows flash before it does.",
  pivot: { x: 800, y: 585 },
  blast: { left: -420, right: 2020, top: -540, bottom: 1360 },
  pal: { a: "#f5d90a", b: "#2fd6c2", plat: "#25221d", platEdge: "#f5d90a",
         soft: "#8f8a6e", ink: "#0b0a07" },
  music: { bpm: 132, root: 131, scale: [0, 2, 3, 7, 10], wave: "sawtooth", hats: true,
           seq: [0, 0, -1, 0, 3, -1, 0, -1, 4, 4, -1, 3, 0, -1, 2, -1] },
  layout: [
    { x1: -370, y1: 0,    x2: 370,  y2: 0,    solid: true,  main: true, thick: 28,
      belt: { speed: 1.25, period: 540, warn: 100 } },
    { x1: -320, y1: -172, x2: -150, y2: -172, solid: false, thick: 12 },
    { x1:  150, y1: -172, x2:  320, y2: -172, solid: false, thick: 12 },
    { x1:  -86, y1: -310, x2:   86, y2: -310, solid: false, thick: 12 },
  ],

  drawBg(g, t) {
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0d0f10"); grad.addColorStop(0.55, "#16191a"); grad.addColorStop(1, "#22231c");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    // tall factory windows with the dawn coming through
    g.save();
    for (let i = 0; i < 5; i++) {
      const x = 70 + i * 240, y = H * 0.08, w = 160, h = H * 0.44;
      const wg = g.createLinearGradient(0, y, 0, y + h);
      wg.addColorStop(0, "rgba(47,214,194,.22)"); wg.addColorStop(1, "rgba(245,217,10,.10)");
      g.fillStyle = wg; g.fillRect(x, y, w, h);
      g.strokeStyle = "#0b0c0c"; g.lineWidth = 5;
      for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x + k * w / 4, y); g.lineTo(x + k * w / 4, y + h); g.stroke(); }
      for (let k = 1; k < 6; k++) { g.beginPath(); g.moveTo(x, y + k * h / 6); g.lineTo(x + w, y + k * h / 6); g.stroke(); }
      g.strokeRect(x, y, w, h);
    }
    // light shafts falling from the windows
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 5; i++) {
      const x = 70 + i * 240;
      g.fillStyle = `rgba(47,214,194,${0.035 + Math.sin(t * 0.5 + i) * 0.015})`;
      poly(g, [x, H * 0.52, x + 160, H * 0.52, x + 290, H, x + 90, H]); g.fill();
    }
    g.restore();

    // a background line of robot arms, welding in turn
    g.save();
    for (let i = 0; i < 6; i++) {

STAGES.forEach(s => { STAGE_BY_ID[s.id] = s; });

/* ========================================================================== */
/* Stage runtime                                                              */
/* ========================================================================== */
const Stage = {
  def: STAGES[0],
  /* The deck's centre. Still called pivot because every stage stands on a
     support column there, but nothing rotates about it any more. */
  pivot: { x: 800, y: 580 },
  flashT: 0,          // frames left on a deck-edge flash (Pivot's Tipping Point)
  segs: [],
  pfx: [], platT: 0,

  get blast() { return this.def.blast; },
  get pal() { return this.def.pal; },

  select(def) {
    this.def = def;
    this.pivot = { x: def.pivot.x, y: def.pivot.y };
    this.reset();
  },
  reset() {
    this.flashT = 0;
    this.resetPlatforms();
    this.rebuild();
  },

  toWorld(lx, ly) { return { x: this.pivot.x + lx, y: this.pivot.y + ly }; },

  /** The highest walkable surface at x that is at or below y, or null when
      there is only open air underneath. Supers use it to check there is a
      floor to land on before committing to a dive or a slam. */
  floorBelow(x, y) {
    let best = null;
    for (const seg of this.segs) {
      const sy = this.surfaceY(seg, x);
      if (sy !== null && sy >= y - 2 && (best === null || sy < best)) best = sy;
    }
    return best;
  },

  /* ---------------------------------------------------- platform state ----
     The side platforms are no longer inert scenery. Each stage gives its own
     a behaviour, and the live state of each one lives in pfx[i], parallel to
     def.layout. Absent platforms are simply left out of segs, so collision,
     combat's ground test and the contact shadows all respect them without
     any of those three needing to know this system exists. */
  resetPlatforms() {
    this.platT = 0;
    this.pfx = this.def.layout.map(() => ({
      dx: 0, dy: 0, belt: 0, beltWarn: 0, squash: 0,
      present: true, heat: 0, stood: 0, gone: 0, alpha: 1,
    }));
    this.derive();
  },

  /* Everything here is a pure function of platT, so a guest that only
     receives platT over the network lands on exactly the host's lifts, belt
     and wind without any of it being sent. */
  derive() {
    const T = this.platT;
    this.def.layout.forEach((p, i) => {
      const s = this.pfx[i]; if (!s) return;
      const ph = p.phase || 0;
      if (p.lift) s.dy = -Math.sin((T + ph) * p.lift.speed) * p.lift.range;
      if (p.belt) {
        const b = p.belt, cyc = (T + ph) % b.period;
        const dir = Math.floor((T + ph) / b.period) % 2 ? -1 : 1;
        // spins up over the first 40 frames after each reversal
        s.belt = dir * b.speed * Math.min(1, cyc / 40);
        s.beltWarn = cyc > b.period - b.warn ? 1 : 0;
      }
    });
  },

  /** Wind on this stage right now: x is the push in px/frame, warn is 1 while
      a gust is building (the snow streaks pick up before it hits). */
  windNow() {
    const w = this.def.wind;
    if (!w) return { x: 0, warn: 0 };
    const T = this.platT, cyc = T % w.period;
    const dir = Math.floor(T / w.period) % 2 ? -1 : 1;
    const calm = w.period - w.on - w.warn;
    if (cyc < calm) return { x: 0, warn: 0, dir };
    if (cyc < calm + w.warn) return { x: 0, warn: (cyc - calm) / w.warn, dir };
    // ease in and out of the gust so it never yanks anyone mid-frame
    const k = (cyc - calm - w.warn) / w.on;
    return { x: dir * w.push * Math.min(1, Math.sin(k * Math.PI) * 2.2), warn: 0, dir };
  },

  platformTick(fighters) {
    this.platT++;
    this.derive();
    const T = this.platT;

    this.def.layout.forEach((p, i) => {
      const s = this.pfx[i];
      if (s.squash > 0) s.squash--;
      if (p.main) return;                       // the deck itself never changes
      const ph = p.phase || 0;

      if (p.drift) {
        s.dx = Math.sin((T + ph) * p.drift.speed) * p.drift.range;
      }

      if (p.hot) {
        // cold → a warning flicker → hot. The warning is what makes it fair.
        const cyc = (T + ph) % p.hot.period;
        if (cyc < p.hot.on) s.heat = 1;
        else if (cyc < p.hot.on + p.hot.warn) s.heat = 0;
        else s.heat = (cyc > p.hot.period - p.hot.warn) ? 0.5 : 0;
      }

      if (p.crumble) {
        if (s.gone > 0) {
          s.gone--;
          s.present = false;
          s.alpha = s.gone < 20 ? 1 - s.gone / 20 : 0;   // fades back in
          if (s.gone === 0) { s.present = true; s.stood = 0; s.alpha = 1; }
        } else {
          const loaded = fighters.some(f =>
            f.alive && f.grounded && f.groundSeg && f.groundSeg.local === p);
          s.stood = loaded ? s.stood + 1 : Math.max(0, s.stood - 1);
          s.alpha = 1 - (s.stood / p.crumble.delay) * 0.55;
          if (s.stood >= p.crumble.delay) {
            s.gone = p.crumble.gone;
            s.present = false; s.alpha = 0;
            const a = this.toWorld(p.x1 + s.dx, p.y1), b = this.toWorld(p.x2 + s.dx, p.y2);
            FX.burst((a.x + b.x) / 2, (a.y + b.y) / 2, 18, this.pal.soft, 5);
            Snd.noise(0.25, 0.2, 700, 0.9);
          }
        }
      }

      if (p.retract) {
        const cyc = (T + ph) % p.retract.period;
        const open = cyc < p.retract.on;
        if (open !== s.present) {
          const a = this.toWorld(p.x1, p.y1), b = this.toWorld(p.x2, p.y2);
          FX.ring((a.x + b.x) / 2, (a.y + b.y) / 2, 8, 60, this.pal.platEdge, 2);
          Snd.tone(open ? 220 : 160, 0.14, "square", 0.1, open ? 420 : 90);
        }
        s.present = open;
        // the last 40 frames before it pulls back are telegraphed
        s.alpha = open ? (cyc > p.retract.on - 40 ? 0.45 + 0.4 * Math.abs(Math.sin(T * 0.4)) : 1) : 0;
      }
    });
  },

  /** Burn anyone standing on a hot platform. Called after collision resolves. */
  platformDamage(fighters) {
    this.def.layout.forEach((p, i) => {
      if (!p.hot || this.pfx[i].heat < 1) return;
      for (const f of fighters) {
        if (!f.alive || !f.grounded || !f.groundSeg || f.groundSeg.local !== p) continue;
        if (f.invuln > 0 || f.hotTick > 0) continue;
        f.hotTick = 14;
        f.applyKnockback(0, -5.5, p.hot.dmg || 1.6, 4, null);
        FX.burst(f.x, f.feetY, 8, "#ff8a1f", 4);
        Snd.tone(300, 0.06, "sawtooth", 0.09, 120);
      }
    });
  },

  rebuild() {
    this.segs = [];
    this.def.layout.forEach((p, i) => {
      const s = this.pfx[i];
      if (s && !s.present) return;              // retracted / crumbled away
      const dx = s ? s.dx : 0, dy = s ? s.dy : 0;
      const a = this.toWorld(p.x1 + dx, p.y1 + dy), b = this.toWorld(p.x2 + dx, p.y2 + dy);
      this.segs.push({
        ax: a.x, ay: a.y, bx: b.x, by: b.y,
        solid: !!p.solid, main: !!p.main, thick: p.thick,
        angle: Math.atan2(b.y - a.y, b.x - a.x), local: p, fx: s,
      });
    });
  },

  surfaceY(seg, x) {
    const lo = Math.min(seg.ax, seg.bx), hi = Math.max(seg.ax, seg.bx);
    if (x < lo - 2 || x > hi + 2) return null;
    const t = (x - seg.ax) / (seg.bx - seg.ax || 1e-6);
    return seg.ay + t * (seg.by - seg.ay);
  },

  update(fighters) {
    if (this.flashT > 0) this.flashT--;
    this.platformTick(fighters);
    this.rebuild();
    this.platformDamage(fighters);
  },
};


/* ===== src/065_uikit.js ===== */
/* ==========================================================================
   7. UI KIT — the fighters' drawing language, applied to panels and gauges

   The roster got ink outlines, top-lit gradients and a clipped rim light, and
   that is what made it stop looking like flat shapes. The HUD was still plain
   translucent rounded rectangles, so it read as a different, cheaper game
   sitting on top of a good-looking one. Everything here exists so a panel is
   built the same way a pauldron is.

   Shared with the roster: INK, ink(), rim(), vol(), plate(). Those are plain
   function declarations in one concatenated script, so load order is moot.
   ========================================================================== */

const UI = {
  ink:   "#07050f",
  panel: "#15122b",
  panel2:"#0c0a1c",
  line:  "#2c2745",
  text:  "#f2f0ff",
  dim:   "#aeabd4",
  dimmer:"#8e8bb2",
};

/* --------------------------------------------------------------- shapes */

/** Rectangle with its corners cut off — stamped plate rather than a web card.
    `cut` is the size of the chamfer; `only` picks which corners get one. */
function notchPath(g, x, y, w, h, cut, only) {
  const o = only || { tl: 1, tr: 1, br: 1, bl: 1 };
  const c = cut;
  g.beginPath();
  g.moveTo(x + (o.tl ? c : 0), y);
  g.lineTo(x + w - (o.tr ? c : 0), y);
  if (o.tr) g.lineTo(x + w, y + c);
  g.lineTo(x + w, y + h - (o.br ? c : 0));
  if (o.br) g.lineTo(x + w - c, y + h);
  g.lineTo(x + (o.bl ? c : 0), y + h);
  if (o.bl) g.lineTo(x, y + h - c);
  g.lineTo(x, y + (o.tl ? c : 0));
  g.closePath();
}

/** A machined panel: cast shadow, ink edge, top-lit face, rim light, and an
    optional accent hairline just inside the border. */
function panel(g, x, y, w, h, opts) {
  const o = opts || {};
  const cut = o.cut === undefined ? 10 : o.cut;
  const path = () => (cut > 0 ? notchPath(g, x, y, w, h, cut, o.only)
                              : roundRect(g, x, y, w, h, o.r || 12));
  const accent = o.accent || UI.line;

  g.save();

  // 1. a real cast shadow, so panels sit above the stage instead of in it
  if (o.shadow !== false) {
    g.save();
    g.globalAlpha = 0.5; g.fillStyle = "#000";
    g.translate(0, 4); path(); g.fill();
    g.restore();
  }

  // 2. ink edge + top-lit face
  const base = o.fill || UI.panel;
  const q = g.createLinearGradient(0, y, 0, y + h);
  q.addColorStop(0, shade(base, 0.12));
  q.addColorStop(0.5, base);
  q.addColorStop(1, shade(base, -0.42));
  path();
  g.strokeStyle = UI.ink; g.lineWidth = o.inkW || 4; g.lineJoin = "round"; g.stroke();
  g.fillStyle = q; g.fill();

  // 3. rim light along the top edge, clipped inside the panel
  g.save(); path(); g.clip();
  g.translate(0, 2.4); path();
  g.strokeStyle = "#ffffff"; g.lineWidth = 3; g.globalAlpha = 0.14; g.stroke();
  g.restore();

  // 4. accent hairline, glowing when the panel wants attention
  g.save(); path(); g.clip();
  g.translate(0, 1.4); path();
  g.strokeStyle = accent; g.lineWidth = o.accentW || 2;
  g.globalAlpha = o.accentA === undefined ? 0.75 : o.accentA;
  if (o.glow) { g.shadowColor = accent; g.shadowBlur = o.glow; }
  g.stroke();
  g.restore();

  g.restore();
}

/** Diagonal hazard hatching, clipped to a shape. Used for danger zones. */
function hatch(g, x, y, w, h, col, step, a) {
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.globalAlpha = a === undefined ? 0.3 : a;
  g.strokeStyle = col; g.lineWidth = (step || 10) * 0.45;
  for (let i = -h; i < w + h; i += step || 10) {
    g.beginPath(); g.moveTo(x + i, y + h); g.lineTo(x + i + h, y); g.stroke();
  }
  g.restore();
}

/** A recessed slot: the inverse of a panel, for bars and readouts to sit in. */
function slot(g, x, y, w, h, r) {
  const path = () => roundRect(g, x, y, w, h, r === undefined ? h / 2 : r);
  path();
  g.fillStyle = "rgba(0,0,0,.55)"; g.fill();
  // inner shadow at the top sells the depth
  g.save(); path(); g.clip();
  g.translate(0, 2); path();
  g.strokeStyle = "#000"; g.lineWidth = 3; g.globalAlpha = 0.5; g.stroke();
  g.restore();
}

/** A filled bar inside a slot, lit along its own top edge. */
function bar(g, x, y, w, h, frac, col, opts) {
  const o = opts || {};
  const fw = Math.max(0, w * clamp(frac, 0, 1));
  if (fw < 0.6) return;
  const r = o.r === undefined ? h / 2 : o.r;
  const path = () => roundRect(g, x, y, fw, h, Math.min(r, fw / 2));
  g.save();
  if (o.glow) { g.shadowColor = col; g.shadowBlur = o.glow; }
  path(); g.fillStyle = col; g.fill();
  g.shadowBlur = 0;
  // highlight stripe across the top third
  path(); g.clip();
  g.fillStyle = "rgba(255,255,255,.26)";
  g.fillRect(x, y, fw, Math.max(1, h * 0.34));
  g.restore();
}

/** Evenly spaced tick marks — turns a bar into an instrument. */
function ticks(g, x, y, w, h, n, col, a) {
  g.save();
  g.globalAlpha = a === undefined ? 0.4 : a;
  g.strokeStyle = col; g.lineWidth = 1;
  for (let i = 1; i < n; i++) {
    const tx = Math.round(x + (w * i) / n) + 0.5;
    g.beginPath(); g.moveTo(tx, y); g.lineTo(tx, y + h); g.stroke();
  }
  g.restore();
}

/** Small bolt head, for the corners of metal panels. */
function screw(g, x, y, r, col) {
  g.save();
  g.fillStyle = "rgba(0,0,0,.6)";
  g.beginPath(); g.arc(x, y + 0.8, r, 0, 7); g.fill();
  g.fillStyle = col || UI.line;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = "rgba(0,0,0,.55)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x - r * 0.55, y); g.lineTo(x + r * 0.55, y); g.stroke();
  g.restore();
}

/** A small label chip — stage names, counts, tags. */
function chip(g, text, x, y, col, opts) {
  const o = opts || {};
  g.save();
  g.font = o.font || `700 10px ${FONT_MONO}`;
  const tw = g.measureText(text).width;
  const padX = o.padX || 9, h = o.h || 20;
  const w = tw + padX * 2;
  const bx = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
  notchPath(g, bx, y, w, h, 5);
  g.fillStyle = "rgba(6,5,14,.88)"; g.fill();
  g.strokeStyle = hexA(col, 0.65); g.lineWidth = 1.5; g.stroke();
  g.fillStyle = col; g.textAlign = "left"; g.textBaseline = "middle";
  g.fillText(text, bx + padX, y + h / 2 + 0.5);
  g.textBaseline = "alphabetic";
  g.restore();
  return w;
}


/* ===== src/06_fx.js ===== */
/* ==========================================================================
   7. FX — particles, impact feedback, and the camera

   The camera is the part that was wrong in v1: it chased the exact midpoint of
   every fighter on every frame, so it drifted left and right constantly even
   when nothing was happening. This one holds completely still until the action
   leaves a dead zone, eases rather than snaps, and quantises its zoom so it
   never breathes in and out. Screen shake is short, capped, and switchable off.
   ========================================================================== */

const FX = {
  parts: [], rings: [], marks: [], streaks: [], texts: [],
  blades: [], bolts: [], cracks: [], glyphs: [],
  shakeMag: 0, shakeX: 0, shakeY: 0,
  pause: 0,
  flashCol: null, flashAmt: 0,
  chroma: 0,                 // red/blue separation, decays every frame
  bannerText: "", bannerTimer: 0, bannerColor: "#fff",
  slow: 0,                   // sim steps of slow motion left (a match-ending SMASH)
  kickAmt: 0, kickX: 0, kickY: 0,   // a quick camera lunge toward a big hit

  cam: {
    x: 800, y: 440, zoom: 0.9,
    px: 800, py: 440, pz: 0.9,   // previous step, for render interpolation
    tz: 0.9,
  },

  reset() {
    this.parts.length = 0; this.rings.length = 0; this.marks.length = 0;
    this.streaks.length = 0; this.texts.length = 0;
    this.blades.length = 0; this.bolts.length = 0;
    this.cracks.length = 0; this.glyphs.length = 0;
    this.shakeMag = 0; this.pause = 0; this.bannerTimer = 0;
    this.flashAmt = 0; this.chroma = 0;
    this.slow = 0; this.kickAmt = 0;
    const c = this.cam;
    c.x = c.px = Stage.pivot.x;
    c.y = c.py = Stage.pivot.y - 150;
    c.zoom = c.pz = c.tz = 0.88;
  },

  /* ----------------------------------------------------------- feedback */
  shake(m) {
    const amt = Settings.get("shakeAmount");
    if (amt <= 0) return;
    this.shakeMag = Math.min(CFG.cam.maxShake, this.shakeMag + m * amt);
  },
  hitPause(f) { this.pause = Math.max(this.pause, f); },
  flash(col, amt) { this.flashCol = col; this.flashAmt = Math.max(this.flashAmt, amt); },
  /** Lunge the camera toward (x, y) and zoom in by amt, then ease back. It
      rides the shake setting: anyone who turned shake off wants a still view. */
  kick(x, y, amt) {
    const k = Math.min(1, Settings.get("shakeAmount"));
