      const fall = clamp(1 - e.life / e.max, 0, 1);
      warnCircle(g, e.x, e.ty || e.y, e.r + 30, c, 0.15 + fall * 0.3);
      g.save(); g.globalCompositeOperation = "source-over";
      w3bDie(g, e.x, e.y, e.r, e.w, INK, e.life * 0.25);
      g.restore();
    },
  },
});

/* ---------------------------------------------------------------- CPU
   CPU.think only knows the specials of the fighters it was written with.
   This wraps it (other waves may wrap it too — each layer just adds) so a
   CPU playing one of these four fires its special and super on sensible
   cues instead of never. It only adds a button press; it never overrides
   what the base brain chose to do. */
const W3B_CPU = {
  VOLT:   (f, t, d) => ({ sp: d.facing && d.adx < 380 && d.ady < 90, su: true }),
  WARDEN: (f, t, d) => ({ sp: d.facing && d.adx > 50 && d.adx < 200 && d.ady < 60 && f.grounded, su: d.bd < 520 }),
  MAGMA:  (f, t, d) => ({ sp: d.facing && d.adx > 110 && d.adx < 420, su: Combat.foes(f).some(o => o.grounded) }),
  JINX:   (f, t, d) => ({ sp: d.adx < 320 && d.ady < 80, su: d.bd < 700 }),
};
(function () {
  const baseThink = CPU.think;
  CPU.think = function (f, match) {
    const inp = baseThink.call(this, f, match);
    const brain = W3B_CPU[f.ch.id], ai = f._ai;
    if (!brain || !ai || f.state === ST.ATTACK) return inp;
    const cur = ai.cur;
    if (cur.super || cur.special || cur.shield || cur.up) return inp;
    const t = Combat.nearestFoe(f);
    if (!t || t.intangible()) return inp;
    // never while recovering: the base brain owns that
    const onStage = f.groundSeg !== null ||
      (Math.abs(f.x - Stage.pivot.x) < Math.abs(Stage.def.layout[0].x2) && f.y < Stage.pivot.y);
    if (!onStage) return inp;
    const dx = t.x - f.x;
    const d = { adx: Math.abs(dx), ady: Math.abs(t.y - f.y), bd: dist(f.x, f.y, t.x, t.y),
                facing: Math.sign(dx) === f.facing };
    const want = brain(f, t, d);
    if (f.meterFull && want.su && Math.random() < CFG.cpu.superChance) cur.super = true;
    else if (f.specialCD <= 0 && want.sp && Math.random() < 0.014) cur.special = true;
    return inp;
  };
})();


/* ===== src/08d_kinds_c.js ===== */
/* ==========================================================================
   9d. ENTITY KINDS — wave 3c: Bulwark, Wraith, Drift and Quill

     bulwark_dome    Aegis: a mirrored bubble that throws projectiles back
     wraith_minion   Raise / Legion: a skeleton that walks to a foe and claws
     drift_trail     Kickflip: a strip of grind sparks that bites ankles
     drift_board     Drift's glide (a watcher, see below)
     quill_spike     Caltrops: lands on the floor and trips whoever steps on it
     quill_storm     Needle Storm: the cloud that drops the needles
     quill_needle    one falling needle
     quill_bristle   Quill's thorns passive (a watcher, see below)

   Watchers. Fighter has no per-character "every frame" hook, so the two
   passives that need one ride on an invisible entity that follows its owner:
   Entities.update runs right after Combat.resolve every frame, which is
   exactly when a fresh hit or a fresh release of the stick can be seen. The
   owner's own moves spawn it (w3cWatch) — one per fighter, never more.

   As with 08a, every draw() reads only what the netcode ships: x, y, r, life,
   max, dir, landed, storm, w, plus e.owner.
   ========================================================================== */

/** Can f's mirror take this? Only an enemy's moving, damaging projectile —
    never a planted thing, a stuck bomb or a walking minion. */
function w3cReflectable(e, f) {
  if (!e.owner || allies(e.owner, f) || !e.move || e.stuck) return false;
  const k = KINDS[e.kind];
  if (k && k.noReflect) return false;
  return Math.hypot(e.vx || 0, e.vy || 0) > 3.5;
}

/** Send a projectile back as f's own, 30% faster (capped). With a surface
    normal it bounces off a curve (the dome); without one it simply reverses. */
function w3cReflect(e, f, nx, ny) {
  let vx = e.vx, vy = e.vy;
  if (nx === undefined) { vx = -vx; vy = -vy; }
  else { const d = vx * nx + vy * ny; vx -= 2 * d * nx; vy -= 2 * d * ny; }
  const sp = Math.hypot(vx, vy) || 1, k = Math.min(sp * 1.3, 22) / sp;
  e.vx = vx * k; e.vy = vy * k;
  e.owner = f;
  e.hitIds = [];
  if (e.hitLog) e.hitLog = {};
  if (e.dir) e.dir = e.vx >= 0 ? 1 : -1;
  e.life = Math.max(e.life, 50);
  FX.ring(e.x, e.y, 6, 46, f.ch.accent, 3);
  FX.spark(e.x, e.y, "#ffffff");
  FX.damageText(e.x, e.y - 30, "REFLECT", f.ch.accent);
  Snd.tone(2100, 0.07, "triangle", 0.1, 3200);
}

/** One watcher of a kind per fighter; their own moves call this. */
function w3cWatch(f, kind) {
  for (const e of Entities.list) if (e.kind === kind && e.owner === f) return;
  Entities.add(kind, f, { r: 0, life: 9999999, pv: 0 });
}

Object.assign(KINDS, {

  /* ---- BULWARK: Aegis. Follows him; bounces every enemy projectile off
         its surface and braces him and his teammates inside it. ---- */
  bulwark_dome: {
    noReflect: true,
    update(e, fighters) {
      const o = e.owner;
      if (!o.alive || o.state === ST.DEAD) { e.dud = true; return true; }
      e.x = o.x; e.y = o.y;
      for (const p of Entities.list) {
        if (p === e || !w3cReflectable(p, o)) continue;
        const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
        if (d > e.r + (p.r || 0)) continue;
        const nx = dx / d, ny = dy / d;
        if (p.vx * nx + p.vy * ny >= 0) continue;          // already heading out
        w3cReflect(p, o, nx, ny);
      }
      // the Keel Anchor brace (anchorGlow) is the engine's "half knockback"
      for (const f of fighters)
        if (allies(f, o) && f.alive && f.state !== ST.DEAD && dist(f.x, f.y, e.x, e.y) < e.r)
          f.anchorGlow = Math.max(f.anchorGlow, 2);
      if (e.life % 5 === 0) FX.spark(e.x + rnd(-e.r, e.r) * 0.7, e.y + rnd(-e.r, e.r) * 0.7, o.ch.accent);
      return false;
    },
    end(e, fighters) {
      if (e.dud) return;
      FX.ring(e.x, e.y, e.r * 0.6, e.r * 1.6, "#ffffff", 6);
      FX.burst(e.x, e.y, 36, e.owner.ch.accent, 10);
      FX.shake(18); FX.flash(e.owner.ch.accent, 0.25);
      Snd.superHit();
      Entities.blast(e.owner, e.x, e.y, e.r, e.move, fighters);
    },
    draw(g, e, c) {
      const ac = e.owner.ch.accent;
      const rise = clamp((e.max - e.life) / 10, 0, 1);
      const a = rise * (e.life < 40 ? 0.55 + 0.45 * Math.sin(e.life * 0.7) : 1);
      const R = e.r * (0.7 + 0.3 * rise);
      g.save();
      const q = g.createRadialGradient(e.x - R * 0.3, e.y - R * 0.4, 4, e.x, e.y, R);
      q.addColorStop(0, hexA("#ffffff", 0.16 * a)); q.addColorStop(0.7, hexA(ac, 0.06 * a));
      q.addColorStop(1, hexA(ac, 0.3 * a));
      g.fillStyle = q; g.beginPath(); g.arc(e.x, e.y, R, 0, 7); g.fill();
      g.globalAlpha = a; g.shadowColor = ac; g.shadowBlur = 18;
      g.strokeStyle = hexA(ac, 0.85); g.lineWidth = 3;
      g.beginPath(); g.arc(e.x, e.y, R, 0, 7); g.stroke();
      // mirror facets: three latitude bands and a turning meridian
      g.shadowBlur = 0; g.strokeStyle = hexA("#ffffff", 0.25); g.lineWidth = 1.2;
      for (const k of [-0.5, 0, 0.5]) {
        g.beginPath(); g.ellipse(e.x, e.y + k * R, R * Math.sqrt(1 - k * k), R * 0.16, 0, 0, 7); g.stroke();
      }
      const m = Math.sin(e.life * 0.04);
      g.beginPath(); g.ellipse(e.x, e.y, Math.abs(m) * R, R, 0, 0, 7); g.stroke();
      // the travelling glint
      g.strokeStyle = hexA("#ffffff", 0.8); g.lineWidth = 4;
      const ga = e.life * 0.05;
      g.beginPath(); g.arc(e.x, e.y, R - 4, ga, ga + 0.5); g.stroke();
      g.restore();
    },
  },

  /* ---- WRAITH: a raised skeleton. Claws out of the ground, walks the floor
         toward the nearest foe (it won't step off an edge), winds up and
         swipes. A few swings and it falls apart; any enemy hitbox shatters it.
         w = swing timer, storm = a Legion minion (faster, shares a hit log). */
  wraith_minion: {
    noReflect: true,
    update(e, fighters) {
      const o = e.owner;
      if ((!o.alive || o.state === ST.DEAD) && e.life > 14) e.life = 14;
      if (e.life <= 14) return false;                       // crumbling
      if (!e.landed) {
        e.vy = Math.min(e.vy + 0.6, 14); e.y += e.vy;
        const fl = Stage.floorBelow(e.x, e.y - e.vy - 1);
        if (fl !== null && e.y >= fl) { e.y = fl; e.vy = 0; e.landed = true; FX.dustLine(e.x, fl, 30, "#b9b6d8"); }
        return e.y > CFG.world.h + 200;
      }
      if (e.max - e.life < 18) return false;                // still clawing out
      // follow whatever floor is underfoot (platforms drift)
      const here = Stage.floorBelow(e.x, e.y - 18);
      if (here === null || here - e.y > 20) { e.landed = false; return false; }
      e.y = here;
      // any enemy hitbox that sweeps through it shatters it
      for (const f of fighters) {
        if (allies(f, o) || !f.alive || f.state === ST.DEAD || !f.attack || !f.hitboxActive()) continue;
        const hb = f.hitboxWorld();
        if (dist(hb.x, hb.y, e.x, e.y - 16) < hb.r + 12) {
          e.life = 14;
          FX.burst(e.x, e.y - 16, 12, o.ch.accent, 5);
          Snd.tone(700, 0.06, "square", 0.08, 260);
          return false;
        }
      }
      let t = null, bd = 900;
      for (const f of fighters) {
        if (allies(f, o) || !f.alive || f.state === ST.DEAD || f.stealthT > 0) continue;
        const d = dist(e.x, e.y - 16, f.x, f.y);
        if (d < bd) { bd = d; t = f; }
      }
      if (e.cd > 0) e.cd--;
      if (e.w > 0) {                                        // mid-swing
        if (--e.w === 4) {
          const ok = t && !t.intangible() && Math.abs(t.x - e.x) < 34 + t.ch.hurt &&
                     Math.abs(t.y - (e.y - 16)) < 48 && (!e.log || (e.log[t.slot] || 0) < 3);
          if (ok) {
            if (e.log) e.log[t.slot] = (e.log[t.slot] || 0) + 1;
            Combat.land(o, t, e.move, e.x + e.dir * 16, e.y - 18);
          } else Snd.noise(0.05, 0.05, 2400, 1, "bandpass");
          if (++e.hits >= e.cap) e.life = Math.min(e.life, 26);
        }
        return false;
      }
      if (!t) return false;
      const dx = t.x - e.x;
      e.dir = dx >= 0 ? 1 : -1;
      if (Math.abs(dx) < 26 + t.ch.hurt && Math.abs(t.y - (e.y - 16)) < 50) {
        if (e.cd <= 0) { e.w = 14; e.cd = 36; Snd.tone(240, 0.08, "sawtooth", 0.06, 120); }
        return false;
      }
      const nx = e.x + e.dir * e.spd, fl = Stage.floorBelow(nx, e.y - 18);
      if (fl !== null && Math.abs(fl - e.y) < 20) { e.x = nx; e.y = fl; }
      return false;
    },
    draw(g, e, c) {
      const bone = e.owner.ch.accent;
      const rise = e.landed ? clamp((e.max - e.life) / 18, 0, 1) : 1;
      const crumble = e.life < 14 ? e.life / 14 : 1;
      if (e.storm) aura(g, e.x, e.y - 16, 30, c, 0.22 * crumble);
      g.save(); g.globalCompositeOperation = "source-over";
      g.globalAlpha = crumble;
      // clip at the floor so it rises out of the ground
      g.beginPath(); g.rect(e.x - 60, e.y - 90, 120, 90); g.clip();
      g.translate(e.x, e.y + (1 - rise) * 34 + (1 - crumble) * 8);
      g.scale(e.dir || 1, 1);
      const walk = Math.sin(e.life * 0.3) * (e.w > 0 ? 0 : 6);
      const sw = e.w > 4 ? -1.4 + (14 - e.w) * 0.1 : e.w > 0 ? 0.9 : -0.3;
      g.lineCap = "round";
      const bones = (pts, w) => {
        g.beginPath(); g.moveTo(pts[0], pts[1]);
        for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
        g.strokeStyle = INK; g.lineWidth = w + 2.4; g.stroke();
        g.strokeStyle = bone; g.lineWidth = w; g.stroke();
      };
      bones([-3, -12, -4 + walk, -5, -5 + walk * 1.3, 0], 2.6);       // legs
      bones([3, -12, 4 - walk, -5, 5 - walk * 1.3, 0], 2.6);
      bones([0, -12, 0, -26], 2.8);                                     // spine
      for (let i = 0; i < 3; i++) bones([-5 + i * 0.6, -24 + i * 4, 0, -23 + i * 4, 5 - i * 0.6, -24 + i * 4], 1.8);
      bones([-2, -24, -8, -16, -6, -10], 2.2);                          // back arm
      const hx = 2 + Math.cos(sw) * 12, hy = -24 + Math.sin(sw) * 12;   // claw arm
      bones([2, -24, hx, hy], 2.4);
      for (let i = -1; i <= 1; i++) bones([hx, hy, hx + Math.cos(sw + i * 0.4) * 6, hy + Math.sin(sw + i * 0.4) * 6], 1.4);
      // skull, with soulfire in the sockets
      ink(g, () => { g.beginPath(); g.ellipse(1, -31, 6, 5.6, 0, 0, 7); }, vol(g, -37, -25, bone, 0.2, 0.35), 2.4);
      lens(g, () => { g.beginPath(); g.arc(3.2, -31.5, 1.6, 0, 7); }, c, c, e.storm ? 14 : 8);
      lens(g, () => { g.beginPath(); g.arc(-0.8, -31.5, 1.3, 0, 7); }, c, c, e.storm ? 12 : 6);
      g.fillStyle = INK; g.fillRect(0, -27.6, 5, 1.2);
      g.restore();
    },
  },

  /* ---- DRIFT: the grind trail Kickflip leaves on the floor. w = its length;
         it bites each foe who stands on it once. ---- */
  drift_trail: {
    noReflect: true,
    update(e, fighters) {
      if (e.w < 6) return false;
      if (e.life % 3 === 0) FX.spark(e.x + rnd(-e.w, e.w) * 0.5, e.y - 2, e.owner.ch.accent);
      for (const f of fighters) {
        if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
        if (e.hitIds.includes(f.slot)) continue;
        if (Math.abs(f.x - e.x) < e.w / 2 + 8 && Math.abs(f.feetY - e.y) < 16) {
          e.hitIds.push(f.slot);
          Combat.land(e.owner, f, e.move, f.x, e.y - 8);
        }
      }
      return false;
    },
    draw(g, e, c) {
      if (e.w < 2) return;
      const a = clamp(e.life / 40, 0, 1), ac = e.owner.ch.accent;
      const x0 = e.x - e.w / 2, x1 = e.x + e.w / 2;
      g.save(); g.globalAlpha = a;
      g.shadowColor = c; g.shadowBlur = 16;
      g.strokeStyle = hexA(c, 0.8); g.lineWidth = 6; g.lineCap = "round";
      g.beginPath(); g.moveTo(x0, e.y - 2); g.lineTo(x1, e.y - 2); g.stroke();
      g.strokeStyle = ac; g.lineWidth = 2;
      g.setLineDash([8, 7]); g.lineDashOffset = e.life * 1.5;
      g.beginPath(); g.moveTo(x0, e.y - 3); g.lineTo(x1, e.y - 3); g.stroke();
      g.setLineDash([]);
      // flickering flames along it
      for (let x = x0 + 6; x < x1; x += 14) {
        const h = 5 + 4 * Math.abs(Math.sin(x * 0.3 + e.life * 0.4));
        g.fillStyle = hexA(ac, 0.7);
        poly(g, [x - 3, e.y - 2, x, e.y - 2 - h, x + 3, e.y - 2]); g.fill();
      }
      g.restore();
    },
  },

  /* ---- DRIFT: the board watcher. Out of an attack the engine bleeds speed
         the moment the stick is let go; a skater doesn't. While he's running
         or idling on the ground and hasn't turned around, speed decays only
         2.5% a frame instead — so a dash or a sprint carries on as a glide. */
  drift_board: {
    noReflect: true,
    update(e) {
      const o = e.owner;
      const free = o.alive && o.state !== ST.DEAD && o.grounded && o.rootT <= 0 &&
                   (o.state === ST.RUN || o.state === ST.IDLE);
      const pv = e.pv || 0;
      if (free && Math.abs(pv) > 1 && Math.sign(o.vx) === Math.sign(pv) && o.facing === Math.sign(pv) &&
          Math.abs(o.vx) < Math.abs(pv) * 0.975) {
        o.vx = pv * 0.975;
        if (o.state === ST.IDLE) o.setState(ST.RUN);
      }
      e.pv = o.vx; e.x = o.x; e.y = o.y;
      return false;
    },
    draw(g, e, c) {
      // speed lines streaming off the back of his board when he's flying
      const o = e.owner, v = o.vx;
      if (!o.alive || o.state === ST.DEAD || Math.abs(v) < 6.5) return;
      const k = clamp((Math.abs(v) - 6.5) / 6, 0, 1), s = -Math.sign(v);
      g.save(); g.globalAlpha = 0.5 * k;
      g.strokeStyle = o.ch.accent; g.lineWidth = 2; g.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const y = o.y + 4 + i * 9, x = o.x + s * (18 + i * 4);
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + s * (20 + k * 26 - i * 4), y); g.stroke();
      }
      g.restore();
    },
  },

  /* ---- QUILL: a caltrop. Flies in a short arc (and pricks anyone it hits
         on the way), then sits on the floor until a foe steps on it. ---- */
  quill_spike: {
    update(e, fighters) {
      if (!e.landed) {
        e.vy = Math.min(e.vy + 0.5, 14); e.x += e.vx; e.y += e.vy; e.vx *= 0.99;
        if (e.vy > 0) {
          const fl = Stage.floorBelow(e.x, e.y - e.vy);
          if (fl !== null && e.y >= fl) {
            e.y = fl; e.landed = true; e.vx = 0; e.vy = 0;
            Snd.tone(1400, 0.03, "square", 0.04, 900);
            return false;
          }
        }
        if (e.y > CFG.world.h + 200) return true;
        return Entities._touch(e, fighters, true);
      }
      const fl = Stage.floorBelow(e.x, e.y - 8);
      if (fl === null || fl - e.y > 10) { e.landed = false; return false; }
      e.y = fl;
      for (const f of fighters) {
        if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || !f.grounded || f.intangible()) continue;
        if (Math.abs(f.x - e.x) < f.w * 0.5 + 4 && Math.abs(f.feetY - e.y) < 12) {
          Combat.land(e.owner, f, e.move, e.x, e.y - 6);
          FX.burst(e.x, e.y - 4, 8, e.owner.ch.accent, 4);
          return true;                                   // spent
        }
      }
      return false;
    },
    draw(g, e, c) {
      const a = clamp(e.life / 30, 0, 1);
      g.save(); g.globalCompositeOperation = "source-over"; g.globalAlpha = a;
      g.translate(e.x, e.y - (e.landed ? 5 : 0));
      g.rotate(e.landed ? 0 : e.life * 0.4);
      const ac = e.owner.ch.accent;
      for (let i = 0; i < 4; i++) {
        g.save(); g.rotate(i * Math.PI / 2 + 0.6);
        plate(g, [-2.2, 0, 2.2, 0, 0, -8], ac, { ink: 1.8, rim: false });
        g.fillStyle = INK; poly(g, [-0.8, -5.5, 0.8, -5.5, 0, -8]); g.fill();
        g.restore();
      }
      g.fillStyle = c; g.beginPath(); g.arc(0, 0, 2.2, 0, 7); g.fill();
      g.restore();
    },
  },

  /* ---- QUILL: Needle Storm's cloud. Sits over the stage (w = half its
         width) and drops a needle every other frame: half fall anywhere, half
         fall on or near a foe, so standing still in it is what costs you. ---- */
  quill_storm: {
    noReflect: true,
    update(e, fighters) {
      if (e.life % 2 !== 0) return false;
      let x = e.x + rnd(-e.w, e.w);
      if (e.life % 4 === 0) {
        const foes = fighters.filter(f => !allies(f, e.owner) && f.alive && f.state !== ST.DEAD);
        if (foes.length) x = pick(foes).x + rnd(-40, 40);
      }
      Entities.add("quill_needle", e.owner, { x, y: e.y + 20, vx: rnd(-0.4, 0.4), vy: rnd(11, 13),
        r: 9, life: 90, log: e.log, move: e.move });
      return false;
    },
    draw(g, e, c) {
      const a = clamp((e.max - e.life) / 15, 0, 1) * clamp(e.life / 20, 0, 1);
      g.save(); g.globalCompositeOperation = "source-over"; g.globalAlpha = 0.5 * a;
      const q = g.createLinearGradient(0, e.y - 40, 0, e.y + 50);
      q.addColorStop(0, hexA("#2a1a10", 0)); q.addColorStop(0.5, hexA("#2a1a10", 0.9)); q.addColorStop(1, hexA("#2a1a10", 0));
      g.fillStyle = q; g.fillRect(e.x - e.w - 40, e.y - 40, e.w * 2 + 80, 90);
      g.restore();
      g.save(); g.globalAlpha = 0.6 * a; g.strokeStyle = c; g.lineWidth = 1.5;
      for (let i = 0; i < 12; i++) {
        const x = e.x - e.w + ((i * 137 + e.life * 9) % (e.w * 2));
        g.beginPath(); g.moveTo(x, e.y + 10); g.lineTo(x - 2, e.y + 34); g.stroke();
      }
      g.restore();
    },
  },

  /* ---- QUILL: one falling needle. It drops straight through the thin
         platforms and sticks in solid floor; each foe can be stuck at most
         nine times, no faster than one every 7 frames. */
  quill_needle: {
    noReflect: true,
    update(e, fighters) {
      if (e.landed) return false;
      e.x += e.vx; e.y += e.vy;
      let fl = null;
      for (const s of Stage.segs) {
        if (!s.solid) continue;
        const sy = Stage.surfaceY(s, e.x);
        if (sy !== null && sy >= e.y - e.vy - 2 && (fl === null || sy < fl)) fl = sy;
      }
      if (fl !== null && e.y >= fl) { e.y = fl; e.landed = true; e.life = Math.min(e.life, 20); return false; }
      if (e.y > CFG.world.h + 100) return true;
      const fr = Match.current ? Match.current.frames : 0;
      for (const f of fighters) {
        if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
        if (dist(e.x, e.y, f.x, f.y) > e.r + f.ch.hurt) continue;
        const h = e.log[f.slot] || (e.log[f.slot] = { n: 0, at: -99 });
        if (h.n >= 9 || fr - h.at < 7) continue;
        h.n++; h.at = fr;
        Combat.land(e.owner, f, e.move, e.x, e.y);
        return true;
      }
      return false;
    },
    draw(g, e, c) {
      const ac = e.owner.ch.accent, a = e.landed ? clamp(e.life / 20, 0, 1) : 1;
      g.save(); g.globalCompositeOperation = "source-over"; g.globalAlpha = a;
      g.translate(e.x, e.y); g.rotate(e.landed ? 0.15 : 0.04);
      g.lineCap = "round";
      g.strokeStyle = INK; g.lineWidth = 4.2;
      g.beginPath(); g.moveTo(0, -20); g.lineTo(0, e.landed ? -2 : 4); g.stroke();
      g.strokeStyle = ac; g.lineWidth = 2.2; g.stroke();
      g.strokeStyle = c; g.lineWidth = 2.2;
      g.beginPath(); g.moveTo(0, -20); g.lineTo(0, -13); g.stroke();
      g.restore();
    },
  },

  /* ---- QUILL: the thorns watcher. A light attack that lands on him this
         frame costs the attacker 1% (once per swing). ---- */
  quill_bristle: {
    noReflect: true,
    update(e) {
      const o = e.owner;
      e.x = o.x; e.y = o.y;
      if (o.hitFlash !== 8 || o.state !== ST.HITSTUN) return false;
      const a = o.lastHitBy;
      // (no hitboxActive() test: the hit-confirm cut has already moved their
      // attack past its active frames by the time this runs)
      if (!a || a === o || allies(a, o) || !a.alive || !a.attack ||
          a.attack.kind !== "light" || e.lastId === a.attack.hitId) return false;
      e.lastId = a.attack.hitId;
      a.percent = Math.min(999, a.percent + 1); a.hitFlash = 4;
      o.stats.damageDealt += 1;
      FX.damageText(a.x, a.y - 40, "PRICKED", o.ch.accent);
      FX.burst(a.x, a.y, 6, o.ch.accent, 3);
      Snd.tone(1700, 0.04, "square", 0.06, 1100);
      return false;
    },
    draw() {},
  },
});


/* ===== src/08e_kinds_d.js ===== */
/* ==========================================================================
   9e. ENTITY KINDS (wave 3d) — what NOVA, HOOK and TWIN put into the world,
       plus the CPU's notes on how to use their specials

   Same contract as 08a: { update(e, fighters) -> gone?, draw(g, e, color),
   end?(e, fighters) }, and every draw() works from the fields the netcode
   ships (x, y, r, life, max, dir, landed, w) plus e.owner.
   ========================================================================== */

/** Twin's clone hits with a weaker copy of whatever move she threw. One copy
    per move object, so stale-move tracking sees a stable name. */
const TWIN_ECHO_MOVES = new WeakMap();
function twinEchoMove(m) {
  let e = TWIN_ECHO_MOVES.get(m);
  if (!e) {
    e = hitMove(m.name, { dmg: m.dmg * 0.6, base: (m.base || 2) * 0.8, scale: (m.scale || 0.5) * 0.85, angle: m.angle });
    TWIN_ECHO_MOVES.set(m, e);
  }
  return e;
}

/** Draw one of Twin's mirror images: her own art, faded, with a shimmer.
    It borrows her current swing when she is attacking (guests rebuild her
    attack from the snapshot too), so the copy visibly moves with her. */
function twinMirrorDraw(g, e, alpha) {
  const o = e.owner, atk = o.state === ST.ATTACK && o.attack &&
    (o.attack.kind === "light" || o.attack.kind === "heavy") ? o.attack : null;
  g.save(); g.globalCompositeOperation = "source-over";
  g.globalAlpha = alpha * (0.8 + 0.2 * Math.sin(e.life * 0.3));
  g.translate(e.x + Math.sin(e.life * 0.7) * 1.2, e.y); g.scale(e.dir || 1, 1);
  o.ch.draw(g, {
    time: e.life, runPhase: 0, running: false, air: false, vx: 0, vy: 0, state: ST.IDLE, flash: false,
    atkPhase: atk ? clamp(atk.t / Math.max(1, atk.total), 0, 1) : -1, atkKind: atk ? atk.kind : null,
    atkT: atk ? atk.t : 0, atkStartup: atk ? atk.data.startup : 0, atkActive: atk ? atk.data.active : 0,
    atkTotal: atk ? atk.total : 0, move: atk ? atk.data : null, v: { clone: 1 }, percent: 0,
  });
  g.restore();
  // scanlines across the image, so it reads as a reflection, not a fighter
  g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = alpha * 0.5;
  g.fillStyle = o.ch.accent;
  for (let i = 0; i < 4; i++) {
    const yy = e.y - 30 + ((e.life * 1.6 + i * 16) % 60);
    g.fillRect(e.x - 14, yy, 28, 1.2);
  }
  g.restore();
}

Object.assign(KINDS, {

  /* ---- NOVA: Star Charge. Its size is its charge (r ships to guests), so
         a full comet looks like one everywhere. ---- */
  nova_star: {
    update(e, fighters) {
      if (e.life % 2 === 0) FX.spark(e.x - e.dir * e.r, e.y + rnd(-e.r, e.r) * 0.5, e.r > 15 ? "#ffffff" : e.owner.ch.color);
      return flyOff(e) || Entities._touch(e, fighters, true);
    },
    end(e) {
      FX.burst(e.x, e.y, 6 + Math.round(e.r), e.owner.ch.color, 3 + e.r * 0.2);
      if (e.r > 15) FX.ring(e.x, e.y, 6, 70, "#ffffff", 3);
    },
    draw(g, e, c) {
      g.save(); g.translate(e.x, e.y);
      // comet tail, longer the bigger the star
      const tl = e.r * 3;
      const q = g.createLinearGradient(0, 0, -e.dir * tl, 0);
      q.addColorStop(0, hexA(c, 0.7)); q.addColorStop(1, hexA(c, 0));
      g.fillStyle = q;
      poly(g, [0, -e.r * 0.7, -(e.dir || 1) * tl, 0, 0, e.r * 0.7]); g.fill();
      g.rotate(e.life * 0.2);
      g.shadowColor = c; g.shadowBlur = 14 + e.r;
      g.fillStyle = c; w3dStarPath(g, e.r, e.r * 0.46, 0); g.fill();
      g.fillStyle = "#ffffff"; w3dStarPath(g, e.r * 0.55, e.r * 0.26, 0); g.fill();
      g.restore();
    },
  },

  /* ---- NOVA: Supernova's blast ring. Expands once, hits each foe once as
         it passes them. ---- */
  nova_ring: {
    update(e, fighters) {
      e.r = e.maxR * (1 - e.life / e.max) + 10;
      for (const f of fighters) {
        if (allies(f, e.owner) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
        if (e.hitIds.includes(f.slot)) continue;
        if (Math.abs(dist(e.x, e.y, f.x, f.y) - e.r) < f.ch.hurt + 14) {
          e.hitIds.push(f.slot);
          Combat.land(e.owner, f, e.move, f.x, f.y);
        }
      }
      if (e.life % 2 === 0) {
        const an = Math.random() * 7;
        FX.spark(e.x + Math.cos(an) * e.r, e.y + Math.sin(an) * e.r, pick(["#ffffff", e.owner.ch.color]));
      }
      return false;
    },
    draw(g, e, c) {
      const a = clamp(e.life / e.max, 0, 1);
      g.save(); g.globalAlpha = a;
      g.strokeStyle = c; g.lineWidth = 10 * a + 3; g.shadowColor = c; g.shadowBlur = 26;
      g.beginPath(); g.arc(e.x, e.y, e.r, 0, 7); g.stroke();
      g.strokeStyle = "#ffffff"; g.lineWidth = 2;
      g.beginPath(); g.arc(e.x, e.y, Math.max(1, e.r - 8), 0, 7); g.stroke();
      // star points riding the front
      g.fillStyle = "#ffffff";
      for (let i = 0; i < 8; i++) {
        const an = i / 8 * Math.PI * 2 + e.life * 0.02;
        g.save(); g.translate(e.x + Math.cos(an) * e.r, e.y + Math.sin(an) * e.r);
        w3dStarPath(g, 6, 2.6, an); g.fill();
        g.restore();
      }
      g.restore();
    },
  },

  /* ---- HOOK: Cast Line / The Big Catch. Flies out on a chain; a foe it
         catches is reeled to her and handed over still stunned. A seeking
         hook (the super) homes on one foe and holds them until the slam.
         `landed` marks a catch, so guests can draw the line pulled taut. ---- */
  hook_line: {
    update(e, fighters) {
      const o = e.owner;
      if (!o.alive || o.state === ST.DEAD || o.state === ST.HITSTUN) return true;
      const t = e.tgt;

      if (t) {                                                     // reeling in
        const oa = o.attack;
        const holding = e.hold && o.state === ST.ATTACK && oa && oa.kind === "super" &&
                        oa.t < oa.data.startup + (oa.data.slamAt || 0);
        if (!t.alive || t.state === ST.DEAD || t.state !== ST.HITSTUN) return true;
        const gx = o.x + o.facing * 44, gy = o.y - 4;
        const dx = gx - t.x, dy = gy - t.y, d = Math.hypot(dx, dy);
        const sp = Math.min(22, d * 0.25);
        t.vx = d > 1 ? dx / d * sp : 0; t.vy = d > 1 ? dy / d * sp : 0;
        t.grounded = false; t.groundSeg = null;
        t.hitstun = Math.max(t.hitstun, 6);
        e.x = t.x; e.y = t.y;
        if (--e.reel > 0 && (d > 34 || holding)) return false;
        if (holding) return false;
        // the super lets go on the slam frame: leave the slam's launch alone
        if (e.hold) return true;
        // landed: dropped right in front of her, still reeling
        t.vx *= 0.15; t.vy = -1.5;
        t.hitstun = Math.max(t.hitstun, 16);
        FX.ring(t.x, t.y, 6, 44, o.ch.accent, 3);
        Snd.tone(300, 0.08, "square", 0.1, 600);
        return true;
      }

      if (!e.back) {                                               // flying out
        if (e.seek) {
          const s = e.seek;
          if (!s.alive || s.state === ST.DEAD) { e.back = true; return false; }
          const dx = s.x - e.x, dy = s.y - e.y, d = Math.hypot(dx, dy) || 1;
          e.vx = dx / d * 24; e.vy = dy / d * 24;
        }
        e.x += e.vx; e.y += e.vy;
        if (e.vx) e.dir = e.vx > 0 ? 1 : -1;
        if (!e.seek && (Math.abs(e.x - e.ox0) > e.range || e.life < 50)) { e.back = true; return false; }
        if (e.seek && e.life < 12) { e.back = true; return false; }
        for (const f of fighters) {
          if (allies(f, o) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
          if (e.seek && f !== e.seek) continue;
          if (dist(e.x, e.y, f.x, f.y) > e.r + f.ch.hurt) continue;
          Combat.land(o, f, e.move, e.x, e.y);
          if (f.state === ST.HITSTUN) {
            e.tgt = f; e.landed = true; e.reel = e.hold ? 999 : 28;
            FX.damageText(f.x, f.y - 50, "HOOKED!", o.ch.accent);
            Snd.tone(220, 0.1, "sawtooth", 0.1, 500);
          } else e.back = true;                                     // shielded: wind it in
          return false;
        }
        return false;
      }

      // winding back in, empty
      const dx = o.x - e.x, dy = o.y - 10 - e.y, d = Math.hypot(dx, dy) || 1;
      if (d < 26) return true;
      e.x += dx / d * Math.min(20, d); e.y += dy / d * Math.min(20, d);
      return false;
    },
    draw(g, e, c) {
      const o = e.owner, ac = o.ch.accent;
      const hx = o.x + o.facing * 30, hy = o.y - 14;
      g.save(); g.globalCompositeOperation = "source-over";
      // the line: taut and straight on a catch, sagging otherwise
      const sag = e.landed ? 0 : 18;
      const line = () => { g.beginPath(); g.moveTo(hx, hy);
        g.quadraticCurveTo((hx + e.x) / 2, (hy + e.y) / 2 + sag, e.x, e.y); };
      line(); g.strokeStyle = INK; g.lineWidth = 4; g.stroke();
      line(); g.strokeStyle = e.landed ? ac : "#d8dee8"; g.lineWidth = 2;
      g.setLineDash([4, 3]); g.stroke(); g.setLineDash([]);
      // the hook itself, pointing along the line
      g.translate(e.x, e.y);
      g.rotate(Math.atan2(e.y - hy, e.x - hx));
      g.lineCap = "round";
      const hook = () => { g.beginPath(); g.moveTo(-10, 0); g.lineTo(4, 0); g.arc(4, 6, 6, -Math.PI / 2, Math.PI * 0.85); };
      hook(); g.strokeStyle = INK; g.lineWidth = 5.4; g.stroke();
      hook(); g.strokeStyle = "#e8ecf2"; g.lineWidth = 2.8; g.stroke();
      g.fillStyle = ac; g.beginPath(); g.arc(-10, 0, 3, 0, 7); g.fill();
      if (e.landed) { g.globalCompositeOperation = "lighter"; g.shadowColor = ac; g.shadowBlur = 14;
        g.strokeStyle = hexA(ac, 0.7); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 14, 0, 7); g.stroke(); }
      g.restore();
    },
  },

  /* ---- TWIN: Split's mirror clone. Stands where she was, faces the
         opposite way to her, and throws every light and heavy she does —
         its hitbox is her move's ox/oy/r mirrored onto the clone. Each foe
         can be hit once per attack. ---- */
  twin_clone: {
    update(e, fighters) {
      const o = e.owner;
      if (!o.alive || o.state === ST.DEAD) return true;
      e.dir = -o.facing;
      const a = o.attack;
      if (o.state === ST.ATTACK && a && (a.kind === "light" || a.kind === "heavy") && o.hitboxActive()) {
        const m = a.data;
        const hx = e.x + (m.ox || 0) * e.dir, hy = e.y + (m.oy || 0);
        if (e.atk !== a.hitId) {
          e.atk = a.hitId; e.hitIds = [];
          FX.blade(e.x + e.dir * 8, hy, e.dir > 0 ? 0 : Math.PI, 20, (m.ox || 30) + m.r, 0.8, o.ch.accent, { w: 8, life: 9 });
        }
        for (const f of fighters) {
          if (allies(f, o) || !f.alive || f.state === ST.DEAD || f.intangible()) continue;
          if (e.hitIds.includes(f.slot) || dist(hx, hy, f.x, f.y) > m.r + f.ch.hurt) continue;
          e.hitIds.push(f.slot);
          Combat.land(o, f, twinEchoMove(m), hx, hy, m.r, f.x >= e.x ? 1 : -1);
        }
      }
      if (e.life % 6 === 0) FX.spark(e.x + rnd(-14, 14), e.y + rnd(-26, 26), o.ch.accent);
      if (e.life === 1) FX.burst(e.x, e.y, 14, o.ch.accent, 4);
      return false;
    },
    draw(g, e) {
      const fade = clamp(e.life / 30, 0, 1) * clamp((e.max - e.life) / 10, 0, 1);
      twinMirrorDraw(g, e, 0.4 * fade);
    },
  },

  /* ---- TWIN: Doppelganger's clones. Hover in place around the target,
         lunge in for the last few frames, and strike together. ---- */
  twin_double: {
    update(e) {
      const t = e.tgt;
      if (t && t.alive && t.state !== ST.DEAD) {
        const k = e.life < 7 ? 0.35 : 1;                            // the lunge
        e.x = t.x + e.ox * k; e.y = t.y + e.oy * k;
        e.dir = t.x >= e.x ? 1 : -1;
        if (e.oy && !e.ox) e.dir = e.owner.facing;
      }
      if (e.life % 3 === 0) FX.spark(e.x + rnd(-12, 12), e.y + rnd(-20, 20), e.owner.ch.accent);
      return false;
    },
    end(e, fighters) {
      const o = e.owner, t = e.tgt;
      FX.blade(e.x, e.y - 4, Math.atan2((t ? t.y : e.y) - e.y, (t ? t.x : e.x + e.dir) - e.x), 20, 70, 0.5, o.ch.accent, { w: 12, life: 10 });
      FX.burst(e.x, e.y, 10, o.ch.color, 5);
      Snd.tone(1000, 0.08, "triangle", 0.1, 400);
      if (t && t.alive && t.state !== ST.DEAD && !t.intangible() && dist(e.x, e.y, t.x, t.y) < 160)
        Combat.land(o, t, e.move, t.x, t.y);
      else Entities.blast(o, e.x, e.y, 60, e.move, fighters);
    },
    draw(g, e) {
      const k = clamp((e.max - e.life) / 6, 0, 1);
      twinMirrorDraw(g, e, 0.6 * k);
    },
  },
});

/* ---------------------------------------------------------------- CPU
   The base CPU only knows the specials it was written for. This runs after
   it and adds presses for these four; it only ever presses buttons, so it
   composes with any other wave that wraps CPU.think the same way. */
const W3D_CPU = {
  // charge to suit the range: tap up close, a full comet across the stage
  NOVA(f, ai, t, adx, ady, facing) {
    const a = f.attack;
    if (f.state === ST.ATTACK && a && a.kind === "special") {
      const want = adx > 320 ? NOVA_MAX_CHARGE : adx > 160 ? 34 : 8;
      if ((f.v.charge || 0) < want) ai.cur.special = true;
      return;
    }
    if (facing && ady < 60 && adx > 70 && Math.random() < 0.02) ai.cur.special = true;
  },
  HOOK(f, ai, t, adx, ady, facing) {
    if (facing && adx > 110 && adx < 340 && ady < 50 && Math.random() < 0.025) ai.cur.special = true;
  },
  BLITZ(f, ai, t, adx, ady, facing) {
    if (facing && adx < 120 && ady < 40 && Math.random() < 0.03) ai.cur.special = true;
  },
  TWIN(f, ai, t, adx, ady, facing) {
    const hasClone = Entities.list.some(e => e.kind === "twin_clone" && e.owner === f);
    if (!hasClone && adx < 220 && Math.random() < 0.015) ai.cur.special = true;
  },
};
const W3D_SUPER_RANGE = { NOVA: 260, HOOK: 1000, BLITZ: 300, TWIN: 700 };

const w3dBaseThink = CPU.think;
CPU.think = function (f, match) {
  const inp = w3dBaseThink.call(this, f, match);
  const fn = W3D_CPU[f.ch.id];
  if (!fn || !f._ai) return inp;
  const ai = f._ai, t = Combat.nearestFoe(f);
  if (!t) return inp;
  const charging = f.state === ST.ATTACK && f.attack && f.attack.kind === "special";
  // only add a press when she is free to act (or mid-charge) and on stage
  if (!charging && (![ST.IDLE, ST.RUN, ST.AIR].includes(f.state) || f.groundSeg === null && !f.grounded &&
      Math.abs(f.x - Stage.pivot.x) > Math.abs(Stage.def.layout[0].x2))) return inp;
  const dx = t.x - f.x, adx = Math.abs(dx), ady = Math.abs(t.y - f.y);
  if (!charging && f.meterFull && adx < W3D_SUPER_RANGE[f.ch.id] && Math.random() < CFG.cpu.superChance) {
    ai.cur.super = true; return inp;
  }
  if (charging || f.specialCD <= 0) fn(f, ai, t, adx, ady, Math.sign(dx) === f.facing);
  return inp;
};


/* ===== src/08f_items.js ===== */
/* ==========================================================================
   9b. ITEMS — power-ups that drop onto the stage mid-match

   Every so often a capsule floats down onto a random platform. Touching it
   uses it at once (there is no pick-up button to learn), so items change who
   wins a scramble rather than adding inputs. They can be switched off on the
   stage-select screen and in the online lobby.

   Only the host simulates items. Guests get the list in every snapshot and
   the buff on each fighter in its status array, so nothing here needs its
   own network message.
   ========================================================================== */

const ITEMS = {
  heart:  { name: "HEART",  color: "#ff4f7a", note: "Heals 35% damage on the spot." },
  boost:  { name: "BOOST",  color: "#4fe8ff", note: "Run and jump faster for 8 seconds." },
  power:  { name: "POWER",  color: "#ff8a1a", note: "Your hits do 30% more for 8 seconds." },
  star:   { name: "STAR",   color: "#ffd23d", note: "Invincible for 6 seconds, and touching a foe hurts them." },
  charge: { name: "CHARGE", color: "#b6ff3b", note: "Half a super meter, instantly." },
  bomb:   { name: "BOMB",   color: "#ff2e88", note: "Lobbed at the nearest foe. It sticks, then blows." },
};
const ITEM_IDS = Object.keys(ITEMS);
/* How often each one turns up. Star is the rare one. */
const ITEM_WEIGHT = { heart: 2, boost: 2, power: 2, star: 1, charge: 2, bomb: 2 };
/* Timed buffs ride on the fighter; index 0 is "none". Order is wire format. */
const BUFF_IDS = ["", "boost", "power", "star"];

const ITEM_CFG = {
  first:  6 * 60,          // the first drop, after the countdown
  gapMin: 8 * 60, gapMax: 13 * 60,
  max:    2,               // never more than this many on the stage at once
  life:   14 * 60,         // an ignored item fades away
  fall:   2.6,             // capsules drift down under a little parachute
  reach:  20,              // pick-up radius beyond the fighter's hurtbox
  buff:   { boost: 8 * 60, power: 8 * 60, star: 6 * 60 },
  heal:   35,
  boostMul: 1.3,
  powerMul: 1.3,
};
const ITEM_BOMB = { name: "Item Bomb", dmg: 14, base: 4.5, scale: 1.0, angle: 55, unblockable: true };
const STAR_TOUCH = { name: "Star", dmg: 8, base: 5.2, scale: 0.75, angle: 48 };

const Items = {
  list: [],
  on: true,
  timer: 0,
  nextId: 1,

  reset(on) {
    this.list.length = 0;
    this.on = on !== false;
    this.timer = ITEM_CFG.first;
  },

  pickKind() {
    let total = 0;
    for (const k of ITEM_IDS) total += ITEM_WEIGHT[k];
    let r = Math.random() * total;
    for (const k of ITEM_IDS) { r -= ITEM_WEIGHT[k]; if (r < 0) return k; }
    return "heart";
  },

  /** Drop one over a random platform, from well above the camera's view. */
  spawn() {
    const segs = Stage.segs.filter(s => Math.abs(s.bx - s.ax) > 60);
    if (!segs.length) return;
    const s = pick(segs);
    const x = lerp(s.ax, s.bx, rnd(0.15, 0.85));
    const y = Math.min(s.ay, s.by) - 520;
    this.list.push({ id: this.nextId++, kind: this.pickKind(), x, y, vy: 0,
                     landed: false, life: ITEM_CFG.life, t: 0 });
  },

  update(fighters) {
    if (!this.on) return;
    if (this.list.length < ITEM_CFG.max && --this.timer <= 0) {
      this.spawn();
      this.timer = rndi(ITEM_CFG.gapMin, ITEM_CFG.gapMax);
    }

    for (let i = this.list.length - 1; i >= 0; i--) {
      const it = this.list[i];
      it.t++; it.life--;
      // falls, or rides whatever it is sitting on (a lift, a drifting ledge)
      const fl = Stage.floorBelow(it.x, it.y - 18);
      if (fl !== null && it.y >= fl - 2 && it.y <= fl + 20) {
        if (!it.landed) { FX.burst(it.x, fl, 6, ITEMS[it.kind].color, 2); Snd.land(); }
        it.y = fl; it.vy = 0; it.landed = true;
      } else {
        it.landed = false;
        it.vy = Math.min(it.vy + 0.12, ITEM_CFG.fall);
        it.y += it.vy;
        if (fl !== null && it.y > fl) { it.y = fl; it.vy = 0; it.landed = true; }
      }
      if (it.life <= 0 || it.y > Stage.blast.bottom) { this.list.splice(i, 1); continue; }

      for (const f of fighters) {
        if (!f.alive || f.state === ST.DEAD || f.state === ST.RESPAWN) continue;
        // the capsule hangs 18 above the floor it sits on
        if (dist(f.x, f.y, it.x, it.y - 18) > f.ch.hurt + ITEM_CFG.reach) continue;
        this.list.splice(i, 1);
        this.apply(f, it.kind, it.x, it.y - 18);
        break;
      }
    }

    // a star makes its holder a weapon: running into a foe hits them
    for (const f of fighters) {
      if (f.buff !== "star" || !f.alive || f.state === ST.DEAD) continue;
      f._starHit = f._starHit || {};
      for (const o of fighters) {
        if (allies(o, f) || !o.alive || o.state === ST.DEAD || o.intangible()) continue;
        if ((f._starHit[o.slot] || 0) > f.animTime) continue;
        if (dist(f.x, f.y, o.x, o.y) > f.ch.hurt + o.ch.hurt) continue;
        f._starHit[o.slot] = f.animTime + 40;
        Combat.land(f, o, STAR_TOUCH, (f.x + o.x) / 2, (f.y + o.y) / 2);
      }
    }
  },

  /** f touched an item of this kind at (x, y). */
  apply(f, kind, x, y) {
    const def = ITEMS[kind];
    f.stats.items = (f.stats.items || 0) + 1;
    FX.ring(x, y, 8, 90, def.color, 4);
    FX.burst(x, y, 18, def.color, 6);
    FX.damageText(f.x, f.y - f.h * 0.7, def.name + "!", def.color);
    Snd.tone(660, 0.07, "square", 0.12, 1320);
    Snd.tone(990, 0.12, "triangle", 0.1, 1760, 0.06);

    switch (kind) {
      case "heart": {
        const heal = Math.min(f.percent, ITEM_CFG.heal);
        f.percent -= heal;
        FX.damageText(f.x, f.y - f.h * 0.7 - 22, "-" + Math.round(heal) + "%", "#7dff9a");
        break;
      }
      case "charge":
        f.addMeter(CFG.meter.max * 0.5);
        break;
      case "bomb": {
        const t = Combat.nearestFoe(f, 900);
        const dir = t ? Math.sign(t.x - f.x) || f.facing : f.facing;
        const dx = t ? Math.abs(t.x - f.x) : 260;
        Entities.add("bomb", f, { x: f.x, y: f.y - 30, vx: dir * clamp(dx / 34, 5, 13), vy: -8,
                                  r: 11, life: 150, move: ITEM_BOMB });
        break;
      }
      default:                       // boost, power, star: a timed buff
        f.buff = kind;
        f.buffT = ITEM_CFG.buff[kind];
        if (kind === "star") { FX.flash("#ffd23d", 0.18); f._starHit = {}; }
    }
  },

  /* ------------------------------------------------------------ drawing */
  draw(g) {
    for (const it of this.list) {
      // the last two seconds it blinks, so nobody walks to one that vanishes
      if (it.life < 120 && Math.floor(it.life / 6) % 2 === 0) continue;
      const bob = it.landed ? Math.sin(it.t * 0.08) * 3 : 0;
      const y = it.y - 18 + bob;
      g.save();
      g.translate(it.x, y);
      if (!it.landed) {
        // a little parachute while it drifts in
        g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(-12, -6); g.lineTo(-20, -38); g.moveTo(12, -6); g.lineTo(20, -38); g.stroke();
        g.fillStyle = hexA(ITEMS[it.kind].color, 0.85);
        g.beginPath(); g.arc(0, -38, 24, Math.PI, 0); g.closePath(); g.fill();
        g.strokeStyle = INK; g.lineWidth = 2.5; g.stroke();
      }
      itemIcon(g, it.kind, 0, 0, 1, it.t);
      g.restore();
    }
  },
};

/** One item's capsule, centred on (x, y). Also used by the menus. */
function itemIcon(g, kind, x, y, s, t) {
  const def = ITEMS[kind], c = def.color;
  t = t || 0;
  g.save();
  g.translate(x, y); g.scale(s, s);
  // halo
  g.save(); g.globalCompositeOperation = "lighter";
  g.globalAlpha = 0.35 + Math.sin(t * 0.12) * 0.12;
  const q = g.createRadialGradient(0, 0, 4, 0, 0, 30);
  q.addColorStop(0, c); q.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = q; g.beginPath(); g.arc(0, 0, 30, 0, 7); g.fill();
  g.restore();
  // capsule
  ink(g, () => { g.beginPath(); g.arc(0, 0, 16, 0, 7); }, vol(g, -16, 16, c, 0.3, -0.35));
  g.fillStyle = "rgba(255,255,255,.35)";
  g.beginPath(); g.ellipse(-5, -8, 7, 4, -0.5, 0, 7); g.fill();
  // glyph
  g.fillStyle = "#ffffff"; g.strokeStyle = INK; g.lineWidth = 2; g.lineJoin = "round";
  switch (kind) {
    case "heart":
      g.beginPath();
      g.moveTo(0, 8); g.bezierCurveTo(-12, -1, -7, -11, 0, -4);
      g.bezierCurveTo(7, -11, 12, -1, 0, 8); g.closePath();
      g.stroke(); g.fill(); break;
    case "boost":
      poly(g, [-8, -7, 0, 0, -8, 7, -4, 7, 4, 0, -4, -7]); g.stroke(); g.fill();
      poly(g, [0, -7, 8, 0, 0, 7, 4, 7, 12, 0, 4, -7]); g.stroke(); g.fill(); break;
    case "power":
      g.beginPath(); roundRect(g, -8, -4, 16, 10, 3); g.stroke(); g.fill();
      g.beginPath();
      for (let i = 0; i < 3; i++) { g.rect(-8 + i * 5.5, -9, 4.5, 6); }
      g.stroke(); g.fill(); break;
    case "star": {
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4.5 : 10;
        g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      g.closePath(); g.stroke(); g.fill(); break;
    }
    case "charge":
      poly(g, [2, -11, -7, 2, -1, 2, -3, 11, 7, -2, 1, -2]); g.stroke(); g.fill(); break;
    case "bomb":
      g.beginPath(); g.arc(0, 2, 7.5, 0, 7); g.stroke(); g.fill();
      g.beginPath(); g.moveTo(3, -4); g.quadraticCurveTo(6, -10, 10, -9); g.stroke();
      g.fillStyle = "#ffd23d"; g.beginPath(); g.arc(10, -9, 2.4, 0, 7); g.fill(); break;
  }
  g.restore();
}

/** What a timed buff looks like on whoever has it. */
function drawBuff(f, rx, ry) {
  if (!f.buff || f.buffT <= 0) return;
  const c = ITEMS[f.buff].color, hurt = f.ch.hurt;
  // the last two seconds flicker so the holder knows it is running out
  if (f.buffT < 120 && Math.floor(f.buffT / 5) % 2 === 0) return;
  g.save();
  g.globalCompositeOperation = "lighter";
  if (f.buff === "star") {
    const hue = (f.animTime * 8) % 360;
    g.globalAlpha = 0.5;
    g.strokeStyle = `hsl(${hue},100%,65%)`; g.lineWidth = 4;
    g.shadowColor = g.strokeStyle; g.shadowBlur = 22;
    g.beginPath(); g.arc(rx, ry, hurt * 1.45, 0, 7); g.stroke();
    for (let i = 0; i < 5; i++) {
      const a = f.animTime * 0.09 + i * Math.PI * 0.4;
      g.fillStyle = `hsl(${(hue + i * 72) % 360},100%,70%)`;
      g.beginPath(); g.arc(rx + Math.cos(a) * hurt * 1.45, ry + Math.sin(a) * hurt * 1.45, 3, 0, 7); g.fill();
    }
  } else if (f.buff === "power") {
    g.globalAlpha = 0.28 + Math.sin(f.animTime * 0.25) * 0.1;
    const q = g.createRadialGradient(rx, ry, hurt * 0.4, rx, ry, hurt * 1.6);
    q.addColorStop(0, hexA(c, 0.9)); q.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = q; g.beginPath(); g.arc(rx, ry, hurt * 1.6, 0, 7); g.fill();
    // flames licking up off the shoulders
    g.globalAlpha = 0.7; g.fillStyle = c;
    for (let i = -1; i <= 1; i++) {
      const fl = 8 + Math.sin(f.animTime * 0.4 + i * 2) * 5;
      poly(g, [rx + i * 12 - 5, ry - f.h * 0.35, rx + i * 12, ry - f.h * 0.35 - fl, rx + i * 12 + 5, ry - f.h * 0.35]);
      g.fill();
    }
  } else if (f.buff === "boost") {
    g.globalAlpha = 0.55; g.strokeStyle = c; g.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      const yy = ry - 10 + i * 12, back = -Math.sign(f.vx || f.facing);
      const len = 10 + Math.min(26, Math.abs(f.vx) * 3);
      g.beginPath(); g.moveTo(rx + back * (hurt * 0.8), yy); g.lineTo(rx + back * (hurt * 0.8 + len), yy); g.stroke();
    }
  }
  g.restore();
}


/* ===== src/09_render.js ===== */
/* ==========================================================================
   10. RENDER — stage, fighters and HUD

   Everything that moves is drawn at an interpolated position between the two
   most recent fixed-timestep frames, so motion stays smooth on 120Hz and
   144Hz displays instead of stepping at 60.
   ========================================================================== */

const cv = document.getElementById("cv");
const g = cv.getContext("2d", { alpha: false });
let RA = 1;   // render alpha: 0..1 between the previous and current sim step

function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 18) / H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = Math.floor(W * scale) + "px";
  cv.style.height = Math.floor(H * scale) + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fitCanvas);

let bgT = 0;
function drawBackground() {
  bgT += 1 / 60;
  (Stage.def.drawBg || STAGES[0].drawBg).call(Stage.def, g, bgT);
}

/* The underside of a platform, drawn differently per stage. This is where a
   map stops being "the same deck in another colour": the Foundry's beam is
   cast iron with molten seams, the Drift's is weathered stone, the Vault's is
   bolted grating. Called already clipped to the platform body and rotated
   into its local space, so x runs along the deck and y down into it. */
function drawDeckDetail(kind, len, th, depth, pal, main, flare, t) {
  const bot = th / 2 + depth;

  if (kind === "cast") {
    // ribs, then molten seams that flare when the deck is struck
    g.strokeStyle = hexA("#000000", 0.5); g.lineWidth = 7;
    for (let x = 18; x < len; x += 46) {
      g.beginPath(); g.moveTo(x, th / 2); g.lineTo(x - 7, bot); g.stroke();
    }
    g.save();
    g.globalCompositeOperation = "lighter";
    const heat = 0.3 + flare * 0.5 + Math.sin(t * 1.4) * 0.08;
    g.strokeStyle = hexA("#ff7a1f", heat); g.lineWidth = 2.5;
    g.beginPath();
    for (let x = 0; x <= len; x += 16)
      g.lineTo(x, th / 2 + 10 + Math.sin(x * 0.07 + t) * 5);
    g.stroke();
    g.strokeStyle = hexA("#ffd27a", heat * 0.7); g.lineWidth = 1;
    g.stroke();
    g.restore();
    // drips
    g.fillStyle = hexA("#ff8a1f", 0.5);
    for (let i = 0; i < 5; i++) {
      const x = ((i * 137) % len);
      const d = 6 + (Math.sin(t * 1.1 + i * 2) * 0.5 + 0.5) * 16;
      g.beginPath(); g.ellipse(x, bot - 6, 2.4, d * 0.5, 0, 0, 7); g.fill();
    }

  } else if (kind === "cloud") {
    // weathered stone: soft strata and a mossy lip, no neon at all
    for (let i = 0; i < 3; i++) {
      g.fillStyle = hexA("#8e79b4", 0.18 - i * 0.04);
      g.fillRect(0, th / 2 + 4 + i * 11, len, 5);
    }
    g.fillStyle = hexA("#c9a7e8", 0.3);
    for (let i = 0; i < 14; i++) {
      const x = (i * 97) % len;
      g.beginPath(); g.ellipse(x, th / 2 + 2, 10 + (i % 4) * 5, 3, 0, 0, 7); g.fill();
    }
    // the stone tapers, hinting it is floating
    g.fillStyle = hexA(pal.ink, 0.5);
    poly(g, [0, bot - 22, len, bot - 22, len * 0.78, bot, len * 0.22, bot]); g.fill();

  } else if (kind === "grate") {
    // bolted plate: hazard stripes along the lip, a grille, rivet rows
    hatch(g, 0, th / 2, len, 9, "#39ff9e", 12, 0.3);
    g.strokeStyle = hexA("#000000", 0.55); g.lineWidth = 2;
    for (let x = 6; x < len; x += 11) {
      g.beginPath(); g.moveTo(x, th / 2 + 11); g.lineTo(x, bot); g.stroke();
    }
    g.strokeStyle = hexA(pal.platEdge, 0.2); g.lineWidth = 1;
    for (let y = th / 2 + 14; y < bot; y += 9) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(len, y); g.stroke();
    }
    for (let x = 14; x < len; x += 52) screw(g, x, th / 2 + 18, 2.4, "#1e7a56");

  } else if (kind === "steel") {
    // an I-beam: flange lines, web stiffeners, rows of rivets
    g.fillStyle = hexA("#000000", 0.35); g.fillRect(0, th / 2 + 8, len, 4);
    g.fillRect(0, bot - 10, len, 4);
    g.strokeStyle = hexA(pal.soft, 0.22); g.lineWidth = 3;
    for (let x = 20; x < len; x += 40) {
      g.beginPath(); g.moveTo(x, th / 2 + 12); g.lineTo(x, bot - 10); g.stroke();
    }
    for (let x = 10; x < len; x += 20) screw(g, x, th / 2 + 4, 1.8, "#8fa3c8");
    if (main) hatch(g, 0, bot - 8, len, 8, "#ffc23d", 12, 0.35);

  } else if (kind === "belt") {
    // the conveyor's rollers, turning with the belt
    for (let x = 22; x < len; x += 44) {
      g.fillStyle = "#15140f"; g.strokeStyle = hexA(pal.platEdge, 0.35); g.lineWidth = 2;
      g.beginPath(); g.arc(x, th / 2 + 18, 14, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = hexA(pal.platEdge, 0.5);
      g.beginPath();
      g.moveTo(x + Math.cos(beltRoll) * 12, th / 2 + 18 + Math.sin(beltRoll) * 12);
      g.lineTo(x - Math.cos(beltRoll) * 12, th / 2 + 18 - Math.sin(beltRoll) * 12);
      g.stroke();
    }
    hatch(g, 0, bot - 9, len, 9, "#f5d90a", 12, 0.4);

  } else if (kind === "moss") {
    // living wood: glowing fungus shelves and roots trailing off the bottom
    g.fillStyle = hexA("#2a1846", 0.8); g.fillRect(0, th / 2, len, depth);
    for (let i = 0; i < len / 30; i++) {
      const x = (i * 53) % len, gl = 0.4 + Math.sin(t * 1.2 + i) * 0.25;
      g.fillStyle = hexA(i % 2 ? "#7dffd0" : "#c46bff", gl);
      g.beginPath(); g.ellipse(x, th / 2 + 10 + (i % 3) * 9, 6, 3, 0, 0, 7); g.fill();
    }
    g.strokeStyle = hexA("#7dffd0", 0.25); g.lineWidth = 2;
    for (let x = 16; x < len; x += 38) {
      g.beginPath(); g.moveTo(x, bot - 14);
      g.quadraticCurveTo(x + 8, bot - 4, x + 2 + Math.sin(t + x) * 3, bot + 4); g.stroke();
    }

  } else if (kind === "ice") {
    // blue ice: frost bands and icicles hanging from the bottom edge
    for (let i = 0; i < 3; i++) {
      g.fillStyle = hexA("#bfe9ff", 0.12 - i * 0.03);
      g.fillRect(0, th / 2 + 6 + i * 12, len, 6);
    }
    g.fillStyle = hexA("#e6f6ff", 0.5);
    for (let x = 8; x < len; x += 22) {
      const d = 8 + hash(x) * (main ? 22 : 8);
      poly(g, [x - 5, bot - 12, x + 5, bot - 12, x, bot - 12 + d]); g.fill();
    }
    g.strokeStyle = hexA("#ffffff", 0.25); g.lineWidth = 1;
    for (let x = 30; x < len; x += 70) {
      g.beginPath(); g.moveTo(x, th / 2 + 2); g.lineTo(x + 10, th / 2 + 14); g.lineTo(x + 4, th / 2 + 24); g.stroke();
    }

  } else {
    // "neon": a lit circuit substrate under a dark deck
    g.strokeStyle = hexA(pal.platEdge, 0.16 + flare * 0.3); g.lineWidth = 3;
    for (let x = 10; x < len; x += 26) {
      g.beginPath(); g.moveTo(x, th / 2 + 4); g.lineTo(x + 12, th / 2 + 30); g.stroke();
    }
    g.strokeStyle = hexA(pal.platEdge, 0.1); g.lineWidth = 1;
    for (let x = 22; x < len; x += 64) {
      g.beginPath();
      g.moveTo(x, th / 2 + 6); g.lineTo(x, bot - 14); g.lineTo(x + 18, bot - 14);
      g.stroke();
      g.fillStyle = hexA(pal.platEdge, 0.3);
      g.beginPath(); g.arc(x + 18, bot - 14, 2, 0, 7); g.fill();
    }
  }
}

let beltRoll = 0, beltScroll = 0;

/* The support column under the deck. Same job on every map, eight different machines. */
function drawPivotColumn(P, kind, pal, t) {
  g.save();
  g.translate(P.x, P.y);

  if (kind === "steel") {
    // a lattice mast, the same kind as the crane in the background
    g.strokeStyle = hexA(pal.soft, 0.55); g.lineWidth = 4;
    g.beginPath(); g.moveTo(-20, 14); g.lineTo(-20, 340); g.moveTo(20, 14); g.lineTo(20, 340); g.stroke();
    g.lineWidth = 2.5;
    for (let y = 14; y < 330; y += 36) {
      g.beginPath(); g.moveTo(-20, y); g.lineTo(20, y + 36); g.moveTo(20, y); g.lineTo(-20, y + 36); g.stroke();
    }

  } else if (kind === "belt") {
    // a gearbox stack driving the conveyor (this runs once a frame, so it
    // also turns the rollers drawn under the deck)
    beltRoll += ((Stage.pfx[0] && Stage.pfx[0].belt) || 0) * 0.02;
    for (let i = 0; i < 4; i++) {
      const y = 50 + i * 76, r = 30 - i * 3;
      g.save(); g.translate(0, y); g.rotate(beltRoll * (i % 2 ? -1 : 1));
      g.fillStyle = "#1c1b16"; g.strokeStyle = hexA(pal.platEdge, 0.4); g.lineWidth = 3;
      g.beginPath();
      for (let k = 0; k < 20; k++) {
        const a = (k / 20) * Math.PI * 2, rr = k % 2 ? r : r + 7;
        g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath(); g.fill(); g.stroke();
      g.restore();
    }

  } else if (kind === "moss") {
    // the deck is the cap of one enormous mushroom
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, "#3a2560"); q.addColorStop(1, hexA("#1c1730", 0));
    g.fillStyle = q;
    poly(g, [-34, 10, 34, 10, 24, 340, -24, 340]); g.fill();
    g.fillStyle = hexA("#7dffd0", 0.3 + Math.sin(t) * 0.1);
    for (let y = 40; y < 300; y += 46) { g.beginPath(); g.arc(Math.sin(y) * 14, y, 4, 0, 7); g.fill(); }

  } else if (kind === "ice") {
    // a column of rock wrapped in ice
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, "#2d4363"); q.addColorStop(1, hexA("#1d2b3c", 0));
    g.fillStyle = q;
    poly(g, [-40, 10, 40, 10, 28, 180, 18, 340, -18, 340, -30, 170]); g.fill();
    g.strokeStyle = hexA("#bfe9ff", 0.35); g.lineWidth = 2;
    g.beginPath(); g.moveTo(-26, 30); g.lineTo(-12, 160); g.lineTo(-16, 300); g.stroke();

  } else if (kind === "cast") {
    // a chain hoist, because the Foundry's beam hangs rather than stands
    g.strokeStyle = "rgba(120,84,56,.75)"; g.lineWidth = 9;
    g.beginPath(); g.moveTo(0, 14); g.lineTo(0, 330); g.stroke();
    g.strokeStyle = "rgba(60,38,22,.9)"; g.lineWidth = 3;
    for (let y = 26; y < 330; y += 18) {
      g.beginPath(); g.ellipse(0, y, 7, 9, 0, 0, 7); g.stroke();
    }
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA("#ff8a1f", 0.3); g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 14); g.lineTo(0, 330); g.stroke();
    g.restore();

  } else if (kind === "cloud") {
    // a slender stone spire that frays into cloud
    const q = g.createLinearGradient(0, 10, 0, 340);
    q.addColorStop(0, hexA("#efe3f3", 0.9));
    q.addColorStop(0.55, hexA("#c9a7e8", 0.45));
    q.addColorStop(1, hexA("#c9a7e8", 0));
    g.fillStyle = q;
    poly(g, [-13, 10, 13, 10, 5, 340, -5, 340]); g.fill();
    g.strokeStyle = hexA("#8e79b4", 0.35); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-4, 20); g.lineTo(-2, 300); g.stroke();

  } else if (kind === "grate") {
    // a hydraulic piston, with a visible rod and collar
    g.fillStyle = "#0a1a14"; g.strokeStyle = pal.ink; g.lineWidth = 4;
    roundRect(g, -16, 12, 32, 330, 5); g.stroke(); g.fill();
    g.fillStyle = hexA("#1e7a56", 0.8);
    roundRect(g, -7, 12, 14, 330, 4); g.fill();
    g.fillStyle = hexA(pal.platEdge, 0.25);
    g.fillRect(-5, 12, 3, 330);
    for (let y = 40; y < 330; y += 54) {
      g.fillStyle = "#0a1a14"; g.strokeStyle = pal.ink; g.lineWidth = 3;
      roundRect(g, -19, y, 38, 12, 3); g.stroke(); g.fill();
      screw(g, -13, y + 6, 2.2, "#1e7a56");
      screw(g, 13, y + 6, 2.2, "#1e7a56");
    }

  } else {
    // "neon": a lit strut with energy running down it
    g.strokeStyle = hexA(pal.ink, 0.9); g.lineWidth = 14;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    g.strokeStyle = hexA(pal.soft, 0.5); g.lineWidth = 10;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(pal.platEdge, 0.4); g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(0, 340); g.stroke();
    // a pulse travelling down the strut
    const py = 12 + ((t * 120) % 328);
    const pg = g.createLinearGradient(0, py - 40, 0, py + 40);
    pg.addColorStop(0, hexA(pal.platEdge, 0));
    pg.addColorStop(0.5, hexA("#ffffff", 0.5));
    pg.addColorStop(1, hexA(pal.platEdge, 0));
    g.strokeStyle = pg; g.lineWidth = 5;
    g.beginPath(); g.moveTo(0, py - 40); g.lineTo(0, py + 40); g.stroke();
    g.restore();
    // cross braces
    g.strokeStyle = hexA(pal.soft, 0.3); g.lineWidth = 3;
    for (let y = 60; y < 330; y += 70) {
      g.beginPath(); g.moveTo(-18, y + 18); g.lineTo(0, y); g.lineTo(18, y + 18); g.stroke();
    }
  }

  g.restore();
}

/* ------------------------------------------------------------------ stage */
function drawStage(alpha) {
  const def = Stage.def, pal = def.pal;
  const P = Stage.pivot;
  const toW = (lx, ly) => Stage.toWorld(lx, ly);

  // the deck edge flares white while a Tipping Point goes off
  const snap = Stage.flashT > 0;
  const flare = clamp(Stage.flashT / 20, 0, 1);
  const kind = def.deck || "neon";

  /* ---- the support column, built differently per stage ---- */
  drawPivotColumn(P, kind, pal, bgT);

  def.layout.forEach((p, pi) => {
    /* Live platform state: drifting offset, how hot it is, and how solid it
       currently is. A platform that has crumbled or retracted draws nothing,
       matching the fact that it is also absent from Stage.segs. */
    const st = Stage.pfx[pi] || { dx: 0, dy: 0, present: true, heat: 0, alpha: 1 };
    const sdy = st.dy || 0;
    const hidden = !st.present && st.alpha <= 0.02;
    if (hidden && !p.retract) return;
    if (hidden) {
      /* A retracted shelf still shows its empty rails, so the gap reads as
         "the platform is away" rather than "there was never one here". */
      const ra = toW(p.x1, p.y1), rb = toW(p.x2, p.y2);
      g.save();
      g.translate(ra.x, ra.y);
      g.rotate(Math.atan2(rb.y - ra.y, rb.x - ra.x));
      const rl = Math.hypot(rb.x - ra.x, rb.y - ra.y);
      g.globalAlpha = 0.35; g.strokeStyle = hexA(pal.platEdge, 0.6); g.lineWidth = 2;
      g.setLineDash([5, 6]);
      g.beginPath(); g.moveTo(-18, 0); g.lineTo(rl + 18, 0); g.stroke();
      g.setLineDash([]);
      g.restore();
      return;
    }

    const a = toW(p.x1 + st.dx, p.y1 + sdy), b = toW(p.x2 + st.dx, p.y2 + sdy);
    const dx = b.x - a.x, dy = b.y - a.y;

    if (p.lift) {
      // the lift's cables, running up out of the top of the shot
      g.save();
      g.strokeStyle = hexA(pal.soft, 0.5); g.lineWidth = 2;
      for (const cx of [a.x + 12, b.x - 12]) {
        g.beginPath(); g.moveTo(cx, a.y - 4); g.lineTo(cx, a.y - 900); g.stroke();
      }
      // the guide rail it travels along, with its range marked
      const top = toW(p.x1, p.y1 - p.lift.range).y, low = toW(p.x1, p.y1 + p.lift.range).y;
      g.strokeStyle = hexA(pal.platEdge, 0.18); g.lineWidth = 6;
      g.beginPath(); g.moveTo((a.x + b.x) / 2, top - 10); g.lineTo((a.x + b.x) / 2, low + 30); g.stroke();
      g.restore();
    }

    if (p.bounce) {
      // a mushroom cap instead of a slab: it squashes when someone lands
      const sq = (st.squash || 0) / 14;
      const cx = (a.x + b.x) / 2, w2 = (b.x - a.x) / 2;
      g.save();
      g.globalAlpha = clamp(st.alpha, 0, 1);
      g.fillStyle = "#2a1c40";
      g.fillRect(cx - 9, a.y + 8, 18, 120);
      const capH = 30 * (1 - sq * 0.45);
      g.translate(cx, a.y);
      g.scale(1 + sq * 0.15, 1);
      const cg = g.createLinearGradient(0, -6, 0, capH);
      cg.addColorStop(0, "#d48aff"); cg.addColorStop(1, "#5a2a8a");
      g.fillStyle = cg; g.strokeStyle = pal.ink; g.lineWidth = 4;
      g.beginPath(); g.ellipse(0, capH * 0.6, w2 + 8, capH, 0, Math.PI, 0); g.closePath();
      g.stroke(); g.fill();
      g.shadowColor = "#7dffd0"; g.shadowBlur = 12;
      g.fillStyle = hexA("#7dffd0", 0.65 + Math.sin(bgT * 3) * 0.2);
      for (const ox of [-0.5, 0, 0.5]) {
        g.beginPath(); g.arc(ox * w2, capH * 0.6 - capH * (ox ? 0.55 : 0.8), 5, 0, 7); g.fill();
      }
      g.shadowBlur = 0;
      // an up-chevron so the bounce is never a surprise
      g.strokeStyle = hexA("#ffffff", 0.35 + 0.3 * Math.abs(Math.sin(bgT * 2.5))); g.lineWidth = 3;
      g.beginPath(); g.moveTo(-10, -18); g.lineTo(0, -28); g.lineTo(10, -18); g.stroke();
      g.restore();
      return;
    }
    const len = Math.hypot(dx, dy);
    const th = p.thick, main = !!p.main;
    let edge = main
      ? (snap ? "#ffffff" : pal.platEdge)
      : pal.soft;
    // a heating shelf shifts toward molten, and flashes while it warns
    if (st.heat >= 1) edge = "#ff5a19";
    else if (st.heat > 0) edge = Math.floor(bgT * 10) % 2 ? "#ffb347" : pal.soft;

    g.save();
    g.globalAlpha = clamp(st.alpha, 0, 1);
    g.translate(a.x, a.y);
    g.rotate(Math.atan2(dy, dx));

    const depth = main ? 48 : 15;
    const top = -th / 2, bot = th / 2 + depth;
    const round = kind === "cloud" ? Math.min(16, th) : 5;

    // cast shadow under the deck, so it floats above the background
    g.save();
    g.globalAlpha = 0.4; g.fillStyle = "#000";
    roundRect(g, 2, top + 5, len, th + depth, round); g.fill();
    g.restore();

    // the body: ink edge, then a top-lit gradient
    const lg = g.createLinearGradient(0, top, 0, bot);
    lg.addColorStop(0, shade(pal.plat, 0.3));
    lg.addColorStop(0.22, shade(pal.plat, 0.06));
    lg.addColorStop(1, pal.ink);
    roundRect(g, 0, top, len, th + depth, round);
    g.strokeStyle = pal.ink; g.lineWidth = 4; g.lineJoin = "round"; g.stroke();
    g.fillStyle = lg; g.fill();

    /* ---- per-stage underside construction ---- */
    g.save();
    roundRect(g, 0, top, len, th + depth, round); g.clip();
    drawDeckDetail(kind, len, th, depth, pal, main, main ? flare : 0, bgT);
    g.restore();

    // the walking surface, lit
    g.shadowColor = edge; g.shadowBlur = snap ? 36 : kind === "cloud" ? 10 : 20;
    g.strokeStyle = edge; g.lineWidth = main ? 5 : 3;
    g.beginPath(); g.moveTo(0, top); g.lineTo(len, top); g.stroke();
    g.shadowBlur = 0;
    // a thin bright bevel just below it reads as a machined lip
    g.strokeStyle = hexA("#ffffff", kind === "cloud" ? 0.5 : 0.28); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(1, top + 3.5); g.lineTo(len - 1, top + 3.5); g.stroke();

    if (!p.solid) {
      g.strokeStyle = hexA(pal.soft, 0.45); g.lineWidth = 2;
      g.setLineDash([8, 10]);
      g.beginPath(); g.moveTo(0, th / 2 + 11); g.lineTo(len, th / 2 + 11); g.stroke();
      g.setLineDash([]);
    }

    if (main) {
      // ledge caps — the thing you are actually aiming for when recovering
      g.fillStyle = edge; g.shadowColor = edge; g.shadowBlur = 16;
      g.beginPath(); g.arc(3, top, 5, 0, 7); g.fill();
      g.beginPath(); g.arc(len - 3, top, 5, 0, 7); g.fill();
      g.shadowBlur = 0;
    }

    /* ---- the platform's own state, drawn on top of its body ---- */
    if (st.heat > 0) {
      // molten glow rising off a hot shelf
      g.save();
      g.globalCompositeOperation = "lighter";
      const q = g.createLinearGradient(0, top - 22, 0, top + 6);
      const k = st.heat >= 1 ? 0.75 : 0.3;
      q.addColorStop(0, hexA("#ff5a19", 0)); q.addColorStop(1, hexA("#ffb347", k));
      g.fillStyle = q; g.fillRect(0, top - 22, len, 28);
      if (st.heat >= 1 && Math.random() < 0.5)
        FX.spark(a.x + Math.random() * dx, a.y - 4 + Math.random() * dy, "#ff8a1f");
      g.restore();
    }
    if (p.crumble && st.present && st.stood > 0) {
      // stress cracks appear as a cloud shelf takes weight
      g.save();
      g.globalAlpha = Math.min(0.8, st.stood / p.crumble.delay);
      g.strokeStyle = "#6b5a85"; g.lineWidth = 1.6; g.lineCap = "round";
      for (let i = 1; i < 5; i++) {
        const cx2 = (len * i) / 5;
        g.beginPath(); g.moveTo(cx2, top + 1); g.lineTo(cx2 + 5, top + th + 3); g.stroke();
      }
      g.restore();
    }
    if (p.belt) {
      // chevrons riding the tread, flashing amber before the belt reverses
      beltScroll += (st.belt || 0) / Math.max(1, def.layout.filter(q => q.belt).length);
      const dir = (st.belt || 0) >= 0 ? 1 : -1;
      const warn = st.beltWarn && Math.floor(bgT * 8) % 2;
      g.save();
      g.beginPath(); g.rect(0, top - 2, len, th); g.clip();
      g.strokeStyle = warn ? "#ff5a19" : hexA(pal.platEdge, 0.55); g.lineWidth = 3;
      const off = ((beltScroll % 40) + 40) % 40;
      for (let x = -40 + off; x < len + 40; x += 40) {
        g.beginPath();
        g.moveTo(x - 6 * dir, top + 4); g.lineTo(x + 4 * dir, top + th / 2); g.lineTo(x - 6 * dir, top + th - 4);
        g.stroke();
      }
      g.restore();
    }
    if (p.retract) {
      // guide rails the shelf slides back into
      g.save();
      g.globalAlpha = 0.5; g.strokeStyle = hexA(pal.platEdge, 0.5); g.lineWidth = 2;
      g.setLineDash([5, 6]);
      g.beginPath(); g.moveTo(-18, top + th / 2); g.lineTo(len + 18, top + th / 2); g.stroke();
      g.setLineDash([]);
      g.restore();
    }
    g.restore();
  });

  if (def.wind) drawWind(P);
}

/* Howling Peak: streaks blowing across the deck during a gust, and pulsing
   arrows under the clock while one is building (drawWindWarning). */
function drawWind(P) {
  const w = Stage.windNow();
  if (!w.x && !w.warn) return;
  g.save();
  if (w.x) {
    const k = Math.abs(w.x) / Stage.def.wind.push, dir = Math.sign(w.x);
    g.strokeStyle = hexA("#e6f6ff", 0.35 * k); g.lineWidth = 2; g.lineCap = "round";
    for (let i = 0; i < 26; i++) {
      const y = P.y - 460 + hash(i * 3) * 520;
      const span = 1500;
      const x = P.x - 750 + (((hash(i) * span + bgT * 900 * dir) % span) + span) % span;
      const l = 40 + hash(i * 7) * 80;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - l * dir, y); g.stroke();
    }
  }
  g.restore();
}

/** The gust warning lives in the HUD, under the clock, so the camera can
    never push it behind the timer or the player cards. */
function drawWindWarning() {
  if (!Stage.def.wind) return;
  const w = Stage.windNow();
  if (!w.warn) return;
  const dir = w.dir, pulse = 0.4 + 0.6 * Math.abs(Math.sin(bgT * 6));
  g.save();
  g.translate(W / 2, 142);         // the clock panel ends at 118
  g.globalAlpha = Math.min(1, w.warn * 2) * pulse;
  g.fillStyle = "#e6f6ff"; g.shadowColor = "#bfe9ff"; g.shadowBlur = 18;
  for (let i = 0; i < 3; i++) {
    const x = (i - 1) * 40 * dir;
    poly(g, [x - 12 * dir, -15, x + 12 * dir, 0, x - 12 * dir, 15, x - 3 * dir, 0]); g.fill();
  }
  g.font = `900 14px ${FONT_DISPLAY}`; g.textAlign = "center";
  g.fillText("GUST INCOMING", 0, 34);
  g.restore();
}

/* --------------------------------------------------------------- fighter */
function drawFighter(f, alpha) {
  if (f.state === ST.DEAD) return;
  const ch = f.ch;
  const rx = lerp(f.px, f.x, alpha);
  const ry = lerp(f.py, f.y, alpha);

  /* Contact shadow on the deck below. It tracks the fighter's own feet rather
     than a fixed offset, so it stays glued to a tilted surface, and it shrinks
     and fades with height — which is most of what sells a jump. */
  {
    let sy = null;
    if (f.grounded) sy = f.feetY;
    else {
      // nearest surface under him, so the shadow still reads mid-jump
      const feet = ry + ch.size.h / 2;
      for (const s of Stage.segs) {
        const y = Stage.surfaceY(s, rx);
        if (y != null && y >= feet - 4 && (sy === null || y < sy)) sy = y;
      }
    }
    if (sy != null && isFinite(sy)) {
      const drop = clamp((sy - (ry + ch.size.h / 2)) / 160, 0, 1);
      const k = 1 - drop;
      if (k > 0.05) {
        g.save();
        g.globalAlpha = 0.34 * k;
        g.fillStyle = "#000000";
        g.beginPath();
        g.ellipse(rx, sy - 1, ch.size.w * 0.48 * (0.55 + k * 0.45),
                  4.5 * (0.5 + k * 0.5), 0, 0, 7);
        g.fill();
        g.restore();
      }
    }
  }

  /* Team ring: in a 2v2 a coloured ellipse under the feet says which side a
     fighter is on even when the tags are lost in a pile-up. */
  if (f.team != null && f.grounded) {
    g.save();
    g.globalAlpha = 0.55;
    g.strokeStyle = f.tint; g.lineWidth = 2.5;
    g.shadowColor = f.tint; g.shadowBlur = 10;
    g.beginPath(); g.ellipse(rx, f.feetY - 1, ch.size.w * 0.62, 6, 0, 0, 7); g.stroke();
    g.restore();
  }

  if (f.cos && f.cos.t) Cosmetics.drawTrail(g, f, rx, ry, f.cos.t);

  // afterimage trail
  if (f.trail.length) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (const t of f.trail) {
      g.globalAlpha = (t.life / 10) * (f.inSuper ? 0.3 : 0.18);
      g.save();
      g.translate(t.x, t.y);
      g.scale(t.facing, 1);
      g.fillStyle = ch.color;
      roundRect(g, -ch.size.w / 2, -ch.size.h / 2, ch.size.w, ch.size.h, 9);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  /* Danger: past 100% one clean hit can take the stock. A red pulse behind
     the body says so without anyone having to read the HUD, and it beats
     faster the closer they are to flying. */
  if (f.percent >= 100 && f.state !== ST.RESPAWN) {
    const k = clamp((f.percent - 100) / 80, 0, 1);
    const rr = ch.hurt * (1.7 + k * 0.5);
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = (0.2 + 0.18 * k) * (0.55 + 0.45 * Math.sin(f.animTime * (0.1 + k * 0.12)));
    const q = g.createRadialGradient(rx, ry, rr * 0.25, rx, ry, rr);
    q.addColorStop(0, "#ff2e4f"); q.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = q; g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.fill();
    g.restore();
  }

  // --- anim context handed to the character's own draw() ---
  const atk = f.attack;
  const A = {
    time: f.animTime,
    runPhase: f.runPhase,
    running: f.state === ST.RUN && f.grounded,
    air: !f.grounded,
    vx: f.vx, vy: f.vy,
    state: f.state,
    flash: f.hitFlash > 0,
    atkPhase: (atk && atk.data.r) ? clamp(atk.t / Math.max(1, atk.total), 0, 1) : -1,
    atkKind: atk ? atk.kind : null,
    // real frame data, so swing() can line the pose up with the hitbox
    atkT: atk ? atk.t : 0,
    atkStartup: atk ? atk.data.startup : 0,
    atkActive: atk ? atk.data.active : 0,
    atkTotal: atk ? atk.total : 0,
    move: atk ? atk.data : null,
    v: f.v || {},                // the fighter's own scratch state (third-wave roster)
    percent: f.percent,
  };

  g.save();
  g.translate(rx, ry);

  let lean;
  if (f.grounded && f.groundSeg) lean = f.groundSeg.angle * 0.85;
  else lean = clamp(f.vx * 0.016, -0.3, 0.3);
  if (f.state === ST.HITSTUN) lean = Math.sin(f.hitstun * 0.6) * 0.5;
  if (f.pinned) lean = 0;
  g.rotate(lean);

  const squash = f.state === ST.JUMPSQUAT ? 0.80
               : f.state === ST.LANDLAG ? 0.90
               : f.state === ST.SPOTDODGE ? 0.74 : 1;
  const stretch = (!f.grounded && f.vy < -4) ? 1.09 : 1;
  const breathe = (f.state === ST.IDLE && f.grounded) ? 1 + Math.sin(f.animTime * 0.055) * 0.015 : 1;
  g.scale(f.facing, squash * stretch * breathe);

  if (f.intangible() && f.buff !== "star") g.globalAlpha = 0.42;
  /* Shade's Fade: nearly gone. Online, her own player still sees her
     clearly enough to play; on a shared screen everyone sees the shimmer. */
  if (f.stealthT > 0) {
    const mine = Net.active && f.slot === Net.slot;
    g.globalAlpha = (mine ? 0.42 : 0.1) + 0.06 * Math.sin(f.animTime * 0.3);
  }
  ch.draw(g, A);
  if (f.cos && f.cos.h) Cosmetics.drawHat(g, ch, f.cos.h, f.animTime);
  g.restore();

  drawStatus(f, rx, ry);
  drawBuff(f, rx, ry);

  /* ---- world-space overlays ---- */
  if (f.shielding()) {
    const k = f.shield / CFG.shieldMax;
    g.save(); g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.22 + k * 0.3;
    const rr = ch.hurt * 1.5 * (0.6 + k * 0.5);
    const rgd = g.createRadialGradient(rx, ry, rr * 0.2, rx, ry, rr);
    rgd.addColorStop(0, "rgba(255,255,255,.5)"); rgd.addColorStop(1, f.tint);
    g.fillStyle = rgd;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.fill();
    g.globalAlpha = 0.5; g.strokeStyle = "#ffffff"; g.lineWidth = 2;
    g.beginPath(); g.arc(rx, ry, rr, 0, 7); g.stroke();
    g.restore();
  }

  if (f.state === ST.SHIELDBREAK) {
    g.save(); g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const a = f.animTime / 14 + i * Math.PI / 2;
      g.fillStyle = "#ffe36b";
      g.beginPath(); g.arc(rx + Math.cos(a) * 26, ry - ch.size.h * 0.6 + Math.sin(a) * 8, 4, 0, 7); g.fill();
    }
    g.restore();
  }

  if (f.state === ST.RESPAWN) {
    g.save();
    g.globalAlpha = 0.6 + 0.3 * Math.sin(f.animTime * 0.1);
    g.strokeStyle = f.tint; g.lineWidth = 4;
    g.shadowColor = f.tint; g.shadowBlur = 20;
    g.beginPath(); g.ellipse(rx, ry + ch.size.h * 0.55, 42, 9, 0, 0, 7); g.stroke();
    g.restore();
  }

  if (f.anchorGlow > 0) {
    g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.3;
    g.strokeStyle = ch.color; g.lineWidth = 3;
    g.beginPath(); g.arc(rx, ry, ch.hurt * 1.9 + Math.sin(f.animTime * 0.1) * 4, 0, 7); g.stroke();
    g.restore();
  }

  // super aura
  if (f.inSuper) {
    g.save(); g.globalCompositeOperation = "lighter";
    const p = f.attack.t * 0.2;
    for (let i = 0; i < 3; i++) {
      g.globalAlpha = 0.26 - i * 0.07;
      g.strokeStyle = ch.accent; g.lineWidth = 2.5;
      g.beginPath();
      g.ellipse(rx, ry, ch.hurt * (1.5 + i * 0.5), ch.hurt * (0.7 + i * 0.3), p + i, 0, 7);
      g.stroke();
    }
    g.restore();
  }

  if (f.attack && f.hitboxActive() && Settings.get("showHitboxGlow")) {
    const hb = f.hitboxWorld();
    g.save(); g.globalCompositeOperation = "lighter";
    const rgd = g.createRadialGradient(hb.x, hb.y, 1, hb.x, hb.y, hb.r);
    rgd.addColorStop(0, "rgba(255,255,255,.5)");
    rgd.addColorStop(0.5, hexA(ch.color, 0.32));
    rgd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rgd;
    g.beginPath(); g.arc(hb.x, hb.y, hb.r, 0, 7); g.fill();
    g.restore();
  }

  /* Player tag. Online, the fighter this screen controls is marked YOU with
     a pointer, because with four players on one stage "which one am I" is
     the first question after every respawn. */
  const mine = Net.active && f.slot === Net.slot;
  const tagY = ry - ch.size.h * 0.82;
  g.save();
  g.font = `700 12px ${FONT_MONO}`;
  g.textAlign = "center";
  g.globalAlpha = 0.9;
  g.fillStyle = f.tint;
  const label = mine ? "YOU" : `P${f.slot + 1}${f.isCPU ? " CPU" : ""}`;
  if (mine) { g.shadowColor = f.tint; g.shadowBlur = 10; }
  g.fillText(label, rx, tagY);
  if (mine) {
    const bob = Math.sin(f.animTime * 0.12) * 2;
    poly(g, [rx - 6, tagY + 4 + bob, rx + 6, tagY + 4 + bob, rx, tagY + 10 + bob]);
    g.fill();
  }
  g.restore();
}

function drawOffscreenMarkers(fighters, cam) {
  for (const f of fighters) {
    if (!f.alive || f.state === ST.DEAD) continue;
    const sx = (f.x - cam.x) * cam.z + W / 2, sy = (f.y - cam.y) * cam.z + H / 2;
    if (sx > 26 && sx < W - 26 && sy > 26 && sy < H - 26) continue;
    const cx = clamp(sx, 38, W - 38), cy = clamp(sy, 54, H - 40);
    g.save();
    g.translate(cx, cy);
    g.rotate(Math.atan2(sy - H / 2, sx - W / 2));
    g.fillStyle = f.tint; g.shadowColor = f.tint; g.shadowBlur = 16;
    g.beginPath(); g.moveTo(15, 0); g.lineTo(-10, -11); g.lineTo(-10, 11); g.closePath(); g.fill();
    g.restore();
    g.save();
    g.font = `700 16px ${FONT_MONO}`; g.textAlign = "center";
    g.fillStyle = f.tint;
    outlineText(g, `${Math.floor(f.percent)}%`, cx, cy + 30, f.tint, 4);
    g.restore();
  }
}

/* -------------------------------------------------------------------- HUD */

function drawClock(framesLeft) {
  const secs = Math.max(0, Math.ceil(framesLeft / 60));
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const low = secs <= 10;
  const col = low ? "#ff2e88" : UI.text;

  // the clock sits in its own hanging plate under the gauge
  g.save();
  const cw = 132, cx = W / 2 - cw / 2, cy = 82;
  panel(g, cx, cy, cw, 36, {
    cut: 9, fill: "#120f26", accent: col,
    accentA: low ? 0.95 : 0.4, glow: low ? 18 : 0,
    only: { bl: 1, br: 1 },
  });
  g.textAlign = "center";
  g.font = `900 26px ${FONT_DISPLAY}`;
  g.globalAlpha = low && Math.floor(framesLeft / 8) % 2 === 0 ? 0.55 : 1;
  if (low) { g.shadowColor = "#ff2e88"; g.shadowBlur = 18; }
  g.fillStyle = col;
  g.fillText(`${mm}:${String(ss).padStart(2, "0")}`, W / 2, cy + 27);
  g.restore();

  // stage name, plus whatever special state the clock is in, top right
  const m = Match.current;
  g.save();
