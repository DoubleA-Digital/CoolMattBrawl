    if (k <= 0) return;
    if (amt * k >= this.kickAmt) { this.kickX = x; this.kickY = y; }
    this.kickAmt = Math.min(0.3, Math.max(this.kickAmt, amt * k));
  },
  /** Slow the simulation for this many steps (offline only; see Game.timeScale). */
  slowmo(steps) { this.slow = Math.max(this.slow, steps); },
  /** "3 HIT COMBO!" over whoever is on the receiving end. */
  combo(x, y, n, color) {
    for (const t of this.texts) if (t.combo) t.life = Math.min(t.life, 6);   // only the latest count shows
    this.texts.push({ x, y, vy: -0.8, life: 54, max: 54, text: `${n} HIT COMBO!`, color,
                      combo: n });
    Snd.tone(520 + n * 90, 0.08, "square", 0.1, 900 + n * 120);
  },
  /** Kick the chromatic aberration. Heavy hits, KOs and supers. */
  punch(amt) { this.chroma = Math.min(1, this.chroma + amt); },
  banner(text, color) {
    if (!text) return;
    this.bannerText = text; this.bannerTimer = 72; this.bannerColor = color || "#fff";
    Net.forwardBanner(text, this.bannerColor);    // online guests see it too
  },

  get density() { return Settings.get("particles"); },

  burst(x, y, n, color, speed) {
    n = Math.min(40, Math.round(n * this.density));
    for (let i = 0; i < n; i++) {
      if (this.parts.length > CFG.maxParticles) break;
      const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random());
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        life: 16 + Math.random() * 22, max: 38, size: 1.6 + Math.random() * 3.4,
        color, grav: 0.22, drag: 0.985 });
    }
  },
  spark(x, y, color) {
    if (this.parts.length > CFG.maxParticles || this.density <= 0) return;
    this.parts.push({ x, y, vx: rnd(-1.2, 1.2), vy: rnd(-1.2, 1.2),
      life: 10 + Math.random() * 12, max: 22, size: 1.2 + Math.random() * 2,
      color, grav: 0.02, drag: 0.96 });
  },
  /** A fan of dust along the ground — used by heavy ground impacts. */
  dustLine(x, y, width, color) {
    const n = Math.round(14 * this.density);
    for (let i = 0; i < n; i++) {
      const s = (Math.random() * 2 - 1);
      this.parts.push({ x: x + s * width * 0.5, y: y - 2,
        vx: s * rnd(2, 7), vy: rnd(-4.5, -1),
        life: 18 + Math.random() * 18, max: 36, size: 2 + Math.random() * 3.6,
        color, grav: 0.16, drag: 0.97 });
    }
  },
  ring(x, y, r0, r1, color, lw) {
    this.rings.push({ x, y, r: r0, r1, cur: r0, life: 24, max: 24, color, lw: lw || 3 });
  },
  streak(x1, y1, x2, y2, color) {
    this.streaks.push({ x1, y1, x2, y2, color, life: 10, max: 10 });
  },
  /* ------------------------------------------------- attack primitives

     These exist so each move can have a signature rather than every attack
     producing the same puff of sparks. A blade is the workhorse: a crescent
     that sweeps outward and thins as it goes, which is what reads as "a thing
     was swung through here".

       rot     centre angle of the arc, radians, 0 = +x
       spread  how much of a circle it covers
       r0,r1   radius at birth and death — the sweep
       w       half-thickness at the middle of the crescent  */
  blade(x, y, rot, r0, r1, spread, color, opts) {
    if (this.density <= 0) return;
    const o = opts || {};
    this.blades.push({
      x, y, rot, r0, r1, spread, color,
      w: o.w || 10, life: o.life || 14, max: o.life || 14,
      spin: o.spin || 0, follow: o.follow || null,
      core: o.core !== false,
    });
  },

  /** Jagged lightning between two points. The zigzag is generated once and
      kept, so it reads as a bolt holding still rather than static noise. */
  bolt(x1, y1, x2, y2, color, opts) {
    if (this.density <= 0) return;
    const o = opts || {};
    const segs = o.segs || 6, jag = o.jag || 14;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const px = lerp(x1, x2, t), py = lerp(y1, y2, t);
      const off = (i === 0 || i === segs) ? 0 : rnd(-jag, jag);
      const nx = -(y2 - y1), ny = (x2 - x1);
      const nl = Math.hypot(nx, ny) || 1;
      pts.push({ x: px + (nx / nl) * off, y: py + (ny / nl) * off });
    }
    this.bolts.push({ pts, color, life: o.life || 9, max: o.life || 9, w: o.w || 3,
                      branch: o.branch !== false });
  },

  /** Cracks radiating along a surface from an impact. */
  crack(x, y, dir, len, color, n) {
    if (this.density <= 0) return;
    n = n || 3;
    const steps = 4;
    for (let i = 0; i < n; i++) {
      const pts = [{ x, y }];
      for (let s = 0; s < steps; s++) {
        const prev = pts[pts.length - 1];
        pts.push({
          x: prev.x + dir * (len / steps) * (0.6 + Math.random() * 0.7),
          y: prev.y + rnd(-5, 5),
        });
      }
      this.cracks.push({ pts, color, life: 26, max: 26, w: 2.6 - i * 0.5 });
    }
  },

  /** A brief symbol stamped in the world — scale marks, orbit rings, etc. */
  glyph(x, y, kind, size, color, life) {
    if (this.density <= 0) return;
    this.glyphs.push({ x, y, kind, size, color, life: life || 20, max: life || 20, rot: 0 });
  },

  /** Radial impact lines. Short, bright, and gone in a few frames — the thing
      that makes a heavy connect read as a BLOW rather than a touch. */
  impactLines(x, y, dir, n, color, len) {
    if (this.density <= 0) return;
    n = Math.round(n * Math.min(1, this.density));
    for (let i = 0; i < n; i++) {
      const spread = 1.5;
      const a = dir + rnd(-spread, spread);
      const r0 = 16 + Math.random() * 14;
      const l = (len || 42) * (0.55 + Math.random() * 0.8);
      this.streaks.push({
        x1: x + Math.cos(a) * r0, y1: y + Math.sin(a) * r0,
        x2: x + Math.cos(a) * (r0 + l), y2: y + Math.sin(a) * (r0 + l),
        color, life: 7 + (Math.random() * 4 | 0), max: 11,
      });
    }
  },

  hitmark(x, y, dmg) { this.marks.push({ x, y, life: 11, max: 11, size: 14 + dmg * 2.6 }); },
  /** Floating text at the point of impact — a damage number, or a short label
      like TIP/STALE when something modified that number. */
  damageText(x, y, dmg, color) {
    const text = typeof dmg === "number" ? Math.round(dmg).toString() : String(dmg);
    this.texts.push({ x, y, vy: -1.2, life: 42, max: 42, text, color,
                      small: typeof dmg !== "number" });
  },

  /* ------------------------------------------------------------- update */
  update(fighters) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= p.drag;
      if (--p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.cur = r.r + (r.r1 - r.r) * easeOut(1 - r.life / r.max);
      if (--r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.blades.length - 1; i >= 0; i--) {
      const b = this.blades[i];
      b.rot += b.spin;
      // a blade attached to a fighter tracks them, so a swing stays on the arm
      if (b.follow) { b.x = b.follow.x; b.y = b.follow.y + (b.follow.oy || 0); }
      if (--b.life <= 0) this.blades.splice(i, 1);
    }
    for (let i = this.bolts.length - 1; i >= 0; i--) if (--this.bolts[i].life <= 0) this.bolts.splice(i, 1);
    for (let i = this.cracks.length - 1; i >= 0; i--) if (--this.cracks[i].life <= 0) this.cracks.splice(i, 1);
    for (let i = this.glyphs.length - 1; i >= 0; i--) {
      const gl = this.glyphs[i];
      gl.rot += 0.04;
      if (--gl.life <= 0) this.glyphs.splice(i, 1);
    }
    for (let i = this.marks.length - 1; i >= 0; i--) if (--this.marks[i].life <= 0) this.marks.splice(i, 1);
    for (let i = this.streaks.length - 1; i >= 0; i--) if (--this.streaks[i].life <= 0) this.streaks.splice(i, 1);
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.y += t.vy; t.vy *= 0.94;
      if (--t.life <= 0) this.texts.splice(i, 1);
    }

    this.shakeMag *= CFG.cam.shakeDecay;
    if (this.shakeMag < 0.2) this.shakeMag = 0;
    this.shakeX = (Math.random() - 0.5) * this.shakeMag * 2;
    this.shakeY = (Math.random() - 0.5) * this.shakeMag * 2;

    this.flashAmt *= 0.84;
    if (this.flashAmt < 0.01) this.flashAmt = 0;
    this.chroma *= 0.80;
    if (this.chroma < 0.01) this.chroma = 0;
    if (this.bannerTimer > 0) this.bannerTimer--;
    this.kickAmt *= 0.9;
    if (this.kickAmt < 0.002) this.kickAmt = 0;

    this.updateCamera(fighters);
  },

  /* ------------------------------------------------------------- camera */
  updateCamera(fighters) {
    const c = this.cam, K = CFG.cam;
    c.px = c.x; c.py = c.y; c.pz = c.zoom;

    const live = fighters.filter(f => f.alive && f.state !== ST.DEAD);
    const home = { x: Stage.pivot.x, y: Stage.pivot.y - 150 };

    if (!live.length || Settings.get("cameraSway") <= 0) {
      // Pinned mode: sit over the stage and only change zoom.
      c.x += (home.x - c.x) * 0.08;
      c.y += (home.y - c.y) * 0.08;
      c.zoom += (0.86 - c.zoom) * K.zoomLerp;
      return;
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const f of live) {
      minX = Math.min(minX, f.x); maxX = Math.max(maxX, f.x);
      minY = Math.min(minY, f.y); maxY = Math.max(maxY, f.y);
    }
    // Always keep the stage itself in frame so the camera has an anchor.
    minX = Math.min(minX, home.x - 170); maxX = Math.max(maxX, home.x + 170);
    minY = Math.min(minY, home.y - 90);  maxY = Math.max(maxY, home.y + 110);

    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

    /* Dead zone: do nothing at all while the action's centre stays inside the
       box. Only the amount that pokes out of the box moves the camera, which
       is what stops the constant left-right drift. */
    const sway = Settings.get("cameraSway");
    const dx = cx - c.x, dy = cy - c.y;
    const dzX = K.deadX / sway, dzY = K.deadY / sway;
    let tx = c.x, ty = c.y;
    if (dx > dzX) tx = cx - dzX; else if (dx < -dzX) tx = cx + dzX;
    if (dy > dzY) ty = cy - dzY; else if (dy < -dzY) ty = cy + dzY;

    c.x += (tx - c.x) * K.follow;
    c.y += (ty - c.y) * K.follow;

    /* Zoom is quantised to discrete steps with hysteresis, so it settles on a
       value and stays there instead of micro-adjusting every frame. */
    const bw = (maxX - minX) + K.pad * 2, bh = (maxY - minY) + K.pad * 1.5;
    const want = clamp(Math.min(W / bw, H / bh), K.minZoom, K.maxZoom);
    const stepped = Math.round(want / K.zoomStep) * K.zoomStep;
    if (Math.abs(stepped - c.tz) > K.zoomStep * 0.75) c.tz = stepped;
    c.zoom += (c.tz - c.zoom) * K.zoomLerp;
  },

  /** Camera transform, interpolated between fixed steps for smooth motion. */
  applyCamera(g, alpha) {
    const c = this.cam;
    let x = lerp(c.px, c.x, alpha);
    let y = lerp(c.py, c.y, alpha);
    let z = lerp(c.pz, c.zoom, alpha);
    if (this.kickAmt > 0) {
      const k = Math.min(0.6, this.kickAmt * 2.4);
      x = lerp(x, this.kickX, k); y = lerp(y, this.kickY, k);
      z *= 1 + this.kickAmt;
    }
    g.translate(W / 2 + this.shakeX, H / 2 + this.shakeY);
    g.scale(z, z);
    g.translate(-x, -y);
    return { x, y, z };
  },

  /* ------------------------------------------------------------ drawing */
  /** Crescent path: thickest in the middle, pointed at both tips. Canvas can't
      taper a stroke, so the arc is built as a polygon instead. */
  _bladePath(g, b, r, w) {
    const N = 14, a0 = b.rot - b.spread / 2;
    g.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = i / N, a = a0 + b.spread * t;
      const th = w * Math.sin(Math.PI * t);
      g.lineTo(b.x + Math.cos(a) * (r + th), b.y + Math.sin(a) * (r + th));
    }
    for (let i = N; i >= 0; i--) {
      const t = i / N, a = a0 + b.spread * t;
      const th = w * Math.sin(Math.PI * t);
      g.lineTo(b.x + Math.cos(a) * (r - th), b.y + Math.sin(a) * (r - th));
    }
    g.closePath();
  },

  drawWorld(g) {
    const litParts = Settings.get("postFx") > 0;
    g.save();
    g.globalCompositeOperation = "lighter";

    /* ---- swept blades: the signature of a melee swing ---- */
    for (const b of this.blades) {
      const k = 1 - b.life / b.max;              // 0 at birth, 1 at death
      const a = b.life / b.max;
      const r = lerp(b.r0, b.r1, easeOut(k));
      const w = b.w * (1 - k * 0.72);
      /* Hold near full brightness for the first half of the life, then fade.
         Squaring the alpha instead made the arc dimmest exactly when it was
         widest, so a swing read as a faint expanding ring rather than a swipe. */
      g.globalAlpha = Math.min(1, a * 1.9) * 0.9;
      g.fillStyle = b.color;
      this._bladePath(g, b, r, w);
      g.fill();
      if (b.core) {                               // hot inner edge
        g.globalAlpha = Math.min(1, a * 1.6) * 0.95;
        g.fillStyle = "#ffffff";
        this._bladePath(g, b, r, w * 0.32);
        g.fill();
      }
    }

    /* ---- lightning ---- */
    for (const b of this.bolts) {
      const a = b.life / b.max;
      g.globalAlpha = a;
      g.lineCap = "round"; g.lineJoin = "round";
      for (const pass of [[b.w * 2.4, b.color, 0.5], [b.w, "#ffffff", 1]]) {
        g.lineWidth = pass[0]; g.strokeStyle = pass[1];
        g.globalAlpha = a * pass[2];
        g.beginPath();
        g.moveTo(b.pts[0].x, b.pts[0].y);
        for (let i = 1; i < b.pts.length; i++) g.lineTo(b.pts[i].x, b.pts[i].y);
        g.stroke();
      }
    }

    for (const s of this.streaks) {
      const a = s.life / s.max;
      g.globalAlpha = a * 0.8; g.strokeStyle = s.color;
      g.lineWidth = 1 + a * 5; g.lineCap = "round";
      g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
    }
    for (const r of this.rings) {
      const a = r.life / r.max;
      g.globalAlpha = a * 0.85; g.strokeStyle = r.color;
      g.lineWidth = r.lw * (0.4 + a);
      g.beginPath(); g.arc(r.x, r.y, r.cur, 0, 7); g.stroke();
      // a soft bloom core inside a young ring, so impacts flare
      if (a > 0.55 && litParts)
        Light.draw(g, r.x, r.y, r.cur * 0.9, r.color, (a - 0.55) * 0.7, 0.02);
    }
    /* Particles cast light rather than being flat discs, so a burst reads as
       sparks instead of confetti. Measured at ~1.3us per halo, so only the
       larger particles get one: a 1px spark gains nothing visually from a
       halo, and at the 900-particle cap the difference is ~1ms a frame. */
    for (const p of this.parts) {
      const a = p.life / p.max;
      const r = p.size * (0.4 + a * 0.8);
      if (litParts && p.size > 2.1)
        Light.draw(g, p.x, p.y, r * 3.2, p.color, Math.min(1, a * 1.1) * 0.55, 0.12);
      g.globalAlpha = Math.min(1, a * 1.4); g.fillStyle = p.color;
      g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    }
    for (const m of this.marks) {
      const a = m.life / m.max;
      g.globalAlpha = a; g.fillStyle = "#ffffff";
      const s = m.size * (1.4 - a * 0.5);
      g.save(); g.translate(m.x, m.y); g.rotate(a * 2);
      g.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const rr = i % 2 ? s * 0.34 : s;
        g.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      g.closePath(); g.fill(); g.restore();
    }

    /* ---- stamped glyphs: a move's identity, left briefly in the world ---- */
    for (const gl of this.glyphs) {
      const a = gl.life / gl.max;
      const s = gl.size * (0.8 + (1 - a) * 0.5);
      g.save();
      g.translate(gl.x, gl.y);
      g.globalAlpha = a * 0.8;
      g.strokeStyle = gl.color; g.lineWidth = 2.4; g.lineCap = "round";
      if (gl.kind === "scale") {
        // Pivot: a tipping balance
        g.rotate(Math.sin(gl.rot * 2) * 0.3);
        g.beginPath(); g.moveTo(-s, 0); g.lineTo(s, 0); g.stroke();
        g.beginPath(); g.moveTo(0, -s * 0.5); g.lineTo(0, s * 0.3); g.stroke();
        g.beginPath(); g.arc(-s, s * 0.3, s * 0.3, 0, Math.PI); g.stroke();
        g.beginPath(); g.arc(s, s * 0.3, s * 0.3, 0, Math.PI); g.stroke();
      } else if (gl.kind === "orbit") {
        // Orbit: concentric rings at a tilt
        g.rotate(gl.rot);
        g.beginPath(); g.ellipse(0, 0, s, s * 0.38, 0, 0, 7); g.stroke();
        g.beginPath(); g.ellipse(0, 0, s * 0.6, s * 0.22, 0, 0, 7); g.stroke();
      } else if (gl.kind === "bolt") {
        // Zip: a chevron stack
        for (let i = 0; i < 3; i++) {
          g.globalAlpha = a * (0.8 - i * 0.2);
          g.beginPath();
          g.moveTo(-s * 0.6, -s * 0.4 + i * s * 0.4);
          g.lineTo(0, i * s * 0.4);
          g.lineTo(-s * 0.6, s * 0.4 + i * s * 0.4);
          g.stroke();
        }
      } else {
        // Bolder: an impact wedge
        g.beginPath();
        g.moveTo(-s, -s * 0.5); g.lineTo(s * 0.4, 0); g.lineTo(-s, s * 0.5);
        g.stroke();
      }
      g.restore();
    }
    g.restore();

    /* ---- cracks draw normally: they are in the surface, not glowing ---- */
    g.save();
    for (const c of this.cracks) {
      const a = c.life / c.max;
      g.globalAlpha = a * 0.75;
      g.lineCap = "round"; g.lineJoin = "round";
      g.strokeStyle = "#07050f"; g.lineWidth = c.w + 1.8;
      g.beginPath();
      g.moveTo(c.pts[0].x, c.pts[0].y);
      for (let i = 1; i < c.pts.length; i++) g.lineTo(c.pts[i].x, c.pts[i].y);
      g.stroke();
      g.strokeStyle = c.color; g.lineWidth = c.w;
      g.stroke();
    }
    g.restore();

    // damage numbers draw normally so they stay readable
    g.save();
    g.textAlign = "center";
    for (const t of this.texts) {
      const a = Math.min(1, t.life / t.max * 1.8);
      g.globalAlpha = a;
      if (t.combo) {
        // pops in big, then settles
        const age = t.max - t.life;
        const pop = age < 6 ? 1.5 - age * 0.08 : 1;
        g.font = `900 ${Math.round((22 + Math.min(t.combo, 8) * 2) * pop)}px ${FONT_DISPLAY}`;
        outlineText(g, t.text, t.x, t.y, t.color, 7);
        continue;
      }
      g.font = t.small ? `900 12px ${FONT_MONO}`
                       : `900 ${20 + (1 - t.life / t.max) * 6}px ${FONT_DISPLAY}`;
      outlineText(g, t.text, t.x, t.y, t.color, t.small ? 4 : 5);
    }
    g.restore();
  },

  /** Kept for the menu screens, which do not run the post pass. */
  drawOverlay(g) {
    if (Settings.get("postFx") > 0) return;   // the post pass draws it instead
    if (this.flashAmt > 0.01) {
      g.save();
      g.globalAlpha = Math.min(0.75, this.flashAmt);
      g.fillStyle = this.flashCol || "#fff";
      g.fillRect(0, 0, W, H);
      g.restore();
    }
  },
};


/* ===== src/06b_profile.js ===== */
/* ==========================================================================
   7b. PROFILE — lifetime stats, coins, cosmetics and the optional account

   Everything works as a guest, saved to this browser. Signing up uploads
   that progress to an account so it follows you to another device; the
   account lives in Supabase behind six RPCs (cmb_signup, cmb_login, cmb_load,
   cmb_save, cmb_logout, cmb_leaderboard). The tables themselves are closed to
   the public key, so the only way in is a username + password or a session
   token, and passwords are bcrypt-hashed in the database.

   Only the account holder earns: P1 on a shared screen, your own seat online.
   ========================================================================== */

/* --------------------------------------------------------------- catalog */
/* A skin is a palette for any fighter: every roster draw() reads its colours
   from this.color / color2 / color3 / accent, so swapping those four repaints
   the whole silhouette, its effects and its HUD card. */
const SKINS = [
  { id: "GOLD",    name: "GOLD RUSH", price: 250, pal: ["#ffc83d", "#8a5a00", "#3a2400", "#fff3c4"] },
  { id: "SHADOW",  name: "SHADOW",    price: 200, pal: ["#4a4466", "#221e38", "#0d0b18", "#b388ff"] },
  { id: "FROST",   name: "FROSTBITE", price: 200, pal: ["#8fe6ff", "#2a6a8a", "#0e2836", "#ffffff"] },
  { id: "TOXIC",   name: "TOXIC",     price: 200, pal: ["#b6ff3b", "#3f6b0d", "#182a05", "#f0ffd0"] },
  { id: "INFERNO", name: "INFERNO",   price: 250, pal: ["#ff5a1f", "#8a1a00", "#330800", "#ffe08a"] },
  { id: "ROYAL",   name: "ROYAL",     price: 300, pal: ["#8a5cff", "#3a1d8a", "#170a3a", "#ffd76b"] },
  { id: "CANDY",   name: "BUBBLEGUM", price: 300, pal: ["#ff8ad8", "#a03a86", "#3e0f33", "#c8fbff"] },
  { id: "GHOST",   name: "GHOST",     price: 400, pal: ["#e8e6f8", "#9a97b8", "#45425e", "#7df9ff"] },
  { id: "PRISM",   name: "PRISM",     price: 900, prism: true },
];
const HATS = [
  { id: "PARTY",  name: "PARTY HAT",  price: 100 },
  { id: "TOPHAT", name: "TOP HAT",    price: 150 },
  { id: "EARS",   name: "CAT EARS",   price: 150 },
  { id: "HORNS",  name: "DEVIL HORNS", price: 200 },
  { id: "CROWN",  name: "CROWN",      price: 300 },
  { id: "HALO",   name: "HALO",       price: 300 },
  { id: "VIKING", name: "VIKING HELM", price: 350 },
  { id: "WIZARD", name: "WIZARD HAT", price: 450 },
];
const TRAILS = [
  { id: "SPARK",   name: "SPARKS",    price: 200, col: "#ffe36b" },
  { id: "BUBBLE",  name: "BUBBLES",   price: 200, col: "#8fe6ff" },
  { id: "FLAME",   name: "FLAMES",    price: 300, col: "#ff7a1f" },
  { id: "STAR",    name: "STARDUST",  price: 400, col: "#ffffff" },
  { id: "RAINBOW", name: "RAINBOW",   price: 650, col: "#ff2e88" },
];
const COS_KINDS = { skin: SKINS, hat: HATS, trail: TRAILS };
const COS_BY_ID = {};
for (const k in COS_KINDS) for (const it of COS_KINDS[k]) { it.kind = k; COS_BY_ID[it.id] = it; }

function hslHex(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(c * 255).toString(16).padStart(2, "0");
  };
  return "#" + f(0) + f(8) + f(4);
}

/** A display name off the wire: the same rules as an account username. */
function cleanName(n) {
  return typeof n === "string" ? n.replace(/[^A-Za-z0-9_]/g, "").slice(0, 14) : "";
}

/* ------------------------------------------------------------- cosmetics */
const Cosmetics = {
  _skinned: Object.create(null),
  _anchor: Object.create(null),

  /** A loadout from the wire or from storage, reduced to known items only. */
  clean(c) {
    if (!c || typeof c !== "object") return null;
    const pick = (id, kind) => (typeof id === "string" && COS_BY_ID[id] && COS_BY_ID[id].kind === kind) ? id : "";
    const out = { s: pick(c.s, "skin"), h: pick(c.h, "hat"), t: pick(c.t, "trail") };
    return out.s || out.h || out.t ? out : null;
  },

  /** The character with a skin's palette laid over it. Everything else —
      moves, sizes, draw() itself — comes through the prototype. */
  skinned(ch, skinId) {
    const s = COS_BY_ID[skinId];
    if (!ch || !s || s.kind !== "skin") return ch;
    const key = ch.id + "/" + s.id;
    if (this._skinned[key]) return this._skinned[key];
    const o = Object.create(ch);
    if (s.prism) {
      // hue cycles with wall time; colours never feed the simulation
      const hue = off => performance.now() / 14 + off;
      Object.defineProperties(o, {
        color:  { get: () => hslHex(hue(0), 95, 62) },
        color2: { get: () => hslHex(hue(40), 80, 34) },
        color3: { get: () => hslHex(hue(80), 70, 15) },
        accent: { get: () => hslHex(hue(180), 100, 86) },
      });
    } else {
      [o.color, o.color2, o.color3, o.accent] = s.pal;
    }
    o.skin = s.id;
    return (this._skinned[key] = o);
  },

  /** Where a fighter's head tops out, found once by drawing the idle pose
      offscreen and scanning for the first solid row. Sixteen hand-tuned
      anchors would drift every time someone's art changed. */
  anchor(ch) {
    const id = ch.id;
    if (this._anchor[id]) return this._anchor[id];
    const fallback = { x: 0, y: -ch.size.h * 0.62 };
    let a = fallback;
    try {
      const S = 260, ox = 130, oy = 170;
      const c = document.createElement("canvas"); c.width = S; c.height = S;
      const q = c.getContext("2d");
      q.translate(ox, oy);
      ch.draw.call(CHAR_BY_ID[id], q, { time: 0, runPhase: 0, running: false, air: false, vx: 0, vy: 0,
                                        state: ST.IDLE, flash: false, atkPhase: -1 });
      const px = q.getImageData(0, 0, S, S).data;
      const band = Math.max(10, ch.size.w * 0.32);
      for (let y = 0; y < S; y++) {
        let n = 0, sx = 0;
        for (let x = Math.floor(ox - band); x <= ox + band; x++) {
          if (px[(y * S + x) * 4 + 3] > 90) { n++; sx += x; }
        }
        if (n >= 3) { a = { x: sx / n - ox, y: y - oy }; break; }
      }
    } catch (e) { a = fallback; }
    return (this._anchor[id] = a);
  },

  /** Hat, in the fighter's own space (already flipped and squashed). */
  drawHat(g, ch, hatId, t) {
    if (!hatId) return;
    const a = this.anchor(ch);
    const k = clamp(ch.size.w / 46, 0.8, 1.25);
    g.save();
    g.translate(a.x, a.y + 3);
    g.scale(k, k);
    g.lineJoin = "round";
    const ink = INK;
    const outline = (fill, w) => { g.strokeStyle = ink; g.lineWidth = w || 3; g.stroke(); g.fillStyle = fill; g.fill(); };
    switch (hatId) {
      case "PARTY": {
        g.beginPath(); g.moveTo(-11, 0); g.lineTo(0, -30); g.lineTo(11, 0); g.closePath();
        outline("#ff2e88");
        g.save(); g.clip();
        g.fillStyle = "#ffe36b";
        for (let i = 0; i < 3; i++) g.fillRect(-14, -24 + i * 9, 28, 3);
        g.restore();
        g.beginPath(); g.arc(0, -31, 4.5, 0, 7); outline("#00e5ff", 2.5);
        break;
      }
      case "TOPHAT": {
        g.beginPath(); g.ellipse(0, -1, 19, 4.5, 0, 0, 7); outline("#1a1730");
        roundRect(g, -11, -27, 22, 26, 3); outline("#1a1730");
        g.fillStyle = "#ff2e88"; g.fillRect(-11, -8, 22, 5);
        g.fillStyle = "rgba(255,255,255,.18)"; g.fillRect(-8, -25, 4, 16);
        break;
      }
      case "EARS": {
        for (const s of [-1, 1]) {
          g.beginPath(); g.moveTo(s * 4, 2); g.lineTo(s * 13, -17); g.lineTo(s * 18, 3); g.closePath();
          outline("#2b2540");
          g.beginPath(); g.moveTo(s * 8, 0); g.lineTo(s * 13, -10); g.lineTo(s * 15, 0); g.closePath();
          g.fillStyle = "#ff8ad8"; g.fill();
        }
        break;
      }
      case "HORNS": {
        for (const s of [-1, 1]) {
          g.beginPath();
          g.moveTo(s * 5, 3);
          g.quadraticCurveTo(s * 9, -10, s * 19, -16);
          g.quadraticCurveTo(s * 15, -4, s * 14, 4);
          g.closePath();
          outline("#e0203a");
        }
        break;
      }
      case "CROWN": {
        g.beginPath();
        g.moveTo(-14, 2); g.lineTo(-14, -12); g.lineTo(-7, -5); g.lineTo(0, -17);
        g.lineTo(7, -5); g.lineTo(14, -12); g.lineTo(14, 2); g.closePath();
        outline("#ffc83d");
        g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(-12, -3, 24, 2);
        g.fillStyle = "#ff2e88"; g.beginPath(); g.arc(0, -4, 2.6, 0, 7); g.fill();
        g.fillStyle = "#00e5ff"; g.beginPath(); g.arc(-8, -2, 2, 0, 7); g.arc(8, -2, 2, 0, 7); g.fill();
        break;
      }
      case "HALO": {
        const bob = Math.sin(t * 0.06) * 2;
        g.save();
        g.translate(0, -12 + bob);
        g.shadowColor = "#fff3a0"; g.shadowBlur = 16;
        g.strokeStyle = "#fff3a0"; g.lineWidth = 4;
        g.beginPath(); g.ellipse(0, 0, 15, 4.5, 0, 0, 7); g.stroke();
        g.shadowBlur = 0;
        g.strokeStyle = "#ffffff"; g.lineWidth = 1.5;
        g.beginPath(); g.ellipse(0, -0.5, 15, 4.5, 0, Math.PI, Math.PI * 2); g.stroke();
        g.restore();
        break;
      }
      case "VIKING": {
        for (const s of [-1, 1]) {
          g.beginPath();
          g.moveTo(s * 11, -5);
          g.quadraticCurveTo(s * 24, -8, s * 22, -24);
          g.quadraticCurveTo(s * 18, -12, s * 9, -11);
          g.closePath();
          outline("#f2ead2");
        }
        g.beginPath(); g.arc(0, 2, 14, Math.PI, 0); g.closePath(); outline("#8a93a8");
        g.fillStyle = "#c9a227"; g.fillRect(-14, -1, 28, 4);
        g.fillStyle = "rgba(255,255,255,.3)"; g.fillRect(-8, -9, 3, 7);
        break;
      }
      case "WIZARD": {
        g.beginPath(); g.ellipse(0, 0, 21, 5, 0, 0, 7); outline("#3a1d8a");
        g.beginPath(); g.moveTo(-12, -1); g.quadraticCurveTo(-2, -22, 6, -38);
        g.quadraticCurveTo(4, -18, 12, -1); g.closePath(); outline("#4b2aa8");
        g.fillStyle = "#ffe36b";
        for (const [sx, sy, r] of [[-3, -12, 2.4], [4, -22, 1.8], [-1, -4, 1.6]]) {
          g.beginPath(); g.arc(sx, sy, r, 0, 7); g.fill();
        }
        break;
      }
    }
    g.restore();
  },

  /** Trail, in world space, from a short history of where the fighter was.
      It is kept per draw rather than per tick: purely cosmetic, so it never
      has to agree between host and guest. */
  drawTrail(g, f, rx, ry, trailId) {
    const tr = COS_BY_ID[trailId];
    if (!tr) return;
    const now = performance.now();
    const h = f._ctrail || (f._ctrail = []);
    const last = h[h.length - 1];
    const moving = !last || Math.hypot(rx - last.x, ry - last.y) > 1.2;
    if (moving && f.state !== ST.DEAD) {
      h.push({ x: rx + (Math.random() - 0.5) * f.w * 0.5,
               y: ry + (Math.random() - 0.2) * f.h * 0.5, t: now, r: Math.random() });
    }
    const life = trailId === "RAINBOW" ? 420 : 520;
    while (h.length && now - h[0].t > life) h.shift();
    if (h.length > 60) h.splice(0, h.length - 60);

    g.save();
    if (trailId === "RAINBOW") {
      g.lineCap = "round"; g.lineJoin = "round";
      for (let i = 1; i < h.length; i++) {
        const k = 1 - (now - h[i].t) / life;
        g.globalAlpha = k * 0.7;
        g.strokeStyle = hslHex(h[i].t / 4, 95, 62);
        g.lineWidth = 3 + k * 9;
        g.beginPath(); g.moveTo(h[i - 1].x, h[i - 1].y); g.lineTo(h[i].x, h[i].y); g.stroke();
      }
      g.restore();
      return;
    }
    g.globalCompositeOperation = "lighter";
    for (const p of h) {
      const k = 1 - (now - p.t) / life;
      if (k <= 0) continue;
      const rise = (1 - k) * 18;
      switch (trailId) {
        case "SPARK":
          g.globalAlpha = k;
          g.fillStyle = p.r > 0.5 ? "#ffe36b" : "#ffffff";
          g.fillRect(p.x - 1.5, p.y + rise * 0.6 - 1.5, 3, 3);
          break;
        case "BUBBLE":
          g.globalAlpha = k * 0.8;
          g.strokeStyle = "#8fe6ff"; g.lineWidth = 1.6;
          g.beginPath(); g.arc(p.x, p.y - rise, 2 + (1 - k) * 6 + p.r * 2, 0, 7); g.stroke();
          break;
        case "FLAME": {
          g.globalAlpha = k * 0.75;
          const r = 3 + k * 7;
          const q = g.createRadialGradient(p.x, p.y - rise, 0, p.x, p.y - rise, r);
          q.addColorStop(0, "#fff0a0"); q.addColorStop(0.45, "#ff7a1f"); q.addColorStop(1, "rgba(255,40,0,0)");
          g.fillStyle = q;
          g.beginPath(); g.arc(p.x, p.y - rise, r, 0, 7); g.fill();
          break;
        }
        case "STAR": {
          g.globalAlpha = k;
          g.fillStyle = p.r > 0.66 ? "#ffe36b" : p.r > 0.33 ? "#8fe6ff" : "#ffffff";
          const s = 1.5 + k * 3;
          g.save(); g.translate(p.x, p.y + rise * 0.3); g.rotate(p.r * 6 + (now - p.t) / 200);
          g.beginPath();
          for (let i = 0; i < 8; i++) {
            const rr = i % 2 ? s * 0.4 : s * 1.6, a = i * Math.PI / 4;
            g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
          }
          g.closePath(); g.fill(); g.restore();
          break;
        }
      }
    }
    g.restore();
  },

  /** A fighter as a portrait: skin, hat, the lot. Used on every menu. */
  portrait(g, ch, cos, A) {
    const c = this.clean(cos);
    const sk = c ? this.skinned(ch, c.s) : ch;
    sk.draw(g, A);
    if (c && c.h) this.drawHat(g, ch, c.h, A.time || 0);
  },
};

/* ---------------------------------------------------------------- profile */
function freshProfile() {
  return {
    v: 1, coins: 0,
    stats: { matches: 0, wins: 0, kos: 0, falls: 0, damage: 0, supers: 0, bestHit: 0,
             tourneys: 0, tourneyWins: 0, earned: 0, online: 0,
             items: 0, smashes: 0, bestCombo: 0, dailies: 0 },
    chars: {},              // id -> { p: played, w: won, k: KOs }
    favs: [],               // fighter ids, most favourite first
    owned: [],              // cosmetic ids
    equip: { skin: {}, hat: "", trail: "" },
    ach: [],                // achievement ids unlocked
    daily: null,            // { day, prog: [n,n,n], done: [0|1,...] } (see 06c_goals)
  };
}

/** Whatever came out of storage or the cloud, coerced to the current shape. */
function normProfile(d) {
  const p = freshProfile();
  if (!d || typeof d !== "object") return p;
  const num = v => (typeof v === "number" && isFinite(v) && v >= 0) ? v : 0;
  p.coins = Math.floor(num(d.coins));
  if (d.stats && typeof d.stats === "object") for (const k in p.stats) p.stats[k] = num(d.stats[k]);
  if (d.chars && typeof d.chars === "object") {
    for (const id in d.chars) {
      if (!CHAR_BY_ID[id]) continue;
      const c = d.chars[id] || {};
      p.chars[id] = { p: num(c.p), w: num(c.w), k: num(c.k) };
    }
  }
  if (Array.isArray(d.favs)) p.favs = d.favs.filter(id => CHAR_BY_ID[id]).slice(0, ROSTER.length);
  if (Array.isArray(d.owned)) p.owned = [...new Set(d.owned.filter(id => COS_BY_ID[id]))];
  const e = d.equip || {};
  if (e.skin && typeof e.skin === "object") {
    for (const id in e.skin) {
      if (CHAR_BY_ID[id] && p.owned.includes(e.skin[id]) && COS_BY_ID[e.skin[id]].kind === "skin")
        p.equip.skin[id] = e.skin[id];
    }
  }
  if (p.owned.includes(e.hat) && COS_BY_ID[e.hat].kind === "hat") p.equip.hat = e.hat;
  if (p.owned.includes(e.trail) && COS_BY_ID[e.trail].kind === "trail") p.equip.trail = e.trail;
  if (Array.isArray(d.ach)) p.ach = [...new Set(d.ach.filter(id => ACH_BY_ID[id]))];
  const dl = d.daily;
  if (dl && typeof dl.day === "string" && Array.isArray(dl.prog) && Array.isArray(dl.done))
    p.daily = { day: dl.day.slice(0, 10), prog: [0, 1, 2].map(i => num(dl.prog[i])),
                done: [0, 1, 2].map(i => dl.done[i] ? 1 : 0) };
  return p;
}

const ACCOUNT_ERRORS = {
  bad_username: "Usernames are 3-14 letters, numbers or _",
  bad_password: "Passwords need 4-72 characters",
  taken: "That username is taken",
  bad_login: "Wrong username or password",
  bad_session: "You were signed out — log in again",
  too_big: "Profile too large to save",
};

const Profile = {
  d: freshProfile(),
  user: null,             // account username, null as a guest
  token: null,
  status: "",             // last account message, for the screens
  busy: false,
  saveTimer: 0,
  board: null,            // leaderboard rows once fetched

  get signedIn() { return !!this.token; },
  get name() { return this.user || ""; },

  boot() {
    let acct = null, guest = null;
    try { acct = JSON.parse(localStorage.getItem("cmb_acct") || "null"); } catch (e) {}
    try { guest = JSON.parse(localStorage.getItem("cmb_guest") || "null"); } catch (e) {}
    if (acct && acct.token && acct.user) {
      this.user = acct.user; this.token = acct.token;
      this.d = normProfile(acct.data);
      this.refresh();
    } else {
      this.d = normProfile(guest);
    }
  },

  /** Write locally now; push to the account shortly after (changes batch). */
  persist() {
    Goals.sweep(this.d);       // lifetime milestones can unlock from anywhere
    try {
      if (this.signedIn) localStorage.setItem("cmb_acct", JSON.stringify({ user: this.user, token: this.token, data: this.d }));
      else localStorage.setItem("cmb_guest", JSON.stringify(this.d));
    } catch (e) { /* storage blocked: progress lasts the session */ }
    if (this.signedIn) {
      clearTimeout(this.saveTimer);
      this.saveTimer = setTimeout(() => this.pushCloud(), 1200);
    }
  },

  rpc(fn, body) {
    return fetch(`${RTC.url}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { apikey: RTC.key, Authorization: "Bearer " + RTC.key, "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(async r => {
      let j = null;
      try { j = await r.json(); } catch (e) {}
      if (!r.ok) {
        const code = j && j.message;
        const err = new Error(ACCOUNT_ERRORS[code] || "Couldn't reach the server — try again");
        err.code = code;
        throw err;
      }
      return j;
    });
  },

  pushCloud() {
    if (!this.signedIn) return;
    this.rpc("cmb_save", { p_token: this.token, p_data: this.d })
      .catch(e => { if (e.code === "bad_session") this.dropSession(e.message); });
  },

  /** Signed in already: pull the account copy, which wins over the cache. */
  refresh() {
    if (!this.signedIn) return;
    this.rpc("cmb_load", { p_token: this.token }).then(r => {
      if (!r) return;
      this.user = r.username || this.user;
      this.d = normProfile(r.data);
      this.persist();
    }).catch(e => { if (e.code === "bad_session") this.dropSession(e.message); });
  },

  /** A dead token: back to guest, keeping nothing of the account here. */
  dropSession(msg) {
    this.user = this.token = null;
    try { localStorage.removeItem("cmb_acct"); } catch (e) {}
    let guest = null;
    try { guest = JSON.parse(localStorage.getItem("cmb_guest") || "null"); } catch (e) {}
    this.d = normProfile(guest);
    this.status = msg || "";
  },

  /** Signing up turns this browser's guest progress into the account. */
  signup(user, pass) {
    return this.auth("cmb_signup", { p_user: user, p_pass: pass, p_data: this.d }, "Account created — progress saved");
  },
  /** Logging in loads the account; the guest progress stays with the guest. */
  login(user, pass) {
    return this.auth("cmb_login", { p_user: user, p_pass: pass }, "Logged in");
  },
  auth(fn, body, okMsg) {
    if (this.busy) return Promise.resolve(false);
    this.busy = true; this.status = "";
    return this.rpc(fn, body).then(r => {
      this.busy = false;
      if (!r || !r.token) throw new Error("Couldn't reach the server — try again");
      this.user = r.username; this.token = r.token;
      this.d = normProfile(r.data);
      this.status = okMsg;
      this.persist();
      this.applyFavourite();
      return true;
    }).catch(e => { this.busy = false; this.status = e.message; return false; });
  },
  logout() {
    const tok = this.token;
    clearTimeout(this.saveTimer);
    if (tok) this.rpc("cmb_save", { p_token: tok, p_data: this.d })
      .finally(() => this.rpc("cmb_logout", { p_token: tok }).catch(() => {}));
    this.dropSession("Logged out");
  },

  fetchBoard() {
    this.rpc("cmb_leaderboard", {}).then(rows => { this.board = Array.isArray(rows) ? rows : []; })
      .catch(() => { this.board = this.board || []; });
  },

  /* ------------------------------------------------------- favourites */
  isFav(id) { return this.d.favs.includes(id); },
  toggleFav(id) {
    const f = this.d.favs;
    if (f.includes(id)) f.splice(f.indexOf(id), 1); else f.push(id);
    this.persist();
  },
  /** P1 starts on your top favourite. */
  applyFavourite() {
    if (this.d.favs.length && typeof Game !== "undefined") Game.slots[0].charId = this.d.favs[0];
  },

  /* ------------------------------------------------------------ shop */
  owns(id) { return this.d.owned.includes(id); },
  buy(id) {
    const it = COS_BY_ID[id];
    if (!it || this.owns(id) || this.d.coins < it.price) return false;
    this.d.coins -= it.price;
    this.d.owned.push(id);
    this.persist();
    return true;
  },
  equipped(it, charId) {
    return it.kind === "skin" ? this.d.equip.skin[charId] === it.id : this.d.equip[it.kind] === it.id;
  },
  /** Equip, or take off again if it was already on. Skins are per fighter. */
  toggleEquip(it, charId) {
    if (!this.owns(it.id)) return;
    if (it.kind === "skin") {
      if (this.d.equip.skin[charId] === it.id) delete this.d.equip.skin[charId];
      else this.d.equip.skin[charId] = it.id;
    } else {
      this.d.equip[it.kind] = this.d.equip[it.kind] === it.id ? "" : it.id;
    }
    this.persist();
  },
  /** The loadout this player wears on a given fighter. */
  cosFor(charId) {
    return Cosmetics.clean({ s: this.d.equip.skin[charId], h: this.d.equip.hat, t: this.d.equip.trail });
  },

  /* ---------------------------------------------------------- earning */
  /** Called once per finished match. Returns the coin breakdown for the
      results screen, or null when nobody on this machine was playing. */
  recordMatch(match, extra) {
    if (!match || match._recorded) return match && match._reward;
    match._recorded = true;
    const mineSlot = Net.active ? Net.slot : 0;
    const me = match.fighters.find(f => f.slot === mineSlot && !f.isCPU);
    if (!me || match.fighters.length < 2) return null;

    const won = match.winTeam != null ? me.team === match.winTeam : match.winner === me;
    const s = me.stats, st = this.d.stats;
    st.matches++; if (won) st.wins++;
    st.kos += s.kos; st.falls += s.falls;
    st.damage = Math.round(st.damage + s.damageDealt);
    st.supers += s.supers;
    st.bestHit = Math.max(st.bestHit, Math.round(s.bestHit));
    st.items += s.items || 0; st.smashes += s.smashes || 0;
    st.bestCombo = Math.max(st.bestCombo, s.bestCombo || 0);
    if (Net.active) st.online++;
    const c = this.d.chars[me.ch.id] || (this.d.chars[me.ch.id] = { p: 0, w: 0, k: 0 });
    c.p++; if (won) c.w++; c.k += s.kos;

    const lines = [["MATCH PLAYED", 10]];
    if (won) lines.push(["VICTORY", 25]);
    if (won && s.falls === 0) lines.push(["FLAWLESS", 15]);
    if (s.kos) lines.push([`${s.kos} KO${s.kos > 1 ? "s" : ""}`, s.kos * 8]);
    const dmg = Math.min(30, Math.floor(s.damageDealt / 25));
    if (dmg) lines.push([`${Math.round(s.damageDealt)}% DEALT`, dmg]);
    if (s.supers) lines.push([`${s.supers} SUPER${s.supers > 1 ? "S" : ""}`, Math.min(12, s.supers * 3)]);
    if (Net.active) lines.push(["ONLINE", 5]);
    if (extra) lines.push(...extra);

    let total = lines.reduce((n, l) => n + l[1], 0);
    this.d.coins += total; st.earned += total;
    // daily challenges and achievements pay on top (onMatch credits them itself)
    const bonus = Goals.onMatch(this.d, {
      won, charId: me.ch.id, stage: Stage.def.id, teams: !!match.teams, size: match.fighters.length,
      kos: s.kos, falls: s.falls, damage: s.damageDealt, supers: s.supers, bestHit: s.bestHit,
      smashes: s.smashes || 0, bestCombo: s.bestCombo || 0, items: s.items || 0,
      lastStock: won && me.stocks === 1 && s.falls >= CFG.stocks - 1,
      secs: match.frames / 60, sudden: !!match.suddenDeath,
    });
    total += bonus.reduce((n, b) => n + b.coins, 0);
    this.persist();
    match._reward = { total, lines, won, bonus };
    return match._reward;
  },

  /** Coins outside a match (tournament placings). */
  award(n) {
    if (n <= 0) return;
    this.d.coins += n; this.d.stats.earned += n;
    this.persist();
  },
};

/* --------------------------------------------------------- text entry
   The canvas cannot take typing on its own, and a phone will not show a
   keyboard for one, so a real (invisible) input carries the text and the
   canvas just paints it. */
const TextIn = {
  el: null, field: null,
  ensure() {
    if (this.el) return this.el;
    const el = document.createElement("input");
    el.setAttribute("autocomplete", "off");
    el.setAttribute("autocapitalize", "off");
    el.spellcheck = false;
    Object.assign(el.style, { position: "fixed", left: "0", top: "0", width: "1px", height: "1px",
                              opacity: "0", border: "0", padding: "0", zIndex: "-1" });
    el.addEventListener("input", () => {
      if (!this.field) return;
      let v = el.value;
      if (this.field.filter) v = v.replace(this.field.filter, "");
      v = v.slice(0, this.field.max);
      if (v !== el.value) el.value = v;
      this.field.value = v;
    });
    document.body.appendChild(el);
    return (this.el = el);
  },
  focus(field) {
    const el = this.ensure();
    if (this.field !== field) {
      this.field = field;
      el.type = field.secret ? "password" : "text";
      el.maxLength = field.max;
      el.value = field.value;
    }
    if (document.activeElement !== el) el.focus({ preventScroll: true });
  },
  blur() {
    if (this.el) { this.el.blur(); this.el.value = ""; }
    this.field = null;
  },
};


/* ===== src/06c_goals.js ===== */
/* ==========================================================================
   6c. GOALS — daily challenges, achievements, and the toasts that announce them

   Three challenges a day, picked from the date so everyone gets the same
   three, each paying coins once. Achievements are one-off badges for
   milestones and stand-out matches. Both live in the profile blob, so an
   account carries them between devices like everything else.

   Everything is checked from Profile: after every match (with that match's
   numbers) and on every save (lifetime milestones only, which is how a
   tournament win or a shop purchase unlocks one).
   ========================================================================== */

/* m is the match summary built in Profile.recordMatch; p is the challenge's
   parameter (a fighter or stage id) when it has one. */
const DAILY_POOL = [
  { id: "win",      n: 3,   coins: 60, text: n => `Win ${n} matches`,            add: m => m.won ? 1 : 0 },
  { id: "play",     n: 4,   coins: 40, text: n => `Play ${n} matches`,           add: () => 1 },
  { id: "kos",      n: 8,   coins: 60, text: n => `Land ${n} KOs`,               add: m => m.kos },
  { id: "dmg",      n: 600, coins: 50, text: n => `Deal ${n}% damage`,           add: m => Math.round(m.damage) },
  { id: "supers",   n: 3,   coins: 50, text: n => `Land ${n} supers`,            add: m => m.supers },
  { id: "items",    n: 6,   coins: 50, text: n => `Grab ${n} items`,             add: m => m.items },
  { id: "smash",    n: 8,   coins: 50, text: n => `Land ${n} SMASH hits`,        add: m => m.smashes },
  { id: "combo",    n: 1,   coins: 60, text: () => "Land a 3-hit combo",         add: m => m.bestCombo >= 3 ? 1 : 0 },
  { id: "flawless", n: 1,   coins: 80, text: () => "Win without losing a stock", add: m => m.won && m.falls === 0 ? 1 : 0 },
  { id: "team",     n: 1,   coins: 50, text: () => "Win a 2v2 match",            add: m => m.won && m.teams ? 1 : 0 },
  { id: "char",     n: 1,   coins: 70, param: "fighter",
    text: (n, p) => `Win a match as ${CHAR_BY_ID[p].name}`,  add: (m, p) => m.won && m.charId === p ? 1 : 0 },
  { id: "stage",    n: 2,   coins: 40, param: "stage",
    text: (n, p) => `Play ${n} matches on ${(STAGES.find(s => s.id === p) || STAGES[0]).name}`,
    add: (m, p) => m.stage === p ? 1 : 0 },
];
const DAILY_COUNT = 3;

/* test(st, d, m): st is lifetime stats, d the whole profile, m this match's
   summary or null when checking outside a match. */
const ACHIEVEMENTS = [
  { id: "FIRST_WIN", name: "FIRST BLOOD",    coins: 25,  desc: "Win your first match",           test: st => st.wins >= 1 },
  { id: "WINS_10",   name: "CONTENDER",      coins: 50,  desc: "Win 10 matches",                 test: st => st.wins >= 10 },
  { id: "WINS_50",   name: "CHAMPION",       coins: 150, desc: "Win 50 matches",                 test: st => st.wins >= 50 },
  { id: "PLAY_25",   name: "REGULAR",        coins: 40,  desc: "Play 25 matches",                test: st => st.matches >= 25 },
  { id: "PLAY_100",  name: "LIFER",          coins: 120, desc: "Play 100 matches",               test: st => st.matches >= 100 },
  { id: "KO_25",     name: "KNOCKOUT ARTIST", coins: 40, desc: "Land 25 KOs",                    test: st => st.kos >= 25 },
  { id: "KO_250",    name: "WRECKING BALL",  coins: 150, desc: "Land 250 KOs",                   test: st => st.kos >= 250 },
  { id: "DMG_5K",    name: "HEAVY HITTER",   coins: 60,  desc: "Deal 5,000% damage in total",    test: st => st.damage >= 5000 },
  { id: "SUPER_25",  name: "SUPERNOVA",      coins: 60,  desc: "Land 25 supers",                 test: st => st.supers >= 25 },
  { id: "ITEMS_25",  name: "SCAVENGER",      coins: 40,  desc: "Grab 25 items",                  test: st => st.items >= 25 },
  { id: "FLAWLESS",  name: "UNTOUCHABLE",    coins: 40,  desc: "Win without losing a stock",     test: (st, d, m) => m && m.won && m.falls === 0 },
  { id: "TRIPLE",    name: "HAT TRICK",      coins: 30,  desc: "Land 3 KOs in one match",        test: (st, d, m) => m && m.kos >= 3 },
  { id: "COMBO5",    name: "COMBO KING",     coins: 60,  desc: "Land a 5-hit combo",             test: (st, d, m) => m && m.bestCombo >= 5 },
  { id: "BIGHIT",    name: "HAYMAKER",       coins: 40,  desc: "Deal 30% or more in one hit",    test: (st, d, m) => m && m.bestHit >= 30 },
  { id: "CLUTCH",    name: "CLUTCH",         coins: 40,  desc: "Win on your last stock",         test: (st, d, m) => m && m.won && m.lastStock },
  { id: "SPEED",     name: "SPEEDRUN",       coins: 50,  desc: "Win a match in under a minute",  test: (st, d, m) => m && m.won && m.secs < 60 },
  { id: "SUDDEN",    name: "SURVIVOR",       coins: 40,  desc: "Win in Sudden Death",            test: (st, d, m) => m && m.won && m.sudden },
  { id: "FFA4",      name: "LAST ONE UP",    coins: 50,  desc: "Win a 4-fighter free-for-all",   test: (st, d, m) => m && m.won && !m.teams && m.size >= 4 },
  { id: "TEAM",      name: "TEAMWORK",       coins: 30,  desc: "Win a 2v2 match",                test: (st, d, m) => m && m.won && m.teams },
  { id: "LOOT",      name: "POWER HUNGRY",   coins: 40,  desc: "Grab 5 items in one match",      test: (st, d, m) => m && m.items >= 5 },
  { id: "ONLINE",    name: "CONNECTED",      coins: 30,  desc: "Play a match online",            test: st => st.online >= 1 },
  { id: "TROPHY",    name: "TROPHY",         coins: 100, desc: "Win a tournament",               test: st => st.tourneyWins >= 1 },
  { id: "DYNASTY",   name: "DYNASTY",        coins: 250, desc: "Win 5 tournaments",              test: st => st.tourneyWins >= 5 },
  { id: "ROSTER10",  name: "EXPLORER",       coins: 50,  desc: "Play 10 different fighters",     test: (st, d) => Object.keys(d.chars).length >= 10 },
  { id: "ROSTERALL", name: "FULL ROSTER",    coins: 200, desc: `Play every fighter`,            test: (st, d) => Object.keys(d.chars).length >= ROSTER.length },
  { id: "COLLECTOR", name: "COLLECTOR",      coins: 60,  desc: "Own 5 cosmetics",                test: (st, d) => d.owned.length >= 5 },
  { id: "SAVER",     name: "BIG SAVER",      coins: 50,  desc: "Hold 1,000 coins at once",       test: (st, d) => d.coins >= 1000 },
  { id: "DAILY10",   name: "DEDICATED",      coins: 100, desc: "Complete 10 daily challenges",   test: st => st.dailies >= 10 },
];
const ACH_BY_ID = Object.fromEntries(ACHIEVEMENTS.map(a => [a.id, a]));

/** The local calendar day, as YYYY-MM-DD. Challenges turn over at midnight. */
function dayKey(t) {
  const d = t ? new Date(t) : new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
/** A small seeded generator, so a given day always deals the same challenges. */
function seededRng(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}

const Daily = {
  /** Today's three challenges: [{ def, p, n, text }]. Same for everyone. */
  deal(day) {
    const rng = seededRng("cmb-" + day);
    const pool = DAILY_POOL.slice(), out = [];
    while (out.length < DAILY_COUNT && pool.length) {
      const def = pool.splice(Math.floor(rng() * pool.length), 1)[0];
      let p = null;
      if (def.param === "fighter") p = ROSTER[Math.floor(rng() * ROSTER.length)].id;
      if (def.param === "stage") p = STAGES[Math.floor(rng() * STAGES.length)].id;
      out.push({ def, p, n: def.n, text: def.text(def.n, p) });
    }
    return out;
  },
  /** Today's challenges with this profile's progress, rolling over at midnight. */
  today(d) {
    const day = dayKey();
    if (!d.daily || d.daily.day !== day) d.daily = { day, prog: [0, 0, 0], done: [0, 0, 0] };
    if (this._for !== day) { this._for = day; this._list = this.deal(day); }
    return this._list.map((c, i) => Object.assign({}, c, { prog: d.daily.prog[i] || 0, done: !!d.daily.done[i] }));
  },
  /** Milliseconds until the next set. */
  msLeft() {
    const now = new Date(), next = new Date(now);
    next.setHours(24, 0, 0, 0);
    return next - now;
  },
};

const Goals = {
  busy: false,

  /** After a match: advance today's challenges and check every achievement.
      Credits the coins and returns what paid, for the results screen. */
  onMatch(d, m) {
    const paid = [];
    const list = Daily.today(d);
    list.forEach((c, i) => {
      if (c.done) return;
      const add = c.def.add(m, c.p) || 0;
      if (!add) return;
      d.daily.prog[i] = Math.min(c.n, (d.daily.prog[i] || 0) + add);
      if (d.daily.prog[i] >= c.n) {
        d.daily.done[i] = 1;
        d.stats.dailies++;
        paid.push({ kind: "daily", label: c.text, coins: c.def.coins });
        Toast.push("DAILY CHALLENGE COMPLETE", c.text, "#b6ff3b", c.def.coins);
      }
    });
    paid.push(...this.unlock(d, m));
    for (const p of paid) { d.coins += p.coins; d.stats.earned += p.coins; }
    return paid;
  },

  /** Anything newly earned. Pays for itself when called outside a match. */
  unlock(d, m, pay) {
    const got = [];
    for (const a of ACHIEVEMENTS) {
      if (d.ach.includes(a.id)) continue;
      let hit = false;
      try { hit = !!a.test(d.stats, d, m); } catch (e) { hit = false; }
      if (!hit) continue;
      d.ach.push(a.id);
      got.push({ kind: "ach", label: a.name, coins: a.coins });
      Toast.push("ACHIEVEMENT UNLOCKED", a.name, "#ffc83d", a.coins);
      if (pay) { d.coins += a.coins; d.stats.earned += a.coins; }
    }
    return got;
  },

  /** On every save: lifetime milestones only (a tournament win, a purchase,
      a pile of coins). Guarded, since paying out saves again. */
  sweep(d) {
    if (this.busy) return false;
    this.busy = true;
    const got = this.unlock(d, null, true);
    this.busy = false;
    return got.length > 0;
  },
};

/* ------------------------------------------------------------- toasts
   A small card that slides down at the top right of any screen, so an unlock is
   seen wherever it happened. */
const Toast = {
  list: [],
  push(title, text, color, coins) {
    if (this.list.length > 6) return;
    this.list.push({ title, text, color, coins, at: null });
    Snd.uiBig();
  },
  draw(g) {
    if (!this.list.length) return;
    const now = performance.now(), LIFE = 3800;
    // one at a time, each waiting for the last to leave
    const t = this.list[0];
    if (t.at === null) t.at = now;
    const age = now - t.at;
    if (age > LIFE) { this.list.shift(); return; }
    const k = Math.min(1, age / 260, (LIFE - age) / 260);
    // top right, clear of the big centred titles on the results screen
    const w = 400, h = 58, x = W - w - 20, y = -h + (h + 62) * easeOut(Math.max(0, k));
    g.save();
    panel(g, x, y, w, h, { cut: 10, fill: "#15112b", accent: t.color, accentA: 1, glow: 18, shadow: true });
    g.textAlign = "left"; g.textBaseline = "middle";
    // a trophy or a tick
    g.save(); g.translate(x + 30, y + h / 2);
    g.fillStyle = t.color; g.strokeStyle = INK; g.lineWidth = 2.5;
    if (t.title.startsWith("ACH")) {
      g.beginPath(); g.moveTo(-10, -12); g.lineTo(10, -12); g.lineTo(8, 0); g.quadraticCurveTo(0, 8, -8, 0); g.closePath();
      g.stroke(); g.fill();
      g.fillRect(-2, 4, 4, 6); g.fillRect(-7, 10, 14, 4);
    } else {
      g.lineWidth = 5; g.strokeStyle = t.color; g.lineCap = "round";
      g.beginPath(); g.moveTo(-9, 0); g.lineTo(-3, 7); g.lineTo(10, -8); g.stroke();
    }
    g.restore();
    g.font = `700 10px ${FONT_MONO}`; g.fillStyle = t.color;
    g.fillText(t.title, x + 56, y + 19);
    g.font = `900 17px ${FONT_DISPLAY}`; g.fillStyle = "#ffffff";
    let text = t.text;
    while (g.measureText(text).width > w - 150 && text.length > 4) text = text.slice(0, -2);
    if (text !== t.text) text = text.trimEnd() + "…";
    g.fillText(text, x + 56, y + 39);
    if (t.coins) coinChip(g, t.coins, x + w - 14, y + 13, "right", "+");
    g.restore();
  },
};


/* ===== src/07_fighter.js ===== */
/* ==========================================================================
   8. FIGHTER — state machine, movement, attacks, meter
   ========================================================================== */

const ST = {
  IDLE: "idle", RUN: "run", JUMPSQUAT: "jumpsquat", AIR: "air", LANDLAG: "landlag",
  ATTACK: "attack", SHIELD: "shield", ROLL: "roll", SPOTDODGE: "spotdodge",
  AIRDODGE: "airdodge", HITSTUN: "hitstun", GRABBING: "grabbing", GRABBED: "grabbed",
  SHIELDBREAK: "shieldbreak", DEAD: "dead", RESPAWN: "respawn",
};

let HITID = 1;

/* How long Orbit's Keel Anchor braces her. It used to borrow the stage's
   anchor timer; it is her own now. */
const ANCHOR_FRAMES = 180;

class Fighter {
  /** team is 0 or 1 in a 2v2, and null in free-for-all. look is the
      player's cosmetics ({ cos, name }); it changes nothing but the paint. */
  constructor(slot, charId, isCPU, team, look) {
    this.slot = slot;
    this.cos = Cosmetics.clean(look && look.cos);
    this.name = cleanName(look && look.name);
    this.ch = Cosmetics.skinned(CHAR_BY_ID[charId], this.cos && this.cos.s);
    this.isCPU = isCPU;
    this.team = team == null ? null : team;
    this.pad = new Pad(slot);
    this.tint = this.team == null ? PLAYER_TINT[slot] : TEAM_TINT[this.team];
    this.stats = { kos: 0, damageDealt: 0, falls: 0, supers: 0, bestHit: 0,
                   smashes: 0, bestCombo: 0, items: 0 };
    this.reset(true);
  }

  reset(full) {
    this.x = CFG.world.w / 2 + (this.slot - 1.5) * 150;
    this.y = 160;
    this.px = this.x; this.py = this.y;
    this.vx = 0; this.vy = 0;
    this.facing = this.x < Stage.pivot.x ? 1 : -1;
    this.percent = 0;
    this.state = ST.AIR; this.stateTimer = 0;
    this.grounded = false; this.groundSeg = null;
    this.airJumps = CFG.airJumps;
    this.shield = CFG.shieldMax;
    this.invuln = 0; this.hitstun = 0;
    this.attack = null;
    this.fastFalling = false; this.dropThrough = 0;
    this.lastHitBy = null;
    this.grabTarget = null; this.grabHold = 0; this.grabbedBy = null;
    this.heavyStomp = 0;
    this.anchorGlow = 0; this.flipGlow = 0;
    this.launchFx = 0;        // frames of smoke trail after a SMASH-strength hit
    this.stealWait = 0;       // a CPU that is out counts this up before stealing
    /* ---- status effects. Each is a frame countdown; see STATUS below. ---- */
    this.slowT = 0;           // Rime's chill: moves and jumps slower
    this.frozenT = 0;         // Rime's Absolute Zero: encased, cannot act
    this.curseT = 0;          // Hex: takes more knockback
    this.rootT = 0;           // Sprout: feet held to the floor
    this.stealthT = 0;        // Shade: nearly invisible
    this.ambushT = 0;         // Shade: the next hit out of stealth is stronger
    this.echoT = 0;           // Echo's Deja Vu: damage taken now comes back later
    this.echoDmg = 0; this.echoBy = null;
    this.burnT = 0; this.burnBy = null;   // Magma: on fire, takes damage over time
    this.markT = 0; this.markBy = null;   // a generic "marked" status a fighter can own
    this.buff = ""; this.buffT = 0;       // an item's timed power-up (see 08f_items)
    this.comboN = 0; this.comboKey = null; // hits landed on this fighter in one string
    /* Scratch state the third wave of fighters keeps on themselves (charge,
       combo count, polarity...). Small and flat: it ships in every snapshot. */
    if (full || !this.v) this.v = {};
    this.posHist = [];        // Echo: where she has been, for Recall
    this.specialCD = 0;
    this.pinned = false;
    this.hotTick = 0;         // cooldown between burns from a hot platform
    this.weightMul = 1;       // Husk doubles his own mass while planted
    this.counter = 0;         // Mira's riposte window, in frames
    this.counterFlash = 0;    // purely cosmetic afterglow on a successful one
    this.hover = 0;           // Kite's remaining hover charge
    this.moveLog = [];        // recent connects, for stale-move negation
    this.armorDamage = 0;     // damage absorbed by the current super's armour
    this.trail = [];
    this.alive = true; this.respawnTimer = 0;
    this.squatHeld = false; this.hitFlash = 0;
    this.runPhase = 0;
    this.animTime = Math.random() * 1000;
    if (full) { this.stocks = CFG.stocks; this.meter = 0; }
  }

  get h() { return this.ch.size.h; }
  get w() { return this.ch.size.w; }
  get feetY() { return this.y + this.h * 0.5; }
  get meterFull() { return this.meter >= CFG.meter.max; }
  /** Ground and air speed: chilled is slower, stealthed is a little faster. */
  get moveMul() {
    return (this.slowT > 0 ? 0.55 : 1) * (this.stealthT > 0 ? 1.15 : 1)
         * (this.buff === "boost" ? ITEM_CFG.boostMul : 1);
  }
  /** A BOOST item puts a little extra spring in every jump too. */
  get jumpMul() { return this.buff === "boost" ? 1.12 : 1; }

  /* ----------------------------------------------------- status effects */
  tickStatus() {
    if (this.slowT > 0) {
      this.slowT--;
      if (this.slowT % 9 === 0) FX.spark(this.x + rnd(-14, 14), this.y + rnd(-20, 20), "#d4f1ff");
    }
    if (this.frozenT > 0 && --this.frozenT === 0) {
      FX.burst(this.x, this.y, 14, "#d4f1ff", 4);
      Snd.tone(1600, 0.08, "triangle", 0.08, 2400);
    }
    if (this.curseT > 0) this.curseT--;
    if (this.rootT > 0 && (--this.rootT === 0 || !this.grounded)) this.rootT = 0;
    if (this.stealthT > 0) this.stealthT--;
    if (this.ambushT > 0) this.ambushT--;
    if (this.burnT > 0) {
      this.burnT--;
      if (this.burnT % 6 === 0) FX.spark(this.x + rnd(-12, 12), this.y + rnd(-22, 14), pick(["#ff7a1a", "#ffd23d"]));
      if (this.burnT % 20 === 0 && this.alive && this.state !== ST.DEAD) {
        this.percent += 1; this.hitFlash = 2;
        if (this.burnBy) this.burnBy.stats.damageDealt += 1;
      }
      if (this.burnT === 0) this.burnBy = null;
    }
    if (this.markT > 0 && --this.markT === 0) this.markBy = null;
    if (this.buffT > 0 && --this.buffT === 0) this.buff = "";
    if (this.echoT > 0 && --this.echoT === 0) this.echoBack();
    if (this.ch.recall) {
      this.posHist.push({ x: this.x, y: this.y, p: this.percent });
      if (this.posHist.length > this.ch.recall) this.posHist.shift();
    }
  }

  /** Echo's Deja Vu runs out: everything taken during it lands again. */
  echoBack() {
    const by = this.echoBy, dmg = Math.min(this.echoDmg, 24);
    this.echoBy = null; this.echoDmg = 0;
    if (!by || dmg < 1 || !this.alive || this.state === ST.DEAD) return;
    const dirX = this.x >= by.x ? 1 : -1;
    const rad = 50 * Math.PI / 180;
    const mag = (CFG.kbBase + 4.6 + dmg * CFG.kbDamageScale + this.percent * CFG.kbPercentScale * 1.0 * 1.9)
              * ((CFG.kbWeightRef + 0.55) / (this.ch.weight + 0.55));
    FX.ring(this.x, this.y, 8, 160, by.ch.color, 4);
    FX.damageText(this.x, this.y - 44, "ECHO", by.ch.accent);
    FX.burst(this.x, this.y, 20, by.ch.color, 7);
    Snd.superHit();
    this.applyKnockback(Math.cos(rad) * mag * dirX, -Math.sin(rad) * mag, dmg, mag, by);
    by.stats.damageDealt += dmg;
  }

  /** Leaving stealth by attacking primes an ambush for the next hit. */
  breakStealth() {
    if (this.stealthT <= 0) return;
    this.stealthT = 0;
    this.ambushT = 40;
    FX.ring(this.x, this.y, 6, 60, this.ch.accent, 2);
  }
  get inSuper() { return this.attack && this.attack.kind === "super"; }

  addMeter(v) {
    const m = Match.current;
    if (v > 0 && m && m.frenzy) v *= CFG.meter.frenzyMul;
    this.meter = clamp(this.meter + v, 0, CFG.meter.max);
  }

  /* ---------------------------------------------------- stale moves ----
     Every connect is remembered for a while. The more of the recent window a
     move occupies, the less it does — so leaning on one strong button costs
     you damage and mixing your options is worth something. Only connects
     count: whiffing a move never stales it. */
  recordMove(move) {
    if (!move || !move.name) return;
    this.moveLog.push({ name: move.name, at: this.animTime });
    if (this.moveLog.length > CFG.skill.staleWindow) this.moveLog.shift();
  }
  staleMul(move) {
    if (!move || !move.name) return 1;
    const K = CFG.skill;
    // entries older than the refresh window have freshened and no longer count
    const recent = this.moveLog.filter(e => this.animTime - e.at < K.staleRefresh);
    const n = recent.filter(e => e.name === move.name).length;
    return K.staleSteps[Math.min(n, K.staleSteps.length - 1)];
  }
  setState(s, t = 0) { this.state = s; this.stateTimer = t; }
  canAct() { return [ST.IDLE, ST.RUN, ST.AIR].includes(this.state); }

  /* ================================================================ update */
  update(match) {
    this.px = this.x; this.py = this.y;
    this.animTime++;

    if (this.state === ST.DEAD) {
      if (this.respawnTimer > 0) this.respawnTimer--;
      if (this.respawnTimer <= 0) {
        if (this.stocks > 0) this.respawn();
        else { this.alive = false; this.tryStockSteal(match); }
      }
      return;
    }
    if (!this.alive) return;

    this.pad.poll();
    const inp = this.buffered(this.isCPU ? CPU.think(this, match) : this.pad);

    if (this.invuln > 0) this.invuln--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.heavyStomp > 0) this.heavyStomp--;
    if (this.specialCD > 0) this.specialCD--;
    if (this.hotTick > 0) this.hotTick--;
    if (this.counter > 0) this.counter--;
    if (this.counterFlash > 0) this.counterFlash--;
    if (this.notReadyT > 0) this.notReadyT--;
    if (this.thornsT > 0) this.thornsT--;
    if (this.anchorGlow > 0) this.anchorGlow--;
    if (this.flipGlow > 0) this.flipGlow--;
    if (this.launchFx > 0) {
      this.launchFx--;
      if (this.launchFx % 2 === 0) FX.burst(this.x, this.y, 2, "#ffffff", 1.2);
    }
    this.tickStatus();

    /* Frozen solid: no input at all. The block still falls and slides, and
       the next hit shatters it (see applyKnockback). */
    if (this.frozenT > 0) {
      this.attack = null; this.pinned = false;
      if (this.grounded) this.vx *= 0.9;
      this.integrate();
      this.checkBlastZones(match);
      return;
    }
    this.addMeter(CFG.meter.passive);

    switch (this.state) {
      case ST.IDLE: case ST.RUN: this.updateGroundFree(inp); break;
      case ST.AIR:               this.updateAirFree(inp); break;
      case ST.JUMPSQUAT:         this.updateJumpSquat(inp); break;
      case ST.LANDLAG:           this.tickTimer(ST.IDLE); break;
      case ST.ATTACK:            this.updateAttack(inp); break;
      case ST.SHIELD:            this.updateShield(inp); break;
      case ST.ROLL:              this.updateRoll(); break;
      case ST.SPOTDODGE:         this.tickTimer(ST.IDLE); break;
      case ST.AIRDODGE:          this.updateAirDodge(); break;
      case ST.HITSTUN:           this.updateHitstun(inp); break;
      case ST.GRABBING:          this.updateGrabbing(inp); break;
      case ST.GRABBED:           this.updateGrabbed(inp); break;
      case ST.SHIELDBREAK:       this.tickTimer(ST.IDLE); break;
      case ST.RESPAWN:           this.updateRespawn(inp); break;
    }

    if (this.state !== ST.SHIELD && this.state !== ST.SHIELDBREAK)
      this.shield = Math.min(CFG.shieldMax, this.shield + CFG.shieldRegen);

    this.integrate();
    this.checkBlastZones(match);

    // run-cycle phase drives the leg animation in every character's draw()
    if (this.grounded && Math.abs(this.vx) > 0.5) this.runPhase += Math.abs(this.vx) * 0.09;
    else this.runPhase *= 0.85;

    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 9 || this.inSuper) {
      this.trail.push({ x: this.x, y: this.y, life: 10, facing: this.facing });
      if (this.trail.length > 12) this.trail.shift();
    }
    for (let i = this.trail.length - 1; i >= 0; i--)
      if (--this.trail[i].life <= 0) this.trail.splice(i, 1);
  }

  tickTimer(next) { if (--this.stateTimer <= 0) this.setState(next); }

  /* ------------------------------------------------------------- grounded */
  updateGroundFree(inp) {
    const ch = this.ch, ax = inp.ax;

    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("shield")) {
      if (ax !== 0) { this.startRoll(ax); return; }
      if (inp.ay > 0) { this.setState(ST.SPOTDODGE, CFG.spotDodgeFrames); Snd.dodge(); return; }
      this.setState(ST.SHIELD); Snd.shield(); return;
    }
    if (inp.held("shield")) { this.setState(ST.SHIELD); return; }
    if (inp.hit("grab")) { this.startGrab(); return; }
    if (inp.hit("heavy")) { this.startAttack("heavy"); return; }
    if (inp.hit("light")) { this.startAttack("light"); return; }
    if (inp.hit("special")) { this.startSpecial(); return; }
    if (inp.hit("up") && this.rootT <= 0) { this.setState(ST.JUMPSQUAT, CFG.jumpSquat); this.squatHeld = true; return; }

    if (inp.ay > 0 && this.groundSeg && !this.groundSeg.solid && this.rootT <= 0) {
      this.grounded = false; this.groundSeg = null;
      this.dropThrough = 10; this.setState(ST.AIR); this.y += 6;
      return;
    }

    // rooted: feet stay put (attacks, shield and turning still work)
    const target = this.rootT > 0 ? 0 : ax * ch.speed * this.moveMul;
    this.vx += (target - this.vx) * (ax !== 0 ? ch.accel * 0.45 : 0.35);
    this.setState(Math.abs(this.vx) > 0.6 ? ST.RUN : ST.IDLE);
    if (ax !== 0) this.facing = ax;
  }

  updateJumpSquat(inp) {
    this.squatHeld = this.squatHeld && inp.held("up");
    if (--this.stateTimer <= 0) {
      this.vy = -this.ch.jump * (this.squatHeld ? 1 : CFG.shortHopMul) * (this.slowT > 0 ? 0.86 : 1) * this.jumpMul;
      this.grounded = false; this.groundSeg = null;
      this.setState(ST.AIR); this.fastFalling = false;
      Snd.jump();
      FX.burst(this.x, this.feetY, 7, this.ch.color, 3);
    }
  }

  /* ---------------------------------------------------------------- air */
  updateAirFree(inp) {
    const ch = this.ch;
    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("shield")) { this.startAirDodge(inp); return; }
    if (inp.hit("grab") || inp.hit("light")) { this.startAttack("light"); return; }
    if (inp.hit("heavy")) { this.startAttack("heavy"); return; }
    if (inp.hit("special")) { this.startSpecial(); return; }

    if (inp.hit("up") && this.airJumps > 0) {
      this.airJumps--;
      this.vy = -ch.jump * 0.94 * this.jumpMul;
      this.vx += inp.ax * ch.airSpeed * 0.5;
      this.fastFalling = false;
      Snd.jump();
      FX.ring(this.x, this.y, 10, 56, ch.color, 2);
      return;
    }
    if (inp.hit("down") && this.vy > -1) this.fastFalling = true;
    if (inp.ax !== 0) {
      const am = this.moveMul;
      this.vx = clamp(this.vx + inp.ax * ch.accel * 0.42 * am, -ch.airSpeed * 1.6 * am, ch.airSpeed * 1.6 * am);
      this.facing = inp.ax;
    }
  }

  startAirDodge(inp) {
    this.setState(ST.AIRDODGE, CFG.airDodgeFrames);
    this.invuln = Math.max(this.invuln, CFG.dodgeInvuln[1]);
    const a = Math.hypot(inp.ax, inp.ay);
    if (a > 0) { this.vx = (inp.ax / a) * CFG.airDodgeSpeed; this.vy = (inp.ay / a) * CFG.airDodgeSpeed; }
    else { this.vx *= 0.3; this.vy = -1; }
    Snd.dodge();
    FX.ring(this.x, this.y, 8, 50, "#ffffff", 2);
  }
  updateAirDodge() {
    this.vx *= 0.93; this.vy *= 0.93;
    if (--this.stateTimer <= 0) this.setState(ST.AIR);
  }

  /* ------------------------------------------------------------- shield */
  updateShield(inp) {
    this.vx *= 0.7;
    if (!this.grounded) { this.setState(ST.AIR); return; }
    this.shield -= CFG.shieldDrainIdle;
    if (this.shield <= 0) { this.breakShield(); return; }
    if (inp.hit("super") && this.meterFull) { this.startSuper(); return; }
    if (inp.hit("grab")) { this.startGrab(); return; }
    if (inp.ax !== 0 && inp.hit("shield")) { this.startRoll(inp.ax); return; }
    if (inp.hit("up")) { this.setState(ST.JUMPSQUAT, CFG.jumpSquat); this.squatHeld = true; return; }
    if (!inp.held("shield")) this.setState(ST.IDLE);
  }
  breakShield() {
    this.shield = 0;
    this.setState(ST.SHIELDBREAK, CFG.shieldBreakStun);
    this.vy = -6;
    Snd.shieldBreak(); FX.shake(14);
    FX.burst(this.x, this.y, 26, "#7fd9ff", 8);
    FX.banner("SHIELD BREAK", this.tint);
  }
  startRoll(dir) {
    this.setState(ST.ROLL, CFG.rollFrames);
    this.rollDir = dir;
    this.invuln = Math.max(this.invuln, CFG.dodgeInvuln[1]);
    Snd.dodge();
  }
  updateRoll() {
    this.vx = this.rollDir * CFG.rollSpeed * Math.sin(Math.PI * (this.stateTimer / CFG.rollFrames));
    if (--this.stateTimer <= 0) { this.facing = -this.rollDir; this.setState(ST.IDLE); }
  }

  /* ------------------------------------------------------------ attacks */
  startAttack(kind) {
    this.breakStealth();
    this.clearBuffer();
    const m = this.ch[kind];
    this.attack = {
      kind, data: m, t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, lastHitFrame: -99,
    };
    this.setState(ST.ATTACK);
    if (this.grounded) this.vx *= 0.42;
    if (m.onStart) m.onStart(this);
    Snd.whoosh();
  }

  /* Input buffer. A button pressed a few frames before the fighter can act
     on it (landing lag, the tail of an attack, a jump's squat) is remembered
     and fires on the first frame it can, instead of being silently dropped —
     which read as "my special did nothing". */
  buffered(raw) {
    const b = this.buf || (this.buf = {});
    for (const k of BUFFERED) {
      if (raw.hit(k)) b[k] = CFG.inputBuffer;
      else if (b[k] > 0) b[k]--;
    }
    return {
      ax: raw.ax, ay: raw.ay,
      held: k => raw.held(k),
      hit: k => raw.hit(k) || (b[k] > 0 && BUFFERED.includes(k)),
    };
  }
  clearBuffer() { this.buf = null; }

  startSpecial() {
    if (this.specialCD > 0) {
      // say so, rather than doing nothing (once per press, not every buffered frame)
      if (!this.notReadyT) {
        this.notReadyT = 30;
        FX.damageText(this.x, this.y - this.h * 0.7, "NOT READY", "#8f8cb5");
        Snd.tone(150, 0.06, "square", 0.06, 110);
      }
      return;
    }
    this.clearBuffer();
    this.specialCD = this.ch.specialCooldown;
    const m = this.ch.special;
    this.attack = {
      kind: "special", data: m, t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, fired: false,
    };
    this.setState(ST.ATTACK);
    if (m.onStart) m.onStart(this);
    Snd.whoosh(1.2);
  }

  startSuper() {
    this.breakStealth();
    this.clearBuffer();
    const m = this.ch.super;
    this.meter = 0;
    this.armorDamage = 0;
    this.stats.supers++;
    this.attack = {
      kind: "super", data: Object.assign({}, m), t: 0,
      total: m.startup + m.active + m.recovery,
      hitId: HITID++, hitIds: null, fired: false, landed: false,
    };
    this.setState(ST.ATTACK);
    this.invuln = Math.max(this.invuln, m.startup + 4);
    FX.punch(0.6);
    if (m.onStart) m.onStart(this);
    FX.banner(m.name.toUpperCase(), this.ch.color);
    FX.hitPause(10);
  }

  updateAttack(inp) {
    const a = this.attack;
    if (!a) { this.setState(this.grounded ? ST.IDLE : ST.AIR); return; }
    a.t++;

    if (a.data.tick) a.data.tick(this, a, inp);

    const m = a.data;

    /* Signature effects. vfx fires once, on the frame the hitbox opens, so the
       flourish and the hit are the same event; vfxTick runs every active frame
       for moves that need a continuous effect. */
    if (m.vfx && a.t === m.startup + 1) m.vfx(this, a);
    if (m.vfxTick && this.hitboxActive()) m.vfxTick(this, a);

    // multi-hit: re-arm the hitbox every hitGap frames
    if (m.hits && m.hits > 1 && this.hitboxActive()) {
      if (a.t - a.lastHitFrame >= (m.hitGap || 4)) {
        a.hitIds = null; a.lastHitFrame = a.t;
        a.hitIndex = (a.hitIndex || 0) + 1;
        if (m.vfxRehit) m.vfxRehit(this, a);
      }
    }

    if (this.grounded) this.vx *= 0.86;

    if (a.t >= a.total) {
      this.attack = null;
      this.pinned = false;
      this.setState(this.grounded ? ST.LANDLAG : ST.AIR, CFG.landLag);
    }
  }

  hitboxActive() {
    const a = this.attack;
    if (!a) return false;
    const m = a.data;
    if (!m.r) return false;
    return a.t > m.startup && a.t <= m.startup + m.active;
  }
  hitboxWorld() {
    const a = this.attack, m = a.data;
    let ox = m.ox || 0, oy = m.oy || 0;
    if (this.ch.id === "BOLDER" && (a.kind === "special" || a.kind === "super")) ox = 0;
    return { x: this.x + ox * this.facing, y: this.y + oy, r: m.r };
  }

  /* -------------------------------------------------------------- grabs */
  startGrab() {
    this.breakStealth();
    this.clearBuffer();
    this.attack = {
      kind: "grab",
      data: { startup: CFG.grabStartup, active: CFG.grabActive,
              recovery: CFG.grabRecovery, ox: 34, oy: -6, r: 28, dmg: 0 },
      t: 0, total: CFG.grabStartup + CFG.grabActive + CFG.grabRecovery,
      hitId: HITID++, hitIds: null,
    };
    this.setState(ST.ATTACK);
    this.vx *= 0.3;
    Snd.whoosh(0.8);
  }
  lockGrab(target) {
    this.attack = null;
    this.grabTarget = target; this.grabHold = CFG.grabHoldBase;
    this.setState(ST.GRABBING);
    target.grabbedBy = this;
    target.setState(ST.GRABBED, CFG.grabHoldBase);
    target.vx = 0; target.vy = 0;
    Snd.grab();
    FX.burst(target.x, target.y, 10, this.ch.color, 4);
  }
  updateGrabbing(inp) {
    const t = this.grabTarget;
    if (!t || t.state !== ST.GRABBED || !t.alive) { this.releaseGrab(); return; }
    this.vx *= 0.5;
    t.x = this.x + this.facing * (this.w * 0.5 + t.w * 0.4);
    t.y = this.y - 2; t.vx = 0; t.vy = 0;

    if (inp.hit("light")) {
      t.percent += CFG.pummelDamage;
      this.stats.damageDealt += CFG.pummelDamage;
      this.addMeter(CFG.pummelDamage * CFG.meter.onDeal);
      t.hitFlash = 5;
      Snd.hit(4);
      FX.spark(t.x, t.y, "#ffffff");
      this.grabHold -= 4;
    }
    let thrown = null;
    if (inp.hit("right"))     thrown = { x:  0.98, y: -0.22 };
    else if (inp.hit("left")) thrown = { x: -0.98, y: -0.22 };
    else if (inp.hit("up"))   thrown = { x:  0.10, y: -0.99 };
    else if (inp.hit("down")) thrown = { x:  0.34, y:  0.94 };
    if (thrown) { this.doThrow(t, thrown); return; }

    if (--this.grabHold <= 0) this.releaseGrab();
  }
  doThrow(t, dir) {
    const kb = CFG.kbBase + CFG.throwDamage * CFG.kbDamageScale + t.percent * CFG.kbPercentScale * 1.1;
    const weightFix = (CFG.kbWeightRef + 0.55) / (t.ch.weight + 0.55);
    const mag = kb * weightFix * 0.9 + 4;
    t.applyKnockback(dir.x * mag, dir.y * mag, CFG.throwDamage, mag, this);
    this.stats.damageDealt += CFG.throwDamage;
    this.addMeter(CFG.throwDamage * CFG.meter.onDeal);
    Snd.throw_(); FX.shake(7);
    FX.burst(t.x, t.y, 14, this.ch.color, 6);
    this.releaseGrab();
    this.setState(ST.LANDLAG, 12);
  }
  releaseGrab() {
    const t = this.grabTarget;
    if (t) { t.grabbedBy = null; if (t.state === ST.GRABBED) t.setState(ST.AIR); }
    this.grabTarget = null;
    this.setState(this.grounded ? ST.IDLE : ST.AIR);
  }
  updateGrabbed(inp) {
    let mash = 0;
    for (const b of BUTTONS) if (inp.hit(b)) mash++;
    this.stateTimer -= 1 + mash * 5;
    if (this.stateTimer <= 0) {
      if (this.grabbedBy) this.grabbedBy.releaseGrab();
      this.setState(ST.AIR);
    }
  }

  /* ------------------------------------------------------------ hitstun */
  updateHitstun(inp) {
    this.hitstun--;
    if (inp.ax !== 0) this.vx += inp.ax * CFG.diStrength;
