<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cool Matt Brawl</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%; background:#05040d; color:#f2f0ff;
    font-family:"Archivo Black", Impact, "Arial Narrow Bold", system-ui, sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #wrap{ position:fixed; inset:0; display:grid; place-items:center; }
  canvas{
    display:block; touch-action:none;
    box-shadow:0 0 60px rgba(0,229,255,.16), 0 0 180px rgba(255,46,136,.10);
    background:#05040d; border-radius:4px;
  }
  #hint{
    position:fixed; left:50%; bottom:calc(5px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:10px;
    letter-spacing:.09em; color:#55536e; pointer-events:none; user-select:none;
    white-space:nowrap;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hint">COOL MATT GAMES &nbsp;·&nbsp; click the canvas to focus &nbsp;·&nbsp; ESC pauses &nbsp;·&nbsp; F11 fullscreen</div>

<script>
/* ===== src/00_config.js ===== */
/* ==========================================================================
   COOL MATT BRAWL — 1. CONFIG
   Every tunable number in the game lives in this file.
   ========================================================================== */
"use strict";

const CFG = {
  // ---- canvas / world ----
  view:  { w: 1280, h: 720 },
  world: { w: 1600, h: 900 },

  // ---- simulation ----
  fps: 60,
  maxFrameSkip: 5,

  // ---- physics ----
  gravity:        0.62,
  maxFall:        14.0,
  fastFallMul:    1.75,
  airDrag:        0.955,
  groundFriction: 0.80,
  slideStrength:  0.70,
  slopeFrictionLoss: 0.85,
  landLag:        3,
  inputBuffer:    8,     // frames an early attack/special/super/grab press is kept

  // ---- jumps ----
  jumpSquat:   3,
  airJumps:    1,
  shortHopMul: 0.62,

  // ---- knockback ----
  kbBase:         1.0,
  kbPercentScale: 0.105,
  kbDamageScale:  0.42,
  kbWeightRef:    1.0,
  hitstunPerKb:   2.10,
  hitstunMax:     60,
  hitPauseBase:   4,
  hitPausePerDmg: 0.42,
  diStrength:     0.22,

  // ---- shields / dodges ----
  shieldMax:       100,
  shieldRegen:     0.35,
  shieldDrainIdle: 0.22,
  shieldDamageMul: 1.15,
  shieldBreakStun: 110,
  rollFrames:      22,
  rollSpeed:       9.5,
  spotDodgeFrames: 20,
  airDodgeFrames:  26,
  airDodgeSpeed:   11,
  dodgeInvuln:     [4, 16],

  // ---- grabs ----
  grabStartup:  5,
  grabActive:   4,
  grabRecovery: 18,
  grabHoldBase: 48,
  pummelDamage: 2.2,
  throwDamage:  8,

  // ---- stocks / match ----
  stocks:        3,
  respawnFrames: 60,
  respawnInvuln: 110,
  matchSeconds:  180,
  /* The last stretch of the clock is a FRENZY: meter fills twice as fast, so
     the end of a close match is decided by supers instead of running down. */
  frenzySeconds: 30,
  /* A time-out with the stocks level is not a draw any more. The tied sides
     come back on one stock at suddenDeathPercent and fight it out. */
  suddenDeathPercent: 150,
  suddenDeathSeconds: 45,
  /* A hit with at least this much knockback is announced as a SMASH: it is
     very likely to take a stock, and the player should feel that. */
  smashKb: 15.5,

  // ---- SUPER METER ----
  /* ---- SUPER METER ----
     Tuned down from the first pass, where a super arrived roughly every 80
     damage dealt and the passive trickle alone filled the bar in under two
     minutes — so supers landed constantly and decided matches on their own.
     They are now something you earn by actually fighting. */
  meter: {
    max:          100,
    onDeal:       0.80,   // per point of damage dealt (was 1.25)
    onTake:       0.50,   // per point taken (comebacks) (was 0.75)
    passive:      0.004,  // a safety net, not a source (was 0.016)
    frenzyMul:    2.0,    // every gain is doubled in the final stretch
    superArmor:   true,   // supers resist knockback during their active window
    superArmorHp: 16,     // ...but that armour BREAKS above this much damage,
                          //    so a committed super can be contested
  },

  /* ---- SKILL ----
     Levers that reward precision and variety over mashing one good button. */
  skill: {
    // Repeating a move makes it weaker; rotating keeps your damage up.
    staleSteps:  [1.0, 0.90, 0.82, 0.75, 0.70],
    staleWindow: 6,      // how many recent connects are remembered
    staleRefresh: 600,   // frames before a stale entry freshens again
    // Connecting with the outer edge of a hitbox pays more than hugging.
    tipBonus:    1.16,
    tipZone:     0.60,   // fraction of hitbox radius that counts as the tip
    // A clean hit refunds some endlag; a whiff pays it all.
    hitConfirmCut: 0.25,
  },

  /* ---- CAMERA ----
     The v1 camera chased the exact midpoint of all fighters every frame, so it
     drifted side to side constantly. This one holds still until the action
     actually leaves a dead zone, then eases with a critically damped spring. */
  cam: {
    deadX:     190,   // half-width of the dead zone, in world units
    deadY:     120,   // half-height
    follow:    0.055, // how fast the camera closes on its target
    zoomLerp:  0.030,
    pad:       330,
    minZoom:   0.62,
    maxZoom:   1.04,
    zoomStep:  0.04,  // zoom quantisation — kills micro-breathing
    maxShake:  26,
    shakeDecay: 0.80,
  },

  // ---- feel ----
  maxParticles: 900,

  // ---- cpu ----
  cpu: { aggression: 0.95, dodgeChance: 0.012, superChance: 0.02 },

  // ---- player settings (persisted; see Settings) ----
  defaults: {
    shakeAmount: 1.0,   // 0 disables screen shake entirely
    cameraSway:  1.0,   // 0 pins the camera dead centre
    particles:   1.0,
    showHitboxGlow: true,
    musicOn:     true,
    sfxOn:       true,
    postFx:      1.0,   // bloom, chromatic aberration and vignette; 0 disables
    items:       true,  // power-ups drop onto the stage during a match
  },
};

const W = CFG.view.w, H = CFG.view.h;

/* Per-player accent used for tags, stock pips and slot cards. */
const PLAYER_TINT = ["#ff5fa2", "#4fe8ff", "#caff6e", "#ffd76b"];

/* 2v2: in a team match every fighter's tag, ring and card wear their team's
   colour instead of their player colour, so sides read at a glance. */
const TEAM_TINT = ["#ff4f6a", "#3fa8ff"];
const TEAM_NAME = ["RED", "BLUE"];

/** True when two fighters are on the same side. Free-for-all has no teams,
    so there the only ally a fighter has is itself. */
function allies(a, b) {
  return a === b || (a.team != null && a.team === b.team);
}


/* ===== src/01_util.js ===== */
/* ==========================================================================
   2. UTIL — math, colour and canvas helpers
   ========================================================================== */

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
/** Smooth 0..1 ease used all over the animation code. */
function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeIn(t) { return t * t * t; }

/** Deterministic per-seed noise — stable backgrounds that never re-randomise. */
function hash(n) {
  let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Rounded polygon from a flat [x,y,...] list — used for angular armour. */
function poly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function mixColor(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(((a >> 16) & 255) + (((b >> 16) & 255) - ((a >> 16) & 255)) * t);
  const g = Math.round(((a >> 8) & 255) + (((b >> 8) & 255) - ((a >> 8) & 255)) * t);
  const bl = Math.round((a & 255) + ((b & 255) - (a & 255)) * t);
  return `rgb(${r},${g},${bl})`;
}

/** Shift a hex colour's lightness without leaving its hue. */
function shade(hex, amt) {
  return mixColor(hex, amt > 0 ? "#ffffff" : "#000000", Math.abs(amt));
}

/** Draw text with a knocked-out dark outline so it reads on any background. */
function outlineText(ctx, text, x, y, fill, lw) {
  ctx.lineJoin = "round";
  ctx.lineWidth = lw || 8;
  ctx.strokeStyle = "rgba(4,3,12,.92)";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

/** Glow helper that always restores shadow state. */
function glow(ctx, color, blur, fn) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  fn();
  ctx.restore();
}

const FONT_DISPLAY = '"Archivo Black", Impact, "Arial Narrow Bold", sans-serif';
/* The UI face. It was the system monospace, which read as a terminal and was
   hard to scan at small sizes; Chakra Petch has the same cut corners as the
   panels. The name stays FONT_MONO so the many call sites need not change. */
const FONT_MONO = '"Chakra Petch", "Segoe UI", system-ui, sans-serif';


/* ===== src/02_audio.js ===== */
/* ==========================================================================
   3. AUDIO — everything synthesised with Web Audio, no files
   ========================================================================== */

const Snd = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  ready: false,
  musicTimer: null, musicStep: 0, musicStage: null,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(this.ctx.destination);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 1;
    this.sfxGain.connect(this.master);

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.22;
    this.musicGain.connect(this.master);

    // A short reverb gives hits weight without sounding like a click track.
    const len = this.ctx.sampleRate * 1.1;
    const buf = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    this.verb = this.ctx.createConvolver(); this.verb.buffer = buf;
    this.verbGain = this.ctx.createGain(); this.verbGain.gain.value = 0.18;
    this.verb.connect(this.verbGain); this.verbGain.connect(this.master);
    this.ready = true;
  },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  get sfxOn() { return Settings.get("sfxOn"); },

  tone(freq, dur, type = "square", vol = 0.25, slideTo = null, delay = 0, send = 0) {
    if (!this.ready || !this.sfxOn) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, freq), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxGain);
    if (send > 0) g.connect(this.verb);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, vol = 0.3, freq = 900, q = 1.2, type = "lowpass", delay = 0, send = 0) {
    if (!this.ready || !this.sfxOn) return;
    const t = this.ctx.currentTime + delay;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    if (send > 0) g.connect(this.verb);
    src.start(t);
  },

  /* ---------------- game events ---------------- */
  hit(dmg) {
    const p = clamp(dmg / 20, 0, 1);
    this.noise(0.07 + p * 0.1, 0.24 + p * 0.22, 1700 - p * 1200, 1.0, "lowpass", 0, p * 0.6);
    this.tone(230 - p * 100, 0.06 + p * 0.08, "square", 0.12 + p * 0.1, 70);
  },
  bigHit() { this.noise(0.3, 0.42, 300, 0.9, "lowpass", 0, 0.8); this.tone(92, 0.34, "sawtooth", 0.2, 36, 0, 0.5); },
  whoosh(p = 1) { this.noise(0.1 * p, 0.09, 2800, 0.7, "bandpass"); },
  jump() { this.tone(360, 0.09, "square", 0.09, 700); },
  land() { this.noise(0.06, 0.11, 420, 0.8); },
  shield() { this.tone(560, 0.13, "sine", 0.13, 780); this.tone(860, 0.09, "sine", 0.06, 1140); },
  shieldBreak() { this.noise(0.4, 0.4, 2200, 2.2, "bandpass", 0, 1); this.tone(1400, 0.5, "sawtooth", 0.18, 90); },
  dodge() { this.noise(0.09, 0.09, 3400, 1.6, "bandpass"); },
  grab() { this.tone(170, 0.08, "triangle", 0.18, 300); },
  throw_() { this.noise(0.13, 0.22, 700, 0.9); this.tone(150, 0.19, "sawtooth", 0.15, 420); },
  blip(f = 680) { this.tone(f, 0.05, "square", 0.1, f * 1.4); },
  ko() {
    this.noise(0.5, 0.4, 900, 0.7, "lowpass", 0, 1);
    [760, 570, 430, 300].forEach((f, i) => this.tone(f, 0.25, "square", 0.15, f * 0.6, i * 0.07, 0.5));
  },
  superCharge() {
    [220, 330, 440, 660].forEach((f, i) => this.tone(f, 0.5, "sine", 0.1, f * 2, i * 0.06, 0.8));
    this.noise(0.6, 0.2, 400, 1, "highpass", 0, 1);
  },
  superHit() {
    this.noise(0.5, 0.5, 180, 0.8, "lowpass", 0, 1);
    this.tone(60, 0.6, "sawtooth", 0.28, 28, 0, 0.6);
    [330, 440, 550, 880].forEach((f, i) => this.tone(f, 0.35, "square", 0.1, f * 0.5, i * 0.05, 0.7));
  },
  ui() { this.tone(680, 0.05, "square", 0.1, 940); },
  uiBig() { this.tone(430, 0.09, "square", 0.14, 820); this.tone(820, 0.13, "square", 0.1, 1240, 0.06); },
  count(n) { this.tone(n === 0 ? 880 : 440, n === 0 ? 0.4 : 0.13, "square", 0.18, n === 0 ? 1320 : 440); },

  /* ---------------- stage music ----------------
     A tiny step sequencer. Each stage supplies a root note, a scale and a
     tempo, so every map has its own bed without any audio files. */
  startMusic(stage) {
    this.stopMusic();
    if (!this.ready || !Settings.get("musicOn") || !stage || !stage.music) return;
    this.musicStage = stage;
    this.musicStep = 0;
    const m = stage.music;
    const beat = 60000 / m.bpm / 2;
    this.musicTimer = setInterval(() => this._musicTick(), beat);
  },
  stopMusic() {
    if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
  },
  _musicTick() {
    if (!this.ready || !Settings.get("musicOn")) return;
    const m = this.musicStage.music;
    const s = this.musicStep++;
    const t = this.ctx.currentTime;
    const note = f => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = m.wave || "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      o.connect(g); g.connect(this.musicGain); g.connect(this.verb);
      o.start(t); o.stop(t + 0.4);
    };
    // bass on the downbeat
    if (s % 4 === 0) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "sawtooth";
      o.frequency.value = m.root / 2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
      o.connect(lp); lp.connect(g); g.connect(this.musicGain);
      o.start(t); o.stop(t + 0.55);
    }
    // arpeggio
    const seq = m.seq;
    const deg = seq[s % seq.length];
    if (deg >= 0) note(m.root * Math.pow(2, m.scale[deg % m.scale.length] / 12) * (deg >= m.scale.length ? 2 : 1));
    // hat
    if (m.hats && s % 2 === 1) this.noise(0.03, 0.05, 7000, 1, "highpass");
  },
};


/* ===== src/02a_glow.js ===== */
/* ==========================================================================
   3b. LIGHT — cached glow sprites and the screen post-processing pass

   WHY SPRITES INSTEAD OF shadowBlur
   Canvas `shadowBlur` re-blurs its source on every single draw call. The game
   was using it for every lit visor, every ring, every particle flourish, which
   meant re-blurring dozens of shapes per frame. A radial-gradient sprite baked
   once and then stamped with additive blending looks the same or better and is
   a plain drawImage. Cheap enough that light can be used liberally, which is
   what makes a neon game actually glow instead of merely having bright colours.

   THE POST PASS
   Everything that makes a frame feel finished rather than merely drawn:
     bloom      bright areas bleed into their surroundings
     chroma     red/blue separation on heavy impacts
     flash      full-screen colour on a super or a KO
     vignette   darkened corners so the eye goes to the middle
   It runs on the world, underneath the HUD, so readouts stay crisp.
   ========================================================================== */

const Light = {
  cache: new Map(),
  sizes: [8, 16, 32, 64, 128, 256],
  bloomCv: null, bloomCtx: null,

  _bucket(r) {
    for (const s of this.sizes) if (r <= s) return s;
    return 256;
  },

  /** A soft radial sprite: white hot centre, the colour, then out to nothing. */
  sprite(color, radius, core) {
    core = core === undefined ? 0.18 : core;
    const r = this._bucket(radius);
    const key = color + "|" + r + "|" + core;
    let c = this.cache.get(key);
    if (c) return c;
    c = document.createElement("canvas");
    c.width = c.height = r * 2;
    const cx = c.getContext("2d");
    const q = cx.createRadialGradient(r, r, 0, r, r, r);
    q.addColorStop(0, "#ffffff");
    q.addColorStop(core, color);
    q.addColorStop(0.45, hexA(color, 0.35));
    q.addColorStop(1, hexA(color, 0));
    cx.fillStyle = q;
    cx.fillRect(0, 0, r * 2, r * 2);
    if (this.cache.size < 220) this.cache.set(key, c);
    return c;
  },

  /** Stamp a glow centred on (x,y). Additive, so overlapping lights build up. */
  draw(ctx, x, y, radius, color, alpha, core) {
    if (alpha !== undefined && alpha <= 0.01) return;
    if (radius <= 0.5) return;
    const s = this.sprite(color, radius, core);
    const pa = ctx.globalAlpha, po = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = pa * Math.min(1, alpha === undefined ? 1 : alpha);
    ctx.drawImage(s, x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalAlpha = pa;
    ctx.globalCompositeOperation = po;
  },

  /* ------------------------------------------------------------- post ---- */

  /** Cheap thresholded bloom.

      Downsampling and adding the result straight back lifts EVERY pixel by a
      fraction of its neighbourhood, which washed the whole frame out — the
      background is dark blue, not black, so it bloomed too. Multiplying the
      downsample by itself squares each channel first: a dark 0.2 becomes 0.04
      while a hot 0.9 stays 0.81, so only genuinely bright things bleed. Three
      drawImages and no pixel reads. */
  bloom(ctx, canvas, w, h, amount) {
    if (amount <= 0.01) return;
    const bw = Math.max(1, (w / 8) | 0), bh = Math.max(1, (h / 8) | 0);
    if (!this.bloomCv) {
      this.bloomCv = document.createElement("canvas");
      this.bloomCtx = this.bloomCv.getContext("2d");
    }
    if (this.bloomCv.width !== bw || this.bloomCv.height !== bh) {
      this.bloomCv.width = bw; this.bloomCv.height = bh;
    }
    const b = this.bloomCtx;
    b.globalCompositeOperation = "source-over";
    b.clearRect(0, 0, bw, bh);
    b.drawImage(canvas, 0, 0, bw, bh);
    // square it against the same source, never against itself
    b.globalCompositeOperation = "multiply";
    b.drawImage(canvas, 0, 0, bw, bh);
    b.globalCompositeOperation = "source-over";
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = amount;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.bloomCv, 0, 0, w, h);
    ctx.restore();
  },

  /** Red/blue separation. Used on heavy impacts, supers and KOs. */
  chroma(ctx, canvas, w, h, amount) {
    if (amount <= 0.02) return;
    const shift = amount * 7;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.3 * amount;
    ctx.drawImage(canvas, -shift, 0);
    ctx.drawImage(canvas, shift, 0);
    ctx.restore();
  },

  vignette(ctx, w, h, amount) {
    const q = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.34,
                                       w / 2, h / 2, Math.max(w, h) * 0.76);
    q.addColorStop(0, "rgba(0,0,0,0)");
    q.addColorStop(1, "rgba(0,0,8," + amount + ")");
    ctx.fillStyle = q;
    ctx.fillRect(0, 0, w, h);
  },

  /** The whole pass, in screen space. Call after the world, before the HUD. */
  post(ctx, canvas, w, h) {
    const q = Settings.get("postFx");
    if (q <= 0) return;
    this.chroma(ctx, canvas, w, h, FX.chroma * q);
    this.bloom(ctx, canvas, w, h, 0.62 * q);
    if (FX.flashAmt > 0.01) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.7, FX.flashAmt);
      ctx.fillStyle = FX.flashCol || "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }
    this.vignette(ctx, w, h, 0.5 * q);
  },
};

/* ==========================================================================
   4. INPUT — rebindable keyboard, gamepads, and persisted settings
   ========================================================================== */

/* Every bindable action, in the order the controls table lists them. */
const ACTIONS = [
  { id: "left",    name: "Move Left",      desc: "Walk / run left. Also steers your launch while in hitstun." },
  { id: "right",   name: "Move Right",     desc: "Walk / run right." },
  { id: "up",      name: "Jump",           desc: "Tap on the ground to jump, again in the air to double jump." },
  { id: "down",    name: "Crouch / Drop",  desc: "Drop through a soft platform. In the air, fast-fall." },
  { id: "light",   name: "Light Attack",   desc: "Fast, low commitment. Your bread and butter at low damage." },
  { id: "heavy",   name: "Heavy Attack",   desc: "Slow smash with big knockback. This is what closes stocks." },
  { id: "special", name: "Special",        desc: "Your signature move. Every fighter's special works differently." },
  { id: "super",   name: "Super",          desc: "Costs a full meter. One huge, character-defining move." },
  { id: "shield",  name: "Shield",         desc: "Hold to block. With a direction, roll. With down, spot dodge. In air, air dodge." },
  { id: "grab",    name: "Grab",           desc: "Beats shields. Then press a direction to throw, or Light to pummel." },
];
const BUTTONS = ACTIONS.map(a => a.id);
// the buttons a fighter remembers if pressed a moment too early (Fighter.buffered)
const BUFFERED = ["light", "heavy", "special", "super", "grab"];

/* Factory defaults. P1/P2 on the keyboard halves, P3 on the numpad,
   P4 on the number row. All of it is rebindable in the Controls screen. */
const DEFAULT_BINDS = [
  { left: "KeyA", right: "KeyD", up: "KeyW", down: "KeyS",
    light: "KeyF", heavy: "KeyG", special: "KeyH", super: "KeyR",
    shield: "KeyQ", grab: "KeyE" },
  { left: "ArrowLeft", right: "ArrowRight", up: "ArrowUp", down: "ArrowDown",
    light: "KeyK", heavy: "KeyL", special: "Semicolon", super: "Quote",
    shield: "KeyO", grab: "KeyP" },
  { left: "Numpad4", right: "Numpad6", up: "Numpad8", down: "Numpad5",
    light: "Numpad7", heavy: "Numpad9", special: "NumpadAdd", super: "NumpadEnter",
    shield: "NumpadSubtract", grab: "NumpadMultiply" },
  { left: "Digit4", right: "Digit6", up: "Digit8", down: "Digit5",
    light: "Digit7", heavy: "Digit9", special: "Digit0", super: "Minus",
    shield: "Digit1", grab: "Digit3" },
];

/* -------------------------------------------------------------- settings */
const Settings = {
  data: Object.assign({}, CFG.defaults),
  binds: DEFAULT_BINDS.map(b => Object.assign({}, b)),

  load() {
    try {
      const raw = localStorage.getItem("cmb_settings");
      if (raw) {
        const o = JSON.parse(raw);
        if (o && o.data) Object.assign(this.data, o.data);
        if (o && Array.isArray(o.binds)) {
          o.binds.forEach((b, i) => { if (b && this.binds[i]) Object.assign(this.binds[i], b); });
        }
      }
    } catch (e) { /* private window or blocked storage — defaults are fine */ }
  },
  save() {
    try {
      localStorage.setItem("cmb_settings", JSON.stringify({ data: this.data, binds: this.binds }));
    } catch (e) { /* non-fatal */ }
  },
  get(k) { return this.data[k]; },
  set(k, v) { this.data[k] = v; this.save(); },
  toggle(k) { this.data[k] = !this.data[k]; this.save(); return this.data[k]; },

  resetBinds() {
    this.binds = DEFAULT_BINDS.map(b => Object.assign({}, b));
    this.save();
  },
  /** Returns the [player, action] already using a code, or null. */
  conflict(code, player, action) {
    for (let p = 0; p < this.binds.length; p++)
      for (const a of BUTTONS)
        if (this.binds[p][a] === code && !(p === player && a === action)) return [p, a];
    return null;
  },
  bind(player, action, code) {
    const c = this.conflict(code, player, action);
    if (c) this.binds[c[0]][c[1]] = null;   // a key can only drive one action
    this.binds[player][action] = code;
    this.save();
  },
};

/** Turn a KeyboardEvent.code into something a human can read on a key cap. */
function keyLabel(code) {
  if (!code) return "—";
  const map = {
    ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓",
    Space: "SPACE", Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/",
    Backslash: "\\", BracketLeft: "[", BracketRight: "]", Minus: "-", Equal: "=",
    Backquote: "`", Enter: "ENTER", ShiftLeft: "L SHIFT", ShiftRight: "R SHIFT",
    ControlLeft: "L CTRL", ControlRight: "R CTRL", AltLeft: "L ALT", AltRight: "R ALT",
    Tab: "TAB", Backspace: "BKSP", CapsLock: "CAPS",
    NumpadAdd: "NUM +", NumpadSubtract: "NUM -", NumpadMultiply: "NUM *",
    NumpadDivide: "NUM /", NumpadDecimal: "NUM .", NumpadEnter: "NUM ⏎",
  };
  if (map[code]) return map[code];
  if (code.startsWith("Key")) return code.slice(3);
  if (code.startsWith("Digit")) return code.slice(5);
  if (code.startsWith("Numpad")) return "NUM " + code.slice(6);
  if (code.startsWith("F") && code.length <= 3) return code;
  return code.toUpperCase();
}

/* ------------------------------------------------------------- raw keys */
const Keys = {
  down: Object.create(null),
  pressed: Object.create(null),
  /* Keys pressed since the last simulation step, even if already released.
     Fighters read this as well as `down`, so a tap shorter than one frame —
     or one that lands between two frames on a 30Hz tab — still counts. */
  tapped: Object.create(null),
  capture: null,          // set to a callback while the Controls screen listens
};

addEventListener("keydown", e => {
  if (Keys.capture) {                      // rebinding: swallow the key
    e.preventDefault();
    const cb = Keys.capture; Keys.capture = null;
    cb(e.code);
    return;
  }
  if (!Keys.down[e.code]) { Keys.pressed[e.code] = true; Keys.tapped[e.code] = true; }
  Keys.down[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab", "Quote", "Slash"].includes(e.code))
    e.preventDefault();
  Snd.init(); Snd.resume();
});
addEventListener("keyup", e => { Keys.down[e.code] = false; });
addEventListener("blur", () => { Keys.down = Object.create(null); });

/* ------------------------------------------------------- per-player pad */
class Pad {
  constructor(slot) {
    this.slot = slot;
    this.cur = {}; this.prev = {};
    BUTTONS.forEach(b => { this.cur[b] = false; this.prev[b] = false; });
    this.ax = 0; this.ay = 0;
    this.hasGamepad = false;
  }
  poll() {
    const m = Settings.binds[this.slot];
    this.prev = Object.assign({}, this.cur);
    for (const b of BUTTONS) this.cur[b] = m[b] ? !!(Keys.down[m[b]] || Keys.tapped[m[b]]) : false;

    const gps = navigator.getGamepads ? navigator.getGamepads() : null;
    const gp = gps && gps[this.slot];
    if (gp && gp.connected) {
      const a = gp.axes, bt = gp.buttons, dz = 0.35;
      const B = i => bt[i] && bt[i].pressed;
      if ((a[0] || 0) < -dz || B(14)) this.cur.left = true;
      if ((a[0] || 0) > dz || B(15)) this.cur.right = true;
      if ((a[1] || 0) < -dz || B(12)) this.cur.up = true;
      if ((a[1] || 0) > dz || B(13)) this.cur.down = true;
      if (B(0)) this.cur.up = true;
      if (B(2)) this.cur.light = true;
      if (B(3)) this.cur.heavy = true;
      if (B(1)) this.cur.special = true;
      if (B(5) || B(7)) this.cur.shield = true;
      if (B(4) || B(6)) this.cur.grab = true;
      if (B(9)) this.cur.super = true;
      this.hasGamepad = true;
    } else this.hasGamepad = false;

    this.ax = (this.cur.right ? 1 : 0) - (this.cur.left ? 1 : 0);
    this.ay = (this.cur.down ? 1 : 0) - (this.cur.up ? 1 : 0);
  }
  held(b) { return this.cur[b]; }
  hit(b) { return this.cur[b] && !this.prev[b]; }
  released(b) { return !this.cur[b] && this.prev[b]; }
}

/* ------------------------------------------------------------- pointer */
const Mouse = { x: 0, y: 0, click: false, down: false, wheel: 0 };


/* ===== src/04_roster.js ===== */
/* ==========================================================================
   5. ROSTER — the original fighters, each with their own art and moveset
              (the newer ones live in 04a_newcomers.js)

   Every character owns:
     stats    weight / speed / jump, which also decide how far they fly and recover
     moves    light, heavy, special and super — none of them shared templates
     draw()   a bespoke silhouette, not one body in four colours

   Move frame data:
     startup/active/recovery  frames
     dmg/base/scale/angle     knockback maths (angle in degrees, 0 = straight out)
     ox/oy/r                  hitbox offset from the fighter's centre, radius
     hits/hitGap              optional multi-hit
     onStart(f) / tick(f,a)   optional behaviour hooks
   ========================================================================== */

/* ---------- shared drawing kit (local space: origin = fighter centre,
               already flipped so +x is always "forward")

   Three things make a flat canvas shape read as a character, and every
   fighter below uses all three:

     ink        a dark outline on every silhouette, so the art survives both
                the neon Pivot Yard and the near-white Cirrus Drift sky
     volume     a vertical gradient per plate — lit at the top, falling to
                shadow at the bottom — instead of one flat fill
     rim        a bright inner edge along the top, implying a single light
                source above and in front of the whole roster
   ---------- */

const INK = "#0a0613";          // the one outline colour, shared by all four

/** Mid tone between a fighter's body and shadow colours. Forearms and the
    hand that holds a weapon use this: pure shadow colour made them vanish on
    a dark stage and the weapon looked like it was floating alongside. */
function mid_(col, darkCol) { return mixColor(col, darkCol, 0.42); }

/** Build a path, outline it in ink, then fill — the base of every plate. */
function ink(g, pathFn, fill, w) {
  pathFn();
  if (w !== 0) {
    g.strokeStyle = INK; g.lineWidth = w || 3.2;
    g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
  }
  g.fillStyle = fill; g.fill();
}

/** Top-lit vertical gradient for a plate spanning y0..y1.

   Cached: a gradient's stops are fixed in *local* space and every fighter is
   drawn in its own local space, so the same object is valid every frame. Without
   this, four fighters rebuilt ~40 gradients per frame for no reason. */
const _volCache = new Map();
function vol(g, y0, y1, col, up, down) {
  const key = y0 + "|" + y1 + "|" + col + "|" + up + "|" + down;
  let q = _volCache.get(key);
  if (q) return q;
  q = g.createLinearGradient(0, y0, 0, y1);
  q.addColorStop(0, shade(col, up === undefined ? 0.26 : up));
  q.addColorStop(0.55, col);
  q.addColorStop(1, shade(col, -(down === undefined ? 0.3 : down)));
  if (_volCache.size < 400) _volCache.set(key, q);
  return q;
}

/** Bright inner edge along a shape's top, clipped so it never leaks out. */
function rim(g, pathFn, col, w, a) {
  g.save();
  pathFn(); g.clip();
  g.translate(0.9, 2.2);                 // nudge down so only the top edge shows
  pathFn();
  g.strokeStyle = col; g.lineWidth = w || 3;
  g.lineJoin = "round"; g.globalAlpha = a === undefined ? 0.5 : a;
  g.stroke();
  g.restore();
}

/** Occlusion along a shape's bottom — the counterpart to rim(). */
function underShade(g, pathFn, a) {
  g.save();
  pathFn(); g.clip();
  g.translate(-0.6, -2.6);
  pathFn();
  g.strokeStyle = INK; g.lineWidth = 3.4; g.lineJoin = "round";
  g.globalAlpha = a === undefined ? 0.3 : a;
  g.stroke();
  g.restore();
}

/** A plate in one call: ink + volume + rim. pts is a flat [x,y,...] list. */
function plate(g, pts, col, opts) {
  const o = opts || {};
  let y0 = Infinity, y1 = -Infinity;
  for (let i = 1; i < pts.length; i += 2) { if (pts[i] < y0) y0 = pts[i]; if (pts[i] > y1) y1 = pts[i]; }
  const path = () => poly(g, pts);
  ink(g, path, o.flat ? col : vol(g, y0, y1, col, o.up, o.down), o.ink);
  if (o.rim !== false) rim(g, path, o.rimCol || "#ffffff", o.rimW, o.rimA);
  if (o.under) underShade(g, path, o.underA);
}

/** Same, for a rounded box. */
function plateRect(g, x, y, w, h, r, col, opts) {
  const o = opts || {};
  const path = () => roundRect(g, x, y, w, h, r);
  ink(g, path, o.flat ? col : vol(g, y, y + h, col, o.up, o.down), o.ink);
  if (o.rim !== false) rim(g, path, o.rimCol || "#ffffff", o.rimW, o.rimA);
  if (o.under) underShade(g, path, o.underA);
}

/** Limb drawn as an inked capsule so it reads as a solid arm, not a stroke. */
function limb(g, x1, y1, x2, y2, w, col) {
  const path = () => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); };
  path(); g.strokeStyle = INK; g.lineWidth = w + 2.6; g.lineCap = "round"; g.stroke();
  path(); g.strokeStyle = col; g.lineWidth = w; g.stroke();
  // highlight down the upper length of the limb
  path(); g.strokeStyle = hexA("#ffffff", 0.22); g.lineWidth = w * 0.3;
  g.save(); g.translate(0, -w * 0.26); g.stroke(); g.restore();
}

function jointLimb(g, x1, y1, x2, y2, bend, w, col) {
  const mx = (x1 + x2) / 2 + bend, my = (y1 + y2) / 2;
  const path = () => {
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(mx, my); g.lineTo(x2, y2);
  };
  path(); g.strokeStyle = INK; g.lineWidth = w + 2.6;
  g.lineCap = "round"; g.lineJoin = "round"; g.stroke();
  path(); g.strokeStyle = col; g.lineWidth = w; g.stroke();
  path(); g.strokeStyle = hexA("#ffffff", 0.2); g.lineWidth = w * 0.28;
  g.save(); g.translate(0, -w * 0.24); g.stroke(); g.restore();
  // a joint cap, so the elbow/knee reads as a pivot rather than a kink
  g.fillStyle = shade(col, -0.2);
  g.beginPath(); g.arc(mx, my, w * 0.42, 0, 7); g.fill();
}

function rivets(g, x, y, n, step, col) {
  for (let i = 0; i < n; i++) {
    const rx = x + i * step;
    g.fillStyle = hexA(INK, 0.55);
    g.beginPath(); g.arc(rx, y + 0.9, 1.7, 0, 7); g.fill();
    g.fillStyle = col;
    g.beginPath(); g.arc(rx, y, 1.5, 0, 7); g.fill();
  }
}

/** A lit lens/visor: dark socket, glowing core, a hot specular dot.
    Still uses shadowBlur rather than a glow sprite: a sprite has to be stamped
    at a point, and these shapes sit at arbitrary offsets inside each
    fighter's local transform, so a sprite would light the fighter's centre
    rather than the visor. There are only a handful per fighter. */
function lens(g, pathFn, col, glowCol, blur) {
  g.save();
  pathFn(); g.fillStyle = INK; g.fill();
  g.shadowColor = glowCol || col; g.shadowBlur = blur === undefined ? 14 : blur;
  pathFn(); g.fillStyle = col; g.fill();
  pathFn(); g.fillStyle = col; g.fill();     // twice: the glow stacks, the core burns
  g.restore();
}

/** Faint energy wash behind a fighter — sells "this thing is powered". */
function aura(g, x, y, r, col, a) {
  Light.draw(g, x, y, r, col, a === undefined ? 0.3 : a, 0.05);
}

/* Reach of a swing arm.

   This is keyed to the move's real frame data, not to its total duration. The
   old version split the swing at fixed fractions (0.3 / 0.5) of the whole
   animation, so a jab with 4 startup frames out of 17 reached full extension
   at a different moment than a smash with 14 out of 42 — on most moves the arm
   was still travelling while the hitbox was already live, and had started
   coming back before the hitbox closed. Now the arm is fully out on the exact
   frame the hitbox opens and holds there until it shuts, which is what makes
   the hit land where the eye expects it. */
function swing(A, back, out) {
  if (A.atkPhase < 0) return 0;
  const su = A.atkStartup || 1, ac = A.atkActive || 1;
  const tot = A.atkTotal || (su + ac), t = A.atkT || 0;

  if (t <= su) return lerp(0, back, easeOut(t / su));          // wind up

  if (t <= su + ac) {
    /* A multi-hit move pumps instead of extending once and holding: the arm is
       furthest out on each tap and draws back slightly between them, so a
       three-hit flurry looks like three strikes rather than one long reach. */
    const mv = A.move;
    if (mv && mv.hits > 1) {
      const gap = mv.hitGap || 4;
      const local = ((t - su - 1) % gap) / gap;
      return out * (1 - 0.4 * Math.sin(local * Math.PI));
    }
    // otherwise: snap out within a couple of frames, then hold for the hitbox
    const k = Math.min(1, (t - su) / Math.max(1, Math.min(ac, 2)));
    return lerp(back, out, easeOut(k));
  }
  const k = clamp((t - su - ac) / Math.max(1, tot - su - ac), 0, 1);
  return lerp(out, 0, ease(k));                                // follow through
}

/* ---------- attack VFX helpers, shared by every move ---------- */

/** Where a move's hitbox actually sits in the world. Effects are drawn there
    rather than at a hand-tuned offset, so they can never drift out of sync
    with what the move actually hits. */
function hbAt(f, m) {
  return { x: f.x + (m.ox || 0) * f.facing, y: f.y + (m.oy || 0) };
}
/** Forward direction as an angle, for arcs that sweep away from the fighter. */
function faceAng(f) { return f.facing > 0 ? 0 : Math.PI; }

    dmg: 17, base: 5.8, scale: 1.12, angle: 50, ox: 0, oy: 26, r: 104,
    onStart(f) { f.vy = -9; Snd.superCharge(); FX.flash("#ff2e88", 0.35); },
    tick(f, a) {
      const m = a.data;
      if (a.t < m.startup) { f.vx *= 0.8; f.vy = Math.max(f.vy, -9) + 0.35; FX.spark(f.x + rnd(-30, 30), f.y + rnd(-40, 40), f.ch.color); }
      if (a.t === m.startup) {
        a.floor = Stage.floorBelow(f.x, f.feetY);
        f.vy = a.floor !== null ? 32 : 3;             // the drop -- only if there is a floor
        f.vx = 0;
        FX.flash("#ffffff", 0.5);
      }
      if (a.t > m.startup && !a.landed && (f.grounded || a.t >= m.startup + 12)) {
        a.landed = true;
        Snd.superHit(); FX.shake(34); FX.hitPause(14);
        FX.ring(f.x, f.feetY, 20, 520, "#ffffff", 5);
        FX.ring(f.x, f.feetY, 10, 340, f.ch.color, 4);
        FX.burst(f.x, f.feetY, 46, f.ch.color, 13);
        FX.blade(f.x, f.feetY - 10, 0, 40, 260, 6.28, "#ffffff", { w: 16, life: 20 });
        FX.glyph(f.x, f.feetY - 60, "wedge", 44, f.ch.accent, 26);
        if (f.grounded && f.groundSeg) {
          const plat = f.groundSeg.local;
          FX.crack(f.x, f.feetY - 2, 1, 90, "#ffffff", 5);
          FX.crack(f.x, f.feetY - 2, -1, 90, "#ffffff", 5);

          Entities.shockwave(f, f.x, f.feetY, 1, m, plat);

  /* ---- art: industrial slab. Everything about him is wider at the top than
           the bottom, so he reads as top-heavy even standing still. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const sw = swing(A, -10, 46);
    const body = A.flash ? "#ffffff" : c;
    const dark = A.flash ? "#ffb9d4" : c2;
    const deep = A.flash ? "#ff8dbb" : c3;
    const wind = A.atkPhase >= 0 && A.atkPhase < 0.3;   // winding up

    // heat haze in the vents when he's about to swing
    if (wind) aura(g, 0, 4, 44, c, 0.22);

    /* --- legs: short, thick, braced wide; boots are slabs --- */
    const st = Math.sin(A.runPhase) * (A.running ? 9 : 0);
    const kneeL = A.air ? 5 : 0;
    jointLimb(g, -8, 10, -12 + st, 27 - kneeL, -3.5, 11, dark);
    jointLimb(g, 9, 10, 13 - st, 27 - kneeL, 3.5, 11, dark);
    // knee guards
    plate(g, [-17 + st * 0.5, 14, -7 + st * 0.5, 13, -7 + st * 0.5, 21, -17 + st * 0.5, 21], deep, { rimA: 0.3 });
    plate(g, [7 - st * 0.5, 13, 17 - st * 0.5, 14, 17 - st * 0.5, 21, 7 - st * 0.5, 21], deep, { rimA: 0.3 });
    // boots, with a toe cap that catches the light
    plateRect(g, -21 + st * 0.6, 25 - kneeL, 17, 9, 2.5, deep, { up: 0.18 });
    plateRect(g, 4 - st * 0.6, 25 - kneeL, 17, 9, 2.5, deep, { up: 0.18 });
    g.fillStyle = hexA(ac, 0.5);
    g.fillRect(-21 + st * 0.6, 25 - kneeL, 17, 1.6);
    g.fillRect(4 - st * 0.6, 25 - kneeL, 17, 1.6);

    /* --- torso: wide shoulders tapering hard to a narrow waist --- */
    plate(g, [-22, -16, 22, -16, 15, 13, -15, 13], body, { up: 0.3, down: 0.36, under: true });
    // sunken chest plate
    plate(g, [-16, -12, 16, -12, 12, 2, -12, 2], dark, { up: 0.14, down: 0.34, rimA: 0.26 });
    rivets(g, -12, -9, 7, 4, ac);
    // exhaust vents, lit from inside — gives the slab an interior
    for (let i = 0; i < 3; i++) {
      const vy = -6 + i * 3.4;
      g.fillStyle = INK; g.fillRect(-9, vy, 18, 2.2);
      g.fillStyle = hexA(c, wind ? 0.9 : 0.4); g.fillRect(-9, vy, 18, 1.2);
    }
    // waist belt with a buckle
    plateRect(g, -15, 3, 30, 6, 1.5, deep, { up: 0.1 });
    plate(g, [-5, 2, 5, 2, 4, 10, -4, 10], ac, { flat: true, ink: 2, rim: false });

    /* --- head: raised clear of the shoulders so he actually has one --- */
    // neck piston, drawn before the head
    plateRect(g, -5, -24, 10, 8, 2, deep, { up: 0.1, rim: false });
    plateRect(g, -10.5, -40, 21, 18, 5, body, { up: 0.32, down: 0.3 });
    // jaw grille
    g.fillStyle = INK; roundRect(g, -8.5, -27, 17, 4.5, 1.5); g.fill();
    g.strokeStyle = hexA(ac, 0.4); g.lineWidth = 1;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(-6 + i * 4, -27); g.lineTo(-6 + i * 4, -22.5); g.stroke(); }
    // visor socket, then the lit slit inside it
    g.fillStyle = INK; roundRect(g, -11, -36, 22, 8, 2.5); g.fill();
    lens(g, () => roundRect(g, -3, -35, 12, 5.4, 2.4), A.flash ? "#ffffff" : ac, c, 15);
    // brow crest, above the skull rather than over the visor
    plate(g, [-11, -39, 11, -39, 9, -43, -8, -43], deep, { up: 0.24, rim: false });

    /* --- pauldrons: narrower and lower, so they frame the head
           instead of swallowing it --- */
    plate(g, [-26, -17, -9, -21, -7, -6, -24, -4], body, { up: 0.38, down: 0.3 });
    plate(g, [26, -17, 9, -21, 7, -6, 24, -4], body, { up: 0.4, down: 0.28 });
    // ridges on the forward pauldron
    g.strokeStyle = hexA(INK, 0.45); g.lineWidth = 1.6;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(11 + i * 5, -20 + i * 0.6); g.lineTo(9 + i * 5, -6); g.stroke();
    }
    plate(g, [24, -16, 13, -19, 12, -13, 23, -11], dark, { up: 0.2, rimA: 0.4 });

    /* --- arms: a thick body-coloured forearm, so the anvil reads as held
           rather than floating next to him --- */
    const ax = 18 + sw, ay = -4 + (A.atkPhase >= 0 ? -3 : 0);
    // back arm first so the front one overlaps it
    jointLimb(g, -15, -11, -20 - (A.running ? st * 0.4 : 0), 2, -3.5, 9, dark);
    plateRect(g, -25, -2, 10, 10, 4.5, deep, { up: 0.14, rim: false });
    // upper arm in shadow, forearm in body colour and much thicker
    jointLimb(g, 15, -11, (15 + ax) / 2, ay - 1, 2, 10, dark);
    limb(g, (15 + ax) / 2, ay - 1, ax - 3, ay, 12, mid_(c, c2));
    // elbow/shoulder caps tie the limb to the torso
    g.fillStyle = shade(body, -0.1); g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.arc(15, -11, 5.5, 0, 7); g.stroke(); g.fill();

    /* The anvil. Shaped like one on purpose: narrow at the wrist, flaring to
       a flat face, with a horn off the back — as a plain bright rectangle it
       read as a briefcase he was carrying. */
    g.save(); g.translate(ax, ay);
    // wrist cuff, dark, so the head of the anvil starts somewhere
    plateRect(g, -12, -6, 9, 12, 2.5, deep, { up: 0.12, rim: false });
    // the horn, behind the head
    plate(g, [-4, -5, -12, -1, -4, 3], dark, { up: 0.2, ink: 2.4, rim: false });
    // the head: waisted, flaring forward
    plate(g, [-4, -11, 9, -13, 15, -10, 15, 8, 9, 11, -4, 9], dark,
          { up: 0.3, down: 0.34, under: true });
    // the striking face only — the one bright surface, kept thin
    plate(g, [12, -10, 15, -9.5, 15, 7.5, 12, 8], ac, { up: 0.1, down: 0.2, ink: 2.2 });
    // a seam line, not a pair of bright rivets -- two dots on the anvil read
    // as eyes and turned the weapon into a face
    g.strokeStyle = hexA(INK, 0.5); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(1, -9); g.lineTo(1, 7); g.stroke();
    g.restore();
  },
},

{

  /* A lance: one long narrow spike along the dash, not a sweep. */
  heavy: { name: "Volt Lance", startup: 11, active: 4, recovery: 24,

  special: { name: "Polarity Flip", startup: 4, active: 12, recovery: 12,

    onStart(f) { f.vx = f.facing * 15; f.vy *= 0.2; },
    tick(f, a) {

      if (a.t === m.startup + 1 && !a.fired) {

        for (let i = 0; i < 4; i++)

  super: { name: "Lightspeed Gauntlet",
    desc: "Becomes a line of afterimages. Eight strikes on whoever is closest, then a launcher.",
    startup: 14, active: 42, recovery: 32,
    dmg: 2.5, base: 1.0, scale: 0.20, angle: 60, ox: 0, oy: -6, r: 36,
    onStart(f) { Snd.superCharge(); FX.flash("#00e5ff", 0.3); f.vy = -3; },
    tick(f, a) {
      const m = a.data;
      if (a.t < m.startup) { f.vx *= 0.7; f.vy *= 0.7; FX.spark(f.x + rnd(-24, 24), f.y + rnd(-26, 26), f.ch.color); }
      if (a.t < m.startup || a.t > m.startup + m.active) return;

      const tgt = Combat.nearestFoe(f);
      if (!tgt) return;
      const step = a.t - m.startup;
      // teleport to a new angle around the target every 7 frames, and strike
      if (step % 7 === 0) {
        const n = step / 7;
        const ang = n * 2.3;

        f.y = tgt.y + Math.sin(ang) * rad * 0.6;
        f.vx = 0; f.vy = 0;
        f.facing = tgt.x >= f.x ? 1 : -1;
        a.hitIds = null;                     // each blink is a fresh hit
        FX.streak(f.x, f.y, tgt.x, tgt.y, f.ch.color);
        FX.burst(f.x, f.y, 6, f.ch.color, 4);

        FX.bolt(f.x, f.y, tgt.x, tgt.y, f.ch.accent, { segs: 4, jag: 10, life: 5, w: 2 });

      f.vx = 0; f.vy = 0;                    // frozen mid-super
      if (step === m.active - 1) {           // the finisher

  /* ---- art: every line rakes forward, and nothing on her is ever fully
           still — the ribbons and arc-coil keep moving at idle. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c;
    const dark = A.flash ? "#bfefff" : c2;
    const deep = A.flash ? "#9ee6ff" : c3;
    const sw = swing(A, -8, 40);
    const fast = Math.min(1, Math.abs(A.vx) / 5);

    aura(g, 0, -6, 34, c, 0.16 + fast * 0.14);

    /* --- trailing ribbons. Each is drawn segment by segment, thinning and
           fading toward the tail, so they read as streamers coming off her
           rather than one closed loop hanging behind like a wing. --- */
    g.save();
    g.globalCompositeOperation = "lighter";
    g.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const at = (s) => [
        -8 - s * (7 + fast * 6),
        -13 + i * 6.5 + Math.sin(A.time * 0.14 + s * 0.8 + i) * (3 + s * 1.4),
      ];
      for (let s = 0; s < 4; s++) {
        const [x1, y1] = at(s), [x2, y2] = at(s + 1);
        g.globalAlpha = (0.30 - i * 0.07) * (1 - s * 0.24);
        g.strokeStyle = c; g.lineWidth = (2.6 - i * 0.5) * (1 - s * 0.2);
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      }
    }
    g.restore();

    /* --- arc-coil on her back: two beads chasing each other --- */
    g.save();
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(c, 0.5); g.lineWidth = 1.6;
    g.beginPath(); g.arc(-7, -8, 9, -0.6, 2.4); g.stroke();
    for (let i = 0; i < 2; i++) {
      const an = -0.6 + ((A.time * 0.07 + i * 1.5) % 3.0);
      g.fillStyle = ac; g.shadowColor = c; g.shadowBlur = 10;
      g.beginPath(); g.arc(-7 + Math.cos(an) * 9, -8 + Math.sin(an) * 9, 2, 0, 7); g.fill();
    }
    g.restore();

    /* --- legs: long, thin, sprinter's blade feet --- */
    const st = Math.sin(A.runPhase) * (A.running ? 14 : 0);
    jointLimb(g, -4, 8, -7 + st, 24, -4.5, 5.5, dark);
    jointLimb(g, 5, 8, 8 - st, 24, 4.5, 5.5, dark);
    plate(g, [-12 + st, 22, -2 + st, 22, -5 + st, 28], ac, { up: 0.1, ink: 2.2, rim: false });
    plate(g, [3 - st, 22, 13 - st, 22, 10 - st, 28], ac, { up: 0.1, ink: 2.2, rim: false });

    /* --- torso: narrow wedge, raked harder the faster she goes --- */
    g.save(); g.rotate(A.running ? 0.12 : 0.05 + Math.sin(A.time * 0.06) * 0.015);
    plate(g, [-10, -14, 12, -16, 9, 10, -8, 9], body, { up: 0.3, down: 0.34, under: true });
    plate(g, [-7, -11, 9, -12, 7, 0, -6, 0], dark, { up: 0.12, down: 0.3, rimA: 0.3 });
    // shoulder flare
    plate(g, [4, -16, 14, -17, 13, -10, 5, -11], body, { up: 0.4, rimA: 0.6 });
    // lightning emblem, burning
    lens(g, () => poly(g, [2, -10, -3, -2, 1, -2, -3, 6, 5, -3, 1, -3]), ac, c, 12);
    // thin circuit traces on the flank
    g.strokeStyle = hexA(ac, 0.35); g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(-6, 2); g.lineTo(-2, 2); g.lineTo(-2, 7); g.lineTo(5, 7); g.stroke();
    g.restore();

    /* --- neck, so the helmet doesn't sit straight on the chest --- */
    plateRect(g, -3, -20, 6.5, 6, 2, dark, { up: 0.1, rim: false });

    /* --- head: swept wedge helmet, smaller than it was — it was reading as
           a bobblehead at match scale --- */
    g.save(); g.translate(1, -24); g.rotate(0.06);
    plate(g, [-8, -6, 7, -8, 10.5, 2, -7, 5.5], body, { up: 0.34, down: 0.3 });
    // swept back fin
    plate(g, [-7, -5, -16, -1.5, -7, 3.5], dark, { up: 0.2, ink: 2.4, rimA: 0.4 });
    // jaw shadow under the visor
    g.fillStyle = hexA(INK, 0.45); poly(g, [-6, 1.5, 10, 1.5, 9, 4.5, -6, 4.5]); g.fill();
    lens(g, () => poly(g, [-1.5, -4, 9.5, -2, 9.5, 1.6, -2.5, 0.8]),
         A.flash ? "#ff2e88" : ac, c, 14);
    // crest spark
    g.fillStyle = hexA(ac, 0.6); poly(g, [-2, -7, 3.5, -8, 1.5, -5.5]); g.fill();
    g.restore();

    /* --- arms: forearm in a mid tone so the glove reads as held --- */
    jointLimb(g, -7, -10, -14 - (A.running ? st * 0.3 : 0), -1, -3.5, 5, dark);
    g.fillStyle = dark; g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.arc(-15, 0, 4.2, 0, 7); g.stroke(); g.fill();

    const ax = 14 + sw, ay = -6;
    jointLimb(g, 8, -10, (8 + ax) / 2, ay - 1, 2.5, 5.5, dark);
    limb(g, (8 + ax) / 2, ay - 1, ax - 2, ay, 6.5, mid_(c, c2));
    g.fillStyle = shade(body, -0.1); g.strokeStyle = INK; g.lineWidth = 1.8;
    g.beginPath(); g.arc(8, -10, 4, 0, 7); g.stroke(); g.fill();
    const hot = A.atkPhase >= 0;
    if (hot) {
      // crackle arcs off the glove mid-swing
      g.save(); g.globalCompositeOperation = "lighter";
      g.strokeStyle = hexA(ac, 0.75); g.lineWidth = 1.4;
      for (let i = 0; i < 3; i++) {
        const a0 = A.time * 0.5 + i * 2.1;
        g.beginPath(); g.moveTo(ax, ay);
        g.lineTo(ax + Math.cos(a0) * 11, ay + Math.sin(a0) * 11);
        g.stroke();
      }
      g.restore();
    }
    // the arc glove: a cyan core, not a white ball
    g.fillStyle = INK; g.beginPath(); g.arc(ax, ay, 4.6, 0, 7); g.fill();
    lens(g, () => { g.beginPath(); g.arc(ax, ay, 3.4, 0, 7); }, c, c, hot ? 20 : 9);
    g.fillStyle = hexA(ac, 0.9);
    g.beginPath(); g.arc(ax - 1, ay - 1.2, 1.3, 0, 7); g.fill();
  },
},

  /* ---- art: the only symmetrical fighter. No legs — a hovering keel, so
           it reads as machinery holding itself level on purpose. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c;
    const dark = A.flash ? "#e4ffb9" : c2;
    const deep = A.flash ? "#cdf58d" : c3;
    const sw = swing(A, -8, 40);
    const spin = A.time * 0.05;
    const bob = Math.sin(A.time * 0.045) * 1.6;      // it never quite touches down

    aura(g, 0, -4, 34, c, 0.1);

    g.save(); g.translate(0, bob);

    /* --- halo: sits low around the hips, not through the arms, where its
           beads were being misread as a second pair of hands --- */
    const ringR = 29, tiltY = 0.34, ringY = 12;
    const ringPath = (a0, a1) => {
      g.beginPath(); g.ellipse(0, ringY, ringR, ringR * tiltY, 0.18, a0, a1);
    };
    g.save();
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(c, 0.4); g.lineWidth = 3.4;
    ringPath(Math.PI, Math.PI * 2); g.stroke();
    g.restore();

    /* --- keel skirt: a hull, with thruster slots in the underside --- */
    const sway = Math.sin(A.runPhase * 0.5) * (A.running ? 3 : 1);
    plate(g, [-10, 2, 10, 2, 15 + sway, 26, -15 + sway, 26], dark, { up: 0.18, down: 0.4, under: true });
    plate(g, [-13 + sway, 21, 13 + sway, 21, 15 + sway, 26, -15 + sway, 26], deep, { up: 0.12, rimA: 0.3 });
    // the keel fin, lit along its spine
    g.strokeStyle = hexA(ac, 0.55); g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(0, 3); g.lineTo(sway, 25); g.stroke();
    // thruster glow beneath — brighter while airborne
    // (kept in the body colour and soft-edged — in the bright accent these
    //  read as a row of white teeth under the skirt)
    g.save(); g.globalCompositeOperation = "lighter";
    const flen = A.air ? 14 : 5;
    for (let i = -1; i <= 1; i++) {
      const q = g.createLinearGradient(0, 24, 0, 24 + flen);
      q.addColorStop(0, hexA(c, A.air ? 0.5 : 0.28)); q.addColorStop(1, hexA(c, 0));
      g.fillStyle = q;
      g.beginPath();
      g.moveTo(i * 7 - 2.4 + sway, 24); g.lineTo(i * 7 + 2.4 + sway, 24);
      g.lineTo(i * 7 + sway, 24 + flen);
      g.closePath(); g.fill();
    }
    g.restore();

    /* --- torso: a smooth capsule with a seam and a core gem --- */
    plateRect(g, -14, -16, 28, 22, 10, body, { up: 0.3, down: 0.36, under: true });
    plateRect(g, -10, -12, 20, 14, 7, dark, { up: 0.12, down: 0.3, rimA: 0.28 });
    // panel seam across the chest
    g.strokeStyle = hexA(INK, 0.4); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(-13, -2); g.lineTo(13, -2); g.stroke();
    // the core, with a bright ring around it
    g.strokeStyle = hexA(ac, 0.45); g.lineWidth = 1.3;
    g.beginPath(); g.arc(0, -5, 7, 0, 7); g.stroke();
    lens(g, () => { g.beginPath(); g.arc(0, -5, 4.6, 0, 7); }, ac, c, 16);

    /* --- arms: back then front, with ring-cutter emitters for hands --- */
    jointLimb(g, -11, -12, -17, -2, -3.5, 6.5, dark);
    plateRect(g, -22, -7, 10, 10, 5, body, { up: 0.26 });
    const ax = 16 + sw, ay = -8;
    jointLimb(g, 11, -12, (11 + ax) / 2, ay - 1, 2.5, 7, dark);
    limb(g, (11 + ax) / 2, ay - 1, ax - 2, ay, 8, mid_(c, c2));
    g.fillStyle = shade(body, -0.1); g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.arc(11, -12, 4.6, 0, 7); g.stroke(); g.fill();
    g.save(); g.translate(ax, ay);
    plateRect(g, -5.5, -5.5, 11, 11, 5.5, body, { up: 0.3 });
    // the emitter disc spins, and flares during an attack
    g.save(); g.rotate(spin * 3);
    g.strokeStyle = hexA(ac, A.atkPhase >= 0 ? 0.95 : 0.5);
    g.lineWidth = 1.6; g.shadowColor = c; g.shadowBlur = A.atkPhase >= 0 ? 14 : 5;
    g.beginPath(); g.arc(0, 0, 7.5, 0.4, 2.6); g.stroke();
    g.beginPath(); g.arc(0, 0, 7.5, 3.6, 5.8); g.stroke();
    g.restore();
    g.restore();

    /* --- head: smooth dome, wide sensor band, antenna --- */
    // antenna first, behind the dome
    limb(g, 0, -34, 2, -42, 2.2, dark);
    g.fillStyle = ac; g.shadowColor = c; g.shadowBlur = 8;
    g.beginPath(); g.arc(2, -43, 2.1, 0, 7); g.fill(); g.shadowBlur = 0;

    const domePath = () => { g.beginPath(); g.arc(0, -27, 11.5, 0, 7); };
    ink(g, domePath, vol(g, -38, -16, body, 0.32, 0.3));
    rim(g, domePath, "#ffffff", 3, 0.55);
    // sensor band, sunk into the dome
    g.fillStyle = INK; roundRect(g, -12, -30.5, 24, 8, 3.5); g.fill();
    lens(g, () => roundRect(g, -7.5, -29.5, 15, 5, 2.5),
         A.flash ? "#ff2e88" : ac, c, 14);
    // two small status pips on the cheek
    g.fillStyle = hexA(ac, 0.55);
    g.beginPath(); g.arc(-6, -20.5, 1.2, 0, 7); g.fill();
    g.beginPath(); g.arc(-2, -20.5, 1.2, 0, 7); g.fill();

    /* --- front half of the halo + beads, over everything --- */
    g.save();
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = hexA(c, 0.9); g.lineWidth = 3.4;
    ringPath(0, Math.PI); g.stroke();
    g.strokeStyle = hexA("#ffffff", 0.35); g.lineWidth = 1.2;
    ringPath(0, Math.PI); g.stroke();
    for (let i = 0; i < 2; i++) {
      const an = spin + i * Math.PI;
      const bx = Math.cos(an) * ringR, by = -2 + Math.sin(an) * ringR * tiltY;
      const front = Math.sin(an) > 0;                 // nearer beads are bigger
      g.fillStyle = ac; g.shadowColor = c; g.shadowBlur = 12;
      g.beginPath(); g.arc(bx, by, front ? 3.6 : 2.4, 0, 7); g.fill();
    }
    g.restore();

    g.restore();
  },
},

{

  color: "#ffc83d", color2: "#5e3c05", color3: "#2c1c02", accent: "#fff6dc",
  weight: 0.88, speed: 4.6, accel: 0.9, jump: 12.4, airSpeed: 4.5, fallMul: 0.96,

  /* A fan, so the effect is three thin leaves opening at once. */
  light: { name: "Fan Slice", startup: 3, active: 3, recovery: 9,

                 i === 1 ? f.ch.accent : f.ch.color, { w: 6.5, life: 10 + i, core: i === 1 });
      }
      Snd.tone(1100, 0.04, "triangle", 0.07, 1700);
    } },

  /* A crescent plus a balance stamped on the victim — her whole kit still
     reads as "the scale" even with the stage itself no longer tilting. */
  heavy: { name: "Scale Breaker", startup: 13, active: 4, recovery: 26,
    dmg: 13.5, base: 4.0, scale: 1.0, angle: 44, ox: 48, oy: -8, r: 29,
    vfx(f) {
      const ang = faceAng(f);
      FX.blade(f.x + f.facing * 6, f.y - 8, ang - 0.85 * f.facing, 46, 82, 1.8, f.ch.color,

      FX.blade(f.x + f.facing * 6, f.y - 8, ang - 0.7 * f.facing, 42, 74, 1.5, f.ch.accent,
               { w: 5, life: 10, core: false, spin: f.facing * 0.07 });

    onHit(f, def) {

  /* Her whole kit used to be about cranking the stage over. With a deck that
     never tilts, the trick moved onto the fighters: she swaps places with
     them, and her super tips them off the stage instead of tipping the stage.

     Trade Places throws the lever out in a line that grows over the active
     frames. The first foe it reaches swaps positions with her outright. Used
     off-stage it is a recovery that strands someone else out there. */
  special: { name: "Trade Places", startup: 8, active: 12, recovery: 20,
    dmg: 4, base: 2.2, scale: 0.2, angle: 80, ox: 0, oy: 0, r: 0,
    reach: 290,
    desc: "Throws her lever out in a line. The first foe it catches swaps places with her and is left reeling — save yourself off-stage, or strand them there.",
    onStart(f) { f.vy = Math.min(f.vy, 0) * 0.3; Snd.tone(520, 0.12, "triangle", 0.1, 900); },
    tick(f, a) {
      const m = a.data;
      if (a.t <= m.startup) { f.vx *= 0.7; f.vy *= 0.7; return; }
      if (a.t > m.startup + m.active || a.caught) return;
      f.vx *= 0.6; f.vy *= 0.6;
      const reach = m.reach * (a.t - m.startup) / m.active;
      FX.streak(f.x + f.facing * 14, f.y - 8, f.x + f.facing * reach, f.y - 8, f.ch.color);
      if ((a.t - m.startup) % 4 === 0)
        FX.glyph(f.x + f.facing * reach, f.y - 8, "scale", 12, f.ch.accent, 10);

      let tgt = null, best = Infinity;
      for (const o of Combat.foes(f)) {
        const ahead = (o.x - f.x) * f.facing;
        if (ahead < 0 || ahead > reach + o.ch.hurt || Math.abs(o.y - f.y) > 44) continue;
        if (o.intangible() || o.state === ST.GRABBED) continue;
        if (ahead < best) { best = ahead; tgt = o; }
      }
      if (!tgt) return;
      a.caught = true;

      // a live counter answers the lever instead of being moved by it
      if (tgt.counter > 0) { tgt.applyKnockback(0, 0, 0, 0, f); return; }

      const fx0 = f.x, fy0 = f.y, tx0 = tgt.x, ty0 = tgt.y;
      FX.streak(fx0, fy0, tx0, ty0, f.ch.accent);
      FX.ring(fx0, fy0, 6, 70, f.ch.color, 3);
      FX.ring(tx0, ty0, 6, 70, f.ch.color, 3);
      f.x = f.px = tx0; f.y = f.py = ty0 + (tgt.h - f.h) * 0.5;
      tgt.x = tgt.px = fx0; tgt.y = tgt.py = fy0 + (f.h - tgt.h) * 0.5;
      f.vx = 0; f.vy = 0; f.grounded = false; f.groundSeg = null;
      f.facing = -f.facing;                        // now facing the foe she swapped with
      f.invuln = Math.max(f.invuln, 12);
      if (tgt.grabTarget) tgt.releaseGrab();
      tgt.attack = null; tgt.pinned = false;
      tgt.applyKnockback(0, -3.5, m.dmg, 8, f);    // left reeling where she was
      f.stats.damageDealt += m.dmg;
      f.addMeter(m.dmg * CFG.meter.onDeal);
      FX.glyph(f.x, f.y - 40, "scale", 22, f.ch.accent, 22);
      FX.banner("TRADE PLACES", f.ch.color);
      FX.shake(6);
      Snd.tone(880, 0.1, "square", 0.12, 440); Snd.tone(440, 0.14, "square", 0.1, 880, 0.06);
      a.t = m.startup + m.active;                   // straight into recovery
    } },

  /* The old Snap-Back, as a move. The stage used to tip and throw everyone
     off its low side; now she does it herself. Every foe in range is thrown
     outward, away from the middle of the stage -- toward whichever blast
     zone they were already nearest -- on a low, flat angle that kills. */
  super: { name: "Tipping Point",
    desc: "Slams her lever down and tips the world: every foe in range is thrown flat toward the edge of the stage they're already on.",
    startup: 18, active: 6, recovery: 32,
    dmg: 14, base: 6.6, scale: 1.12, angle: 22, ox: 0, oy: 0, r: 0,

    onStart(f) { Snd.superCharge(); FX.flash("#ffc83d", 0.3); },

      FX.ring(f.x, f.y, 20, m.radius, "#ffffff", 5);
      FX.ring(f.x, f.y, 10, m.radius * 0.8, f.ch.color, 4);
      FX.glyph(f.x, f.y - 80, "scale", 54, f.ch.accent, 30);
      Stage.flashT = 26;
      for (const o of Combat.foes(f)) {
        if (o.intangible() || dist(f.x, f.y, o.x, o.y) > m.radius) continue;
        const out = Math.sign(o.x - Stage.pivot.x) || (o.x >= f.x ? 1 : -1);
        Combat.land(f, o, m, o.x, o.y, 0, out);
        FX.streak(o.x, o.y, o.x + out * 160, o.y - 30, f.ch.accent);

  /* ---- art: deliberately lopsided — one huge gauntlet, one bare hand, a
           hood with no face in it. The scarf does the acting. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c;
    const dark = A.flash ? "#ffe9b4" : c2;
    const deep = A.flash ? "#ffd98a" : c3;
    const sw = swing(A, -9, 42);

    aura(g, 6, -8, 30, c, 0.14);

    /* --- scarf: two tails on offset sines, tapering to a point. Kept in the
           body colour rather than the shadow colour — in shadow brown it read
           as a pair of antlers instead of cloth, and it was wide enough to
           outweigh the character it belongs to. --- */
    const scarf = mid_(c, c2);
    for (let t = 0; t < 2; t++) {
      g.save();
      const spread = t === 0 ? 0 : 4;
      const seg = (s) => [
        -4 - s * 7.2 - Math.abs(A.vx) * 0.8 * s * 0.35,
        // trails DOWN behind her: curling upward made it read as a hook

      ];
      g.lineCap = "round"; g.lineJoin = "round";
      // taper: each segment drawn thinner than the last
      for (let s = 0; s < 5; s++) {
        const [x1, y1] = seg(s), [x2, y2] = seg(s + 1);
        const w = (t ? 4.2 : 6.0) * (1 - s * 0.19);
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
        g.strokeStyle = INK; g.lineWidth = w + 1.8; g.stroke();
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
        g.strokeStyle = t ? shade(scarf, -0.22) : scarf; g.lineWidth = w; g.stroke();
      }
      g.restore();
    }

    /* --- legs: thin, with wrapped shins --- */
    const st = Math.sin(A.runPhase) * (A.running ? 12 : 0);
    jointLimb(g, -5, 9, -9 + st, 25, -4.5, 6, dark);
    jointLimb(g, 6, 9, 10 - st, 25, 4.5, 6, dark);
    // shin wraps
    g.strokeStyle = hexA(deep, 0.85); g.lineWidth = 1.6;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(-12 + st, 15 + i * 3); g.lineTo(-6 + st, 14 + i * 3); g.stroke();
      g.beginPath(); g.moveTo(7 - st, 14 + i * 3); g.lineTo(13 - st, 15 + i * 3); g.stroke();
    }
    plateRect(g, -15 + st, 23, 12, 6, 2, deep, { up: 0.16 });
    plateRect(g, 4 - st, 23, 12, 6, 2, deep, { up: 0.16 });

    /* --- torso: slim wedge, a sash, and the balance-scale brand --- */
    plate(g, [-11, -15, 11, -15, 9, 11, -9, 11], body, { up: 0.3, down: 0.34, under: true });
    plate(g, [-8, -11, 8, -11, 6, 1, -6, 1], dark, { up: 0.12, down: 0.3, rimA: 0.28 });
    // sash across the body — asymmetry again
    plate(g, [-10, -4, 10, -13, 11, -8, -9, 1], mid_(c, c2), { up: 0.2, ink: 2.2, rimA: 0.35 });
    // The scale, tipped: one pan always hangs lower. Kept to three strokes —
    // with a centre post as well it turned into a scribble at match scale.
    const tip = Math.sin(A.time * 0.035) * 1.8;
    glow(g, ac, 9, () => {
      g.strokeStyle = ac; g.lineWidth = 1.9; g.lineCap = "round";
      g.beginPath(); g.moveTo(-6, -6.5 - tip); g.lineTo(6, -6.5 + tip); g.stroke();
      g.beginPath(); g.moveTo(-6, -6.5 - tip); g.lineTo(-6, -4 - tip); g.stroke();
      g.beginPath(); g.moveTo(6, -6.5 + tip); g.lineTo(6, -4 + tip); g.stroke();
    });

    /* --- back arm: slim, bare-handed --- */
    jointLimb(g, -9, -11, -16, 0, -3.5, 5, dark);
    g.fillStyle = body; g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.arc(-17, 1, 4.2, 0, 7); g.stroke(); g.fill();

    /* --- front arm: the oversized gauntlet, braced by a shoulder cowl --- */
    plate(g, [6, -16, 16, -14, 15, -7, 7, -9], body, { up: 0.4, rimA: 0.6 });
    const ax = 17 + sw, ay = -7;
    jointLimb(g, 9, -11, (9 + ax) / 2, ay - 1, 2.5, 6.5, dark);
    limb(g, (9 + ax) / 2, ay - 1, ax - 4, ay, 8, mid_(c, c2));
    g.fillStyle = shade(body, -0.1); g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.arc(9, -11, 4.4, 0, 7); g.stroke(); g.fill();
    /* The lever gauntlet: a wedge that tapers to its point, with a dark
       knuckle bar. As a bright slab it read as a briefcase too. */
    g.save(); g.translate(ax, ay); g.rotate(A.atkPhase >= 0 ? -0.3 : 0.1);

          { up: 0.34, down: 0.34, under: true });
    g.fillStyle = INK; g.fillRect(-2, -3, 11, 3.4);

    /* --- head: pointed hood, no face — just a visor in the shadow --- */
    const hoodPath = () => poly(g, [-10, -22, 10, -22, 7, -36, -2, -40, -11, -33]);
    ink(g, hoodPath, vol(g, -40, -22, body, 0.3, 0.3));

    // the inside of the hood is genuinely dark

    g.fillStyle = hexA(deep, 0.5); poly(g, [-10, -22, 10, -22, 9.4, -24, -10, -24]); g.fill();
    lens(g, () => poly(g, [-5, -30, 8, -28, 8, -24.5, -5, -26]),

    // hood fold + the point

  },
},

  /* The old Monsoon planted three columns at fixed spots across the main
     deck and gave her a hitbox for the whole 70 frames while she floated up
     and away from everyone -- it rarely touched anybody. Now a storm column
     opens under each foe and carries them up helpless, she rises with them,

  super: { name: "Monsoon",
    desc: "Opens a storm column under every foe and lifts them helpless into the air, then dives on the closest one as the hit.",
    startup: 14, active: 66, recovery: 28,
    dmg: 18, base: 6.0, scale: 1.08, angle: 74, ox: 0, oy: 4, r: 0,
    onStart(f) { Snd.superCharge(); FX.flash("#5ff2d0", 0.3); },
    tick(f, a) {
      const m = a.data;
      const s = a.t - m.startup;
      if (s < 0) { f.vy *= 0.8; FX.spark(f.x + rnd(-30, 30), f.y + rnd(-40, 40), f.ch.color); return; }
      if (s === 0) {

      const t = a.tgt;

        // connected: pull up out of the dive

      } else if (t && t.alive && t.state !== ST.DEAD) {
        const dx = t.x - f.x, dy = t.y - f.y, d = Math.hypot(dx, dy) || 1;
        f.vx = dx / d * 17; f.vy = dy / d * 17;
        f.facing = dx >= 0 ? 1 : -1;

  /* ---- art: a slender glider. A sail-wing frames her, streamers trail off
           it, and she stands on taloned feet — which is what the slope grip
           is, made visible. ---- */
  draw(g, A) {
    const c = this.color, c2 = this.color2, c3 = this.color3, ac = this.accent;
    const body = A.flash ? "#ffffff" : c;
    const dark = A.flash ? "#c8fff2" : c2;
    const deep = A.flash ? "#9dffe9" : c3;
    const sw = swing(A, -8, 40);
    const breeze = Math.sin(A.time * 0.07);

    aura(g, 0, -8, 40, c, 0.13);

    /* --- the sail: a wing on a spar, behind everything --- */
    g.save();
    g.translate(-7, -22);
    g.rotate(-0.3 + breeze * 0.07 + (A.air ? -0.22 : 0));
    /* Kept deliberately small. At its first size the sail was wider than her
       whole body and she read as a flag with legs instead of a flier. */
    const span = A.air ? 27 : 21;
    const sailPath = () => poly(g, [0, 0, -span, -15, -span * 1.08, 7, -8, 14]);
    ink(g, sailPath, vol(g, -26, 24, dark, 0.3, 0.3), 3);
    rim(g, sailPath, "#ffffff", 3, 0.35);
    // spars
    g.strokeStyle = hexA(ac, 0.28); g.lineWidth = 1.1;
    for (let i = 1; i <= 2; i++) {
      g.beginPath(); g.moveTo(0, 0);
      g.lineTo(-span * (0.6 + i * 0.22), -11 + i * 9); g.stroke();
    }
    // streamers off the trailing edge
    g.lineCap = "round";
    /* Short ripples hugging the trailing edge. Long ones in any colour stuck
       out sideways and read as antennae rather than cloth. */
    for (let i = 0; i < 3; i++) {
      g.strokeStyle = hexA(c, 0.45 - i * 0.12); g.lineWidth = 2;
      const ey = -9 + i * 8;
      g.beginPath();
      g.moveTo(-span * 0.98, ey);
      g.quadraticCurveTo(-span * 1.1, ey + 3 + Math.sin(A.time * 0.18 + i) * 2.5,
                         -span * 1.16, ey + 1);
      g.stroke();
    }
    g.restore();

    /* --- legs: long and thin, ending in gripping talons --- */
    const st = Math.sin(A.runPhase) * (A.running ? 13 : 0);
    jointLimb(g, -4, 8, -7 + st, 24, -4, 5, dark);
    jointLimb(g, 5, 8, 8 - st, 24, 4, 5, dark);
    for (const [fx2, dir] of [[-7 + st, -1], [8 - st, 1]]) {
      g.save(); g.translate(fx2, 25);
      g.strokeStyle = INK; g.lineWidth = 3.4; g.lineCap = "round";
      for (let i = -1; i <= 1; i++) {
        g.beginPath(); g.moveTo(0, 0); g.lineTo(i * 4 + dir * 2, 5); g.stroke();
      }
      g.strokeStyle = ac; g.lineWidth = 1.8;
      for (let i = -1; i <= 1; i++) {
        g.beginPath(); g.moveTo(0, 0); g.lineTo(i * 4 + dir * 2, 5); g.stroke();
      }
      g.restore();
    }

    /* --- torso: narrow, upright, a wind-vane crest on the chest --- */
    g.save(); g.rotate(A.running ? 0.08 : 0.02 + breeze * 0.02);
    plate(g, [-8, -14, 9, -15, 8, 10, -7, 9], body, { up: 0.3, down: 0.32, under: true });
    plate(g, [-6, -11, 7, -12, 6, 0, -5, 0], dark, { up: 0.12, down: 0.28, rimA: 0.3 });
    // one small chevron: stacked pairs read as a capital W on her chest
    glow(g, ac, 10, () => {
      g.strokeStyle = ac; g.lineWidth = 1.6; g.lineCap = "round";
      g.beginPath();
      g.moveTo(-3.5, -7); g.lineTo(2, -3.5); g.lineTo(-3.5, 0);
      g.stroke();
    });
    g.restore();

    /* --- head: a small hooded skull with a long trailing crest --- */
    g.save(); g.translate(1, -24);
    const headPath = () => poly(g, [-7, -5, 7, -7, 10, 2, -6, 5]);
    ink(g, headPath, vol(g, -8, 6, body, 0.34, 0.3));
    rim(g, headPath, "#ffffff", 3, 0.5);
    // crest streaming backward
    g.strokeStyle = hexA(ac, 0.6); g.lineWidth = 2.6; g.lineCap = "round";
    g.beginPath(); g.moveTo(-5, -5);
    for (let i = 1; i <= 3; i++)
      g.lineTo(-5 - i * 9, -6 + Math.sin(A.time * 0.13 + i) * (2 + i * 2));
    g.stroke();
    g.fillStyle = hexA(INK, 0.4); poly(g, [-6, 2, 9, 2, 8, 4.5, -6, 4.5]); g.fill();
    lens(g, () => poly(g, [-1, -3.4, 9, -1.6, 9, 1.4, -2, 0.6]),
         A.flash ? "#ff2e88" : ac, c, 13);
    g.restore();

    /* --- arms: thin, with a wind-blade that opens on the swing --- */
    jointLimb(g, -6, -10, -13 - (A.running ? st * 0.3 : 0), -2, -3, 4.5, dark);
    const ax = 13 + sw, ay = -7;
    jointLimb(g, 7, -10, (7 + ax) / 2, ay - 1, 2.5, 5, dark);
    limb(g, (7 + ax) / 2, ay - 1, ax - 2, ay, 6, mid_(c, c2));
    g.save(); g.translate(ax, ay);
    const open = A.atkPhase >= 0 ? 1 : 0.22;
    for (let i = 0; i < 3; i++) {
      g.save(); g.rotate((i - 1) * 0.36 * open);
      plate(g, [0, -1.6, 12, -3.6, 14, 0, 12, 3.6, 0, 1.6], i === 1 ? ac : body,
            { up: 0.2, ink: 1.8, rim: false });
      g.restore();
    }
    g.restore();
  },
},

{

  special: { name: "Dead Weight", startup: 6, active: 150, recovery: 20,

    desc: "Slams down and plants itself: the landing jolts anyone close, nothing can knock it back while planted, and whoever hits it takes half the damage back. Hold to stay planted.",
    /* It used to be pure defence -- if nobody happened to swing at him, the
       button seemed to do nothing. The plant now hits, and it bites back. */
    quake: { dmg: 5, base: 4.2, scale: 0.55, angle: 82 },
    tick(f, a) {

      if (a.t === m.startup) {
        for (const o of Combat.foes(f)) {
          if (o.intangible() || Math.abs(o.x - f.x) > 140 || Math.abs(o.y - f.y) > 70) continue;

      }

    } },

  /* Two problems with the old chain. Its data carried a 74-unit hitbox, so
     reeling someone in dragged them through a full-damage hit before the
     slam even happened. And the slam drove them straight down, which on a
     floor that no longer tips just bounced them in place. It now reels from
     a set range, and the slam reads the ground: over a floor it smashes them
     into it and they rebound sky-high; over open air it spikes them down. */
  super: { name: "Mortal Coil",
    desc: "Throws a chain at the nearest foe in range and reels them in. Over solid ground it smashes them into the floor and they rebound sky-high; over open air it spikes them straight down.",
    startup: 18, active: 46, recovery: 34,
    dmg: 21, base: 6.6, scale: 1.12, angle: 84, ox: 0, oy: 0, r: 0,
    range: 480,
    onStart(f) { Snd.superCharge(); FX.flash("#a764ff", 0.32); },
    tick(f, a) {
      const m = a.data;
      if (a.t < m.startup) { f.vx *= 0.8; FX.spark(f.x + rnd(-30, 30), f.y + rnd(-40, 30), f.ch.color); }
      if (a.t === m.startup) {
        const t = Combat.nearestFoe(f, m.range);
        a.grabbed = t && !t.intangible() ? t : null;
        FX.banner("MORTAL COIL", f.ch.color);
        if (a.grabbed) {
          Snd.grab();
          if (a.grabbed.grabTarget) a.grabbed.releaseGrab();
          if (a.grabbed.grabbedBy) a.grabbed.grabbedBy.releaseGrab();
          a.grabbed.attack = null;
        } else {
          // whiffed: the chain lashes out at nothing
          FX.streak(f.x, f.y - 10, f.x + f.facing * m.range * 0.6, f.y - 20, f.ch.accent);
          Snd.whoosh(1.4);
        }
      }
      const t = a.grabbed;
      if (t && t.alive && t.state !== ST.DEAD && a.t > m.startup && a.t < m.startup + m.active) {
        const phase = (a.t - m.startup) / m.active;
        // reel them in, hold them overhead, then bring them down
        if (phase < 0.55) {
          t.x = lerp(t.x, f.x + f.facing * 46, 0.16);
          t.y = lerp(t.y, f.y - 36, 0.16);
          t.vx = 0; t.vy = 0;
          t.setState(ST.HITSTUN); t.hitstun = 6;
          t.grounded = false; t.groundSeg = null;
          if (a.t % 4 === 0) FX.spark(t.x, t.y, f.ch.accent);
        } else if (!a.slammed) {
          a.slammed = true;
          const floor = Stage.floorBelow(t.x, t.y);
          const grounded = floor !== null && floor - t.y < 260;
          m.angle = grounded ? 84 : -72;            // rebound up, or spike down
          Combat.land(f, t, m, t.x, t.y);
          FX.hitPause(14); FX.shake(26);
          FX.burst(t.x, t.y, 34, f.ch.color, 11);
          FX.ring(t.x, t.y, 14, 240, "#ffffff", 5);

          if (grounded) FX.crack(t.x, floor - 2, -1, 60, f.ch.color, 4);
          Snd.superHit();
